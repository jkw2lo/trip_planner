sula","character":["Gridded","Layered","Opinionated","Weather-changeable","Quietly stylish"],"dontMiss":["The laneways and arcades of the CBD, on foot and without a map","A proper coffee, sitting down, in a place with no branding","The NGV, both buildings","Queen Victoria Market","An inner-suburb evening in Fitzroy, Carlton or Collingwood","Sport at the MCG if anything at all is on","A day on the Great Ocean Road or the Mornington Peninsula"],"neighbourhoods":["The CBD laneways and arcades","Fitzroy and Collingwood","Carlton and Brunswick","St Kilda and the bay","South Melbourne and Southbank","Richmond and Cremorne"]},"history":{"story":"Melbourne sits on the land of the Wurundjeri and Boonwurrung peoples of the Kulin Nation, on a river they had used for thousands of years. The British settlement of 1835 was a land grab by Tasmanian speculators, but the gold rushes of the 1850s changed everything: Victoria's gold made Melbourne one of the richest cities in the world within a generation, and the boulevards, banks, arcades and gold-rush architecture of the centre all date from that money. The boom collapsed in the 1890s, the city was the national capital until 1927, and postwar migration - Italian, Greek, Vietnamese, Lebanese, Chinese, Ethiopian, more recently South Asian - built the food culture the city now trades on.","origins":"The site was chosen for the Yarra's fresh water above the falls and for the sheltered bay below it, which made Melbourne the natural port for the goldfields inland. The flat river plain is why the city has a rigid grid instead of Sydney's tangle, and the grid is why the laneways exist at all.","periods":[{"name":"Kulin Nation","text":"Wurundjeri and Boonwurrung country, with the Yarra as a food source and a boundary; Birrarung Marr and the Koorie Heritage Trust are where that story is told in the city today."},{"name":"Settlement, 1835-1851","text":"A speculative settlement becomes a colonial capital when Victoria separates from New South Wales."},{"name":"Gold, 1851-1890","text":"'Marvellous Melbourne': the goldfields make it one of the world's wealthiest cities and build the arcades, banks and public libraries still standing."},{"name":"Crash and federation, 1890-1927","text":"A savage property collapse, then a period as the seat of the new federal parliament until Canberra was ready."},{"name":"Postwar migration","text":"Italian Carlton, Greek Melbourne - for decades the largest Greek-speaking population outside Greece - and later Vietnamese Richmond and Footscray reshape the suburbs."},{"name":"Laneway Melbourne, 1990s-","text":"Deliberate policy turned the emptying service lanes into bars, cafes and galleries, which is now the city's defining texture."}],"whyItMatters":"Almost everything visitors like about Melbourne comes from two events: gold money, which built the grand nineteenth-century bones, and migration, which filled them. The laneway culture is younger than people assume and was substantially planned, which is why it is so consistent.","visible":["Kulin country: Birrarung Marr, the Koorie Heritage Trust at Federation Square, scar trees in the Royal Botanic Gardens","Gold-rush Melbourne: the Block and Royal arcades, the State Library dome, Parliament House, Collins Street banks","Working Melbourne: Queen Victoria Market, the Docklands wharves, Victorian terraces in Fitzroy","Migrant Melbourne: Lygon Street, Victoria Street in Richmond, Sydney Road in Brunswick, Footscray's markets","Modern Melbourne: Federation Square, NGV International, the Metro Tunnel stations opened in 2025"]},"thingsToDo":{"historic":[{"name":"The arcades and laneways","area":"CBD","why":"Block Arcade, Royal Arcade, Degraves, Hosier Lane and the unmarked doorways between them. Walk without a destination for an hour.","mins":120},{"name":"State Library Victoria","area":"CBD","why":"The La Trobe Reading Room dome is one of the best interiors in Australia, and it is free.","mins":60},{"name":"Queen Victoria Market","area":"CBD north","why":"A working market since 1878: produce, deli halls and, in winter, a night market. Go early on a weekday.","mins":120},{"name":"Old Melbourne Gaol","area":"CBD","why":"Colonial justice told plainly, including Ned Kelly's cell.","mins":90},{"name":"Parliament House and Collins Street","area":"East Melbourne","why":"The gold-rush city at its grandest; walk the 'Paris end' of Collins Street with it.","mins":90},{"name":"Melbourne Cricket Ground","area":"Yarra Park","why":"A hundred thousand seats and the national sporting cathedral. Tour it, or better, get a ticket to anything.","mins":180}],"arts":[{"name":"NGV International","area":"Southbank","why":"The bigger of the two National Gallery buildings, with the water wall and a strong international collection. Free entry to the permanent galleries.","mins":150},{"name":"The Ian Potter Centre: NGV Australia","area":"Federation Square","why":"Australian and First Nations art in the Federation Square building; the better of the two for understanding the country.","mins":120},{"name":"ACMI","area":"Federation Square","why":"Moving image, from early cinema to games, and unusually well designed for how it teaches.","mins":120},{"name":"Heide Museum of Modern Art","area":"Bulleen","why":"Modernist Australian art in the house and gardens where much of it was made.","mins":180},{"name":"Street art laneways","area":"CBD and Fitzroy","why":"Hosier Lane for the famous version, AC/DC Lane and the Fitzroy backstreets for the better one.","mins":90},{"name":"Live music at a suburban pub","area":"Fitzroy, Collingwood, Brunswick","why":"Melbourne has more live venues per head than almost anywhere; the Tote, the Corner and the Northcote Social Club are institutions.","mins":180}],"neighbourhoods":[{"name":"Fitzroy and Collingwood","character":"Terraces, bars, vintage, murals","highlights":"Gertrude Street, Brunswick Street, Smith Street","food":"Wine bars, small restaurants, bakeries, late-night dumplings","bestTime":"Afternoon into night","mins":240},{"name":"Carlton and Brunswick","character":"Italian heritage giving way to student and Middle Eastern Melbourne","highlights":"Lygon Street, Sydney Road, the Exhibition Building and Carlton Gardens","food":"Italian, Lebanese, Turkish, some of the best pizza in the city","bestTime":"Evening","mins":210},{"name":"The CBD grid","character":"Laneways, arcades, rooftops, hidden staircases","highlights":"Degraves Street, Block Arcade, Chinatown, Flinders Lane","food":"Everything from a two-dollar dumpling to a tasting menu","bestTime":"All day, and after dark for the bars","mins":240},{"name":"Richmond and Cremorne","character":"Vietnamese Victoria Street, warehouses, pubs","highlights":"Victoria Street, Bridge Road, the walk to the MCG","food":"Vietnamese, and a run of very good modern restaurants","bestTime":"Lunch or early evening","mins":180},{"name":"St Kilda and the bay","character":"Faded seaside glamour, sunsets, cake shops","highlights":"The pier and its penguins at dusk, Acland Street, Luna Park","food":"European cake shops, casual seafood, beach bars","bestTime":"Late afternoon into sunset","mins":180},{"name":"Footscray and the west","character":"Vietnamese and East African, market-centred, unpolished","highlights":"Footscray Market, Barkly Street, riverside walks","food":"Pho, Ethiopian injera, West African, cheap and excellent","bestTime":"Daytime","mins":150}],"nature":[{"name":"Royal Botanic Gardens","area":"South Yarra","why":"The best park in the city, with the Tan running track around it and an Aboriginal heritage walk inside.","mins":120},{"name":"The Yarra and Birrarung Marr","area":"Central","why":"Walk or ride the river path from the city out towards Abbotsford; it is how the city connects to its country.","mins":120},{"name":"St Kilda pier at dusk","area":"St Kilda","why":"A little penguin colony lives in the breakwater and comes ashore after sunset. Free, and genuinely charming.","mins":90},{"name":"Dandenong Ranges","area":"Outer east","why":"Mountain ash forest, fern gullies and tea rooms an hour from town.","mins":300},{"name":"Werribee and the You Yangs","area":"West","why":"Open-range zoo, a grand estate and granite hills with wide views over the bay.","mins":360},{"name":"Brighton Beach and the bay trail","area":"Bayside","why":"The bathing boxes are the photo; the cycle path along the bay is the better use of the afternoon.","mins":150}],"shopping":[{"name":"Block Arcade and Royal Arcade","area":"CBD","why":"Victorian arcades with tiled floors, tea rooms and small shops.","mins":60},{"name":"Gertrude and Smith Streets","area":"Fitzroy and Collingwood","why":"Australian designers, ceramics, vintage and bookshops in a walkable strip.","mins":150},{"name":"Queen Victoria Market","area":"CBD north","why":"Produce and deli halls in the morning, and a night market in season.","mins":120},{"name":"Chapel Street and Prahran Market","area":"South Yarra and Prahran","why":"Fashion, a genuinely good produce market and a Sunday crowd.","mins":150},{"name":"Sydney Road, Brunswick","area":"Brunswick","why":"Bridal shops, Middle Eastern grocers, record shops and cheap food, in that order.","mins":120},{"name":"Rose Street Artists' Market","area":"Fitzroy","why":"Weekend market of local makers, small and well curated.","mins":60}],"nightlife":[{"name":"CBD laneway bars","area":"CBD","why":"The city's defining night out: unmarked doors, basements and rooftops within a few blocks of each other.","mins":210},{"name":"Fitzroy and Collingwood","area":"Inner north","why":"Wine bars, dive bars and live rooms along Gertrude, Brunswick and Smith streets.","mins":210},{"name":"Live music pubs","area":"Inner north and east","why":"The Tote, the Corner Hotel, the Northcote Social Club and a dozen smaller rooms most nights of the week.","mins":180},{"name":"Chinatown late","area":"CBD","why":"Little Bourke Street stays open long after the restaurants elsewhere have closed.","mins":120},{"name":"Rooftop bars","area":"CBD","why":"Summer only, and worth it for the view down into the grid.","mins":120},{"name":"Comedy and theatre","area":"CBD and Southbank","why":"The Comedy Festival in March and April is one of the largest in the world; the theatres run year round.","mins":150}]},"essential10":[{"rank":1,"name":"Laneways and arcades on foot","why":"The city's whole personality is in the gap between two buildings. Walk Degraves, the Block and Royal arcades, Hosier Lane and whatever door looks promising.","mins":150,"label":"Essential","popularity":5,"cultural":5,"worth":5},{"rank":2,"name":"Coffee, properly, sitting down","why":"Not a takeaway cup between sights. Melbourne's coffee culture is the one thing it is genuinely best in the world at.","mins":60,"label":"Essential","popularity":5,"cultural":5,"worth":5},{"rank":3,"name":"NGV International and NGV Australia","why":"Two free buildings, one international and one Australian and First Nations. Do the Australian one if you only do one.","mins":180,"label":"Essential","popularity":4,"cultural":5,"worth":5},{"rank":4,"name":"An evening in Fitzroy or Collingwood","why":"Where the city eats and drinks when it is not performing for anyone.","mins":210,"label":"Essential","popularity":4,"cultural":4,"worth":5},{"rank":5,"name":"Queen Victoria Market","why":"A working market since 1878, best on a weekday morning before the tour groups.","mins":120,"label":"Essential","popularity":5,"cultural":4,"worth":4},{"rank":6,"name":"Sport at the MCG","why":"Australian rules football in winter or cricket in summer, in a hundred-thousand-seat stadium. The atmosphere is the attraction, not the sport.","mins":240,"label":"Essential","popularity":5,"cultural":5,"worth":5},{"rank":7,"name":"Great Ocean Road day","why":"Cliffs, rainforest and the Twelve Apostles. Long, but the best single day out of the city.","mins":660,"label":"Recommended","popularity":5,"cultural":3,"worth":4},{"rank":8,"name":"St Kilda pier at sunset","why":"Bay sunset, faded seaside architecture and a colony of little penguins that comes ashore after dark.","mins":150,"label":"Recommended","popularity":4,"cultural":3,"worth":4},{"rank":9,"name":"Live music in a suburban pub","why":"Melbourne's other world-class culture, and it happens on a Tuesday as readily as a Saturday.","mins":180,"label":"Recommended","popularity":3,"cultural":5,"worth":5},{"rank":10,"name":"Eat across the migrant suburbs","why":"Vietnamese in Richmond or Footscray, Italian in Carlton, Middle Eastern in Brunswick. Cheap, and the real story of the city.","mins":150,"label":"Recommended","popularity":3,"cultural":4,"worth":5}],"food":{"identity":"Melbourne's food reputation rests on three things: coffee, migration and a bar culture that lets small operators do interesting things cheaply. There is no Melbourne dish. What there is instead is an unusually high floor - the average cafe, bakery or neighbourhood Vietnamese restaurant is very good - and a middle tier of wine bars and bistros that punch far above the price. Eat breakfast seriously, eat lunch cheaply in a migrant suburb, and spend the money at dinner in a wine bar rather than a white-tablecloth room.","mustTry":[{"dish":"Melbourne coffee","what":"Espresso-based drinks - flat white, magic, long black - from a roaster that cares.","why":"Italian migration plus 1990s obsessiveness produced the coffee culture the world copied.","flavour":"Balanced, milk-forward, never scalded; a 'magic' is a double ristretto flat white in a smaller cup.","howLocalsEat":"Sitting down, before 11am, with something baked.","importance":"Essential"},{"dish":"Vietnamese pho and banh mi","what":"Beef noodle soup and pork rolls along Victoria Street and in Footscray.","why":"Melbourne's Vietnamese community made these a default local meal, not a novelty.","flavour":"Clear, aromatic broth; crackling bread with pate and pickle.","importance":"Essential"},{"dish":"Carlton Italian","what":"Pasta, pizza and old-school Italian along Lygon Street and its offshoots.","why":"Postwar Italian migration is the foundation of how the city eats and drinks.","flavour":"Simple, and better in the smaller rooms than the strip's tourist ends.","importance":"Recommended"},{"dish":"A bakery morning","what":"Sourdough, croissants, sausage rolls and the ubiquitous custard tart.","why":"The bakery scene has become as competitive as the coffee scene.","flavour":"Laminated, buttery, and queued for.","importance":"Essential"},{"dish":"Cantonese and Chinatown supper","what":"Roast duck, dumplings and late-night noodles on Little Bourke Street.","why":"Melbourne's Chinatown is the longest continuously operating in the western world.","flavour":"Salt, fat, soy; best after 9pm.","importance":"Recommended"},{"dish":"Greek food","what":"Souvlaki, saganaki and Greek sweets around the CBD and the northern suburbs.","why":"Melbourne has one of the largest Greek populations of any city outside Greece.","flavour":"Charred, lemony, generous.","importance":"Recommended"},{"dish":"Middle Eastern Brunswick","what":"Lebanese and Turkish bakeries, pide, manoush and mezze on Sydney Road.","why":"The cheapest very good meal in the city, at almost any hour.","flavour":"Charcoal, za'atar, yoghurt.","importance":"Recommended"},{"dish":"Victorian wine in a wine bar","what":"Yarra Valley chardonnay and pinot, Heathcote shiraz, and a great deal of minimal-intervention oddity.","why":"The wine bar is Melbourne's native restaurant form.","flavour":"Cooler climate and lighter than most Australian wine stereotypes.","importance":"Essential"},{"dish":"Parma at a pub","what":"Chicken parmigiana with chips and salad, in a suburban front bar.","why":"The most Australian meal in the city, and a genuine local ritual.","flavour":"Enormous. Order one between two if you have eaten at all that day.","importance":"Optional"},{"dish":"European cake shops in St Kilda","what":"Acland Street's window displays of kugelhopf, strudel and cream cakes.","why":"A surviving trace of the city's Jewish and Central European migration.","flavour":"Sweet, old-fashioned, unapologetic.","importance":"Optional"}]},"mustEat10":[{"dish":"Coffee and pastry","where":"Any specialty roaster with no branding","order":"A magic or flat white, plus whatever is laminated","price":"AUD 10-18"},{"dish":"Pho","where":"Victoria Street, Richmond, or Footscray","order":"Pho tai with the herb plate, plus a Vietnamese iced coffee","price":"AUD 15-22"},{"dish":"Wine bar dinner","where":"Embla or a Gertrude Street bar","order":"Small plates, wood-fired bread, whatever the by-the-glass list is excited about","price":"AUD 70-110 pp"},{"dish":"Cantonese roast and dumplings","where":"Chinatown, Little Bourke Street","order":"Roast duck, greens, dumplings","price":"AUD 25-45 pp"},{"dish":"Pizza or pasta","where":"Carlton, off the main Lygon strip","order":"One pasta, one pizza, house red","price":"AUD 30-55 pp"},{"dish":"Modern Australian tasting","where":"Attica, Ripponlea","order":"The set menu","price":"AUD 300-400 pp"},{"dish":"All-day bistro","where":"Cumulus Inc, Flinders Lane","order":"Tuna tartare, lamb shoulder if you are a group","price":"AUD 60-100 pp"},{"dish":"Chinese banquet","where":"Flower Drum, Chinatown","order":"Peking duck and whatever the waiter suggests","price":"AUD 120-200 pp"},{"dish":"Middle Eastern cheap eat","where":"Sydney Road, Brunswick","order":"Manoush, pide or a mixed grill","price":"AUD 12-25"},{"dish":"Market breakfast","where":"Queen Victoria Market","order":"A bratwurst, a borek, and a coffee to carry","price":"AUD 12-25"}],"restaurants":{"iconic":[{"name":"Flower Drum","cuisine":"Cantonese","price":"High","area":"Chinatown","desc":"The city's grand Cantonese institution, formal in a way almost nothing else here is.","dishes":"Peking duck, seasonal seafood","whyGo":"A Melbourne ritual for forty years and still the standard.","booking":"Book well ahead"},{"name":"Cumulus Inc","cuisine":"Modern Australian bistro","price":"Mid-high","area":"Flinders Lane","desc":"The all-day laneway dining room that set the template for a generation of Melbourne restaurants.","dishes":"Tuna tartare, slow-roast lamb shoulder","whyGo":"The easiest introduction to how the city likes to eat.","booking":"Walk-ins possible; book for dinner"},{"name":"Pellegrini's","cuisine":"Italian","price":"Low","area":"Bourke Street","desc":"A 1950s espresso bar with a single long counter and a menu that has barely changed.","dishes":"Spaghetti, granita, an espresso standing up","whyGo":"The origin point of Melbourne's coffee culture.","booking":"No"}],"bestFood":[{"name":"Attica","cuisine":"Modern Australian","price":"High","area":"Ripponlea","desc":"Native ingredients treated with more seriousness and humour than anywhere else in the country.","dishes":"The set menu","whyGo":"The most distinctive fine dining in Australia, and worth the trip out of the centre.","booking":"Essential, well in advance"},{"name":"Gimlet at Cavendish House","cuisine":"European","price":"High","area":"Russell Street","desc":"A grand room doing precise, classic cooking and very good drinks.","dishes":"Oysters, steak, a martini","whyGo":"The best-looking dining room in the city, and the cooking earns it.","booking":"Book ahead"},{"name":"Embla","cuisine":"Wine bar","price":"Mid-high","area":"Russell Street","desc":"Wood fire, small plates and a wine list that runs the whole natural-to-classic range.","dishes":"Wood-fired bread, whatever the vegetable dish is","whyGo":"The purest example of Melbourne's native restaurant form.","booking":"Some seats held for walk-ins"}],"bestValue":[{"name":"Victoria Street Vietnamese","cuisine":"Vietnamese","price":"Low","area":"Richmond","desc":"A strip of pho and com tam shops with queues at lunch.","dishes":"Pho tai, banh mi, iced coffee","whyGo":"Fifteen dollars for one of the best meals of the trip.","booking":"No"},{"name":"Footscray market and food shops","cuisine":"Vietnamese and East African","price":"Low","area":"Footscray","desc":"Market halls plus Ethiopian, Somali and West African restaurants around them.","dishes":"Injera platters, pho, tropical fruit","whyGo":"The most interesting cheap eating in Melbourne.","booking":"No"},{"name":"Sydney Road bakeries and grills","cuisine":"Lebanese and Turkish","price":"Low","area":"Brunswick","desc":"Bakeries turning out manoush and pide from early morning.","dishes":"Manoush, mixed grill, baklava","whyGo":"Excellent food for the price of a coffee elsewhere.","booking":"No"}],"special":[{"name":"Vue de Monde","cuisine":"Modern Australian","price":"High","area":"Rialto tower, CBD","desc":"Fine dining on the 55th floor with the whole grid below.","dishes":"The tasting menu","whyGo":"For a celebration where the view is part of the point.","booking":"Book well ahead"},{"name":"Attica","cuisine":"Modern Australian","price":"High","area":"Ripponlea","desc":"The country's most singular tasting menu.","dishes":"The set menu","whyGo":"If you book one serious dinner in Australia, this is a strong candidate.","booking":"Essential, well in advance"}],"casual":[{"name":"Chin Chin","cuisine":"Southeast Asian","price":"Mid","area":"Flinders Lane","desc":"Loud, no-bookings-for-small-groups Thai-leaning cooking with a bar downstairs.","dishes":"Son-in-law eggs, curries, the feed-me menu","whyGo":"Consistently good and built for a group.","booking":"Limited bookings; wait downstairs"},{"name":"A front-bar parma","cuisine":"Pub","price":"Low","area":"Inner suburbs","desc":"Chicken parmigiana, chips and a pot of beer in a suburban pub.","dishes":"Parma and a pot","whyGo":"The most ordinary and most local meal available.","booking":"No"},{"name":"Chinatown supper","cuisine":"Chinese","price":"Low-mid","area":"Little Bourke Street","desc":"Dumpling houses and noodle bars open long after the rest of the city has closed.","dishes":"Dumplings, hand-pulled noodles, roast duck","whyGo":"Melbourne's default post-gig meal.","booking":"No"}],"cafes":[{"name":"Market Lane Coffee","cuisine":"Coffee","price":"Low","area":"Prahran and branches","desc":"Single-origin filter and espresso done with unusual rigour.","dishes":"Filter coffee, a single pastry","whyGo":"The clearest demonstration of why Melbourne coffee has the reputation.","booking":"No"},{"name":"Proud Mary","cuisine":"Coffee and brunch","price":"Mid","area":"Collingwood","desc":"Roastery cafe with an ambitious breakfast menu and a queue to match.","dishes":"Coffee flight, whatever the eggs special is","whyGo":"The full Melbourne brunch, done properly.","booking":"No"},{"name":"Acland Street cake shops","cuisine":"Cakes","price":"Low","area":"St Kilda","desc":"Central European cake windows that have been there for generations.","dishes":"Kugelhopf, strudel, a slice of something enormous","whyGo":"A living piece of the city's migration history.","booking":"No"}]},"experiences":[{"name":"A laneway bar crawl","what":"Three or four bars in the CBD grid, found by looking for unmarked doors and staircases.","why":"It is the single most Melbourne evening available.","mins":210},{"name":"Sit down for coffee","what":"Order a magic or a filter at a roaster and stay for it.","why":"Takeaway misses the entire point of the culture.","mins":45},{"name":"A game at the MCG","what":"AFL from March to September, cricket over summer, including the Boxing Day Test.","why":"Nothing else shows you what the city cares about this plainly.","mins":240},{"name":"Ride a tram with no plan","what":"Take route 96, 86 or 11 out to the end and walk back through whatever suburb you land in.","why":"The tram network is the cheapest tour of the city's differences.","mins":120},{"name":"Street art walk in Fitzroy","what":"The backstreets off Gertrude and Smith, rather than the Hosier Lane crowd.","why":"The work is better and changes constantly.","mins":90},{"name":"See a band on a weeknight","what":"The Tote, the Corner, the Northcote Social Club or a front bar with no cover.","why":"Melbourne's live music runs every night, not just weekends.","mins":180},{"name":"Eat your way down one migrant street","what":"Victoria Street, Sydney Road, Lygon Street or Barkly Street in Footscray.","why":"One street tells the city's postwar history better than any museum.","mins":150},{"name":"Penguins at St Kilda pier","what":"Arrive at dusk and wait at the breakwater; volunteers are usually there to explain.","why":"Wild little penguins, free, twenty minutes from the CBD.","mins":90},{"name":"A festival, whatever is on","what":"Comedy in March and April, the film festival in August, arts festivals through spring.","why":"The calendar is dense enough that something serious is almost always running.","mins":180},{"name":"Day on the Great Ocean Road","what":"Drive or tour to the Twelve Apostles, stopping at Lorne and the Otways.","why":"The best landscape day within reach of the city.","mins":660}],"neighbourhoodGuide":[{"name":"The CBD grid","vibe":"Laneways, arcades, rooftops, hidden bars","bestFor":"Walking, bars, galleries, shopping","sights":"Degraves Street, Block Arcade, Chinatown, State Library, Federation Square","food":"Everything, at every price","mins":300},{"name":"Fitzroy and Collingwood","vibe":"Terraces, murals, wine bars, vintage","bestFor":"Eating, drinking, shopping, live music","sights":"Gertrude Street, Smith Street, Rose Street market","food":"Wine bars, bakeries, small restaurants","mins":240},{"name":"Carlton and Brunswick","vibe":"Italian heritage, students, Middle Eastern strips","bestFor":"Italian food, cheap eats, record shops","sights":"Lygon Street, Carlton Gardens, Sydney Road","food":"Italian, Lebanese, Turkish","mins":210},{"name":"Richmond and Cremorne","vibe":"Vietnamese strip meets warehouse offices","bestFor":"Cheap lunch, pubs, walking to the MCG","sights":"Victoria Street, Bridge Road, Yarra path","food":"Vietnamese, modern bistros","mins":180},{"name":"St Kilda and the bay","vibe":"Faded seaside, sunsets, cake shops","bestFor":"A late afternoon, penguins, the beach path","sights":"St Kilda pier, Luna Park, Acland Street","food":"Cake shops, casual seafood","mins":180},{"name":"South Yarra and Prahran","vibe":"Polished, shopping-led, market-anchored","bestFor":"Fashion, the Botanic Gardens, a produce market","sights":"Chapel Street, Prahran Market, Royal Botanic Gardens","food":"Cafes, good coffee, restaurants along Chapel","mins":180},{"name":"Southbank and Docklands","vibe":"River promenade, arts precinct, towers","bestFor":"Galleries, theatre, river walking","sights":"NGV International, Arts Centre, the Yarra promenade","food":"Riverside dining, hotel bars","mins":150},{"name":"Footscray and the west","vibe":"Market-centred, Vietnamese and East African, unpolished","bestFor":"Cheap food, markets, a different Melbourne","sights":"Footscray Market, Barkly Street, riverside trails","food":"Pho, injera, West African","mins":150}],"timeGuidance":{"three":"Day 1 the grid: laneways, arcades, NGV Australia and a laneway bar evening. Day 2 the inner north: Carlton or Brunswick by day, Fitzroy and Collingwood at night. Day 3 either the Great Ocean Road, or Queen Victoria Market plus St Kilda and the penguins at dusk.","fivePlus":"Add the MCG if anything is on, NGV International and ACMI, a Vietnamese lunch in Richmond or Footscray, a live music night, and a second day trip to the Mornington Peninsula, the Yarra Valley or the Dandenongs."},"dayTrips":[{"name":"Great Ocean Road","travel":"About 3 hr to the Twelve Apostles","why":"Cliffs, surf coast towns, rainforest in the Otways and the limestone stacks at the end.","duration":"Full day, long","suits":"Anyone; the walking is optional and the views are not.","logistics":"Car or organised tour. Leave early, and consider staying overnight in Apollo Bay rather than driving back in the dark.","verdict":"Worth it"},{"name":"Mornington Peninsula","travel":"About 1-1.5 hr","why":"Wineries, hot springs, beaches and a coastal walk out to the Cape Schanck lighthouse.","duration":"Full day","suits":"Wine, swimming and a slower day.","logistics":"Easiest by car; some tours combine wineries and the hot springs.","verdict":"Worth it"},{"name":"Yarra Valley","travel":"About 1 hr","why":"Cool-climate wine, cellar doors and a very good regional food scene.","duration":"Full day","suits":"Wine drinkers with a driver or a tour.","logistics":"Needs a car or a tour; public transport is impractical.","verdict":"Worth it"},{"name":"Dandenong Ranges","travel":"About 1 hr","why":"Mountain ash forest, fern gullies, gardens and the Puffing Billy steam railway.","duration":"Half or full day","suits":"Families and anyone wanting forest without a long drive.","logistics":"Train to Belgrave then Puffing Billy, or drive.","verdict":"Worth it"},{"name":"Phillip Island","travel":"About 2 hr","why":"The penguin parade, surf beaches and a seal colony.","duration":"Full day","suits":"Families; the parade is heavily managed and ticketed.","logistics":"Car or tour; the parade is after sunset, so it is a late return.","verdict":"Only if you have extra time"},{"name":"Ballarat and Sovereign Hill","travel":"About 1.5 hr","why":"The goldfields city, with a large open-air museum of the rush that built Melbourne.","duration":"Full day","suits":"History, and children.","logistics":"Train from Southern Cross, then a short bus or taxi.","verdict":"Only if you have extra time"},{"name":"Geelong and Bellarine","travel":"About 1 hr","why":"A revitalised waterfront, beaches and wineries on the way to the Great Ocean Road.","duration":"Half or full day","suits":"A gentler coastal day than the full Ocean Road drive.","logistics":"Train from Southern Cross; a car helps on the Bellarine.","verdict":"Only if you have extra time"}],"practical":{"gettingAround":"Trams are the city's signature and the CBD sits inside a Free Tram Zone, so travel within the centre costs nothing - but tapping on outside it is not optional and inspectors are real. Elsewhere you need a myki card, which you can buy and top up at stations, 7-Elevens and machines; contactless bank-card 'tap and go' began rolling out across the network in 2026, starting with trains, so check what the reader on your mode accepts rather than assuming. The Metro Tunnel opened on 30 November 2025 and added five stations - Anzac, Town Hall, State Library, Parkville and Arden - which put the Sunbury, Cranbourne and Pakenham lines directly under the city centre; all five are in Zone 1 and cost no extra. Trains cover the suburbs and the airport bus runs frequently from Southern Cross. The grid is small and flat enough to walk end to end in half an hour, and that is usually the fastest way across the centre.","whenToGo":"Seasons are inverted, and the local joke about four seasons in one day is accurate: carry a layer whatever the forecast says. Autumn, March to May, is the best overall - mild, clear and full of festivals including the Comedy Festival. Spring, September to November, is similar but wetter, and ends with the racing carnival. Summer, December to February, brings hot northerly days, the Australian Open in January and long light evenings; it can spike above 40C. Winter, June to August, is grey and cold by Australian standards but is the football season and the best time for the bars, galleries and food the city is actually built around.","howLong":{"one":"The grid: laneways, an arcade, NGV Australia, a coffee sitting down and a laneway bar at night.","twoThree":"Add Fitzroy or Carlton, Queen Victoria Market and either St Kilda or the MCG. Enough for the city itself.","fourFive":"The right length: add a day trip, a live music night and a proper eating day in the migrant suburbs.","week":"Add the Great Ocean Road with an overnight, the Mornington Peninsula or Yarra Valley, and time to be aimless in the inner north."},"culture":["The Free Tram Zone covers the CBD and Docklands; outside it, touch on with myki or you risk a fine.","Tipping is not expected; ten per cent for exceptional service is generous.","Coffee is ordered by style, not size. A 'magic' is a Melbourne invention and ordering one is a small local password.","Weather changes fast in any season - a cold front can drop ten degrees in an hour.","The UV is high even on cool days; sunscreen is a habit here, not a holiday activity.","Traffic drives on the left, and the CBD's hook turn - turning right from the left lane at tram intersections - catches out visiting drivers.","Many of the best bars and restaurants are unmarked upstairs or down a lane; if a door looks like nothing, try it."]},"whatIdDo":[{"day":"Day 1","plan":"Coffee in the Degraves area, then walk the arcades and laneways with no route. NGV Australia at Federation Square in the afternoon, ACMI if the exhibition is good. Laneway bars in the evening, Chinatown for supper."},{"day":"Day 2","plan":"Queen Victoria Market early, tram up to Carlton for the gardens and Lygon Street lunch. Afternoon in Fitzroy: Gertrude and Smith streets, the backstreet murals. Dinner at a wine bar, then a band."},{"day":"Day 3","plan":"Vietnamese lunch on Victoria Street, walk the Yarra path, and the MCG in the afternoon if anything is on - tour it if not. Sunset at St Kilda pier for the penguins, cake on Acland Street."},{"day":"Day 4","plan":"Great Ocean Road, leaving early: Lorne, the Otways, the Twelve Apostles at the end of the day. Long drive back, or stay overnight in Apollo Bay."},{"day":"Day 5","plan":"Slow morning in Prahran or South Yarra with the Botanic Gardens, Footscray for lunch, then one dinner that matters - Attica, Gimlet or Embla."}],"quickRef":{"musts":["The laneways and arcades","Coffee sitting down","NGV Australia","An evening in Fitzroy or Collingwood","Queen Victoria Market"],"eats":["Melbourne coffee","Pho on Victoria Street","A wine bar dinner","Chinatown supper","A bakery morning"],"areas":["The CBD grid","Fitzroy and Collingwood","Carlton and Brunswick","Richmond","St Kilda"],"experiences":["A lane confirm before you commit.","glance":{"why":"Shanghai is the only Chinese city that was largely built by outsiders and then took itself back. The result is a place with no imperial axis and no single centre, where a 1920s banking facade faces a 632-metre tower across a muddy river, and the best afternoon you can have is aimless walking under plane trees in the old French Concession. It is China's most comfortable city for a first-time visitor and its least representative.","bestFor":["Architecture","Food","Walking","Coffee and bars","Contemporary art","Shopping"],"idealStay":"3-4 days, 5 with a water town","character":["Cosmopolitan","Commercial","Art deco","Fast","Comfortable"],"dontMiss":["The Bund at dusk, then again at 7am when it is empty","Aimless walking in the former French Concession","Yu Garden early, before the bazaar fills","Shanghai Museum's bronzes and ceramics","Xiaolongbao done properly","The skyline from the Pudong side, or from a Bund rooftop","One water town or a Suzhou day trip"],"neighbourhoods":["Former French Concession","The Bund and Waitan","Jing'an","Tianzifang and Dapuqiao","West Bund","Hongkou"]},"history":{"story":"Shanghai spent most of Chinese history as an unremarkable cotton and fishing town. Everything that makes it interesting happened in the last 180 years, starting with a war fought over the right to sell opium, and the city has been catching up with, and then overtaking, that origin ever since.","origins":"A walled market town at the mouth of the Yangtze, useful for coastal shipping and cotton, entirely overshadowed by Suzhou and Hangzhou.","periods":[{"name":"Treaty port, 1842-1943","text":"The Treaty of Nanking opened Shanghai to foreign trade and created the International Settlement and the French Concession, foreign-run enclaves with their own police and courts. Money, opium, banking and printing poured in."},{"name":"The 1920s and 30s","text":"The Paris of the East and the whore of the Orient, depending on who was writing. Jazz clubs, gangsters, Chinese modernist literature, the founding of the Communist Party in a Concession shikumen house, and the largest refugee community of European Jews in Asia."},{"name":"War and revolution, 1937-1949","text":"Japanese occupation, then the Communist victory. Capital, industry and much of the elite left for Hong Kong and Taiwan."},{"name":"Socialist decades, 1949-1990","text":"Shanghai became an industrial workhorse taxed to fund the rest of the country. The Bund buildings became government offices; Pudong was farmland and warehouses."},{"name":"Reform, 1990-","text":"Deng Xiaoping's decision to develop Pudong turned a floodplain into the skyline you photograph, in one generation."}],"modern":"Shanghai now runs on finance, shipping, design and consumption. It is China's wealthiest large city and the one most legible to a foreigner, which is precisely why some Chinese visitors find it inauthentic. The trade-off for the visitor is real: everything is easy, and you will learn less about China than you would in Xi'an or Chengdu.","whyItMatters":"The city's whole aesthetic is negotiation between imported and local. Shikumen houses are British terraces with Chinese courtyard gates. The food is Jiangnan sweetness plus everything that arrived by ship. The art scene lives in repurposed industry because industry is what the socialist decades left behind.","visible":["The Bund is a catalogue of 1920s banking architecture, read left to right as you walk north.","Shikumen lane houses in the Concession show the hybrid at domestic scale; Xintiandi is the restored version, Tianzifang the messier one.","Wukang Mansion, the flatiron block on Huaihai Road, is the single most photographed piece of that era.","The Jewish Refugees Museum in Hongkou marks where 20,000 people sheltered from the Holocaust.","Power Station of Art and M50 are socialist industry turned into culture."]},"thingsToDo":{"historic":[{"name":"The Bund","area":"Huangpu","why":"A mile of 1920s granite facing the towers. Walk it at dusk for the lights and again at dawn for the tai chi and the emptiness.","mins":60},{"name":"Yu Garden","area":"Huangpu","why":"A Ming scholar's garden of rockeries, dragon walls and zigzag bridges. Go at opening; the surrounding bazaar is a scrum by ten.","mins":90},{"name":"Shikumen Open House Museum","area":"Xintiandi","why":"A restored lane house furnished as it was in the 1930s. The best single explanation of how Shanghai actually lived.","mins":45},{"name":"Jewish Refugees Museum","area":"Hongkou","why":"The Ohel Moishe synagogue and the story of the Shanghai ghetto. Small, sober, worth the trip.","mins":90},{"name":"Longhua Temple","area":"Xuhui","why":"The city's oldest temple with a wooden pagoda dating to the tenth century. Working, incense-thick, largely local.","mins":60}],"arts":[{"name":"Shanghai Museum","area":"People's Square","why":"Free and genuinely world-class. The bronze and ceramic galleries are the reason; skip the rest if pressed. A second, larger branch has opened in Pudong.","mins":150},{"name":"Power Station of Art","area":"Huangpu","why":"A former power plant, China's first state-run contemporary art museum. Ambitious, uneven, always interesting.","mins":120},{"name":"West Bund museum mile","area":"Xuhui","why":"Long Museum, Yuz Museum and the Centre Pompidou outpost strung along the riverside. A half day if the shows are good.","mins":240},{"name":"M50","area":"Putuo","why":"Suzhou Creek warehouses full of working studios and small galleries. Rougher and more real than West Bund.","mins":120},{"name":"Propaganda Poster Art Centre","area":"Xuhui","why":"In the basement of an apartment block, a private collection of 1950s-70s posters. Strange, excellent, tiny.","mins":60}],"neighbourhoods":[{"name":"Former French Concession","character":"Plane trees, art deco villas, low walls, small shops","highlights":"Wukang Mansion, Anfu Road, Ferguson Lane, Fuxing Park","food":"Coffee, wine bars, Shanghainese home cooking","bestTime":"Late morning or golden hour","mins":240},{"name":"Jing'an","character":"Temple gold against glass towers, upmarket","highlights":"Jing'an Temple, Zhangyuan restored lanes","food":"Serious restaurants, hotel bars","bestTime":"Afternoon","mins":150},{"name":"Tianzifang","character":"Dense shikumen alleys packed with shops","highlights":"The lanes themselves","food":"Snacks, small bars","bestTime":"Weekday morning or skip","mins":90},{"name":"Hongkou and North Bund","character":"Working, unpolished, historically layered","highlights":"Jewish quarter, 1933 Old Millfun slaughterhouse","food":"Local breakfast streets","bestTime":"Morning","mins":150},{"name":"Pudong Lujiazui","character":"Vertical, corporate, spectacular","highlights":"Shanghai Tower, riverside promenade","food":"Mall food and hotel restaurants","bestTime":"Sunset","mins":120}],"nature":[{"name":"Fuxing Park","area":"FFC","why":"French-laid-out park where retirees dance, play cards and sing. Best before 9am.","mins":60},{"name":"Century Park","area":"Pudong","why":"The big green one, good for cycling.","mins":90},{"name":"Suzhou Creek walkway","area":"Jing'an / Putuo","why":"A restored riverside walk past converted warehouses; the quieter alternative to the Bund.","mins":90},{"name":"Shanghai Botanical Garden or Chenshan","area":"Songjiang","why":"Worth it in magnolia season, otherwise skip.","mins":180}],"shopping":[{"name":"Anfu Road and Wulumuqi Road","area":"FFC","why":"Independent design, concept stores, the best browsing in the city.","mins":120},{"name":"Nanjing Road","area":"Huangpu","why":"The famous pedestrian shopping street. Crowded and mostly chains; walk it once for the neon.","mins":60},{"name":"Tianzifang","area":"Dapuqiao","why":"Craft and souvenir shops in lane houses. Touristy but pleasant early.","mins":90},{"name":"Dongtai Road antiques (much reduced) and Yuyuan bazaar","area":"Huangpu","why":"Chops, fans, tea things and reproductions. Bargain.","mins":90},{"name":"Zhangyuan","area":"Jing'an","why":"Restored shikumen block turned into luxury retail. Architecturally interesting even if you buy nothing.","mins":60}],"nightlife":[{"name":"Bund rooftop bars","area":"Huangpu","why":"You pay for the view once. Bar Rouge, Vue and the Peninsula terrace all deliver it.","mins":120},{"name":"Speakeasy cocktail bars","area":"FFC and Jing'an","why":"Shanghai's bar scene is Asia's most serious after Tokyo and Singapore.","mins":150},{"name":"Jazz at the Fairmont Peace Hotel","area":"The Bund","why":"The old jazz band in the 1929 lobby bar. Corny, historic, fun once.","mins":120},{"name":"Live music at Yuyintang","area":"Putuo","why":"The city's long-running independent music venue.","mins":150}]},"essential10":[{"rank":1,"name":"The Bund at dusk and again at dawn","why":"Two completely different cities in the same frame twelve hours apart.","mins":90,"label":"Essential","popularity":5,"cultural":5,"worth":5},{"rank":2,"name":"A long walk in the former French Concession","why":"No monuments, no queue, and the thing people remember about Shanghai.","mins":180,"label":"Essential","popularity":4,"cultural":5,"worth":5},{"rank":3,"name":"Xiaolongbao and a proper Shanghainese lunch","why":"The regional cooking is the most underrated thing in the city.","mins":90,"label":"Essential","popularity":5,"cultural":5,"worth":5},{"rank":4,"name":"Shanghai Museum, bronzes and ceramics","why":"Free, compact and among the best collections in the country.","mins":150,"label":"Essential","popularity":4,"cultural":5,"worth":5},{"rank":5,"name":"Yu Garden at opening","why":"Genuine Ming garden design; unbearable after ten in the morning.","mins":90,"label":"Recommended","popularity":5,"cultural":4,"worth":4},{"rank":6,"name":"Shanghai Tower or a Bund rooftop","why":"One elevated view. The rooftop bar is better value and better looking than the observation deck.","mins":90,"label":"Recommended","popularity":5,"cultural":2,"worth":4},{"rank":7,"name":"Power Station of Art or West Bund","why":"Contemporary China at scale, in buildings worth seeing regardless.","mins":150,"label":"Recommended","popularity":3,"cultural":4,"worth":4},{"rank":8,"name":"A water town or Suzhou","why":"The Jiangnan landscape Shanghai grew out of, half an hour to two hours away.","mins":480,"label":"Recommended","popularity":4,"cultural":5,"worth":4},{"rank":9,"name":"Jewish Refugees Museum in Hongkou","why":"An unexpected and moving corner of the city's history.","mins":120,"label":"Optional","popularity":2,"cultural":5,"worth":4},{"rank":10,"name":"Tianzifang","why":"Photogenic, crowded and mostly retail. Fine early, skip if pressed.","mins":90,"label":"Optional","popularity":4,"cultural":2,"worth":2}],"food":{"identity":"Shanghainese cooking belongs to the Jiangnan tradition: sweeter, oilier and more delicate than northern food, built on river fish, freshwater shrimp, soy and sugar rather than chilli. Locals call the signature technique nong you chi jiang, heavy oil and red sauce. Layered on top is everything that arrived by port, so the city also has China's best coffee, its most serious bar scene and long-established Cantonese, Japanese and Western cooking.","mustTry":[{"dish":"Xiaolongbao","what":"Thin-skinned pork dumplings with jellied stock inside that melts into soup when steamed.","why":"Invented in Nanxiang on the city's edge, and the technical benchmark for dumpling-making.","flavour":"Rich, porky, faintly sweet.","howLocalsEat":"Nip the side, drink the soup, then eat. Vinegar with ginger shreds, never soy.","importance":"Essential"},{"dish":"Shengjianbao","what":"Thicker-skinned pork buns pan-fried until the base is crisp, sesame and scallion on top.","why":"The breakfast counterpart to xiaolongbao and, for many locals, the better dumpling.","flavour":"Crunchy bottom, soft top, soup inside.","howLocalsEat":"From a shop window, standing, two or four at a time.","importance":"Essential"},{"dish":"Hongshao rou","what":"Pork belly braised in soy, sugar and rice wine until glossy and collapsing.","why":"The archetypal red-cooked dish and the clearest expression of the local sweet-savoury balance.","flavour":"Sweet, deep, unctuous.","howLocalsEat":"With plain rice, as part of a shared table.","importance":"Essential"},{"dish":"Drunken shrimp or drunken crab","what":"Live freshwater shrimp or raw crab cured in strong rice wine.","why":"A genuinely local delicacy that most visitors never try.","flavour":"Sweet, alcoholic, slippery.","howLocalsEat":"As a cold starter. Be aware it is raw.","importance":"Optional, adventurous"},{"dish":"Hairy crab","what":"Small freshwater crab steamed whole, eaten with vinegar and ginger. Autumn only.","why":"A seasonal obsession that shuts down conversation in October and November.","flavour":"Sweet roe, delicate meat, a great deal of work.","howLocalsEat":"With yellow wine, slowly, at a table of people who will show you how.","importance":"Essential if you visit in autumn"},{"dish":"Cong you ban mian","what":"Noodles tossed in scallion oil with dried shrimp and soy.","why":"Three ingredients, no protein, and one of the great cheap bowls anywhere.","flavour":"Intensely oniony, savoury, simple.","howLocalsEat":"For lunch, alone, in five minutes.","importance":"Recommended"},{"dish":"Xiaolongxia","what":"Spicy crayfish, seasonal, eaten with gloves.","why":"Summer street food; more Hunan than Shanghai in origin but adopted wholeheartedly.","flavour":"Chilli, garlic, beer.","howLocalsEat":"Outdoors in summer, messily, in groups.","importance":"Recommended in summer"},{"dish":"Sheng jian and da bing you tiao breakfast","what":"Fried dough sticks, rice rolls, soy milk and pancakes from a morning shop.","why":"The four heavenly kings of Shanghai breakfast, still eaten daily.","flavour":"Savoury, plain, comforting.","howLocalsEat":"Before eight, standing.","importance":"Recommended"}]},"mustEat10":[{"dish":"Xiaolongbao","where":"Jia Jia Tang Bao, or Din Tai Fung for the polished r","price":"High","area":"The Bund","desc":"1929 lobby bar with the old jazz band still playing.","dishes":"Cocktails","whyGo":"The clearest surviving piece of 1930s Shanghai.","booking":"Recommended"}],"bestFood":[{"name":"Fu He Hui","cuisine":"Vegetarian fine dining","price":"High","area":"Changning","desc":"Buddhist-influenced vegetarian tasting menus, meditative rooms.","dishes":"Set menu","whyGo":"One of the best restaurants in China, meat or not.","booking":"Essential"},{"name":"Ultraviolet","cuisine":"Experimental","price":"Very high","area":"Secret","desc":"Ten seats, one table, multi-sensory. You are collected from a meeting point.","dishes":"Set menu","whyGo":"If you want the most-discussed dining experience in Asia.","booking":"Months ahead"},{"name":"Fu 1088","cuisine":"Shanghainese","price":"High","area":"Jing'an","desc":"Private rooms in a 1930s villa, refined versions of local classics.","dishes":"Hongshao rou, drunken chicken","whyGo":"Shanghainese food in the setting it deserves.","booking":"Essential"}],"bestValue":[{"name":"Yang's Fry Dumpling","cuisine":"Shengjianbao","price":"Low","area":"Several","desc":"A chain, still excellent, still cheap.","dishes":"Pan-fried pork buns","whyGo":"The best five-minute meal in the city.","booking":"No"},{"name":"Nanxiang Steamed Bun Restaurant","cuisine":"Xiaolongbao","price":"Low-mid","area":"Yu Garden","desc":"The famous one by the garden. Tourist-heavy, but the upstairs rooms are calmer and good.","dishes":"Crab roe xiaolongbao","whyGo":"Convenient after Yu Garden.","booking":"No"},{"name":"Neighbourhood noodle shops in the Concession","cuisine":"Shanghainese noodles","price":"Low","area":"Xuhui","desc":"Unnamed, plastic-stooled, open at lunch only.","dishes":"Scallion oil noodles, wontons","whyGo":"Where the food actually is.","booking":"No"}],"special":[{"name":"Mr & Mrs Bund","cuisine":"Modern French","price":"High","area":"The Bund","desc":"Paul Pairet's less formal room, with the river outside the wind
