   5h. LIVE DECKS — OpenStreetMap + Wikipedia
   ========================================================= */
const OVERPASS = "https://overpass-api.de/api/interpreter";

function suitFromTags(tg){
  const t = tg || {};
  if(t.tourism==="museum" || t.building==="museum") return "museum";
  if(t.tourism==="gallery" || t.tourism==="artwork" || t.amenity==="arts_centre") return "art";
  if(t.tourism==="viewpoint" || t.man_made==="tower" || t.natural==="peak") return "view";
  if(t.tourism==="zoo" || t.tourism==="aquarium" || t.tourism==="theme_park") return "nature";
  if(t.amenity==="place_of_worship" || t.historic==="temple" || t.historic==="church" ||
     /^(cathedral|temple|church|mosque|synagogue|shrine|pagoda|monastery|chapel)$/.test(t.building||"")) return "temple";
  if(t.amenity==="marketplace" || t.shop==="mall" || t.shop==="department_store") return "market";
  if(t.amenity==="theatre" || t.amenity==="casino") return "night";
  if(t.leisure==="park" || t.leisure==="garden" || t.leisure==="nature_reserve" ||
     t.natural==="beach" || t.natural==="bay") return "nature";
  return "landmark";
}
// things that carry a wikidata tag but nobody flies anywhere to see
function isJunkPOI(t){
  if(!t) return true;
  if(t.amenity==="hospital" || t.amenity==="clinic" || t.amenity==="school" ||
     t.amenity==="university" && !t.tourism || t.amenity==="townhall" && !t.historic ||
     t.amenity==="police" || t.amenity==="fire_station" || t.amenity==="bank" ||
     t.amenity==="fuel" || t.amenity==="parking" || t.amenity==="bus_station") return true;
  if(t.office || t.healthcare || t.craft) return true;
  if(/^(hotel|hostel|motel|guest_house|apartment|information|camp_site|caravan_site)$/.test(t.tourism||"")) return true;
  if(/^(office|apartments|residential|commercial|retail|hospital|school|industrial|warehouse|hotel|dormitory|garage|service|roof)$/
     .test(t.building||"") && !t.historic && !t.tourism) return true;
  if(t.railway && !t.historic && !t.tourism) return true;
  return false;
}
function bearingLabel(from, to){
  const dLon = (to.lon-from.lon)*Math.PI/180;
  const y = Math.sin(dLon)*Math.cos(to.lat*Math.PI/180);
  const x = Math.cos(from.lat*Math.PI/180)*Math.sin(to.lat*Math.PI/180) -
            Math.sin(from.lat*Math.PI/180)*Math.cos(to.lat*Math.PI/180)*Math.cos(dLon);
  const b = (Math.atan2(y,x)*180/Math.PI + 360)%360;
  const dirs = ["north","north-east","east","south-east","south","south-west","west","north-west"];
  const dir = dirs[Math.round(b/45)%8];
  const km = haversine(from,to);
  if(km==null || km<0.9) return "city centre";
  return Math.round(km)+"km "+dir;
}
async function wikiExtracts(titles){
  const out = {};
  for(let i=0;i<titles.length;i+=20){
    const batch = titles.slice(i,i+20);
    const url = "https://en.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1"+
      "&exsentences=1&redirects=1&format=json&origin=*&titles="+encodeURIComponent(batch.join("|"));
    try{
      const r = await fetch(url);
      const j = await r.json();
      const pages = (j.query && j.query.pages) || {};
      const norm = {};
      ((j.query && j.query.normalized) || []).forEach(n=>{ norm[n.to]=n.from; });
      Object.keys(pages).forEach(k=>{
        const p = pages[k];
        if(!p.extract) return;
        let s = p.extract.replace(/\s+/g," ").trim();
        if(s.length>150) s = s.slice(0,147).replace(/[ ,;]\w*$/,"")+"…";
        out[p.title] = s;
        if(norm[p.title]) out[norm[p.title]] = s;
      });
    }catch(e){ /* leave blanks */ }
  }
  return out;
}
// how many language editions of Wikipedia bothered to write about this place.
// The Forbidden City has ~100; a district hospital has one. That's the whole trick.
async function wikidataFame(ids){
  const fame = {}, enTitle = {};
  for(let i=0;i<ids.length;i+=50){
    const batch = ids.slice(i,i+50);
    const url = "https://www.wikidata.org/w/api.php?action=wbgetentities&props=sitelinks"+
      "&format=json&origin=*&ids="+batch.join("%7C");
    try{
      const r = await fetch(url);
      const j = await r.json();
      const ents = j.entities || {};
      Object.keys(ents).forEach(q=>{
        const sl = ents[q].sitelinks || {};
        fame[q] = Object.keys(sl).length;
        if(sl.enwiki && sl.enwiki.title) enTitle[q] = sl.enwiki.title;
      });
    }catch(e){ /* leave unranked */ }
  }
  return {fame, enTitle};
}
function isLatinName(s){ return !/[^\u0000-\u024F\u1E00-\u1EFF\u2000-\u206F]/.test(s||""); }

async function fetchLiveDeck(city){
  const R = 20000;   // wide enough for the Summer Palace, Versailles, Sagrada's suburbs
  const at = `(around:${R},${city.lat},${city.lon})`;
  const q = `[out:json][timeout:60];
(
 nwr${at}["wikidata"]["tourism"~"^(attraction|museum|gallery|artwork|viewpoint|zoo|aquarium|theme_park)$"];
 nwr${at}["wikidata"]["historic"];
 nwr${at}["wikidata"]["amenity"~"^(place_of_worship|marketplace|theatre|arts_centre)$"];
 nwr${at}["wikidata"]["leisure"~"^(park|garden|nature_reserve)$"];
 nwr${at}["wikidata"]["building"~"^(palace|cathedral|temple|castle|pagoda|monastery|shrine|church|mosque)$"];
 nwr${at}["wikidata"]["man_made"~"^(tower|lighthouse|bridge)$"];
 nwr${at}["wikidata"]["natural"~"^(peak|beach|bay)$"];
);
out center 400;`;
  let els = [];
  try{
    const r = await fetch(OVERPASS, {method:"POST", body:"data="+encodeURIComponent(q),
      headers:{"Content-Type":"application/x-www-form-urlencoded"}});
    if(!r.ok) throw new Error("overpass "+r.status);
    const j = await r.json();
    els = j.elements || [];
  }catch(e){
    return fetchWikiDeck(city);
  }

  const byQ = {};
  els.forEach(el=>{
    const tg = el.tags || {};
    const q = tg.wikidata;
    const lat = el.lat != null ? el.lat : (el.center && el.center.lat);
    const lon = el.lon != null ? el.lon : (el.center && el.center.lon);
    if(!q || !isNum(lat) || !isNum(lon) || !tg.name || isJunkPOI(tg)) return;
    if(byQ[q]) return;                       // same place mapped as node and way
    byQ[q] = {q, tags:tg, lat, lon};
  });
  const ids = Object.keys(byQ);
  if(!ids.length) return fetchWikiDeck(city);

  const {fame, enTitle} = await wikidataFame(ids);
  let ranked = ids.map(q=>Object.assign({fame: fame[q]||0, en: enTitle[q]||null}, byQ[q]));
  // a place worth a card is one several countries have written about.
  // The floor never drops below 3 — that's what kept hospitals out.
  let keep = ranked.filter(x=>x.fame >= 6);
  if(keep.length < 10) keep = ranked.filter(x=>x.fame >= 3);
  if(keep.length < 3) return fetchWikiDeck(city);
  keep.sort((a,b)=>b.fame-a.fame || haversine(city,a)-haversine(city,b));
  keep = keep.slice(0,26);

  const cards = keep.map(x=>{
    const tg = x.tags;
    const native = tg.name;
    const name = tg["name:en"] || (isLatinName(native) ? native : (x.en || native));
    const area = tg["addr:suburb"] || tg["addr:city_district"] || tg["addr:neighbourhood"] ||
                 tg["addr:quarter"] || bearingLabel(city, x);
    const c = {name, suit:suitFromTags(tg), area, blurb: tg.description || "",
            lat:x.lat, lon:x.lon, wiki: x.en, fame:x.fame, src:"osm",
            alt: (name!==native && isLatinName(name)) ? native : ""};
    const f = cardFacts(c, null, keep.length);
    return Object.assign(c, f, {iconic: fameToIconic(x.fame)});
  });
  const titles = cards.map(c=>c.wiki).filter(Boolean);
  if(titles.length){
    const ex = await wikiExtracts(titles);
    cards.forEach(c=>{ if(!c.blurb && c.wiki && ex[c.wiki]) c.blurb = ex[c.wiki]; });
  }
  cards.forEach(c=>{
    if(!c.blurb) c.blurb = suitOf(c.suit).name+" in "+c.area;
    if(c.alt) c.blurb += " · "+c.alt;
  });
  return cards.concat(genericFoodCards(city));
}
async function fetchWikiDeck(city){
  try{
    const url = "https://en.wikipedia.org/w/api.php?action=query&list=geosearch&format=json&origin=*"+
      "&gsradius=10000&gslimit=40&gscoord="+city.lat+"%7C"+city.lon;
    const r = await fetch(url);
    const j = await r.json();
    const hits = (j.query && j.query.geosearch) || [];
    if(!hits.length) return null;
    const ex = await wikiExtracts(hits.map(h=>h.title));
    return hits.slice(0,24).map(h=>{
      const c = {name:h.title, suit:"landmark", area:bearingLabel(city,{lat:h.lat,lon:h.lon}),
        blurb: ex[h.title] || "Notable place nearby", lat:h.lat, lon:h.lon, src:"wikipedia"};
      return Object.assign(c, cardFacts(c, null, hits.length), {iconic:3});
    }).concat(genericFoodCards(city));
  }catch(e){ return null; }
}
function genericFoodCards(city){
  return [].concat([
    {name:"The dish this city is known for", suit:"eats", area:"anywhere",
     blurb:"Ask one local where they'd send their own family, then go there", lat:city.lat, lon:city.lon, src:"prompt"},
    {name:"Morning market", suit:"market", area:"city centre",
     blurb:"Produce, cheap breakfast, and a read on how people actually eat here", lat:city.lat, lon:city.lon, src:"prompt"},
    {name:"A proper sit-down dinner", suit:"eats", area:"anywhere",
     blurb:"One booked meal that anchors an evening", lat:city.lat, lon:city.lon, src:"prompt"},
    {name:"Coffee somewhere with a view", suit:"eats", area:"anywhere",
     blurb:"An hour of watching the place go by counts as an activity", lat:city.lat, lon:city.lon, src:"prompt"}
  ].map(c=>Object.assign(c, cardFacts(c, 99, 4), {iconic:2})));
}

function cardId(cityId, name){
  return cityId+":"+name.toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,40);
}
const DECK_RANK = {report:3, curated:2, osm:1, wikipedia:1, none:0};
const DECK_FORMAT = 2;   // 2 = food lives on the Eat & drink board, not in the deck
async function ensureDeck(t, city){
  t.decks = t.decks || {};
  const cached = t.decks[city.id];
  const report = reportFor(city.name);
  const best = report ? "report" : (DECKS[city.name] ? "curated" : "osm");
  const cacheOk = cached && cached.cards && cached.cards.length &&
                  (cached.v||1) >= DECK_FORMAT &&
                  (DECK_RANK[cached.source]||0) >= (DECK_RANK[best]||0);
  if(cacheOk) return cached;

  let cards = null, source = null;
  if(report){
    cards = deckFromReport(report, city);
    source = "report";
  }
  if(!cards || !cards.length){
    cards = curatedDeck(city.name);
    source = "curated";
  }
  if(!cards){
    if(city.lat==null) return null;
    cards = await fetchLiveDeck(city);
    source = cards && cards.length ? cards[0].src : "none";
  }
  if(!cards || !cards.length) return null;
  cards.forEach(c=>{ c.id = cardId(city.id, c.name); });
  // keep any verdicts you already gave to cards that survived the rebuild
  t.decks[city.id] = {cards, source, at:Date.now(), v:DECK_FORMAT};
  save();
  return t.decks[city.id];
}

/* =========================================================
   5h1. FINDING A PLACE BY NAME, ADDRESS OR LINK
   ========================================================= */
const NOMINATIM = "https://nominatim.openstreetmap.org/search";

// A pair of numbers, or a map link with coordinates in it — no network needed
function parseCoords(text){
  const s = String(text||"").trim();
  let m = s.match(/^\s*(-?\d{1,2}(?:\.\d+)?)\s*[,;\s]\s*(-?\d{1,3}(?:\.\d+)?)\s*$/);
  if(!m) m = s.match(/(?:@|!3d)(-?\d{1,2}\.\d+)[,!]+(?:4d)?(-?\d{1,3}\.\d+)/);
  if(!m) m = s.match(/[?&](?:q|ll|mlat)=(-?\d{1,2}\.\d+)[,&](?:.*?mlon=)?(-?\d{1,3}\.\d+)/);
  if(!m) return null;
  const lat = parseFloat(m[1]), lon = parseFloat(m[2]);
  if(!isFinite(lat) || !isFinite(lon)) return null;
  if(Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
  return {lat, lon};
}
async function findPlace(query, cityHint){
  const coords = parseCoords(query);
  if(coords) return [{name:query.trim().slice(0,60), area:"pasted coordinates",
                      lat:coords.lat, lon:coords.lon, src:"coords"}];
  const q = cityHint && query.toLowerCase().indexOf(cityHint.toLowerCase()) < 0
    ? query + ", " + cityHint : query;
  const url = NOMINATIM + "?format=jsonv2&addressdetails=1&limit=6&q=" + encodeURIComponent(q);
  const r = await fetch(url, {headers:{"Accept":"application/json"}});
  if(!r.ok) throw new Error("search failed");
  const j = await r.json();
  return (j||[]).map(x=>{
    const a = x.address || {};
    const area = a.suburb || a.neighbourhood || a.quarter || a.city_district ||
                 a.town || a.city || a.county || "";
    const short = (x.name && x.name.length ? x.name : String(x.display_name||"").split(",")[0]);
    return {name:short, area, full:x.display_name, lat:+x.lat, lon:+x.lon, src:"osm"};
  }).filter(isPoint);
}

/* =========================================================
   5h2. CONTEXTUAL PLACE SUGGESTIONS
   What kind of thing is this magnet, where is the rest of that day,
   and what real places match both?
   ========================================================= */
const CATS = [
  {id:"shrine",  words:["shrine","jinja","torii"],                       suit:"temple", plural:"shrines",
   osm:'["amenity"="place_of_worship"]'},
  {id:"temple",  words:["temple","pagoda","monastery","wat","buddha"],   suit:"temple", plural:"temples",
   osm:'["amenity"="place_of_worship"]'},
  {id:"church",  words:["church","cathedral","basilica","chapel","mosque","synagogue"], suit:"temple", plural:"churches",
   osm:'["amenity"="place_of_worship"]'},
  {id:"museum",  words:["museum","exhibition"],                          suit:"museum", plural:"museums",
   osm:'["tourism"="museum"]'},
  {id:"gallery", words:["gallery","art","contemporary","sculpture"],     suit:"art",    plural:"galleries",
   osm:'["tourism"="gallery"]'},
  {id:"park",    words:["park","garden","nature","green","botanic"],     suit:"nature", plural:"parks and gardens",
   osm:'["leisure"~"^(park|garden)$"]'},
  {id:"view",    words:["view","viewpoint","lookout","observation","sunset","sunrise","panorama","skyline"], suit:"view", plural:"viewpoints",
   osm:'["tourism"="viewpoint"]'},
  {id:"coffee",  words:["coffee","cafe","café","espresso","tea house","teahouse"], suit:"eats", plural:"cafes",
   osm:'["amenity"="cafe"]'},
  {id:"bar",     words:["bar","cocktail","pub","drink","nightlife","beer","wine","izakaya",
                        "opera","theatre","theater","concert","performance","circus","acrobatics","cabaret"], suit:"night", plural:"bars and shows",
   osm:'["amenity"~"^(bar|pub|biergarten)$"]'},
  {id:"market",  words:["market","bazaar","souk","flea"],                suit:"market", plural:"markets",
   osm:'["amenity"="marketplace"]'},
  {id:"shop",    words:["shop","shopping","vintage","bookshop","bookstore","design","boutique","record"], suit:"shop", plural:"shops",
   osm:'["shop"~"^(books|clothes|second_hand|gift|art|music|department_store)$"]'},
  {id:"bath",    words:["onsen","spa","bath","sauna","hammam","bathhouse","massage"], suit:"walk", plural:"baths and spas",
   osm:'["leisure"="spa"]'},
  {id:"eats",    words:["eat","dish","food","dinner","lunch","breakfast","restaurant","ramen","sushi","noodle",
                        "bbq","barbecue","tapas","street food","meal","kaiseki","brunch"], suit:"eats", plural:"places to eat",
   osm:'["amenity"="restaurant"]'}
];
CATS.forEach(c=>{
  c.re = new RegExp("\\b(" + c.words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|") +
                    ")(s|es|ing)?\\b", "i");
});
function categoryFor(label, kind){
  const s = label||"";
  for(const c of CATS){ if(c.re.test(s)) return c; }
  if(kind==="eat") return CATS.find(c=>c.id==="eats");
  return null;
}
function findCard(t, cardId){
  if(!cardId || !t.decks) return null;
  for(const k in t.decks){
    const d = t.decks[k];
    if(!d || !d.cards) continue;
    const hit = d.cards.find(c=>c.id===cardId);
    if(hit) return hit;
  }
  return null;
}
function magnetPoint(t, m){
  if(isPoint(m.place)) return m.place;
  const c = findCard(t, m.cardId);
  return isPoint(c) ? c : null;
}
// where is the rest of this day, and what neighbourhoods is it in?
function dayContext(t, day, excludeId){
  const cityId = computeDayCities(t)[day];
  const city = cityById(t, cityId);
  const others = t.magnets.filter(m=>m.board==="cal" && m.day===day && m.id!==excludeId && m.kind!=="fly");
  const pts = [], areas = [], labels = [];
  others.forEach(m=>{
    const p = magnetPoint(t, m);
    if(p){ pts.push(p); if(p.area) areas.push(p.area); }
    labels.push(m.label);
  });
  const anchor = pts.length
    ? {lat: pts.reduce((a,p)=>a+p.lat,0)/pts.length, lon: pts.reduce((a,p)=>a+p.lon,0)/pts.length}
    : (city && city.lat!=null ? city : null);
  const tally = {};
  areas.forEach(a=>{ tally[a]=(tally[a]||0)+1; });
  const area = Object.keys(tally).sort((a,b)=>tally[b]-tally[a])[0] || "";
  return {city, cityId, anchor, area, anchored: pts.length>0, count: others.length, labels};
}
// matching places already in this city's deck
function deckSuggestions(t, ctx, cat, exclude){
  const d = ctx.cityId && t.decks ? t.decks[ctx.cityId] : null;
  if(!d || !d.cards || !ctx.anchor) return [];
  const used = new Set(t.magnets.map(m=>m.cardId).filter(Boolean));
  return d.cards
    .filter(c=>c.lat!=null && !used.has(c.id) && c.id!==exclude)
    .filter(c=>!cat || c.suit===cat.suit ||
                (cat.id==="eats" && (c.suit==="eats"||c.suit==="market")))
    .map(c=>({name:c.name, area:c.area, lat:c.lat, lon:c.lon, cardId:c.id,
              km:haversine(ctx.anchor,c), src:"deck", blurb:c.blurb}))
    .filter(x=>x.km!=null && x.km < 4)
    .sort((a,b)=>a.km-b.km)
    .slice(0,6);
}
// and anything else nearby that OpenStreetMap knows about
async function osmSuggestions(ctx, cat){
  if(!ctx.anchor || !cat) return [];
  const q = `[out:json][timeout:25];
(
 nwr(around:2200,${ctx.anchor.lat},${ctx.anchor.lon})${cat.osm}["name"];
);
out center 60;`;
  const r = await fetch(OVERPASS, {method:"POST", body:"data="+encodeURIComponent(q),
    headers:{"Content-Type":"application/x-www-form-urlencoded"}});
  if(!r.ok) throw new Error("overpass "+r.status);
  const j = await r.json();
  const seen = new Set();
  return (j.elements||[]).map(el=>{
    const tg = el.tags||{};
    const lat = el.lat!=null?el.lat:(el.center&&el.center.lat);
    const lon = el.lon!=null?el.lon:(el.center&&el.center.lon);
    if(!isNum(lat) || !isNum(lon) || !tg.name || isJunkPOI(tg)) return null;
    const name = tg["name:en"] || tg.name;
    if(seen.has(name.toLowerCase())) return null;
    seen.add(name.toLowerCase());
    return {name, area: tg["addr:suburb"]||tg["addr:neighbourhood"]||tg["addr:quarter"]||"",
            lat, lon, km:haversine(ctx.anchor,{lat,lon}), src:"osm",
            fame:(tg.wikidata?2:0)+(tg.website?1:0)};
  }).filter(Boolean)
    .sort((a,b)=>b.fame-a.fame || a.km-b.km)
    .slice(0,8);
}


/* =========================================================
   5n. DECKS BUILT FROM A CITY REPORT
   When a report exists it outranks everything else: it already knows
   what is worth your time, how long it takes and why.
   ========================================================= */
const SUIT_BY_GROUP = {historic:"landmark", arts:"museum", nature:"nature",
                       shopping:"shop", nightlife:"night", neighbourhoods:"walk"};

function reportCoord(r, name){
  if(!r.coords) return null;
  if(r.coords[name]) return {lat:r.coords[name][0], lon:r.coords[name][1]};
  const key = String(name||"").toLowerCase();
  for(const k in r.coords){
    const lk = k.toLowerCase();
    if(lk === key || lk.indexOf(key) === 0 || key.indexOf(lk) === 0)
      return {lat:r.coords[k][0], lon:r.coords[k][1]};
  }
  // fall back to the best word overlap, but only if there is a clear winner
  const want = new Set(nameTokens(name));
  if(want.size < 2) return null;
  let best = null, bestN = 1, tie = false;
  for(const k in r.coords){
    let n = 0;
    nameTokens(k).forEach(w=>{ if(want.has(w)) n++; });
    if(n > bestN){ best = k; bestN = n; tie = false; }
    else if(n === bestN && best) tie = true;
  }
  if(!best || tie) return null;
  return {lat:r.coords[best][0], lon:r.coords[best][1]};
}
// fall back to the hand-written deck, which does carry coordinates
function curatedCoord(cityName, name){
  const d = curatedDeck(cityName);
  if(!d) return null;
  const key = String(name||"").toLowerCase();
  const hit = d.find(c=>{
    const n = c.name.toLowerCase();
    return n === key || n.indexOf(key) === 0 || key.indexOf(n) === 0;
  });
  return hit ? {lat:hit.lat, lon:hit.lon, area:hit.area} : null;
}
// The suit comes from the name, but whether it is a meal has to consider the
// description too: "Peking duck, properly" only reads as food once you see the prose.
function isFoodish(name, blurb){
  const byName = categoryFor(name, null);
  if(byName) return byName.id === "eats" || byName.id === "coffee";
  const both = categoryFor(name + " " + (blurb||""), null);
  return !!both && (both.id === "eats" || both.id === "coffee");
}
function suitForReportItem(name, blurb, fallback){
  const byName = categoryFor(name, null);      // "Forbidden City" is not a viewpoint
  if(byName) return byName.suit;
  if(fallback) return fallback;
  const byBlurb = categoryFor(blurb || "", null);
  return byBlurb ? byBlurb.suit : "landmark";
}
function iconicFromScores(x){
  if(x.worth || x.cultural || x.popularity){
    const worth = x.worth || 3, cult = x.cultural || 3, pop = x.popularity || 3;
    return Math.max(1, Math.min(5, Math.round((worth*2 + cult + pop) / 4)));
  }
  if(/^essential/i.test(x.label||"")) return 5;
  if(/^recommended/i.test(x.label||"")) return 4;
  return 3;
}

/* ---------- telling two versions of the same thing apart ---------- */
const DUP_STOP = new Set(["the","a","an","and","or","of","in","to","at","then","with","for",
  "on","by","its","it","is","from","into","your","you","one","two"]);
// essential-ten entries are written as instructions; the deck wants the place
const NAME_TAILS = [
  / walked .*/i, / on foot.*/i, / by bike.*/i, / at opening.*/i, / at dawn.*/i, / at dusk.*/i,
  / at sunrise.*/i, / at night.*/i, / after dark.*/i, / at \d.*/i, / in the morning.*/i,
  / on a weekend.*/i, / early or late.*/i, /,? done properly.*/i, /,? properly.*/i,
  / and again .*/i, /,? even briefly.*/i, /,? ideally .*/i, / for a day.*/i, /,? alone.*/i
];
function cleanCardName(n){
  let out = String(n||"").trim();
  NAME_TAILS.forEach(re=>{
    const cut = out.replace(re, "").trim().replace(/[,;:]$/,"");
    const tk = nameTokens(cut);
    if(tk.length >= 2 || (tk.length === 1 && tk[0].length >= 8)) out = cut;
  });
  return out;
}
function nameTokens(s){
  return String(s||"").toLowerCase().replace(/\(.*?\)/g," ").replace(/[^a-z0-9\s]/g," ")
    .split(/\s+/).filter(w=>w.length>2 && !DUP_STOP.has(w));
}
// two cards pinned within 150m that share a distinctive word are one place
function sameSpot(card, name, spot){
  if(!spot || card.atCentre) return false;
  const d = haversine(card, spot);
  if(d == null || d > 0.15) return false;
  const A = new Set(nameTokens(card.name)), B = nameTokens(name);
  return B.some(w=>A.has(w));
}
function sameThing(a, b){
  const na = String(a||"").toLowerCase().trim(), nb = String(b||"").toLowerCase().trim();
  if(na === nb) return true;
  const A = new Set(nameTokens(a)), B = new Set(nameTokens(b));
  if(!A.size || !B.size) return false;
  const small = A.size <= B.size ? A : B, big = A.size <= B.size ? B : A;
  if(small.size < 2) return false;          // one distinctive word is not enough
  let hit = 0; small.forEach(w=>{ if(big.has(w)) hit++; });
  return hit === small.size;                 // one name contains the other entirely
}

function deckFromReport(r, city){
  const cards = [];
  const add = (rawName, suit, area, blurb, mins, iconic, effort) => {
    if(!rawName) return;
    const name = cleanCardName(rawName);
    const spot = reportCoord(r, rawName) || reportCoord(r, name) || curatedCoord(city.name, name);
    // same wording, or the same spot described differently
    const dup = cards.find(c=>sameThing(c.name, name) || sameSpot(c, name, spot));
    if(dup){
      if(name.length < dup.name.length) dup.name = name;
      // a later section often knows better what kind of thing it is
      if(dup.suit === "landmark" && suit && suit !== "landmark") dup.suit = suit;
      if(!dup.area && area) dup.area = area;
      if((blurb||"").length > (dup.blurb||"").length) dup.blurb = blurb;
      // this wording may be the one with hand-set facts, even if it came second
      const exactNow = cardFacts({name, suit, blurb}, null, 0);
      if(exactNow.exact && !dup.factsExact){
        dup.mins = exactNow.mins; dup.effort = exactNow.effort;
        dup.iconic = Math.max(dup.iconic||0, exactNow.iconic);
        dup.factsExact = true;
        if(iconic != null) dup.iconic = Math.max(dup.iconic, iconic);
        const co3 = reportCoord(r, rawName) || curatedCoord(city.name, name);
        if(co3 && dup.atCentre){ dup.lat = co3.lat; dup.lon = co3.lon; dup.atCentre = false; }
        return;
      }
      if(iconic != null) dup.iconic = Math.max(dup.iconic||0, iconic);
      if(mins != null && !dup.factsExact) dup.mins = Math.max(dup.mins||0, mins);
      const co2 = reportCoord(r, rawName) || curatedCoord(city.name, name);
      if(co2 && dup.atCentre){ dup.lat = co2.lat; dup.lon = co2.lon; dup.atCentre = false; }
      return;
    }
    const exact = spot;
    const co = exact ||
               (city.lat!=null ? {lat:city.lat, lon:city.lon} : null);
    if(!co) return;
    const card = {name, suit, area: area || (co.area||"") || "", blurb: blurb||"",
                  lat:co.lat, lon:co.lon, src:"report", atCentre: !exact};
    const f = cardFacts(card, null, 0);
    card.factsExact = f.exact;
    card.mins   = f.exact ? f.mins   : (mins   != null ? mins   : f.mins);
    card.effort = f.exact ? f.effort : (effort != null ? effort : f.effort);
    card.iconic = Math.max(f.exact ? f.iconic : 0, iconic != null ? iconic : f.iconic);
    cards.push(card);
  };

  // 1. the essential ten first, carrying the report's own scoring
  (r.essential10||[]).forEach(x=>{
    if(isFoodish(cleanCardName(x.name), x.why)) return;
    add(x.name, suitForReportItem(cleanCardName(x.name), x.why, "landmark"), "", x.why, x.mins, iconicFromScores(x));
  });
  // 2. everything in things to do
  Object.keys(SUIT_BY_GROUP).forEach(group=>{
    ((r.thingsToDo||{})[group]||[]).forEach(x=>{
      const blurb = x.why || [x.character, x.highlights].filter(Boolean).join(" · ");
      if(group !== "shopping" && isFoodish(cleanCardName(x.name), blurb)) return;
      add(x.name, suitForReportItem(x.name, blurb, SUIT_BY_GROUP[group]), x.area||"", blurb, x.mins);
    });
  });
  // Food is deliberately absent: deciding whether to eat a particular dish
  // is not the same kind of decision as whether to spend a morning somewhere.
  // Dishes and restaurants go to the Eat & drink board instead.
  // 3. experiences
  (r.experiences||[]).forEach(x=>{
    if(isFoodish(cleanCardName(x.name), x.what)) return;
    add(x.name, suitForReportItem(x.name, x.what, "do"), "", x.why || x.what, x.mins, 4);
  });
  // 4. day trips that the report says are worth it
  (r.dayTrips||[]).forEach(x=>{
    if(!/^worth/i.test(x.verdict||"")) return;
    add(x.name, "nature", x.travel||"", x.why, 480, 4);
  });

  // and nothing that is really a meal, wherever it came from
  const out = cards.filter(c=>c.suit !== "eats");
  out.forEach(c=>{ delete c.atCentre; delete c.factsExact; });
  out.forEach(c=>{ c.id = cardId(city.id, c.name); });
  return out;
}

/* ---------- food goes to the Eat & drink board ---------- */
function foodFromReport(r){
  const dishes = ((r.food||{}).mustTry||[]).map(x=>({
    kind:"dish", label:x.dish, note:[x.importance, x.flavour].filter(Boolean).join(" · "),
    detail:x.what||"", importance:x.importance||""
  }));
  const eat = (r.mustEat10||[]).map(x=>({
    kind:"where", label:x.where||x.dish, note:[x.dish, x.price].filter(Boolean).join(" · "),
    detail:x.order||"", importance:""
  }));
  const rs = r.restaurants||{};
  const groups = [["iconic","Iconic"],["bestFood","Best food"],["bestValue","Best value"],
                  ["special","Special occasion"],["casual","Casual"],["cafes","Cafes and tea"]];
  const places = [];
  groups.forEach(([k,label])=>{
    (rs[k]||[]).forEach(x=>places.push({
      kind:"restaurant", group:label, label:x.name,
      note:[label, x.price, x.area].filter(Boolean).join(" · "),
      detail:[x.dishes?"Order: "+x.dishes:"", x.booking?"Booking: "+x.booking:""].filter(Boolean).join(" · "),
      importance:""
    }));
  });
  return {dishes, eat, places};
}

/* =========================================================
   5i. CLUSTERING + DAY SPLIT
   ========================================================= */
function clusterCards(cards, radiusKm){
  const R = radiusKm || 1.3;
  const left = cards.slice();
  const groups = [];
  while(left.length){
    // seed from the densest remaining point, not just the next one in the list,
    // so a walkable knot of places doesn't get split by list order
    let best = 0, bestN = -1;
    for(let i=0;i<left.length;i++){
      let n = 0;
      for(let j=0;j<left.length;j++){
        if(i===j) continue;
        const d = haversine(left[i], left[j]);
        if(d!=null && d<=R) n++;
      }
      if(n>bestN){ bestN = n; best = i; }
    }
    const seed = left.splice(best,1)[0];
    const g = [seed];
    for(let i=left.length-1;i>=0;i--){
      const d = haversine(seed, left[i]);
      if(d!=null && d<=R) g.push(left.splice(i,1)[0]);
    }
    groups.push(g);
  }
  return groups.map(g=>{
    const tally = {};
    g.forEach(c=>{ tally[c.area] = (tally[c.area]||0)+1; });
    const name = Object.keys(tally).sort((a,b)=>tally[b]-tally[a])[0] || "around town";
    return {name, cards:g};
  }).sort((a,b)=>b.cards.length-a.cards.length);
}

function daysForCity(t, cityId){
  const dc = computeDayCities(t);
  return tripDays(t).filter(d=>dc[d]===cityId);
}

/* ---------- when in a day does this actually belong ---------- */
const DAY_MINUTES = 600;             // about ten hours of doing, meals aside
const FULL_DAY_MINS = 300;
function slotPrefs(card){
  const mins = card.mins || 60;
  const text = ((card.name||"") + " " + (card.blurb||"") + " " + (card.area||"")).toLowerCase();
  if(mins >= FULL_DAY_MINS) return {full:true, slots:["morning"]};
  if(/\bdawn\b|\bsunrise\b|early morning|\bat opening\b|\bbreakfast\b|\bmorning\b/.test(text))
    return {slots:["morning"]};
  if(card.suit === "night" || /\bsunset\b|\bdusk\b|after dark|\bat night\b|\bevening\b|\bnightlife\b/.test(text))
    return {slots:["evening","afternoon"]};
  if(mins >= 180) return {slots:["morning","afternoon"]};      // half a day needs daylight
  return {slots:["morning","afternoon","evening"]};
}
function dayHasRoom(day, card, per){
  const pref = slotPrefs(card);
  if(pref.full) return day.items.length === 0;
  if(day.full) return false;
  if(day.items.length >= per) return false;
  if(day.minutes + (card.mins||60) > DAY_MINUTES) return false;
  return pref.slots.some(sl=>!day.slotTaken[sl]);
}
function putOnDay(day, card, group){
  const pref = slotPrefs(card);
  const slot = pref.slots.find(sl=>!day.slotTaken[sl]) || pref.slots[0];
  day.slotTaken[slot] = true;
  day.minutes += (card.mins||60);
  if(pref.full) day.full = true;
  day.items.push({card, group, slot});
  day.names.add(group);
}

// Spread over the days that belong to this city - never another city's days -
// respecting how long each thing takes and when in the day it makes sense.
function planSplit(t, cityId, must, maybe){
  const per = paceOf(t.pace).per;
  const mustCards = must || [];
  const maybeCards = maybe || [];
  const days = daysForCity(t, cityId);
  const groups = clusterCards(mustCards.concat(maybeCards));
  const noDays = !days.length;
  if(noDays) return {days:[], groups, per, noDays:true,
                     unplaced:mustCards.concat(maybeCards), unplacedOptional:[]};

  const plan = days.map(d=>({day:d, items:[], names:new Set(), minutes:0,
                            slotTaken:{}, full:false}));
  const unplaced = [], unplacedOptional = [];
  const groupOf = c => (groups.find(g=>g.cards.indexOf(c)>=0) || {name:"around town"}).name;
  const emptiest = () => plan.slice().sort((a,b)=>a.minutes-b.minutes);

  // Whole-day outings claim a day first, since nothing else can share it.
  // Everything else is placed neighbourhood by neighbourhood so a day stays walkable,
  // longest first within each neighbourhood.
  const mustSet = new Set(mustCards);
  const bigDays = mustCards.filter(c=>slotPrefs(c).full).sort((a,b)=>(b.mins||0)-(a.mins||0));
  bigDays.forEach(card=>{
    const target = emptiest().find(p=>dayHasRoom(p, card, per));
    if(!target){ unplaced.push(card); return; }
    putOnDay(target, card, groupOf(card));
  });
  groups.forEach(g=>{
    g.cards.filter(c=>mustSet.has(c) && !slotPrefs(c).full)
           .sort((a,b)=>(b.mins||60)-(a.mins||60))
           .forEach(card=>{
      let target = plan.find(p=>p.names.has(g.name) && dayHasRoom(p, card, per));
      if(!target) target = emptiest().find(p=>dayHasRoom(p, card, per));
      if(!target){ unplaced.push(card); return; }
      putOnDay(target, card, g.name);
    });
  });

  // optionals only join a day that is already going to that part of town
  maybeCards.forEach(card=>{
    const g = groupOf(card);
    const near = plan.filter(p=>p.items.length && dayHasRoom(p, card, per) &&
      p.items.some(it=>{
        const d = haversine(it.card, card);
        return d != null && d <= 2.5;
      }));
    const target = near.find(p=>p.names.has(g)) || near[0];
    if(!target){ unplacedOptional.push(card); return; }
    putOnDay(target, card, g);
  });

  return {days:plan, groups, per, noDays:false,
          unplaced, unplacedOptional,
          allUnplaced: unplaced.concat(unplacedOptional)};
}

// already on the board? same card, or the same name on the same day
function alreadyPlaced(t, card, day){
  return t.magnets.some(m=>
    (m.cardId && m.cardId===card.id) ||
    (day && m.day===day && m.label.toLowerCase()===card.name.toLowerCase()));
}
function magnetFromCard(c, extra){
  const d = c.mins!=null ? durLabel(c.mins) : "";
  return Object.assign({
    optional:false,
    id:uid(), kind:suitOf(c.suit).kind, label:c.name,
    note:[c.area, d].filter(Boolean).join(" · "),
    mins:c.mins!=null?c.mins:null, effort:c.effort!=null?c.effort:null,
    locked:false, order:Date.now(), cardId:c.id,
    place: (isPoint(c) ? {lat:c.lat, lon:c.lon, area:c.area} : null)
  }, extra||{});
}
function placePlan(t, cityId, plan){
  let n = 0, skipped = 0, ix = 0;
  plan.days.forEach(p=>{
    p.items.forEach(it=>{
      if(alreadyPlaced(t, it.card, p.day)){ skipped++; return; }
      t.magnets.push(magnetFromCard(it.card, {board:"cal", day:p.day, slot:it.slot,
        order:Date.now()+(ix++),
        optional: (t.verdicts||{})[it.card.id] === "maybe"}));
      n++;
    });
  });
  (plan.allUnplaced || plan.unplaced || []).forEach(c=>{
    if(alreadyPlaced(t, c, null)){ skipped++; return; }
    t.magnets.push(magnetFromCard(c, {board:"short", col:cityId,
      optional:(t.verdicts||{})[c.id]==="maybe"}));
    n++;
  });
  save();
  return {placed:n, skipped};
}

/* =========================================================
   5j. DECK UI
   ========================================================= */
let deck = null;   // {cityId, queue:[], idx, done:[], phase}

// A card leaves the deck once it's on the board, or once you've said no.
// "Optional" keeps it in circulation - that's the whole point of optional.
function deckQueue(t, cityId){
  const d = t.decks && t.decks[cityId];
  if(!d || !d.cards) return [];
  const v = t.verdicts || {};
  return d.cards.filter(c=>{
    if(alreadyPlaced(t, c, null)) return false;
    return v[c.id] !== "must" && v[c.id] !== "no";
  });
}
function deckProgress(t, city){
  const d = t.decks && t.decks[city.id];
  if(!d) return null;
  const v = t.verdicts || {};
  const total = d.cards.length;
  const placed = d.cards.filter(c=>alreadyPlaced(t, c, null)).length;
  const kept = d.cards.filter(c=>v[c.id]==="must" || v[c.id]==="maybe").length;
  const left = deckQueue(t, city.id).length;
  return {total, placed, kept, left, seen: total-left};
}

// Which part of town is this? The area the card carried, else the note, else
// worked out from where it actually is.
function magnetArea(t, m){
  if(m.place && m.place.area) return m.place.area;
  const card = findCard(t, m.cardId);
  if(card && card.area) return card.area;
  const first = String(m.note||"").split(" · ")[0].trim();
  if(first && !/^\d/.test(first) && !/^(most of|full day|overnight)/i.test(first)) return first;
  return "";
}
function magnetIconic(t, m){
  const card = findCard(t, m.cardId);
  return card && card.iconic ? card.iconic : 0;
}
// city first, then the smaller areas inside it
function shortlistGroups(t, cityId){
  const items = shortlistFor(t, cityId);
  const byArea = {};
  const loose = [];
  items.forEach(m=>{
    const a = magnetArea(t, m);
    if(a){ (byArea[a] = byArea[a] || []).push(m); }
    else loose.push(m);
  });
  // anything without a stated area gets one from its neighbours
  if(loose.length){
    const withPos = loose.filter(m=>magnetPoint(t, m));
    const clusters = clusterCards(withPos.map(m=>{
      const p = magnetPoint(t, m);
      return {lat:p.lat, lon:p.lon, area:"", __m:m};
    }), 1.5);
    clusters.forEach(g=>{
      const near = Object.keys(byArea).find(a=>byArea[a].some(other=>{
        const po = magnetPoint(t, other), pg = g.cards[0];
        return po && haversine(po, pg) != null && haversine(po, pg) <= 1.5;
      }));
      const label = near || "Elsewhere";
      g.cards.forEach(c=>{ (byArea[label] = byArea[label] || []).push(c.__m); });
    });
    loose.filter(m=>!magnetPoint(t, m)).forEach(m=>{
      (byArea["Elsewhere"] = byArea["Elsewhere"] || []).push(m);
    });
  }
  return Object.keys(byArea)
    .sort((a,b)=>{
      if(a === "Elsewhere") return 1;
      if(b === "Elsewhere") return -1;
      return byArea[b].length - byArea[a].length || a.localeCompare(b);
    })
    .map(area=>({
      area,
      items: byArea[area].slice().sort((x,y)=>
        magnetIconic(t,y) - magnetIconic(t,x) ||
        (y.mins||0) - (x.mins||0) ||
        x.label.localeCompare(y.label))
    }));
}
function shortlistHTML(t){
  const rows = t.cities.map(c=>{
    const items = shortlistFor(t, c.id);
    if(!items.length) return "";
    const slots = citySlots(t, c.id);
    const onCal = t.magnets.filter(m=>m.board==="cal" && daysForCity(t,c.id).includes(m.day)
                    && m.kind!=="fly" && m.slot!=="transit" && m.slot!=="lunch" && m.slot!=="dinner").length;
    const groups = shortlistGroups(t, c.id);
    return `<div class="slcity" data-drop="short:${c.id}">
      <div class="slhead">
        <b>${esc(c.name)}</b>
        <span class="slcap ${onCal>slots?"full":""}">${onCal} of ${slots} slots used</span>
      </div>
      ${groups.map(g=>`<div class="slarea">
        <div class="slareahead">${esc(g.area)}<span>${g.items.length}</span></div>
        <div class="slstack">${g.items.map(magnetHTML).join("")}</div>
      </div>`).join("")}
    </div>`;
  }).join("");
  if(!rows) return "";
  return `<div class="shortpanel">
    <h3>Waiting list</h3>
    <p class="tsub">Kept, but there wasn't room. Grouped by city, then by area, so you can see
       what would pair well on a day. Drag any onto a day — or drag something back here.</p>
    ${rows}
  </div>`;
}
function deckPanelHTML(t){
  if(!t.cities.length) return "";
  const rows = t.cities.map(c=>{
    const p = deckProgress(t, c);
    const d = t.decks && t.decks[c.id];
    const stale = d && reportFor(c.name) && d.source !== "report";
    const bar = p ? `<span class="dbar"><i style="width:${Math.round(p.seen/p.total*100)}%"></i></span>` : "";
    const srcLabel = d ? (d.source==="report" ? " · from your report"
                        : d.source==="curated" ? " · hand-picked"
                        : d.source==="osm" || d.source==="wikipedia" ? " · from open data" : "") : "";
    const sub = p
      ? (p.left
          ? `${p.left} in the deck${p.placed?" · "+p.placed+" planned":""}${srcLabel}`
          : `deck empty · ${p.placed} planned${srcLabel}`)
      : (reportFor(c.name) ? (deckFromReport(reportFor(c.name), c).length + " cards from your report")
         : DECKS[c.name] ? (curatedDeck(c.name).length + " cards ready") : "fetches on open");

}

async function openDeck(cityId, mode){
  const t = trip();
  const city = cityById(t, cityId);
  if(!city) return;
  deck = {cityId, queue:[], idx:0, phase:"loading", anim:null, mode:mode||"new"};
  drawDeck();
  const d = await ensureDeck(t, city);
  if(!d){
    deck = null; closeModal();
    toast("Couldn't build a deck for "+city.name+" — needs an internet connection");
    return;
  }
  t.verdicts = t.verdicts || {};
  if(deck.mode === "optional"){
    deck.queue = d.cards.filter(c=>t.verdicts[c.id]==="maybe" && !alreadyPlaced(t,c,null));
  }else if(deck.mode === "passed"){
    deck.queue = d.cards.filter(c=>t.verdicts[c.id]==="no");
  }else{
    const q = deckQueue(t, cityId);
    // undecided and "later" first, optionals after - so new things lead
    const rank = c => t.verdicts[c.id]==="maybe" ? 2 : t.verdicts[c.id]==="skip" ? 1 : 0;
    deck.queue = q.slice().sort((a,b)=>rank(a)-rank(b));
  }
  deck.phase = deck.queue.length ? "swiping" : "done";
  drawDeck();
}

const VERDICTS = {
  must: {label:"Must do",       ic:"★", cls:"v-must",  dir:"right"},
  maybe:{label:"Optional",      ic:"◇", cls:"v-maybe", dir:"up"},
  skip: {label:"Decide later",  ic:"↻", cls:"v-skip",  dir:"down"},
  no:   {label:"Not for me",    ic:"✕", cls:"v-no",    dir:"left"}
};

function drawDeck(){
  const t = trip();
  const city = cityById(t, deck.cityId);
  if(deck.phase==="loading"){
    openModal(`<div class="deckwrap">
      <h3>Building the ${esc(city.name)} deck…</h3>

  const total = deck.queue.length;

  const top = deck.queue[deck.idx];
  const stack = deck.queue.slice(deck.idx, deck.idx+3).reverse().map((c,i,arr)=>{
    const depth = arr.length-1-i;
    return cardHTML(c, depth, depth===0);
  }).join("");
  const src = (t.decks[deck.cityId]||{}).source;
  openModal(`<div class="deckwrap">
    <div class="deckhead">
      <div>
        <h3>${esc(city.name)}</h3>
        <p class="msub">${deck.mode==="passed"?"Ones you passed on · ":deck.mode==="optional"?"Your optionals · ":""}${left} of ${total} left${src==="report"?" · from your city report":src==="curated"?" · hand-picked":src==="osm"?" · from OpenStreetMap":src==="wikipedia"?" · from Wikipedia":""}</p>
      </div>
      <button class="btn ghost sm" data-act="close">Done for now</button>
    </div>
    <div class="deckbar"><i style="width:${Math.round(deck.idx/total*100)}%"></i></div>
    <div class="deckstage" id="deckstage">${stack}</div>
    <div class="dpad">
      <button class="vbtn v-no"    data-act="verdict" data-v="no"><span class="vic">✕</span>Not for me<em>←</em></button>
      <div class="dpadmid">
        <button class="vbtn v-maybe" data-act="verdict" data-v="maybe"><span class="vic">◇</span>Optional<em>↑</em></button>
        <button class="vbtn v-skip"  data-act="verdict" data-v="skip"><span class="vic">↻</span>Later<em>↓</em></button>
      </div>
      <button class="vbtn v-must"  data-act="verdict" data-v="must"><span class="vic">★</span>Must do<em>→</em></button>
    </div>
    <p class="deckhint">${deck.mode==="passed"
      ? "Swipe right on anything you want back. Left leaves it passed."
      : deck.mode==="optional"
      ? "A second look at your maybes. Right promotes one to a must-do."
      : "Drag the card, use the arrow keys, or press the buttons."}</p>
  </div>`);
  mountSwipe();
}

function starsHTML(n){
  const k = Math.max(1, Math.min(5, n||2));
  let out = "";
  for(let i=1;i<=5;i++) out += `<span class="st ${i<=k?"on":""}">★</span>`;
  return `<span class="ficon" title="How iconic — ${k} of 5">${out}</span>`;
}
function effortHTML(c){
  if(!SHOW_EFFORT.has(c.suit) || c.effort==null) return "";
  const e = Math.max(0, Math.min(3, c.effort));
  let bars = "";
  for(let i=0;i<3;i++) bars += `<i class="${i<e?"on":""}"></i>`;
  return `<span class="feffort e${e}" title="Effort: ${EFFORT_LABEL[e]}">
    <span class="bars">${bars}</span>${EFFORT_LABEL[e]}</span>`;
}
function cardHTML(c, depth, isTop){
  const s = suitOf(c.suit);
  return `<div class="fcard ${isTop?"top":""}" data-card="${c.id}"
      style="--d:${depth};z-index:${10-depth}">
    <div class="fhead">
      <div class="fsuit" style="--sc:${s.color}"><span>${s.ic}</span>${s.name}</div>
      ${starsHTML(c.iconic)}
    </div>

    <div class="farea">${esc(c.area||"")}</div>

      ${c.mins!=null?`<span class="fchip" title="Rough time on site"><b>◷</b>${esc(durLabel(c.mins))}</span>`:""}
      ${effortHTML(c)}
    </div>
    <div class="fstamp fs-must">Must do</div>
    <div class="fstamp fs-no">Not for me</div>
    <div class="fstamp fs-maybe">Optional</div>
    <div class="fstamp fs-skip">Later</div>
  </div>`;
}

let swipeCleanup = null;
function mountSwipe(){
  if(swipeCleanup){ swipeCleanup(); swipeCleanup = null; }
  const el = document.querySelector(".fcard.top");
  if(!el) return;
  let sx=0, sy=0, dragging=false;
  const start = e=>{
    if(e.target.closest("button")) return;
    dragging = true;
    const p = e.touches?e.touches[0]:e;
    sx = p.clientX; sy = p.clientY;
    el.classList.add("grabbing");
  };
  const move = e=>{
    if(!dragging) return;
    const p = e.touches?e.touches[0]:e;
    const dx = p.clientX-sx, dy = p.clientY-sy;
    el.style.transform = `translate(${dx}px,${dy}px) rotate(${dx*0.05}deg)`;
    const v = verdictFor(dx,dy);
    el.setAttribute("data-hint", v||"");
  };
  const end = e=>{
    if(!dragging) return;
    dragging = false;
    el.classList.remove("grabbing");
    const p = (e.changedTouches&&e.changedTouches[0]) || e;
    const dx = p.clientX-sx, dy = p.clientY-sy;
    const v = verdictFor(dx,dy);
    if(v) return commitVerdict(v);
    el.style.transform = "";
    el.setAttribute("data-hint","");
  };
  el.addEventListener("pointerdown", start);
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", end);
  el.addEventListener("touchstart", start, {passive:true});
  window.addEventListener("touchmove", move, {passive:true});
  window.addEventListener("touchend", end);
  swipeCleanup = ()=>{
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", end);
    window.removeEventListener("touchmove", move);
    window.removeEventListener("touchend", end);
  };
}
function verdictFor(dx,dy){
  const T = 85;
  if(Math.abs(dx) > Math.abs(dy)){
    if(dx > T) return "must";
    if(dx < -T) return "no";
  }else{
    if(dy < -T) return "maybe";
    if(dy > T) return "skip";
  }
  return null;
}

function commitVerdict(v){
  if(swipeCleanup){ swipeCleanup(); swipeCleanup = null; }
  const t = trip();
  const card = deck.queue[deck.idx];
  if(!card) return;
  t.verdicts = t.verdicts || {};
  t.verdicts[card.id] = v;
  save();
  const el = document.querySelector(".fcard.top");
  if(el){
    const dir = VERDICTS[v].dir;
    const off = {right:["120%","0","18deg"], left:["-120%","0","-18deg"],
                 up:["0","-120%","0deg"], down:["0","120%","0deg"]}[dir];
    el.style.transition = "transform .34s cubic-bezier(.3,.7,.4,1), opacity .34s";
    el.style.transform = `translate(${off[0]},${off[1]}) rotate(${off[2]})`;
    el.style.opacity = "0";
  }
  deck.idx++;
  setTimeout(()=>{
    if(deck.idx >= deck.queue.length){ deck.phase = "done"; drawDeckDone(); }
    else drawDeck();
  }, 220);
}

function deckExtrasHTML(t){
  const d = t.decks && t.decks[deck.cityId];
  if(!d) return "";
  const v = t.verdicts || {};
  const opt = d.cards.filter(c=>v[c.id]==="maybe" && !alreadyPlaced(t,c,null)).length;
  const no  = d.cards.filter(c=>v[c.id]==="no").length;
  if(!opt && !no) return "";
  return `<div class="deckextras">
    ${opt?`<button class="btn sm" data-act="revisit" data-city="${deck.cityId}" data-mode="optional">
      Go through your ${opt} optional${opt===1?"":"s"} again</button>`:""}
    ${no?`<button class="btn sm" data-act="revisit" data-city="${deck.cityId}" data-mode="passed">
      Look back at the ${no} you passed on</button>`:""}
  </div>`;
}
function keptCards(t, cityId){
  const d = t.decks && t.decks[cityId];
  if(!d) return {must:[], maybe:[]};
  const v = t.verdicts || {};
  return {
    must: d.cards.filter(c=>v[c.id]==="must"),
    maybe: d.cards.filter(c=>v[c.id]==="maybe")
  };
}

function capacityHTML(t, cityId, keptN, plan){
  const city = cityById(t, cityId);
  const days = daysForCity(t, cityId).length;
  const per = paceOf(t.pace).per;
  const slots = days * per;
  const over = (plan.allUnplaced || plan.unplaced || []).length;
  if(!days) return "";
  return `<div class="capbox ${over?"over":""}">
    <div class="caprow">
      <b>${esc(city?city.name:"")}</b>
      <span>${days} day${days===1?"":"s"} × ${per} a day = <b>${slots} slot${slots===1?"":"s"}</b></span>
      <span>${keptN} kept</span>
    </div>
    <div class="capbar">
      <i class="fit" style="width:${Math.min(100, Math.round(Math.min(keptN,slots)/Math.max(keptN,slots,1)*100))}%"></i>
      ${over?`<i class="spill" style="width:${Math.round(over/Math.max(keptN,1)*100)}%"></i>`:""}
    </div>
    <p>${over
      ? "<b>"+over+" more than will fit.</b> The highest-rated go on the calendar; the rest wait on "+esc(city?city.name:"the city")+"'s shortlist, where you can compare them and swap any of them in."
      : "Everything you kept fits in the days you have."}</p>
  </div>`;
}
function drawDeckDone(){
  const t = trip();
  const city = cityById(t, deck.cityId);
  const all = keptCards(t, deck.cityId);
  const must = all.must.filter(c=>!alreadyPlaced(t,c,null));
  const maybe = all.maybe.filter(c=>!alreadyPlaced(t,c,null));
  const planned = (all.must.length+all.maybe.length) - (must.length+maybe.length);
  const kept = must.concat(maybe);
  if(!kept.length){
    openModal(`<div class="deckwrap">
      <div class="cheer"><span class="big">Deck cleared</span>
      <p>${planned
        ? planned+" from "+esc(city.name)+(planned===1?" is":" are")+" already on your calendar, and nothing new made the cut."
        : "Nothing made the cut for "+esc(city.name)+" — no harm done. Reset the deck if you want another look."}</p></div>
      ${deckExtrasHTML(t)}
      <div class="modrow">
        <button class="btn left" data-act="resetdeck" data-city="${deck.cityId}">Reset deck</button>
        <button class="btn primary" data-act="close">Close</button>
      </div></div>`);
    return;
  }
  const plan = planSplit(t, deck.cityId, must, maybe);
  deck.plan = plan;
  const groupList = plan.groups.slice(0,6).map(g=>{
    const mins = g.cards.reduce((n,c)=>n+(c.mins||0),0);
    const top = Math.max.apply(null, g.cards.map(c=>c.iconic||2));
    return `<div class="grow"><b>${esc(g.name)}</b>
      <span>${g.cards.length} spot${g.cards.length===1?"":"s"}${mins?" · "+esc(durLabel(mins)):""}</span>
      ${starsHTML(top)}
      <em>${g.cards.map(c=>esc(c.name)).slice(0,4).join(" · ")}${g.cards.length>4?" · …":""}</em></div>`;
  }).join("");
  const fallbackNote = plan.noDays
    ? `<div class="gap" style="margin:0 0 10px">No days belong to ${esc(city.name)} yet, so nothing can be
       scheduled there. Set the city on the days you'll be there — or drop a transport magnet on the day you
       travel — and these will slot in. For now they'll wait on the shortlist.</div>`
    : "";
  const dayList = plan.days.length ? plan.days.map(p=>{
    const dt = parseD(p.day);
    const mins = p.items.reduce((n,i)=>n+(i.card.mins||0),0);
    const bySlot = SLOTS.map(sl=>{
      const got = p.items.filter(i=>i.slot===sl.id);
      return got.length ? `<u>${sl.label}</u> ${got.map(i=>esc(i.card.name)+
        ((t.verdicts||{})[i.card.id]==="maybe"?" <opt>opt</opt>":"")).join(", ")}` : "";
    }).filter(Boolean).join(" · ");
    return `<div class="drow"><b>${MON[dt.getMonth()]} ${dt.getDate()}</b>
      <span>${bySlot || "—"}</span>
      ${mins?`<em>${esc(durLabel(mins))} of doing${p.full?" · a full day out":""}</em>`:""}</div>`;
  }).join("") : `<p class="msub">This trip has no days at all — check the dates in trip settings.</p>`;

  openModal(`<div class="deckwrap">
    <div class="cheer"><span class="big">Great job</span>
      <p>${must.length} must-do${must.length===1?"":"s"} and ${maybe.length} optional${maybe.length===1?"":"s"} to place${planned?", plus "+planned+" already on your calendar":""}.</p></div>
    <h4 class="dsec">Grouped by neighbourhood</h4>
    <div class="glist">${groupList}</div>
    <h4 class="dsec">A suggested split — ${plan.per} a day at your ${esc(paceOf(t.pace).label.toLowerCase())} pace</h4>
    ${fallbackNote}<div class="dlist">${dayList}</div>
    ${capacityHTML(t, deck.cityId, kept.length, plan)}
    ${(plan.unplacedOptional||[]).length?`<p class="msub" style="margin-top:8px">
      ${plan.unplacedOptional.length} optional${plan.unplacedOptional.length===1?"":"s"} won't be added:
      nothing else on those days is nearby, so ${plan.unplacedOptional.length===1?"it goes":"they go"} to the shortlist.</p>`:""}
    ${deckExtrasHTML(t)}
    <div class="modrow">
      <button class="btn left" data-act="resetdeck" data-city="${deck.cityId}">Reset deck</button>
      <button class="btn" data-act="close">Not yet</button>
      <button class="btn" data-act="deck-tray">All to shortlist</button>
      <button class="btn primary" data-act="deck-place">Place on the calendar</button>
    </div>
  </div>`);
}


/* =========================================================
   5k. CITY REPORTS
   Written by Claude into the City Reports folder, read here.
   The app never invents one - it loads it, or tells you it's missing.
   ========================================================= */
const REPORTS = {};          // slug -> report object
const REPORT_STATE = {};     // slug -> "loading" | "ready" | "missing" | "error"
let reportDir = null;        // FileSystemDirectoryHandle
let reportDirName = "";

function reportSlug(name){
  return (name||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}

async function initReports(){
  if(!FSA) return;
  let h = null;
  try{ h = await idbGet("reportDir"); }catch(e){ return; }
  if(!h) return;
  let perm = "prompt";
  try{ perm = await h.queryPermission({mode:"readwrite"}); }catch(e){}
  reportDir = h;
  reportDirName = h.name || "City Reports";
  if(perm === "granted"){ if(view.name==="trip") resolveReports(trip()); }
  else {
    Object.keys(REPORT_STATE).forEach(k=>{ if(REPORT_STATE[k]==="missing") delete REPORT_STATE[k]; });
    render();
  }
}
async function linkReportFolder(){
  if(!window.showDirectoryPicker){ toast("This browser can't link folders — Chrome or Edge can"); return; }
  try{
    reportDir = await window.showDirectoryPicker({mode:"readwrite"});
    reportDirName = reportDir.name || "City Reports";
    try{ await idbSet("reportDir", reportDir); }
    catch(e){ toast("Linked for this session only"); }
    Object.keys(REPORT_STATE).forEach(k=>delete REPORT_STATE[k]);
    toast("Linked to " + reportDirName);
    if(view.name==="trip") resolveReports(trip()); else render();
  }catch(e){ /* cancelled */ }
}
async function ensureReportPermission(){
  if(!reportDir) return false;
  try{
    let p = await reportDir.queryPermission({mode:"readwrite"});
    if(p !== "granted") p = await reportDir.requestPermission({mode:"readwrite"});
    return p === "granted";
  }catch(e){ return false; }
}

async function readReport(slug){
  if(!reportDir) throw new Error("no folder");
  const fh = await reportDir.getFileHandle(slug + ".json");   // throws if absent
  const f = await fh.getFile();
  const j = JSON.parse(await f.text());
  if(!j || !j.city) throw new Error("not a report");
  return j;
}
async function writeReport(slug, obj){
  if(!reportDir) throw new Error("no folder");
  const fh = await reportDir.getFileHandle(slug + ".json", {create:true});
  const w = await fh.createWritable();
  await w.write(JSON.stringify(obj, null, 2));
  await w.close();
}

// Resolve every city on the trip, then redraw once they've all settled.
let reportRun = 0;
async function resolveReports(t, viaGesture){
  if(!t) return;
  const run = ++reportRun;
  const todo = t.cities.filter(c=>{
    const s = reportSlug(c.name);
    return !REPORTS[s] && REPORT_STATE[s] !== "missing";
  });
  if(!todo.length){ render(); return; }

  // No folder linked: say so. Do not pretend the reports don't exist.
  if(!reportDir){
    todo.forEach(c=>{ REPORT_STATE[reportSlug(c.name)] = "nofolder"; });
    render();
    return;
  }
  // Permission can lapse between sessions, and re-requesting needs a click.
  let perm = "prompt";
  try{ perm = await reportDir.queryPermission({mode:"readwrite"}); }catch(e){}
  if(perm !== "granted"){
    if(!viaGesture){
      todo.forEach(c=>{ REPORT_STATE[reportSlug(c.name)] = "locked"; });
      render();
      return;
    }
    if(!(await ensureReportPermission())){
      todo.forEach(c=>{ REPORT_STATE[reportSlug(c.name)] = "locked"; });
      render();
      return;
    }
  }
  todo.forEach(c=>{ REPORT_STATE[reportSlug(c.name)] = "loading"; });
  render();
  for(const c of todo){
    const s = reportSlug(c.name);
    try{
      REPORTS[s] = await readReport(s);
      REPORT_STATE[s] = "ready";
    }catch(e){
      REPORT_STATE[s] = "missing";
    }
    if(run !== reportRun) return;
    render();
  }
  refreshDecksFromReports(t);
}
// a deck built before its report arrived gets rebuilt, keeping your verdicts
function refreshDecksFromReports(t){
  if(!t.decks) return;
  let changed = false;
  t.cities.forEach(c=>{
    const d = t.decks[c.id];
    const r = reportFor(c.name);
    if(!r || !d) return;
    if(d.source === "report" && (d.v||1) >= DECK_FORMAT) return;
    const cards = deckFromReport(r, c);
    if(!cards.length) return;
    cards.forEach(x=>{ x.id = cardId(c.id, x.name); });
    t.decks[c.id] = {cards, source:"report", at:Date.now(), v:DECK_FORMAT};
    changed = true;
  });
  if(changed){ save(); render(); }
}
function reportFor(cityName){ return REPORTS[reportSlug(cityName)] || null; }
function reportStatus(cityName){
  const s = reportSlug(cityName);
  if(REPORT_STATE[s] === "loading") return "loading";
  if(REPORTS[s]) return "ready";
  return REPORT_STATE[s] || (reportDir ? "loading" : "nofolder");
}
function reportsLocked(t){
  return t.cities.some(c=>reportStatus(c.name)==="locked");
}
function reportsSummary(t){
  const cities = t.cities.map(c=>({city:c, status:reportStatus(c.name)}));
  return {
    cities,
    ready: cities.filter(x=>x.status==="ready").length,
    loading: cities.filter(x=>x.status==="loading").length,
    missing: cities.filter(x=>x.status==="missing").length,
    locked: cities.filter(x=>x.status==="locked").length,
    nofolder: cities.filter(x=>x.status==="nofolder").length
  };
}

/* ---------- the request you hand to Claude ---------- */
function reportRequest(cityNames){
  const list = cityNames.join(", ");
  return "Write city report" + (cityNames.length>1?"s":"") + " for " + list +
    " using the cityreport.v1 format, and save " + (cityNames.length>1?"them":"it") +
    " into my City Reports folder.";
}

/* =========================================================
   5l. SEARCHING A REPORT
   ========================================================= */
// Deliberately short: in a travel report "when", "how" and "best" are section titles,
// so stripping them would lose the most natural questions.
const STOP = new Set(["the","a","an","and","or","of","in","to","for","is","are",
  "i","my","me","it","on","at","with","do","does","should","any","some","was","were","that","this"]);

function flattenReport(r){
  const out = [];
  const push = (section, title, text) => {
    if(!text) return;
    const s = String(text).trim();
    if(s.length < 3) return;
    out.push({section, title, text:s});
  };
  const humanKey = k => k.replace(/([A-Z])/g, " $1").replace(/^./, c=>c.toUpperCase()).trim().toLowerCase()
                          .replace(/^./, c=>c.toUpperCase());
  const walk = (section, title, v) => {
    if(v == null) return;
    if(typeof v === "string" || typeof v === "number"){ push(section, title, v); return; }
    if(Array.isArray(v)){ v.forEach(x=>walk(section, title, x)); return; }
    const named = v.name || v.dish || v.day;
    if(named){
      // a card: keep it as one passage so the whole entry is returned together
      const bits = [];
      Object.keys(v).forEach(k=>{
        const val = v[k];
        if(typeof val === "string" || typeof val === "number") bits.push(val);
        else walk(section, named, val);
      });
      if(bits.length) push(section, named, bits.join(" · "));
      return;
    }
    // a container like practical or glance: each field is its own searchable heading
    Object.keys(v).forEach(k=>{
      const val = v[k];
      if(typeof val === "string" || typeof val === "number") push(section, humanKey(k), val);
      else walk(section, humanKey(k), val);
    });
  };
  const S = {
    glance:"At a glance", history:"History", thingsToDo:"Things to do",
    essential10:"The essential ten", food:"Food guide", mustEat10:"Must-eat shortlist",
    restaurants:"Restaurants", experiences:"Local experiences",
    neighbourhoodGuide:"Neighbourhoods", timeGuidance:"How long to stay",
    dayTrips:"Day trips", practical:"Practical", whatIdDo:"What I'd actually do",
    quickRef:"Quick reference"
  };
  Object.keys(S).forEach(k=>{ if(r[k] != null) walk(S[k], S[k], r[k]); });
  return out;
}
function reportIndex(r){
  if(!r.__index) Object.defineProperty(r, "__index", {value:flattenReport(r), enumerable:false});
  return r.__index;
}
function searchReports(t, q){
  const terms = String(q||"").toLowerCase().split(/[^a-z0-9']+/)
    .filter(w=>w.length>2 && !STOP.has(w));
  if(!terms.length) return [];
  const hits = [];
  t.cities.forEach(c=>{
    const r = reportFor(c.name);
    if(!r) return;
    reportIndex(r).forEach(entry=>{
      const hay = (entry.title + " " + entry.text).toLowerCase();
      let score = 0, matched = 0;
      terms.forEach(w=>{
        const inTitle = entry.title.toLowerCase().includes(w);
        const n = hay.split(w).length - 1;
        if(n){ matched++; score += n + (inTitle ? 4 : 0); }
      });
      if(!matched) return;
      score *= (matched / terms.length) * (matched === terms.length ? 2 : 1);
      hits.push({city:c.name, section:entry.section, title:entry.title, text:entry.text, score});
    });
  });
  return hits.sort((a,b)=>b.score-a.score).slice(0, 12);
}

       x.status!=="ready"?'<span class="gp">no report</span>':""}</button>`).join("");

  const ask = `<div class="askbar">

let mealPick = null;
function openMealPicker(day, meal){
  const t = trip();

}
function drawMealPicker(){
  const t = trip();
  const {day, meal} = mealPick;
  const ctx = dayContext(t, day, null);
  const city = ctx.city;
  const label = meal === "lunch" ? "Lunch" : "Dinner";
  const r = city ? reportFor(city.name) : null;

  const chip = (name, note, lat, lon) =>
    `<button class="sugchip" data-act="setmeal" data-name="${esc(name)}" data-note="${esc(note||"")}"
       data-lat="${lat!=null?lat:""}" data-lon="${lon!=null?lon:""}">
      <span class="sn">${esc(name)}</span><span class="sm">${esc(note||"")}</span></button>`;

  let fromReport = "";
  if(r){
    const f = foodFromReport(r);
    const picks = [].concat(
      f.places.filter(x=>meal==="lunch" ? !/special/i.test(x.note) : true).slice(0,8),
      f.eat.slice(0,6));
    if(picks.length) fromReport = `<div class="traygroup">From the ${esc(city.name)} report</div>
      <div class="sugwrap">${picks.map(x=>{
        const co = reportCoord(r, x.label);
        return chip(x.label, x.note, co?co.lat:null, co?co.lon:null);
      }).join("")}</div>`;
  }
  const saved = t.magnets.filter(m=>m.board==="eats" && (m.col===ctx.cityId || m.col==="any"));
  const fromSaved = saved.length ? `<div class="traygroup" style="margin-top:10px">Already on your eat list</div>
    <div class="sugwrap">${saved.slice(0,10).map(m=>chip(m.label, m.note)).join("")}</div>` : "";

  const osmBlock =
    mealPick.osmState==="loading" ? `<div class="sugload">Looking for places near the rest of the day…</div>` :
    mealPick.osmState==="error" ? `<div class="sugload">Couldn't reach OpenStreetMap.</div>` :
    (mealPick.osm && mealPick.osm.length) ? `<div class="traygroup" style="margin-top:10px">Near ${esc(ctx.area||"the rest of this day")}</div>
      <div class="sugwrap">${mealPick.osm.map(x=>chip(x.name, (x.area?x.area+" · ":"")+(x.km<1?Math.round(x.km*1000)+"m":x.km.toFixed(1)+"km"), x.lat, x.lon)).join("")}</div>` :
    (mealPick.osm && !mealPick.osm.length) ? `<div class="sugload">Nothing nearby in OpenStreetMap.</div>` : "";

  openModal(`
    <h3>${label} on ${esc(dayLabel(day))}</h3>
    <p class="msub">You will eat either way — this is just where. ${ctx.anchored
      ? "Suggestions are near what is already on this day"+(ctx.area?" around "+esc(ctx.area):"")+"."
      : "Nothing else is on this day yet, so these are from across the city."}</p>
    <div class="field sugbox">
      ${fromReport}${fromSaved}${osmBlock}
      ${!fromReport && !fromSaved && !osmBlock ? `<div class="sugload">No report for this city yet.</div>` : ""}
      ${mealPick.osmState!=="loading" && !mealPick.osm && ctx.anchor

function setMeal(name, note, lat, lon){

    label:name, note:note||"", locked:false, order:Date.now(),

function copyText(s, msg){
  const done = ()=>toast(msg||"Copied");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(s).then(done, ()=>fallback());
  }else fallback();
  function fallback(){
    const ta = document.createElement("textarea");
    ta.value = s; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){ toast("Couldn't copy"); }
    ta.remove();
  }
}

function airportLookup(code){
  const a = AIRPORTS[(code||"").toUpperCase().trim()];

async function geocode(name){
  const url = "https://geocoding-api.open-meteo.com/v1/search?count=1&format=json&language=en&name="
              + encodeURIComponent(name);
  const r = await fetch(url);
  if(!r.ok) throw new Error("geocode failed");
  const j = await r.json();
  if(!j.results || !j.results.length) return null;
  const g = j.results[0];
  return {name:g.name, country:g.country||"", lat:g.latitude, lon:g.longitude, tz:g.timezone||"auto"};
}

function wireStep0(){
  // clocks write straight into the wizard model, then redraw just that clock
  ["arr","dep"].forEach(k=>{
    CLOCK_TARGETS[k] = {
      get: ()=> wiz[k].time,
      set: v => {
        wiz[k].time = v;
        const box = document.querySelector(`[data-clock="${k}"]`);
        if(box){
          box.outerHTML = clockHTML(k, k==="arr"?"Landing":"Take-off", v, "drag the dot anywhere round the ring");
          mountClocks();
        }
      }
    };
  });
  mountClocks();
  wireDropzone();

  const sync = ()=>{
    ["arr","dep"].forEach(k=>{
      const code = (document.getElementById(`w-${k}-code`).value||"").toUpperCase().trim();
      wiz[k].code = code;
      wiz[k].date = document.getElementById(`w-${k}-date`).value;
      wiz[k].flightNo = document.getElementById(`w-${k}-fn`).value.trim();
      const a = airportLookup(code);
      const hint = document.getElementById(`w-${k}-hint`);
      if(a){
        wiz[k].city=a.city; wiz[k].lat=a.lat; wiz[k].lon=a.lon; wiz[k].country=a.country;
        hint.innerHTML = esc(a.city)+" · "+esc(a.country);
      }else{
        wiz[k].city=""; wiz[k].lat=null; wiz[k].lon=null;
        hint.innerHTML = code.length>=3 ? "Unknown code — that's fine, add the city on the next step." : "&nbsp;";
      }
    });
    const box = document.getElementById("w-len");
    const n = tripDaysCount();
    if(wiz.arr.date && wiz.dep.date && n>0){
      box.classList.remove("hide");
      box.innerHTML = `<b>${n} day${n===1?"":"s"}</b> on the ground · ${MON[parseD(wiz.arr.date).getMonth()]} ${parseD(wiz.arr.date).getDate()} → ${MON[parseD(wiz.dep.date).getMonth()]} ${parseD(wiz.dep.date).getDate()}`;
    }else if(wiz.arr.date && wiz.dep.date){
      box.classList.remove("hide");
      box.innerHTML = `<span style="color:#B3402C">Departure needs to be on or after arrival.</span>`;
    }else{
      box.classList.add("hide");
    }
  };
  ["arr","dep"].forEach(k=>["code","date","fn"].forEach(f=>{
    const el = document.getElementById(`w-${k}-${f}`);
    if(!el) return;
    el.addEventListener("input", sync);
    el.addEventListener("change", sync);
  }));
  sync();
}

/* ---------- itinerary drop zone ---------- */
function wireDropzone(){
  const zone = document.getElementById("w-drop");
  const file = document.getElementById("w-file");
  if(!zone || !file) return;
  file.onchange = e => { if(e.target.files[0]) ingestFile(e.target.files[0]); };
  ["dragenter","dragover"].forEach(ev=>zone.addEventListener(ev, e=>{
    e.preventDefault(); e.stopPropagation(); zone.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev=>zone.addEventListener(ev, e=>{
    e.preventDefault(); e.stopPropagation(); zone.classList.remove("over"); }));
  zone.addEventListener("drop", e=>{
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) ingestFile(f);
  });
}

async function ingestFile(f){
  const isPDF = /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name);
  const isImg = /^image\//i.test(f.type) || /\.(png|jpe?g|webp|gif|bmp|heic)$/i.test(f.name);
  if(!isPDF && !isImg){ toast("Drop a PDF or an image"); return; }
  wiz.importing = isPDF ? "Reading the PDF… " : "Reading the image… ";
  render();
  let text = "";
  try{
    text = isPDF ? await textFromPDF(f)
                 : await textFromImage(f, p=>{
                     const z = document.getElementById("w-drop");
                     if(z) z.innerHTML = `<b>Reading the image… ${p}%</b>optical character recognition runs in your browser`;
                   });
  }catch(e){
    wiz.importing = "";
    render();
    toast(isImg ? "Couldn't read that image — needs an internet connection the first time"
                : "Couldn't read that PDF");
    return;
  }
  wiz.importing = "";
  const r = parseItinerary(text);
  wiz.imported = r;

  // fill anything we found, without clobbering what you already typed
  ["arr","dep"].forEach(k=>{
    ["code","date","time","flightNo"].forEach(f2=>{
      if(r[k][f2] && !wiz[k][f2]) wiz[k][f2] = r[k][f2];
    });
    const a = airportLookup(wiz[k].code);
    if(a){ wiz[k].city=a.city; wiz[k].lat=a.lat; wiz[k].lon=a.lon; wiz[k].country=a.country; }
  });
  // cities named in the document become suggested stops
  const have = new Set(wiz.cities.map(c=>c.name.toLowerCase()));
  r.cities.slice(0,6).forEach(c=>{
    if(have.has(c.name.toLowerCase())) return;
    have.add(c.name.toLowerCase());
    wiz.cities.push({id:uid(), name:c.name, country:c.country, lat:c.lat, lon:c.lon, code:""});
  });
  render();
  const n = (r.codes.length?1:0)+(r.dates.length?1:0)+(r.times.length?1:0);
  toast(n>=2 ? "Pulled the details out — give them a check" : "Read the file, but not much was recognisable");
}

async function addCityFromInput(){
  const el = document.getElementById("w-city");
  const hint = document.getElementById("w-city-hint");
  const name = el.value.trim();
  if(!name) return;
  el.value = "";
  const entry = {id:uid(), name, country:"", lat:null, lon:null, code:""};
  wiz.cities.push(entry);
  renderWizard();
  const h2 = document.getElementById("w-city-hint");
  if(h2) h2.textContent = "Looking up "+name+"…";
  try{
    const g = await geocode(name);
    if(g){ entry.name=g.name; entry.country=g.country; entry.lat=g.lat; entry.lon=g.lon; entry.tz=g.tz; }
  }catch(e){ /* offline — keep the city, just no coords */ }
  if(view.name==="wizard" && wiz.step===1){
    renderWizard();
    const h3 = document.getElementById("w-city-hint");
    if(h3) h3.innerHTML = entry.lat==null
      ? "Couldn't reach the location service — the city still works, but weather needs coordinates."
      : "&nbsp;";
  }
}

function seedCitiesFromFlights(){
  const seen = new Set(wiz.cities.map(c=>c.name.toLowerCase()));
  [wiz.arr, wiz.dep].forEach(f=>{
    if(f.city && !seen.has(f.city.toLowerCase())){
      seen.add(f.city.toLowerCase());
      wiz.cities.push({id:uid(), name:f.city, country:f.country||"", lat:f.lat, lon:f.lon, code:f.code});
    }
  });
}

function wizNext(){
  if(wiz.step===0){
    if(!wiz.arr.date || !wiz.dep.date){ toast("Add both dates to continue"); return; }
    if(daysBetween(wiz.arr.date, wiz.dep.date) < 0){ toast("Departure is before arrival"); return; }
    if(daysBetween(wiz.arr.date, wiz.dep.date) > MAX_TRIP_DAYS-1){
      toast("Those dates are "+(daysBetween(wiz.arr.date,wiz.dep.date)+1)+" days apart — check the years"); return; }
    if(!wiz.arr.code) wiz.arr.code = "???";
    if(!wiz.dep.code) wiz.dep.code = wiz.arr.code;
    seedCitiesFromFlights();
  }
  if(wiz.step===1){
    if(!wiz.cities.length){ toast("Add at least one city"); return; }
  }
  if(wiz.step===3){
    const nm = document.getElementById("w-name");
    wiz.name = nm ? nm.value.trim() : "";
    const t = newTripObject(wiz);
    DB.trips.push(t);
    save();
    view = {name:"trip", tripId:t.id, tab:"cal"};
    wiz = null;
    guide = {city:null, q:"", results:null, paste:false};
    resolveReports(t);
    fetchSeasonal(t);
    if(!DB.tourDone) startTour(); else render();
    toast("Trip created");
    return;
  }
  wiz.step++;
  render();
}
