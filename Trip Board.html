/* =========================================================
   9. DRAG AND DROP
   ========================================================= */
let dragId = null;

let ovDrag = null;
function wireOverview(){
  const cells = document.querySelectorAll(".ovc");
  if(!cells.length) return;
  cells.forEach(cell=>{
    cell.addEventListener("pointerdown", e=>{
      ovDrag = {city: cell.getAttribute("data-city"), touched:false};
    });
    cell.addEventListener("pointerenter", e=>{
      if(!ovDrag || !(e.buttons & 1)) return;
      if(cell.getAttribute("data-city") !== ovDrag.city) return;
      const t = trip();
      if(dayLocked(t, cell.getAttribute("data-day"))) return;   // a finalised day keeps its city
      pinDay(t, cell.getAttribute("data-day"), ovDrag.city);
      ovDrag.touched = true;
      cell.classList.add("on");
      save();
    });
  });
  armDragRelease();
}

/* One release handler for the whole board, installed once. It used to be
   registered {once:true} on every render, which meant a stray click anywhere
   ate it and the next drag quietly did nothing. */
let dragReleaseArmed = false;
function armDragRelease(){
  if(dragReleaseArmed) return;
  dragReleaseArmed = true;
  window.addEventListener("pointerup", ()=>{
    let redraw = false;
    if(ovDrag){
      if(ovDrag.touched) redraw = true;
      ovDrag = null;
    }
    if(stayDrag){
      if(!stayDrag.moved) setStayRange(stayDrag.id, stayDrag.anchor, stayDrag.anchor);
      stayDrag = null;
      save();
      redraw = true;
    }
    if(redraw) render();
  });
}
function wireDnD(){
  document.querySelectorAll("[data-mag][draggable='true']").forEach(el=>{
    el.addEventListener("dragstart", e=>{
      dragId = el.getAttribute("data-mag");
      e.dataTransfer.effectAllowed = "move";
      try{ e.dataTransfer.setData("text/plain", dragId); }catch(_){}
      // Everything else waits a tick. Touching the DOM inside dragstart is how you
      // lose a drag: the browser is still taking the drag image and deciding the
      // gesture happened, and Safari in particular just cancels.
      const at = {x:e.clientX, y:e.clientY};
      setTimeout(()=>{
        if(!dragActive) return;              // already over by the time we got here
        el.classList.add("dragging");
        beginDrag(dragId, el, at);
      }, 0);
      dragActive = true;
    });
    el.addEventListener("dragend", ()=>{ el.classList.remove("dragging"); dragId=null; endDrag(); });
  });
  document.querySelectorAll("[data-drop]").forEach(z=>{
    z.addEventListener("dragover", e=>{ e.preventDefault(); e.dataTransfer.dropEffect="move";
      // a folded day is itself a drop zone with smaller ones inside it, so only
      // the innermost one under the cursor lights up
      if(e.target.closest("[data-drop]") === z) z.classList.add("drop-on");
      else z.classList.remove("drop-on"); });
    z.addEventListener("dragleave", e=>{ if(!z.contains(e.relatedTarget)) z.classList.remove("drop-on"); });
    z.addEventListener("drop", e=>{
      e.preventDefault(); e.stopPropagation();
      z.classList.remove("drop-on");
      endDrag();
      let id = dragId;
      if(!id){ try{ id = e.dataTransfer.getData("text/plain"); }catch(_){} }
      if(!id) return;
      // where in the list did you drop it? that decides the order, not the clock
      const sibs = [].slice.call(z.querySelectorAll("[data-mag]"))
        .filter(el=>el.getAttribute("data-mag") !== id);
      let beforeId = null;
      for(const el of sibs){
        const r = el.getBoundingClientRect();
        if(e.clientY < r.top + r.height/2){ beforeId = el.getAttribute("data-mag"); break; }
      }
      moveMagnet(trip(), id, z.getAttribute("data-drop"), beforeId);
      dragId = null;
    });
  });
}

/* =========================================================
   9b. THE DAY RAIL
   The complaint this answers: on a ten-day trip the day you want to move
   something to is almost always off-screen, so a drag becomes a fight with the
   scrollbar — pick the thing up, scroll with it, hope nothing scrolls back.

   So: while — and only while — something is in the air, a list of every day
   appears pinned to the edge of the window. Drop on a row and the thing lands on
   that day in the slot it already had, which is nearly always what you meant.
   Hover a row for a beat and its slots fan out to the left if you want a
   different one. It sits over the side column and never over the day cards, so
   rearranging inside a day is exactly as it was.
   ========================================================= */
const RAIL_TARGETS = SLOTS.concat(MEALS).map(s=>({label:s.label, t:"cal:{d}:"+s.id}))
  .concat([{label:"Getting around", t:"transit:{d}"}]);
let rail = null;

let dragActive = false;
function beginDrag(magId, srcEl, at){
  document.body.classList.add("dragging");
  openRail(magId, srcEl, at);
  startDragScroll();
}
function endDrag(){
  dragActive = false;
  document.body.classList.remove("dragging");
  closeRail();
  stopDragScroll();
}
/* A drag can end without telling anyone — the element it started on gets replaced
   by a render, the window loses focus, the browser gives up. A rail left behind
   would sit there swallowing clicks, which looks exactly like "drag and drop
   stopped working", so anything that proves no drag is running clears it. */
function dragWatchdog(){
  if(!dragActive && (rail || document.body.classList.contains("dragging"))) endDrag();
}
document.addEventListener("mousemove", dragWatchdog);
document.addEventListener("pointerdown", dragWatchdog);

/* If a drag fails to take — a slip of the trackpad, a browser that decided the
   gesture was not one — the mouseup still arrives as a click, and clicking a magnet
   opens its editor. Getting the edit box when you meant to move something is worse
   than nothing happening, so a press that travelled is not a click. */
let magPress = null;
document.addEventListener("pointerdown", e=>{
  const mg = e.target && e.target.closest ? e.target.closest("[data-mag]") : null;
  magPress = mg ? {x:e.clientX, y:e.clientY} : null;
});
function pressTravelled(e){
  if(!magPress) return false;
  return Math.abs(e.clientX - magPress.x) > 6 || Math.abs(e.clientY - magPress.y) > 6;
}
window.addEventListener("blur", ()=>{ dragActive = false; endDrag(); });
function closeRail(){
  if(!rail) return;
  clearTimeout(rail.timer);
  if(rail.el && rail.el.parentNode) rail.el.parentNode.removeChild(rail.el);
  rail = null;
}
function openRail(magId, srcEl, at){
  closeRail();
  if(view.name!=="trip" || view.tab!=="cal") return;
  const t = trip();
  if(!t) return;
  const days = tripDays(t);
  if(days.length < 2) return;            // one day: there is nowhere else to go
  const src = t.magnets.find(m=>m.id===magId);
  const srcDay = (src && src.board==="cal") ? src.day : null;
  const dc = computeDayCities(t);
  const el = document.createElement("div");
  el.id = "dayrail";
  el.innerHTML = `<div class="railhead">Drop on a day</div>
    <div class="railscroll">${days.map((d,i)=>{
      const locked = dayLocked(t, d);
      const here = d === srcDay;
      const n = t.magnets.filter(m=>m.board==="cal" && m.day===d && m.kind!=="fly").length;
      const ci = t.cities.findIndex(c=>c.id===dc[d]);
      const open = (!locked && !here) ? ` data-drop="cal:${d}:same" data-day="${d}"` : "";
      return `<div class="railrow ${locked?"locked":""} ${here?"here":""}"${open}
        style="--tint:${ci>=0?cityTint(ci):"#d3cabb"}"
        title="${esc(dayLabel(d))}${locked?" — finalised":here?" — where it is now":""}">
        <span class="rd">${i+1}</span><span class="rcity"></span>
        <span class="rlab">${esc(dayLabel(d))}</span>
        ${locked ? `<span class="rn">\u{1F512}</span>`
          : here ? `<span class="rn">here</span>`
          : `<span class="rn ${n?"":"zero"}">${n}</span>`}
      </div>`;
    }).join("")}</div>
    <div class="railrow railtray" data-drop="tray" title="Off the calendar, back into your magnets">
      <span class="rd">↩</span><span class="rlab">Your magnets</span></div>`;
  el.style.visibility = "hidden";
  document.body.appendChild(el);
  rail = {el, magId, timer:null, leave:null, openRow:null, armed:null, box:null, side:"left"};
  positionRail(el, srcEl, at);
  el.style.visibility = "";

  el.addEventListener("dragover", e=>{
    railScroll(el, e.clientY);
    const z = e.target.closest("[data-drop]");
    if(!z) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    z.classList.add("drop-on");
    if(rail) clearTimeout(rail.leave);
    if(z.classList.contains("railslot")) return;      // already on the fan-out
    railArm(z.classList.contains("railrow") ? z : null);
  });
  el.addEventListener("dragleave", e=>{
    const z = e.target.closest("[data-drop]");
    if(z && !z.contains(e.relatedTarget)) z.classList.remove("drop-on");
    // leaving the rail closes the fan-out, but not instantly: the trip from a row
    // to its own slots passes over a sliver of page in between
    if(rail && !el.contains(e.relatedTarget)){
      clearTimeout(rail.leave);
      rail.leave = setTimeout(railCloseSlots, 400);
    }
  });
  el.addEventListener("drop", e=>{
    const z = e.target.closest("[data-drop]");
    if(!z) return;
    e.preventDefault(); e.stopPropagation();
    railDrop(z.getAttribute("data-drop"));
  });
  requestAnimationFrame(()=>{ if(rail && rail.el===el) el.classList.add("on"); });
}
/* Put it beside the day you are dragging from, with that day's own row under the
   pointer — so the day before and the day after are a few pixels away, and the far
   end of the trip is a short slide rather than a scroll. It goes in the gutter to
   the right of the day card where there is room, so it never lands on top of the
   card you might be rearranging. */
function positionRail(el, srcEl, at){
  const W = el.offsetWidth, H = el.offsetHeight;
  const pad = 8;
  const host = (srcEl && srcEl.closest) ? (srcEl.closest(".day") || srcEl.closest(".traycol")
                || srcEl.closest(".discovercol") || srcEl) : null;
  const hr = host && host.getBoundingClientRect ? host.getBoundingClientRect() : null;
  const sr = (srcEl && srcEl.getBoundingClientRect) ? srcEl.getBoundingClientRect() : null;
  const py = (at && at.y) ? at.y : (sr ? sr.top + sr.height/2 : window.innerHeight/2);

  let left = hr ? hr.right + 12 : window.innerWidth - W - 14;
  let side = "left";                                  // which way the fan-out opens
  if(left + W > window.innerWidth - pad){
    left = (hr ? hr.left : window.innerWidth) - W - 12;
    side = "left";
  }else{
    side = "right";
  }
  left = Math.max(pad, Math.min(left, window.innerWidth - W - pad));

  const sc = el.querySelector(".railscroll");
  const here = el.querySelector(".railrow.here");
  if(sc && here && sc.scrollHeight > sc.clientHeight + 1){
    sc.scrollTop = Math.max(0, Math.min(sc.scrollHeight - sc.clientHeight,
      here.offsetTop - sc.offsetTop - sc.clientHeight/2 + here.offsetHeight/2));
  }
  // offsetTop is measured against the rail, so this is where that row will sit
  const anchor = here ? (here.offsetTop - (sc ? sc.scrollTop : 0) + here.offsetHeight/2) : H/2;
  let top = py - anchor;
  top = Math.max(pad, Math.min(top, window.innerHeight - H - pad));

  el.style.left = Math.round(left) + "px";
  el.style.top  = Math.round(top) + "px";
  el.style.transformOrigin = side === "right" ? "center left" : "center right";
  if(rail) rail.side = side;
}
/* a long trip does not fit: nudge the list along when you hover its ends */
function railScroll(el, y){
  const sc = el.querySelector(".railscroll");
  if(!sc || sc.scrollHeight <= sc.clientHeight) return;
  const r = sc.getBoundingClientRect();
  if(y < r.top + 24) sc.scrollTop -= 14;
  else if(y > r.bottom - 24) sc.scrollTop += 14;
}
/* hovering a row for a beat fans its slots out; anything shorter is a pass-over.
   The fan-out is a child of the rail rather than of the row, because the list of
   days scrolls and a scrolling box clips whatever hangs outside it. */
function railCloseSlots(){
  if(!rail) return;
  clearTimeout(rail.timer);
  if(rail.box && rail.box.parentNode) rail.box.parentNode.removeChild(rail.box);
  rail.box = null; rail.openRow = null; rail.armed = null;
}
function railArm(row){
  if(!rail) return;
  // dragover repeats for as long as the pointer sits there, so a row already
  // waiting its turn must not restart its own timer — that is a wait that never ends
  if(rail.openRow === row || rail.armed === row) return;
  clearTimeout(rail.timer);
  if(!row || !row.getAttribute("data-day")){ railCloseSlots(); return; }
  railCloseSlots();
  rail.armed = row;
  rail.timer = setTimeout(()=>{
    if(!rail || !row.isConnected) return;
    const sc = rail.el.querySelector(".railscroll");
    const day = row.getAttribute("data-day");
    const box = document.createElement("div");
    // fan out into whichever side has the room
    box.className = "railslots" + (rail.side === "right" ? " toright" : "");
    // offsetTop is already measured against the rail, which is the positioned
    // ancestor here; only the list's own scrolling has to be taken off
    box.style.top = Math.max(6, row.offsetTop - (sc ? sc.scrollTop : 0) - 3) + "px";
    box.innerHTML = RAIL_TARGETS.map(x=>
      `<div class="railslot" data-drop="${x.t.replace("{d}", day)}">${esc(x.label)}</div>`).join("");
    rail.el.appendChild(box);
    rail.box = box; rail.openRow = row; rail.armed = null;
  }, 220);
}
function railDrop(target){
  const t = trip();
  const id = rail ? rail.magId : dragId;
  const y = window.scrollY;
  endDrag();
  if(!t || !id || !target) return;
  moveMagnet(t, id, target, null);
  window.scrollTo(0, y);                 // you asked to stay where you were
  const p = target.split(":");
  if(!lastMove) return;                  // it refused — it has already said why
  if(p[0]==="tray") toastUndo("Back in your magnets", "undomove");
  else toastUndo("Moved to " + dayLabel(p[1]), "undomove");
}

/* Dragging near the top or bottom of the window scrolls the board, which is what
   every other planner does and this one did not. */
let dragScroll = {on:false, y:0, raf:0, overRail:false};
function startDragScroll(){
  dragScroll.on = true; dragScroll.y = 0; dragScroll.overRail = false;
  tickDragScroll();
}
function stopDragScroll(){
  dragScroll.on = false;
  if(dragScroll.raf) cancelAnimationFrame(dragScroll.raf);
  dragScroll.raf = 0;
}
function tickDragScroll(){
  if(!dragScroll.on) return;
  dragScroll.raf = requestAnimationFrame(tickDragScroll);
  if(!dragScroll.y || dragScroll.overRail) return;
  const h = window.innerHeight, EDGE = 110;
  let v = 0;
  if(dragScroll.y < EDGE) v = dragScroll.y - EDGE;
  else if(dragScroll.y > h - EDGE) v = dragScroll.y - (h - EDGE);
  if(v) window.scrollBy(0, Math.max(-28, Math.min(28, v/3.5)));
}

const WMO = {0:"☀️",1:"🌤",2:"⛅️",3:"☁️",45:"🌫",48:"🌫",51:"🌦",53:"🌦",55:"🌦",
  61:"🌧",63:"🌧",65:"🌧",66:"🌧",67:"🌧",71:"🌨",73:"🌨",75:"❄️",77:"🌨",
  80:"🌦",81:"🌧",82:"⛈",85:"🌨",86:"❄️",95:"⛈",96:"⛈",99:"⛈"};

function md(dateStr){ return dateStr.slice(5); }

async function fetchSeasonal(t){
  const years = 5;
  const nowY = new Date().getFullYear();
  for(const city of t.cities){
    if(city.lat==null) continue;
    if(t.wx.seasonal[city.id] && t.wx.seasonal[city.id].range === t.arr.date+"|"+t.dep.date) continue;
    const acc = {};
    let ok = false;
    for(let i=1;i<=years;i++){
      const y = nowY - i;
      const start = (y) + "-" + t.arr.date.slice(5);
      // handle trips crossing new year
      const endY = t.dep.date.slice(0,4) > t.arr.date.slice(0,4) ? y+1 : y;
      const end = endY + "-" + t.dep.date.slice(5);
      const url = "https://archive-api.open-meteo.com/v1/archive?latitude="+city.lat+"&longitude="+city.lon+
        "&start_date="+start+"&end_date="+end+
        "&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto";
      try{
        const r = await fetch(url);
        if(!r.ok) continue;
        const j = await r.json();
        const D = j.daily;
        if(!D || !D.time) continue;
        ok = true;
        D.time.forEach((dt,ix)=>{
          const k = md(dt);
          if(!acc[k]) acc[k] = {hi:0,lo:0,wet:0,n:0};
          const hi=D.temperature_2m_max[ix], lo=D.temperature_2m_min[ix], pr=D.precipitation_sum[ix];
          if(hi==null||lo==null) return;
          acc[k].hi+=hi; acc[k].lo+=lo; acc[k].wet += (pr>1?1:0); acc[k].n++;
        });
      }catch(e){ /* offline */ }
    }
    if(!ok) continue;
    const byMD = {};
    Object.keys(acc).forEach(k=>{
      const a = acc[k];
      if(!a.n) return;
      byMD[k] = {hi:a.hi/a.n, lo:a.lo/a.n, wet:a.wet/a.n, n:a.n};
    });
    t.wx.seasonal[city.id] = {byMD, range:t.arr.date+"|"+t.dep.date, at:Date.now()};
  }
  save();
  if(view.name==="trip") render();
}

async function fetchLive(t){
  let any = false;
  for(const city of t.cities){
    if(city.lat==null) continue;
    const base = "https://api.open-meteo.com/v1/forecast?latitude="+city.lat+"&longitude="+city.lon+
      "&forecast_days=16&timezone=auto&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,";
    try{
      let r = await fetch(base+"weather_code");
      if(!r.ok) r = await fetch(base+"weathercode");   // older parameter spelling
      if(!r.ok) continue;
      const j = await r.json();
      const D = j.daily;
      if(!D || !D.time) continue;
      const codes = D.weather_code || D.weathercode || [];
      const byDate = {};
      D.time.forEach((dt,ix)=>{
        byDate[dt] = {hi:D.temperature_2m_max[ix], lo:D.temperature_2m_min[ix],
                      pop:D.precipitation_probability_max[ix], code:codes[ix]};
      });
      t.wx.live[city.id] = byDate;
      any = true;
    }catch(e){ /* offline */ }
  }
  t.wx.liveAt = any ? Date.now() : t.wx.liveAt;
  save();
  render();
  if(!any) toast("Couldn't reach the weather service");
  else {
    const inRange = tripDays(t).some(d=>{
      const c = computeDayCities(t)[d];
      return t.wx.live[c] && t.wx.live[c][d];
    });
    toast(inRange ? "Live forecast added" : "Trip is beyond the 16-day forecast — seasonal only for now");
  }
}

function wxHTML(t, day, cityId){
  const out = [];
  const s = t.wx.seasonal[cityId];
  const sd = s && s.byMD[md(day)];
  if(sd){
    out.push(`<span class="wxchip" title="Average of the last ${sd.n>0?5:0} years, same date">
      <span class="wxtag">typical</span> <b>${temp(sd.hi)}</b> / ${Math.round(sd.lo)}°
      ${sd.wet>=0.34?"· wet "+Math.round(sd.wet*100)+"%":""}</span>`);
  }
  const l = t.wx.live[cityId] && t.wx.live[cityId][day];
  if(l){
    out.push(`<span class="wxchip live" title="Live forecast">
      ${WMO[l.code]||"•"} <span class="wxtag">forecast</span> <b>${temp(l.hi)}</b> / ${Math.round(l.lo)}°
      ${l.pop!=null?"· "+l.pop+"%":""}</span>`);
  }
  if(!out.length && !t.cities.find(c=>c.id===cityId)) return "";
  return out.join("");
}

function openMagnetEditor(magId, opts){
  const t = trip();

  if(!m) return;
  if(m.kind==="move"){ return openTransport(m.day, m); }
  edState = {id:magId, justDropped:(opts&&opts.justDropped)||false, osm:null, osmState:"idle"};

function syncEditor(){
  const t = trip(), m = t.magnets.find(x=>x.id===edState.id);
  if(!m) return;
  const g = id=>{ const el=document.getElementById(id); return el?el.value:null; };
  const l=g("e-label"); if(l && l.trim()) m.label = l;   // an empty box must not erase the name
  const n=g("e-note");  if(n!=null) m.note = n;
  const k=g("e-kind");  if(k) m.kind = k;
  const h=g("e-hour");
  if(h!=null) m.time = h ? h+":"+(g("e-min")||"00") : "";
  // dragging is the fast way; this is the way that always works
  const nd = g("e-day"), ns = g("e-slot");
  if(nd != null && m.kind !== "fly"){
    if(nd === "tray"){
      if(m.board !== "tray"){ m.board="tray"; m.day=null; m.slot=null; m.col=null; }
    }else if(dayLocked(t, nd)){
      toast(dayLabel(nd)+" is finalised — unlock it first");
    }else{
      const slot = ns || "morning";
      if(m.board!=="cal" || m.day!==nd || m.slot!==slot){
        if(m.board==="cal" && m.day && dayLocked(t, m.day)){
          toast(dayLabel(m.day)+" is finalised — unlock it first");
        }else{
          m.board="cal"; m.day=nd; m.slot=slot; m.col=null;
          m.order = orderBetween(t, slot==="transit" ? "transit:"+nd : "cal:"+nd+":"+slot, null);
        }
      }
    }
  }
}

  if(hourSel) hourSel.addEventListener("change", ()=>{

async function editorFind(){

async function editorOSM(){
  const t = trip(), m = t.magnets.find(x=>x.id===edState.id);
  if(!m) return;
  syncEditor();
  edState.osmState = "loading";
  drawEditor();
  try{

    edState.osmState = "done";

    edState.osmState = "error";
  }
  drawEditor();
}

function saveTransport(){
  const t = trip(), s = tpState;
  if(!s.from || !s.to){ toast("Pick both ends of the trip"); return; }
  const from = cityById(t,s.from), to = cityById(t,s.to);
  const mode = TRANSPORT_MODES.find(m=>m.id===s.mode);
  const mins = s.mins != null ? s.mins : estimateMins(s.mode, from, to);
  const label = `${mode.ic} ${from.name} → ${to.name}`;
  const note = [s.time?fmt12(s.time):"", mins!=null?"≈"+mins2h(mins):"", mode.label]
                 .filter(Boolean).join(" · ");
  if(s.editing){
    const m = t.magnets.find(x=>x.id===s.editing);
    Object.assign(m, {label, note, mode:s.mode, fromCity:s.from, toCity:s.to, time:s.time, mins});
  }else{
    t.magnets.push({id:uid(), kind:"move", board:"cal", day:s.day, slot:"transit",
      label, note, mode:s.mode, fromCity:s.from, toCity:s.to, time:s.time, mins,
      locked:false, order:Date.now()});
  }
  save(); closeModal(); render();
}

async function addSettingsCity(){
  syncSettings();
  const el = document.getElementById("s-city");
  const name = el.value.trim();
  if(!name) return;
  const entry = {id:uid(), name, country:"", lat:null, lon:null, code:""};
  stState.cities.push(entry);
  drawSettings();
  try{
    const g = await geocode(name);
    if(g){ entry.name=g.name; entry.country=g.country; entry.lat=g.lat; entry.lon=g.lon; }
  }catch(e){}
  if(stState) drawSettings();
}

function saveSettings(){
  syncSettings();
  const t = trip();
  if(daysBetween(stState.arr, stState.dep) < 0){ toast("Departure is before arrival"); return; }
  if(daysBetween(stState.arr, stState.dep) > MAX_TRIP_DAYS-1){
    toast("Those dates are "+(daysBetween(stState.arr,stState.dep)+1)+" days apart — check the years"); return; }
  t.name = stState.name;
  const oldArr = t.arr.date, oldDep = t.dep.date;
  t.arr.date = stState.arr; t.dep.date = stState.dep;
  t.interests = stState.interests.slice();
  t.custom = Object.assign({}, stState.custom);
  t.pace = stState.pace;

  const keptIds = new Set(stState.cities.map(c=>c.id));
  t.cities = stState.cities.map(c=>Object.assign({},c));

  // flights follow the new dates
  const fIn = t.magnets.find(m=>m.kind==="fly" && m.day===oldArr);
  const fOut = t.magnets.find(m=>m.kind==="fly" && m.day===oldDep);
  if(fIn) fIn.day = t.arr.date;
  if(fOut) fOut.day = t.dep.date;

  // anything now outside the trip goes back to the tray
  const days = new Set(tripDays(t));
  t.magnets.forEach(m=>{
    if(m.board==="cal" && !days.has(m.day)){ m.board="tray"; m.day=null; m.slot=null; m.locked=false; }
    if(m.board==="eats" && m.col && m.col!=="any" && !keptIds.has(m.col)) m.col="any";
    if(m.kind==="move"){
      if(!keptIds.has(m.fromCity) || !keptIds.has(m.toCity)){ m.fromCity=null; m.toCity=null; }
    }
  });
  Object.keys(t.dayCity||{}).forEach(d=>{ if(!days.has(d)) delete t.dayCity[d]; });

  stState = null;
  save(); closeModal(); render();
  fetchSeasonal(t);
  resolveReports(t);
}

function download(name, text, type){
  const blob = new Blob([text], {type:type||"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function slugify(s){
  return (s||"trip").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "trip";
}
function exportTripJSON(t){
  download(slugify(t.name || tripCodes(t).join("-"))+".json",
           JSON.stringify({trips:[t]}, null, 2));
  toast("Exported — drop it back in via Import any time");
}

    }).join("");

      const got = magnetsIn(t, m=>m.board==="cal"&&m.day===d&&m.slot===x.id);

        `<div class="pi">${m.time?`<u>${esc(fmt12(m.time))}</u> `:""}<b>${esc(m.label)}</b>${m.note?` <span>${esc(m.note)}</span>`:""}</div>`).join("")}</td></tr>` : "";
    }).join("");
    const tr = magnetsIn(t, m=>m.board==="cal"&&m.day===d&&m.slot==="transit");
    const trRow = tr.length ? `<tr><th>Travel</th><td>${tr.map(m=>
      `<div class="pi">${m.time?`<u>${esc(fmt12(m.time))}</u> `:""}<b>${esc(m.label)}</b>${m.note?` <span>${esc(m.note)}</span>`:""}</div>`).join("")}</td></tr>` : "";
    const note = dayNote(t, d);
    const imgs = dayImages(t, d);

    return `<section class="pday">
      <h3>Day ${i+1} · ${DOW[dt.getDay()]} ${MON[dt.getMonth()]} ${dt.getDate()}
        <span class="pcity">${esc(city?city.name:"")}</span>
        ${sd?`<span class="pwx">typically ${Math.round(sd.hi)}° / ${Math.round(sd.lo)}°</span>`:""}</h3>
      ${rows||trRow||ml ? `<table>${rows}${ml}${trRow}</table>` : `<p class="pempty">Nothing planned.</p>`}
      ${note?`<p class="pnote">${esc(note)}</p>`:""}
      ${jots.length?`<ul class="pjots">${jots.map(n=>
        `<li>${esc(n.text.trim())}</li>`).join("")}</ul>`:""}
      ${imgs.length?`<div class="pimgs">${imgs.map(im=>
        `<figure>${imageSVG(im)}${im.caption?`<figcaption>${esc(im.caption)}</figcaption>`:""}</figure>`).join("")}</div>`:""}
    </section>`;
  };
  const listBlock = (title, ms) => ms.length ? `<section class="plist"><h3>${title}</h3><ul>${
    ms.map(m=>`<li><b>${esc(m.label)}</b>${m.note?` — ${esc(m.note)}`:""}</li>`).join("")}</ul></section>` : "";
  const todo = TODO_COLS.map(c=>{
    const ms = magnetsIn(t, m=>m.board==="todo"&&m.col===c.id);
    return ms.length ? `<div class="pcol"><h4>${c.label}</h4><ul>${
      ms.map(m=>`<li>${esc(m.label)}${m.note?` — ${esc(m.note)}`:""}</li>`).join("")}</ul></div>` : "";
  }).join("");
  const eats = t.cities.concat([{id:"any",name:"Anywhere"}]).map(c=>{
    const ms = magnetsIn(t, m=>m.board==="eats"&&m.col===c.id);
    return ms.length ? `<div class="pcol"><h4>${esc(c.name)}</h4><ul>${
      ms.map(m=>`<li>${esc(m.label)}${m.note?` — ${esc(m.note)}`:""}</li>`).join("")}</ul></div>` : "";
  }).join("");

  return `
  <header class="phead">
    <h1>${esc(t.name || tripCodes(t).join(" → "))}</h1>
    <p>${tripCodes(t).join(" → ")} · ${MON[d0.getMonth()]} ${d0.getDate()} – ${MON[d1.getMonth()]} ${d1.getDate()} ${d1.getFullYear()}

function importAll(file){

  fr.onload = ()=>{
    try{
      const j = JSON.parse(fr.result);
      if(!j || !Array.isArray(j.trips)) throw new Error("bad file");
      const have = new Set(DB.trips.map(t=>t.id));
      let n=0;
      j.trips.forEach(t=>{ if(!have.has(t.id)){ DB.trips.push(normalize(t)); n++; } });
      save(); render();
      toast(n+" trip"+(n===1?"":"s")+" imported");
    }catch(e){ toast("That file didn't look like a Trip Board export"); }
  };
  fr.readAsText(file);
}

/* Everything below that carries a data-day and changes something goes through
   one gate, so "finalised" means the same thing everywhere instead of being
   remembered case by case. */
const DAY_EDIT_ACTS = {moveday:1, optday:1, addimg:1, addsticky:1, stickydel:1, stickycolor:1,
                       pinimg:1, pickmeal:1, addtransport:1, "anno-open":1, setday:1};

document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]");
  if(!el) {
    // click a magnet body -> edit, unless the day it sits on is settled
    const mg = e.target.closest("[data-mag]");
    if(mg && pressTravelled(e)) return;          // that was a drag, however it ended
    if(mg && view.name==="trip"){
      const tt = trip();
      const m0 = tt && tt.magnets.find(x=>x.id===mg.getAttribute("data-mag"));
      if(m0 && m0.board==="cal" && m0.day && dayLocked(tt, m0.day)){
        toast(dayLabel(m0.day)+" is finalised — unlock the day to edit this");
        return;
      }
      openMagnetEditor(mg.getAttribute("data-mag"));
    }
    return;
  }
  const act = el.getAttribute("data-act");
  const t = view.tripId ? trip() : null;

  if(t && DAY_EDIT_ACTS[act]){
    const gd = el.getAttribute("data-day");
    if(gd && dayLocked(t, gd)){
      toast(dayLabel(gd)+" is finalised — unlock the day to change it");
      return;
    }
  }

  switch(act){
    case "home": view={name:"home",tripId:null,tab:"cal"}; wiz=null; stState=null; closeModal(); render(); break;
    case "new": startWizard(); break;
    case "open": view={name:"trip",tripId:el.getAttribute("data-id"),tab:"cal"};
      guide={city:null,q:"",results:null,paste:false}; render();
      { const tt=trip(); if(tt){ fetchSeasonal(tt); resolveReports(tt); } } break;
    case "del": {
      e.stopPropagation();
      const id = el.getAttribute("data-id");
      const tt = DB.trips.find(x=>x.id===id);
      if(confirm("Delete "+(tt&&tt.name?tt.name:"this trip")+"? This can't be undone.")){
        DB.trips = DB.trips.filter(x=>x.id!==id); save(); render();
      }
      break;
    }
    case "export": exportAll(); break;
    case "import": {
      let f = document.getElementById("importfile");
      if(!f){
        f = document.createElement("input");
        f.type="file"; f.accept="application/json"; f.id="importfile"; f.className="hide";
        document.body.appendChild(f);
        f.onchange = ev => { if(ev.target.files[0]) importAll(ev.target.files[0]); };
      }
      f.click(); break;
    }
    case "storage": openStorage(); break;
    case "tour": startTour(); break;
    case "cityfocus": {
      const cid = el.getAttribute("data-city");
      const d = el.getAttribute("data-day");
      cityFocus[cid] = (d && cityFocus[cid] !== d) ? d : null;
      render();
      break;
    }
    case "setday": {
      pinDay(t, el.getAttribute("data-day"), el.getAttribute("data-city"));
      save(); render();
      break;
    }

    case "tournext": {
      if(tour.step === TOUR.length-1){ endTour(); break; }
      tour.step++;
      view.tab = TOUR[tour.step].tab;
      render(); break;
    }
    case "tourback": { tour.step--; view.tab = TOUR[tour.step].tab; render(); break; }
    case "tourskip": endTour(); break;
    case "tourscrim": if(!e.target.closest(".modal")) endTour(); break;
    case "linkreports": linkReportFolder(); break;
    case "unlockreports": {
      Object.keys(REPORT_STATE).forEach(k=>delete REPORT_STATE[k]);
      resolveReports(t, true);
      break;
    }
    case "pastereport": openPasteReport(); break;
    case "optday": {
      const day = el.getAttribute("data-day");
      const plan = optimiseDay(t, day);
      if(!plan.changed){
        toast(plan.before > 0
          ? "Already the shortest order for this day"
          : "Nothing with a location to reorder");
        break;
      }
      lastOptimise = {trip:t.id, day, undo: applyOptimise(t, day, plan)};
      save(); render();
      toastUndo("Reordered · " + fmtKm(plan.before) + " → " + fmtKm(plan.after), "undoopt");
      break;
    }
    case "undoopt": {
      if(!lastOptimise) break;
      const tt = DB.trips.find(x=>x.id===lastOptimise.trip);
      if(tt){
        lastOptimise.undo.forEach(u=>{
          const m = tt.magnets.find(x=>x.id===u.id);
          if(m) m.slot = u.slot;
        });
        save(); render();
      }
      lastOptimise = null;
      const el2 = document.querySelector(".toast");
      if(el2) el2.remove();
      break;
    }
    case "addimg": {
      const day = el.getAttribute("data-day");
      let inp = document.getElementById("imgfile");
      if(!inp){
        inp = document.createElement("input");
        inp.type = "file"; inp.accept = "image/*"; inp.id = "imgfile"; inp.className = "hide";
        document.body.appendChild(inp);
      }
      inp.onchange = ev => {
        const f = ev.target.files && ev.target.files[0];
        ev.target.value = "";
        if(f) addDayImage(t, day, f);
      };
      inp.click();
      break;
    }
    case "stayadd": newStay(t, tripDays(t)); break;
    case "stayopen": openStay(el.getAttribute("data-stay")); break;
    case "stayexpand": {
      const id = el.getAttribute("data-stay");
      if(stayOpen[id]) delete stayOpen[id]; else stayOpen[id] = true;
      render();
      break;
    }
    case "stayset": break;   // handled by the drag wiring, not by clicking
    case "staystatus": {
      const st = readStay();
      if(st){ st.status = el.getAttribute("data-status")==="booked" ? "booked" : "idea"; save(); drawStay(); }
      break;
    }
    case "staysave": {
      const st = readStay();
      if(st && !st.name) st.name = "Untitled hotel";
      save(); stayEdit = null; closeModal(); render();
      break;
    }
    case "staydel": {
      const id = el.getAttribute("data-stay");
      const ix = stays(t).findIndex(x=>x.id===id);
      if(ix >= 0) t.stays.splice(ix, 1);
      delete stayOpen[id];
      stayEdit = null; save(); closeModal(); render();
      toast("Hotel removed");
      break;
    }
    case "stayrowlink": {
      const st = stayById(t, el.getAttribute("data-stay"));
      openStayLink(st);
      break;
    }
    case "stayopenlink": {
      openStayLink(readStay());
      break;
    }
    case "stayshot": {
      readStay();
      save();
      openAnnotate(null, el.getAttribute("data-img"), el.getAttribute("data-stay"));
      break;
    }
    case "stayaddshot": {
      readStay(); save();
      const id = el.getAttribute("data-stay");
      let inp = document.getElementById("stayfile");
      if(!inp){
        inp = document.createElement("input");
        inp.type = "file"; inp.accept = "image/*"; inp.id = "stayfile";
        inp.style.display = "none";
        document.body.appendChild(inp);
      }
      inp.onchange = ev => {
        const f = ev.target.files && ev.target.files[0];
        ev.target.value = "";
        if(f) addStayImage(t, id, f);
      };
      inp.click();
      break;
    }
    case "tsize": stepScale(Number(el.getAttribute("data-dir"))); break;
    case "colfold": toggleCol(el.getAttribute("data-col")); break;
    case "sectoggle": toggleSec(el.getAttribute("data-sec")); break;
    case "secall": prefs().hide = {}; save(); render(); break;
    case "moveday": moveDay(el.getAttribute("data-day"), Number(el.getAttribute("data-dir"))); break;
    case "dayfold": toggleDayFold(t, el.getAttribute("data-day")); break;
    case "daylock": toggleDayLock(t, el.getAttribute("data-day")); break;
    case "foldall": foldDays(t, el.getAttribute("data-mode")); break;
    case "undomove": {
      if(!lastMove) break;
      const tt = DB.trips.find(x=>x.id===lastMove.trip);
      const mm = tt && tt.magnets.find(x=>x.id===lastMove.id);
      if(mm){
        mm.board = lastMove.prev.board; mm.day = lastMove.prev.day;
        mm.slot = lastMove.prev.slot;   mm.col = lastMove.prev.col;
        mm.order = lastMove.prev.order; mm.kind = lastMove.prev.kind;
        save(); render();
      }
      lastMove = null;
      const el2 = document.querySelector(".toast");
      if(el2) el2.remove();
      break;
    }
    case "addsticky": addSticky(t, el.getAttribute("data-day")); break;
    case "stickydel": {
      const day = el.getAttribute("data-day"), id = el.getAttribute("data-sticky");
      const list = (t.stickies||{})[day] || [];
      const ix = list.findIndex(n=>n.id===id);
      if(ix >= 0){ list.splice(ix,1); save(); render(); }
      break;
    }
    case "stickycolor": {
      const day = el.getAttribute("data-day"), id = el.getAttribute("data-sticky");
      const n = ((t.stickies||{})[day] || []).find(x=>x.id===id);
      if(n){
        const i = STICKY_COLORS.findIndex(c=>c[0]===n.color);
        n.color = STICKY_COLORS[(i+1+STICKY_COLORS.length) % STICKY_COLORS.length][0];
        save(); render();
      }
      break;
    }
    case "pinimg": {
      t.dayPin = t.dayPin || {};
      t.dayPin[el.getAttribute("data-day")] = el.getAttribute("data-img");
      save(); render();
      break;
    }
    case "anno-open": openAnnotate(el.getAttribute("data-day"), el.getAttribute("data-img")); break;
    case "anno-tool": anno.tool = el.getAttribute("data-tool"); drawAnnotate(); break;
    case "anno-zoom": annoStep(Number(el.getAttribute("data-dir"))); break;
    case "anno-fit": annoZoomTo(1); break;
    case "anno-switch": {
      const cap = document.getElementById("anno-cap");
      const cur = annoImages().find(x=>x.id===anno.imgId);
      if(cur && cap) cur.caption = cap.value.trim();
      const nid = el.getAttribute("data-img");
      const nx = annoImages().find(x=>x.id===nid);
      if(nx){ anno.imgId = nid; anno.zoom = 1; anno.cx = 500; anno.cy = imgH(nx)/2; save(); drawAnnotate(); }
      break;
    }
    case "anno-color": anno.color = el.getAttribute("data-color"); drawAnnotate(); break;
    case "anno-undo": {
      const im = annoImages().find(x=>x.id===anno.imgId);
      if(im && (im.strokes||[]).length){ im.strokes.pop(); save(); drawAnnotate(); }
      break;
    }
    case "anno-clear": {
      const im = annoImages().find(x=>x.id===anno.imgId);
      if(im){ im.strokes = []; save(); drawAnnotate(); }
      break;
    }
    case "anno-del": {
      const list = annoImages();
      const ix = list.findIndex(x=>x.id===anno.imgId);
      if(ix >= 0) list.splice(ix, 1);
      if(t.dayPin && t.dayPin[anno.day] === anno.imgId) delete t.dayPin[anno.day];
      const back = anno.stayId;
      endAnnotate(); save();
      if(back){ closeModal(); openStay(back); } else { closeModal(); render(); }
      toast("Image removed");
      break;
    }
    case "anno-close": {
      const im = annoImages().find(x=>x.id===anno.imgId);
      const cap = document.getElementById("anno-cap");
      if(im && cap) im.caption = cap.value.trim();
      const back = anno.stayId;
      endAnnotate(); save();
      if(back){ closeModal(); openStay(back); } else { closeModal(); render(); }
      break;
    }
    case "pickmeal": openMealPicker(el.getAttribute("data-day"), el.getAttribute("data-meal")); break;
    case "meal-osm": mealOSM(); break;
    case "setmeal": setMeal(el.getAttribute("data-name"), el.getAttribute("data-note"),
      el.getAttribute("data-lat"), el.getAttribute("data-lon")); break;
    case "setmealfree": {
      const box = document.getElementById("mealfree");
      const v = box ? box.value.trim() : "";
      if(!v){ toast("Type somewhere, or pick one above"); break; }
      setMeal(v, "");
      break;
    }
    case "savepaste": savePastedReport(); break;
    case "gcity": guide.city = el.getAttribute("data-city"); guide.results=null; render(); break;
    case "ask": {
      const box = document.getElementById("askq");
      guide.q = box ? box.value : "";
      guide.results = searchReports(t, guide.q);
      render();
      const b2 = document.getElementById("askq"); if(b2){ b2.value = guide.q; }
      break;
    }
    case "copyreq": copyText(reportRequest(el.getAttribute("data-cities").split("|")),
      "Request copied — paste it to Claude"); break;
    case "copyask": copyText(askContext(t), "Question and context copied"); break;
    case "addfood": {
      const label = el.getAttribute("data-label");
      if(t.magnets.some(m=>m.board==="eats" && m.label.toLowerCase()===label.toLowerCase())){
        toast("Already on the list"); break;
      }
      t.magnets.push({id:uid(), kind:"eat", board:"eats", col:el.getAttribute("data-city"),
        label, note:el.getAttribute("data-note")||"", locked:false, order:Date.now()});
      save(); render();
      break;
    }
    case "opendeck": openDeck(el.getAttribute("data-city")); break;
    case "revisit": openDeck(el.getAttribute("data-city"), el.getAttribute("data-mode")); break;
    case "verdict": commitVerdict(el.getAttribute("data-v")); break;
    case "resetdeck": {
      const cid = el.getAttribute("data-city");
      const d = t.decks[cid];
      if(d) d.cards.forEach(c=>{ delete t.verdicts[c.id]; });
      delete t.decks[cid];
      save(); closeModal(); deck=null; render();
      toast("Deck reset and rebuilt — open it again");
      break;
    }
    case "deck-place": {
      const r = placePlan(t, deck.cityId, deck.plan);
      deck=null; closeModal(); render();
      toast(r.placed+" placed"+(r.skipped?" · "+r.skipped+" already on the board":"")
            +(r.placed?" — drag them around from here":""));
      break;
    }
    case "deck-tray": {
      const {must, maybe} = keptCards(t, deck.cityId);
      let n=0, skipped=0;
      must.concat(maybe).forEach(c=>{
        if(alreadyPlaced(t, c, null)){ skipped++; return; }
        t.magnets.push(magnetFromCard(c, {board:"short", col:deck.cityId,
          optional:(t.verdicts||{})[c.id]==="maybe"}));
        n++;
      });
      deck=null; save(); closeModal(); render();
      toast(n+" sent to the shortlist"+(skipped?" · "+skipped+" were already there":""));
      break;
    }
    case "exporttrip": openExport(); break;
    case "ex-json": exportTripJSON(t); closeModal(); break;
    case "ex-print": { const tt = t; closeModal(); setTimeout(()=>printTrip(tt), 80); break; }
    case "st-link": linkFile(); closeModal(); break;
    case "st-open": openFile(); closeModal(); break;
    case "st-reconnect": reconnectFile(); closeModal(); break;
    case "st-unlink": unlinkFile(); closeModal(); break;

    case "wnext": wizNext(); break;
    case "wback": wiz.step--; render(); break;
    case "addcity": addCityFromInput(); break;
    case "rmcity": wiz.cities.splice(+el.getAttribute("data-i"),1); render(); break;
    case "quickcity": {
      wiz.cities.push({id:uid(), name:el.getAttribute("data-name"),
        country:el.getAttribute("data-country"), lat:+el.getAttribute("data-lat"),
        lon:+el.getAttribute("data-lon"), code:""});
      render(); break;
    }
    case "interest": {
      const id = el.getAttribute("data-id");
      const ix = wiz.interests.indexOf(id);
      if(ix<0) wiz.interests.push(id); else wiz.interests.splice(ix,1);
      render(); break;
    }
    case "addinterest": addCustomInterest(); break;
    case "pace": wiz.pace = el.getAttribute("data-id"); render(); break;
    case "rminterest": {
      e.stopPropagation();
      const id = el.getAttribute("data-id");
      delete wiz.custom[id];
      wiz.interests = wiz.interests.filter(x=>x!==id);
      render(); break;
    }
    case "usename": {
      e.preventDefault();
      wiz.name = el.getAttribute("data-name"); wiz.nameTouched = true;
      const nb = document.getElementById("w-name"); if(nb) nb.value = wiz.name;
      break;
    }
    case "pickfile": { const f = document.getElementById("w-file"); if(f) f.click(); break; }
    case "nudge": {
      const tgt = CLOCK_TARGETS[el.getAttribute("data-clock")];
      if(tgt) tgt.set(fromMin(minOfDay(tgt.get()||"12:00") + (+el.getAttribute("data-d"))));
      break;
    }
    case "clearclock": {
      e.preventDefault();
      const key = el.getAttribute("data-clock");
      if(CLOCK_TARGETS[key]) CLOCK_TARGETS[key].set("");
      break;
    }

    case "tab": view.tab = el.getAttribute("data-tab"); render(); break;
    case "settings": stState=null; openSettings(); break;
    case "livewx": toast("Fetching forecast…"); fetchLive(t); break;
    case "addtransport": openTransport(el.getAttribute("data-day"), null); break;
    case "addmag": {
      const inp = document.getElementById("newmag");
      const v = inp.value.trim();
      if(!v) return;
      t.magnets.push({id:uid(), kind:view.tab==="eats"?"eat":(view.tab==="todo"?"note":"do"),
        label:v, note:"", board: view.tab==="eats"?"eats":(view.tab==="todo"?"todo":"tray"),
        col: view.tab==="eats"?"any":(view.tab==="todo"?"before":null),
        locked:false, order:Date.now()});
      save(); render(); break;
    }
    case "delmag": {
      e.stopPropagation();
      const id = el.getAttribute("data-mag");
      const m = t.magnets.find(x=>x.id===id);
      if(!m) break;
      lastDeleted = {trip:t.id, magnet:JSON.parse(JSON.stringify(m))};
      t.magnets = t.magnets.filter(x=>x.id!==id);
      save(); closeModal(); render();
      toastUndo("Removed \u201c"+m.label+"\u201d");
      break;
    }
    case "undodel": {
      if(!lastDeleted) break;
      const tt = DB.trips.find(x=>x.id===lastDeleted.trip);
      if(tt){ tt.magnets.push(lastDeleted.magnet); save(); render(); }
      lastDeleted = null;
      const el2 = document.querySelector(".toast");
      if(el2) el2.remove();
      break;
    }
    case "lock": {
      e.stopPropagation();
      const m = t.magnets.find(x=>x.id===el.getAttribute("data-mag"));
      if(m){ m.locked = !m.locked; save(); render(); }
      break;
    }

    case "scrim":
      if(e.target.closest(".modal")) break;   // clicks inside the modal never close it
      stState=null; closeModal(); break;
    case "close": stState=null; deck=null; edState=null; anno=null; closeModal(); render(); break;

    case "e-save": {
      syncEditor();
      const m = t.magnets.find(x=>x.id===el.getAttribute("data-mag"));
      if(m && !m.label.trim()) m.label = "Something here";
      edState = null;
      save(); closeModal(); render(); break;
    }
    case "e-pick": {
      syncEditor();
      const m = t.magnets.find(x=>x.id===edState.id);
      if(!m) break;
      const name = el.getAttribute("data-name");
      const area = el.getAttribute("data-area");
      const card = el.getAttribute("data-card");
      const lat = parseFloat(el.getAttribute("data-lat"));
      const lon = parseFloat(el.getAttribute("data-lon"));
      m.label = name;
      m.note = [area, m.note && m.note !== area ? m.note : ""].filter(Boolean).join(" · ");
      m.place = (isNum(lat) && isNum(lon)) ? {lat, lon, area} : null;
      if(card) m.cardId = card;
      edState.find = null;
      save();
      drawEditor();
      break;
    }
    case "e-osm": editorOSM(); break;
    case "e-find": editorFind(); break;
    case "e-setplace": {
      syncEditor();
      const m = t.magnets.find(x=>x.id===edState.id);
      const hit = (edState.find && edState.find.results || [])[+el.getAttribute("data-i")];
      if(!m || !hit) break;
      m.place = {lat:hit.lat, lon:hit.lon, area:hit.area || ""};
      if(!m.label.trim() || m.fromIdea) m.label = hit.name;
      if(hit.area && (m.note||"").indexOf(hit.area) < 0)
        m.note = [hit.area, m.note].filter(Boolean).join(" · ");
      m.fromIdea = false;
      edState.find = null;
      save(); drawEditor();
      toast("Pinned — it'll show on that day's map");
      break;
    }
    case "e-unpin": {
      syncEditor();
      const m = t.magnets.find(x=>x.id===el.getAttribute("data-mag"));
      if(m){ m.place = null; save(); drawEditor(); }
      break;
    }
    case "e-del": {
      const id = el.getAttribute("data-mag");
      const gone = t.magnets.find(x=>x.id===id);
      if(gone) lastDeleted = {trip:t.id, magnet:JSON.parse(JSON.stringify(gone))};
      t.magnets = t.magnets.filter(x=>x.id!==id);
      edState = null;
      save(); closeModal(); render();
      if(gone) toastUndo("Removed \u201c"+gone.label+"\u201d");
      break;
    }
    case "e-opt": {
      syncEditor();
      const m = t.magnets.find(x=>x.id===el.getAttribute("data-mag"));
      if(m){ m.optional = !m.optional; save(); drawEditor(); }
      break;
    }
    case "e-lock": {
      syncEditor();
      const m = t.magnets.find(x=>x.id===el.getAttribute("data-mag"));
      m.locked = !m.locked; edState = null; save(); closeModal(); render(); break;
    }

    case "tp-mode": tpState.mode = el.getAttribute("data-id"); tpState.mins=null; drawTransport(); break;
    case "tp-save": saveTransport(); break;

    case "s-interest": {
      syncSettings();
      const id = el.getAttribute("data-id");
      const ix = stState.interests.indexOf(id);
      if(ix<0) stState.interests.push(id); else stState.interests.splice(ix,1);
      drawSettings(); break;
    }
    case "s-pace": syncSettings(); stState.pace = el.getAttribute("data-id"); drawSettings(); break;
    case "s-addinterest": {
      syncSettings();
      const box = document.getElementById("s-interest-new");
      const v = (box.value||"").trim();
      if(!v) break;
      const dup = Object.keys(stState.custom).find(k=>stState.custom[k].toLowerCase()===v.toLowerCase());
      const id = dup || ("c:"+uid());
      stState.custom[id] = v;
      if(!stState.interests.includes(id)) stState.interests.push(id);
      drawSettings(); break;
    }
    case "s-rmcity": syncSettings(); stState.cities.splice(+el.getAttribute("data-i"),1); drawSettings(); break;
    case "s-addcity": addSettingsCity(); break;
    case "s-save": saveSettings(); break;
    case "s-del": {
      if(confirm("Delete this trip? This can't be undone.")){
        DB.trips = DB.trips.filter(x=>x.id!==view.tripId);
        stState=null; view={name:"home",tripId:null,tab:"cal"};
        save(); closeModal(); render();
      }
      break;
    }
  }
});

document.addEventListener("input", e=>{
  const el = e.target.closest("[data-act='daynote'],[data-act='stickytext']");
  if(!el) return;
  const t = trip();
  if(!t) return;
  const day = el.getAttribute("data-day");
  if(dayLocked(t, day)) return;
  if(el.getAttribute("data-act") === "stickytext"){
    const n = ((t.stickies||{})[day] || []).find(x=>x.id===el.getAttribute("data-sticky"));
    if(n) n.text = el.value;
  }else{
    t.dayNotes = t.dayNotes || {};
    const v = el.value;
    if(v.trim()) t.dayNotes[day] = v; else delete t.dayNotes[day];
  }
  clearTimeout(noteTimer);
  noteTimer = setTimeout(save, 500);   // don't write on every keystroke
});
let noteTimer = null;

document.addEventListener("change", e=>{
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.getAttribute("data-act");
  if(act==="setcity"){
    const t = trip();
    const day = el.getAttribute("data-day");
    if(dayLocked(t, day)){ toast(dayLabel(day)+" is finalised"); render(); return; }
    pinDay(t, day, el.value);
    save(); render();
  }
  if(act==="e-day" || act==="e-slot"){ syncEditor(); drawEditor(); }
  if(act==="citycode"){
    wiz.cities[+el.getAttribute("data-i")].code = el.value.toUpperCase().trim();
  }
});

document.addEventListener("keydown", e=>{
  if(deck && deck.phase==="swiping"){
    const map = {ArrowRight:"must", ArrowLeft:"no", ArrowUp:"maybe", ArrowDown:"skip"};
    if(map[e.key]){ e.preventDefault(); commitVerdict(map[e.key]); return; }
  }
  if(e.key==="Escape"){ stState=null; deck=null; edState=null; anno=null; closeModal(); }
  if(e.key==="Enter"){
    const aq = document.getElementById("askq");
    if(aq && document.activeElement===aq){
      e.preventDefault();
      const b = document.querySelector("[data-act='ask']");
      if(b) b.click();
      return;
    }
    const inp = document.getElementById("newmag");
    if(inp && document.activeElement===inp){
      const b = document.querySelector("[data-act='addmag']");
      if(b) b.click();
    }
    const sc = document.getElementById("s-city");
    if(sc && document.activeElement===sc){ e.preventDefault(); addSettingsCity(); }
  }
});

document.addEventListener("dragover", e=>{
  const tgt = e.target && e.target.closest ? e.target : null;
  if(tgt && tgt.closest("[data-drop]")) e.preventDefault();
  dragScroll.y = e.clientY;
  dragScroll.overRail = !!(tgt && tgt.closest("#dayrail"));
});
// a drop re-renders the board, so the element that started the drag can be gone
// before dragend would have fired. Belt and braces.
document.addEventListener("drop", ()=>{ dragId = null; endDrag(); });
window.addEventListener("dragend", ()=>{ dragId = null; endDrag(); });

/* =========================================================
   15. ROUTER + INIT
   ========================================================= */
function render(){
  try{ renderInner(); }
  catch(err){
    console.error(err);
    bootFailed(err);
  }
}
function renderInner(){
  applyScale();
  const ts = document.getElementById("tourslot");
  if(ts) ts.innerHTML = tourHTML();
  const st = document.getElementById("storeslot");
  if(st) st.innerHTML = storageChipHTML();
  if(view.name==="home") renderHome();
  else if(view.name==="wizard") renderWizard();
  else renderTrip();
  const f = document.getElementById("importfile");
  if(f) f.onchange = ev => { if(ev.target.files[0]) importAll(ev.target.files[0]); };
}

function bootFailed(err){
  const app = document.getElementById("app");
  const msg = ((err && (err.message || err)) + "").replace(/[<>&]/g, c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
  if(app) app.innerHTML =
    '<div class="gap" style="margin-top:24px"><b>Something went wrong starting up.</b><br>' + msg +
    '<br><br>Your saved trips are untouched.</div>';
}
window.addEventListener("error", e=>{
  const app = document.getElementById("app");
  if(app && !app.innerHTML.trim()) bootFailed(e.error || e.message);
});
try{
  load();
  render();
  initStorage();
  initReports();
}catch(err){ bootFailed(err); throw err; }
</script>
</body>
