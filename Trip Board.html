<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Board</title>
<style>
:root{
  --paper:#F4F1EA; --paper2:#FBF9F5; --ink:#23201C; --ink2:#6B6459; --line:#DFD8CB;
  --accent:#1F5C4D; --accent2:#E8F0ED;
  --m-do:#F2C14E; --m-eat:#E2725B; --m-see:#5B8DB8; --m-move:#7C6BAD;
  --m-stay:#4F9D69; --m-note:#C9C2B4; --m-fly:#2F3E46;
  --shadow:0 1px 2px rgba(35,32,28,.10), 0 3px 8px rgba(35,32,28,.08);
  --shadow-lift:0 6px 18px rgba(35,32,28,.18);
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-size:calc(15px * var(--ts));
  line-height:1.45;
  font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.hide{display:none !important}

/* ---------- chrome ---------- */
.topbar{
  position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:14px;
  padding:12px 22px;background:rgba(244,241,234,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:-.01em}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--m-eat);
  box-shadow:14px 0 0 -1px var(--m-do), 26px 0 0 -2px var(--m-see)}
.brand span{margin-left:22px}
.spacer{flex:1}
.savechip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
  background:var(--paper2);border-radius:999px;padding:4px 12px;font-size:calc(12.5px * var(--ts));color:var(--ink2);transition:.12s}
.savechip:hover{border-color:#c4bbaa;color:var(--ink)}
.savechip.ok{border-color:#bcd6cb;background:var(--accent2);color:var(--accent)}
.savechip.warn{border-color:#e6cf9a;background:#FFF6E0;color:#7A5C14}
.savechip .ago{opacity:.7;font-family:ui-monospace,Menlo,monospace;font-size:calc(11px * var(--ts))}

.btn{
  border:1px solid var(--line);background:var(--paper2);border-radius:8px;
  padding:7px 13px;font-size:calc(13.5px * var(--ts));font-weight:550;transition:.13s;
}
.btn:hover{border-color:#c4bbaa;box-shadow:var(--shadow)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#18493c}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:rgba(0,0,0,.05);border-color:transparent;box-shadow:none}
.btn.sm{padding:4px 9px;font-size:calc(12.5px * var(--ts))}
.btn.danger:hover{color:#B3402C;border-color:#e0b3a8}

.wrap{max-width:1440px;margin:0 auto;padding:26px 22px 90px}
h1{font-size:calc(26px * var(--ts));letter-spacing:-.02em;margin:0 0 4px}
h2{font-size:calc(17px * var(--ts));letter-spacing:-.01em;margin:0 0 10px}
.sub{color:var(--ink2);font-size:calc(13.5px * var(--ts));margin:0}

/* ---------- landing ---------- */
.trip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:16px;margin-top:22px}
.trip-card{
  position:relative;background:var(--paper2);border:1px solid var(--line);border-radius:14px;
  padding:18px 16px 15px;min-height:148px;display:flex;flex-direction:column;
  cursor:pointer;transition:.15s;text-align:left;
}
.trip-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:#cec4b2}
.trip-card .codes{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:auto}
.code{font-family:ui-monospace,Menlo,monospace;font-size:calc(19px * var(--ts));font-weight:600;letter-spacing:.06em}
.arrow{color:var(--ink2);font-size:calc(12px * var(--ts))}
.trip-card .when{font-family:ui-monospace,Menlo,monospace;font-size:calc(13px * var(--ts));color:var(--ink2);letter-spacing:.1em;margin-top:14px}
.trip-card .days{font-size:calc(13px * var(--ts));color:var(--ink2);margin-top:2px}
.trip-card .nm{font-size:calc(12.5px * var(--ts));color:var(--ink2);margin-top:8px;font-style:italic}
.trip-card .strip{position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
.card-x{position:absolute;top:8px;right:8px;opacity:0;border:none;background:transparent;color:var(--ink2);
  border-radius:6px;padding:2px 6px;font-size:calc(15px * var(--ts));line-height:1}
.trip-card:hover .card-x{opacity:.6}
.card-x:hover{opacity:1 !important;background:rgba(0,0,0,.06)}
.newcard{
  border:1.5px dashed #c9bfad;background:transparent;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;
  color:var(--ink2);min-height:148px;border-radius:14px;cursor:pointer;transition:.15s;
}
.newcard:hover{background:var(--paper2);color:var(--ink);border-color:var(--accent)}
.newcard .plus{font-size:calc(26px * var(--ts));line-height:1}
.empty{padding:56px 0;text-align:center;color:var(--ink2)}

/* ---------- wizard ---------- */
.wiz{max-width:640px;margin:0 auto}
.steps{display:flex;gap:6px;margin:22px 0 26px}
.steps i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.field{margin-bottom:18px}
.field label{display:block;font-size:calc(12.5px * var(--ts));font-weight:600;color:var(--ink2);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.field .hint{font-size:calc(12.5px * var(--ts));color:var(--ink2);margin-top:5px;font-weight:400;text-transform:none;letter-spacing:0}
.inp{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
  background:var(--paper2);outline:none;transition:.12s;
}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}
.row{display:flex;gap:12px}
.row>*{flex:1}
.wizcard{background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:22px}
.wiznav{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1px solid var(--line);background:var(--paper2);border-radius:999px;
  padding:6px 13px;font-size:calc(13.5px * var(--ts));transition:.12s;
}
.chip:hover{border-color:#c0b6a4}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- drop zone / import ---------- */
.dropzone{
  border:1.5px dashed #c9bfad;border-radius:12px;padding:18px 16px;text-align:center;
  color:var(--ink2);font-size:calc(13.5px * var(--ts));transition:.14s;cursor:pointer;background:transparent;
  display:block;width:100%;
}
.dropzone:hover{border-color:var(--accent);background:var(--paper2);color:var(--ink)}
.dropzone.over{border-color:var(--accent);background:var(--accent2);color:var(--accent)}
.dropzone b{display:block;font-size:calc(14px * var(--ts));color:var(--ink);margin-bottom:3px}
.dropzone.busy{border-style:solid;background:var(--accent2);border-color:var(--accent);cursor:wait}
.found{background:var(--accent2);border:1px solid #cadfd8;border-radius:10px;padding:10px 12px;
  font-size:calc(12.5px * var(--ts));color:var(--accent);margin-top:10px}
.found ul{margin:6px 0 0;padding-left:17px}
.found li{margin:1px 0}

/* ---------- clock picker ---------- */
.clockwrap{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.clockbox{text-align:center}
.clockface{touch-action:none;cursor:grab;user-select:none;display:block}
.clockface:active{cursor:grabbing}
.clockface:focus{outline:none}
.clockface:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:50%}
.clockface .knob{transition:cx .09s ease-out, cy .09s ease-out}
.nudge{display:inline-flex;gap:5px;margin-top:8px}
.nudge button{border:1px solid var(--line);background:var(--paper2);border-radius:7px;
  padding:3px 9px;font-size:calc(12px * var(--ts));color:var(--ink2);transition:.12s}
.nudge button:hover{border-color:var(--accent);color:var(--accent)}
.clocklbl{font-size:calc(12.5px * var(--ts));font-weight:600;color:var(--ink2);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:7px}
.clockhint{font-size:calc(11.5px * var(--ts));color:var(--ink2);margin-top:5px;max-width:170px}

/* ---------- pace ---------- */
.pacelist{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:9px}
.pacebtn{border:1px solid var(--line);background:var(--paper2);border-radius:11px;padding:11px 10px;
  display:flex;flex-direction:column;gap:2px;text-align:left;transition:.12s}
.pacebtn:hover{border-color:#c0b6a4}
.pacebtn.on{border-color:var(--accent);background:var(--accent2)}
.pacebtn .pic{font-size:calc(15px * var(--ts));color:var(--accent);line-height:1}
.pacebtn .plab{font-weight:600;font-size:calc(13.5px * var(--ts))}
.pacebtn .pnum{font-size:calc(11.5px * var(--ts));color:var(--ink2);font-family:ui-monospace,Menlo,monospace}
.pacebtn .pblurb{font-size:calc(11.5px * var(--ts));color:var(--ink2);line-height:1.35;margin-top:3px}
.pacebtn.on .plab,.pacebtn.on .pnum{color:var(--accent)}

/* ---------- city suggestion chips ---------- */
.sugcities{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.citychip{border:1px solid var(--line);background:var(--paper2);border-radius:999px;
  padding:5px 12px;font-size:calc(13px * var(--ts));transition:.12s;display:inline-flex;align-items:center;gap:6px}
.citychip:hover{border-color:var(--accent);background:var(--accent2);color:var(--accent)}
.citychip .km{font-size:calc(11px * var(--ts));color:var(--ink2);font-family:ui-monospace,Menlo,monospace}
.citychip:hover .km{color:var(--accent);opacity:.75}

.citylist{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.cityrow{display:flex;align-items:center;gap:10px;background:var(--paper2);
  border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.cityrow .nm{font-weight:550}
.cityrow .meta{font-size:calc(12.5px * var(--ts));color:var(--ink2)}
.dotok{width:7px;height:7px;border-radius:50%;background:var(--m-stay);flex:none}
.dotwait{width:7px;height:7px;border-radius:50%;background:var(--m-do);flex:none}

/* ---------- trip view ---------- */
.triphead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.triphead .codes{gap:7px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:20px 0 18px}
.tab{border:none;background:transparent;padding:9px 14px;font-size:calc(14px * var(--ts));font-weight:550;
  color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:.12s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-size:calc(11.5px * var(--ts));color:var(--ink2);background:var(--line);border-radius:999px;padding:1px 6px;margin-left:6px}

.layout{display:grid;gap:20px;align-items:start;
  --colTray:calc(268px * var(--ts));--colDisc:calc(262px * var(--ts));
  grid-template-columns:minmax(0,1fr) var(--colTray)}
.layout.three{grid-template-columns:minmax(0,1fr) var(--colTray) var(--colDisc)}
.layout.three{--colTray:calc(262px * var(--ts))}
.layout.foldtray{--colTray:34px}
.layout.folddisc{--colDisc:34px}
.layout>*{min-width:0}

/* a folded column keeps a sliver so you can always get it back */
.traycol.folded,.discovercol.folded{position:sticky;top:14px}
.colfold{width:100%;min-height:132px;border:1px dashed var(--line);border-radius:11px;
  background:var(--paper2);color:var(--ink2);cursor:pointer;padding:10px 0;
  display:flex;align-items:center;justify-content:center;font-family:inherit}
.colfold:hover{border-color:var(--accent);color:var(--accent);background:var(--accent2);border-style:solid}
.colfold span{writing-mode:vertical-rl;font-size:calc(10.5px * var(--ts));text-transform:uppercase;
  letter-spacing:.1em;font-weight:600;white-space:nowrap}
.colhide{border:1px solid var(--line);background:var(--paper2);color:var(--ink2);cursor:pointer;
  width:20px;height:20px;border-radius:6px;font-size:calc(13px * var(--ts));line-height:1;padding:0;margin-left:auto;
  flex:none}
.colhide:hover{border-color:var(--accent);color:var(--accent)}
.colhide.loose{display:block;margin:0 0 -6px auto;position:relative;z-index:2}
@media (max-width:1260px){
  .colfold{min-height:0;padding:7px 10px}
  .colfold span{writing-mode:horizontal-tb}
}
/* not enough width for three abreast: stack the two side columns instead */
@media (max-width:1260px){
  .layout.three{grid-template-columns:minmax(0,1fr) 268px}
  .layout.three>.traycol, .layout.three>.discovercol{grid-column:2}
}
@media (max-width:900px){
  .layout, .layout.three{grid-template-columns:1fr}
  .layout.three>.traycol, .layout.three>.discovercol{grid-column:1}
  .traycol, .discovercol{position:static}
}

/* ---------- magnets ---------- */
.magnet{
  position:relative;display:inline-flex;align-items:center;gap:7px;
  border-radius:var(--r);padding:7px 10px 7px 9px;font-size:calc(13px * var(--ts));font-weight:520;
  background:var(--paper2);border:1px solid var(--line);border-left:5px solid var(--m-note);
  box-shadow:var(--shadow);cursor:grab;user-select:none;transition:transform .1s,box-shadow .1s;
  max-width:100%;
}
.magnet:active{cursor:grabbing}
.magnet:hover{box-shadow:var(--shadow-lift);transform:translateY(-1px)}
.magnet.dragging{opacity:.35}
.magnet .body{min-width:0;flex:1}
.magnet .lbl{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.magnet .sub2{display:block;font-size:calc(11.5px * var(--ts));color:var(--ink2);font-weight:400;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.magnet .ic{font-size:calc(13px * var(--ts));line-height:1;flex:none;opacity:.85}
.magnet .pin{
  position:absolute;top:-6px;right:-6px;width:17px;height:17px;border-radius:50%;
  border:1px solid var(--line);background:var(--paper2);font-size:calc(9px * var(--ts));line-height:1;
  display:none;align-items:center;justify-content:center;box-shadow:var(--shadow);padding:0;
}
.magnet:hover .pin{display:flex}
.magnet .trash{
  position:absolute;top:12px;right:-6px;width:17px;height:17px;border-radius:50%;
  border:1px solid var(--line);background:var(--paper2);font-size:calc(8.5px * var(--ts));line-height:1;
  display:none;align-items:center;justify-content:center;box-shadow:var(--shadow);padding:0;
}
.magnet:hover .trash{display:flex}
.magnet .trash:hover{background:#B3402C;border-color:#B3402C;color:#fff}
.magnet.optional{background:transparent;border-style:dashed;opacity:.85}
.magnet.optional .lbl{font-weight:450}
.optbadge{display:inline-block;font-size:calc(9px * var(--ts));text-transform:uppercase;letter-spacing:.07em;
  font-weight:700;color:var(--m-see);border:1px solid var(--m-see);border-radius:4px;
  padding:0 4px;margin-right:6px;vertical-align:1px}
.magnet.vague{border-style:dashed}
.mtime{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:calc(11px * var(--ts));font-weight:700;
  color:var(--accent);background:var(--accent2);border-radius:4px;padding:0 4px;margin-right:6px;
  vertical-align:1px}
.timepick{display:flex;gap:8px}
.timepick .inp{flex:1}
.timepick .inp:disabled{opacity:.5}
.magnet.vague .lbl:after{content:"?";margin-left:5px;color:var(--m-do);font-weight:700}
.magnet.locked{cursor:default;border-style:solid;background:#fff}
.magnet.locked .pin{display:flex;background:var(--m-fly);color:#fff;border-color:var(--m-fly)}
.magnet.locked:hover{transform:none}

.m-do{border-left-color:var(--m-do)}
.m-eat{border-left-color:var(--m-eat)}
.m-see{border-left-color:var(--m-see)}
.m-move{border-left-color:var(--m-move)}
.m-stay{border-left-color:var(--m-stay)}
.m-note{border-left-color:var(--m-note)}
.m-fly{border-left-color:var(--m-fly)}

/* ---------- tray ---------- */
.traycol{position:sticky;top:70px}
.discovercol{position:sticky;top:70px;max-height:calc(100vh - 100px);overflow-y:auto;
  padding-right:2px;scrollbar-width:thin}
.discovercol .deckpanel:last-child, .discovercol .shortpanel:last-child{margin-bottom:0}
.tray{background:var(--paper2);border:1px solid var(--line);
  border-radius:14px;padding:14px;max-height:calc(100vh - 100px);display:flex;flex-direction:column}
.tray h3{margin:0 0 3px;font-size:calc(13px * var(--ts));text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);
  display:flex;align-items:center;gap:8px}
.tray .tsub{font-size:calc(12px * var(--ts));color:var(--ink2);margin:0 0 11px}
.trayscroll{overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding-right:3px;flex:1}
.traygroup{font-size:calc(11px * var(--ts));text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);
  margin:12px 0 3px;font-weight:600;display:flex;align-items:center;gap:6px}
.traygroup.int{color:var(--accent)}
.tgdot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none}
.traywhat{font-size:calc(11.5px * var(--ts));line-height:1.45;color:var(--ink2);background:var(--paper);
  border:1px dashed var(--line);border-radius:9px;padding:8px 10px;margin:0 0 11px}
.traywhat b{color:var(--ink)}
.traygroup:first-child{margin-top:0}
.tray .magnet{width:100%}
.tray .magnet.stamp{border-style:solid;box-shadow:var(--shadow), 3px 3px 0 -1px var(--paper2), 4px 4px 0 -1px var(--line)}
.tray .magnet.stamp:hover{box-shadow:var(--shadow-lift), 3px 3px 0 -1px var(--paper2), 4px 4px 0 -1px var(--line)}
.trayadd{display:flex;gap:6px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
.trayadd .inp{padding:6px 9px;font-size:calc(13px * var(--ts))}

/* ---------- trip overview ---------- */
.overview{background:var(--paper2);border:1px solid var(--line);border-radius:14px;
  padding:13px 15px;margin-bottom:14px}
/* sitting flush against each other reads as one timeline in two parts */
.overview[open]+.stays{margin-top:-6px}
.overview>summary{cursor:pointer;font-size:calc(12px * var(--ts));text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:10px;list-style:none}
.overview>summary::-webkit-details-marker{display:none}
.overview>summary:before{content:"▸";font-size:calc(10px * var(--ts));transition:.15s}
.overview[open]>summary:before{transform:rotate(90deg)}
.overview>summary span{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400;
  font-size:calc(12px * var(--ts));font-family:ui-monospace,Menlo,monospace}
/* Both strips run on the same three-column geometry so a column of cells in
   the overview sits exactly above the same date in the hotel log. Change these
   two numbers and the two grids move together. */
:root{--tlLabel:calc(132px * var(--ts));--tlMeta:calc(126px * var(--ts));--tlGap:9px}
@media (max-width:820px){:root{--tlLabel:calc(104px * var(--ts));--tlMeta:calc(104px * var(--ts))}}
@media (max-width:700px){:root{--tlLabel:calc(88px * var(--ts));--tlMeta:calc(92px * var(--ts))}}
.ovgrid{margin-top:12px;display:flex;flex-direction:column;gap:3px}
.ovrow{display:flex;align-items:center;gap:var(--tlGap)}
.ovname{width:var(--tlLabel);flex:none;font-size:calc(12px * var(--ts));font-weight:600;color:var(--tint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.ovcells{flex:1;display:flex;gap:2px;min-width:0}
.ovmeta{width:var(--tlMeta);flex:none;display:flex;align-items:center;justify-content:flex-end;gap:6px}
.ovn{width:30px;flex:none;font-size:calc(11px * var(--ts));color:var(--ink2);font-family:ui-monospace,Menlo,monospace}
.ovn.zero{opacity:.35}
.ovhead .ovh{flex:1;min-width:0;text-align:center;font-size:calc(9.5px * var(--ts));color:var(--ink2);
  font-family:ui-monospace,Menlo,monospace;line-height:1.2;padding-bottom:3px}
.ovhead .ovh.today{color:var(--accent);font-weight:700}
.ovh .ovdow{display:block;opacity:.6}
.ovc{flex:1;min-width:0;height:26px;border:1px solid var(--line);background:var(--paper);
  border-radius:5px;padding:0;position:relative;transition:.1s;cursor:pointer}
.ovc:hover{border-color:var(--tint);background:color-mix(in srgb, var(--tint) 12%, transparent)}
.ovc.on{background:var(--tint);border-color:var(--tint)}
.ovc.on.start{border-radius:7px 3px 3px 7px}
.ovc.on.end{border-radius:3px 7px 7px 3px}
.ovc.on.start.end{border-radius:7px}
.ovpin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:4px;height:4px;
  border-radius:50%;background:#fff;opacity:.9}
.ovmove{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;
  font-size:calc(10px * var(--ts));font-style:normal;opacity:.9}
.ovhint{font-size:calc(11.5px * var(--ts));color:var(--ink2);line-height:1.5;margin:11px 0 0}
.ovhint .btn{margin-left:6px}
@media (max-width:700px){.ovname{width:70px;font-size:calc(11px * var(--ts))}}

/* ---------- folding, finalising, and the rail that shows up mid-drag ---------- */
.caltools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 10px}
.caltools .ctlab{font-size:calc(10px * var(--ts));font-weight:650;text-transform:uppercase;
  letter-spacing:.08em;color:var(--ink2)}
.ctbtn{border:1px solid var(--line);background:var(--paper2);border-radius:999px;padding:3px 11px;
  font-size:calc(12px * var(--ts));color:var(--ink2);cursor:pointer;transition:.12s}
.ctbtn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:var(--accent2)}
.ctbtn:disabled{opacity:.32;cursor:default}
.ctnote{font-size:calc(11.5px * var(--ts));color:var(--ink2);font-style:italic}

.dayfold{width:20px;height:20px;border:1px solid transparent;border-radius:6px;background:transparent;
  color:var(--ink2);cursor:pointer;font-size:calc(10px * var(--ts));line-height:1;padding:0;flex:none}
.dayfold:hover{border-color:var(--line);background:var(--paper);color:var(--ink)}
.lockbtn{border:1px solid var(--line);border-radius:6px;background:var(--paper2);color:var(--ink2);
  cursor:pointer;font-size:calc(11px * var(--ts));line-height:1;padding:2px 7px}
.lockbtn:hover{border-color:var(--accent);color:var(--accent)}
.lockbtn.on{border-color:#bcd6cb;background:var(--accent2);color:var(--accent)}
.day.locked{border-color:#bcd6cb}
.day.locked>.dayhead{background:repeating-linear-gradient(135deg,rgba(31,92,77,.055) 0 7px,transparent 7px 15px);
  border-bottom-color:#cadfd8}
.finchip{display:inline-flex;align-items:center;gap:5px;border:1px solid #bcd6cb;background:var(--accent2);
  color:var(--accent);border-radius:999px;padding:1px 8px;font-size:calc(10px * var(--ts));
  text-transform:uppercase;letter-spacing:.07em;font-weight:650}
.magnet.frozen{cursor:default;box-shadow:none;background:#F8F6F1}
.magnet.frozen:hover{transform:none;box-shadow:none}
.day.locked .slot,.day.locked .meal,.day.locked .transit{background-image:none}
.lockedhint{font-size:calc(11.5px * var(--ts));color:var(--ink2);font-style:italic;padding:2px 0}

/* a folded day is one line, and you can still drop on it */
.day.folded>.dayhead{border-bottom:0}
.dsum{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 13px 10px}
.dsum .dsumn{font-size:calc(11.5px * var(--ts));color:var(--ink2)}
.dsumchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--paper);
  border-radius:999px;padding:1px 9px;font-size:calc(11.5px * var(--ts));max-width:210px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsumchip i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--m-note));flex:none}
.dsumchip[draggable="true"]{cursor:grab;user-select:none}
.dsumchip[draggable="true"]:hover{border-color:#c3b9a6;background:var(--paper2)}
.dsumchip.dragging{opacity:.35}
/* while something is in the air, folded days show they will take it — a border
   style only, because anything that changes size mid-drag moves the target */
body.dragging .day.folded{border-style:dashed;border-color:#c3b9a6}
body.dragging .day.folded.drop-on{border-style:solid}

/* the rail: only exists while something is in the air */
#dayrail{position:fixed;left:0;top:0;z-index:180;
  width:calc(152px * var(--ts));max-height:76vh;display:flex;flex-direction:column;
  background:rgba(251,249,245,.98);border:1px solid #cdc3b2;border-radius:13px;
  box-shadow:var(--shadow-lift);padding:7px;opacity:0;pointer-events:none;
  transform:scale(.97);transition:opacity .12s ease,transform .12s ease}
#dayrail.on{opacity:1;transform:none;pointer-events:auto}
.railhead{font-size:calc(9.5px * var(--ts));text-transform:uppercase;letter-spacing:.08em;
  color:var(--ink2);font-weight:650;padding:1px 6px 7px}
.railscroll{overflow-y:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
.railrow{position:relative;display:flex;align-items:center;gap:6px;border:1px solid transparent;
  border-radius:8px;padding:4px 7px;font-size:calc(12px * var(--ts));background:var(--paper2)}
.railrow[data-drop]{cursor:copy}
.railrow[data-drop]:hover{border-color:#d3cabb}
.railrow .rd{font-family:ui-monospace,Menlo,monospace;font-weight:650;font-size:calc(10px * var(--ts));
  color:var(--ink2);min-width:17px;text-align:right}
.railrow .rcity{width:6px;height:6px;border-radius:50%;background:var(--tint,#d3cabb);flex:none}
.railrow .rlab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.railrow .rn{font-size:calc(9.5px * var(--ts));color:var(--ink2);background:var(--line);
  border-radius:999px;padding:0 6px;line-height:1.6}
.railrow .rn.zero{background:transparent;opacity:.5}
.railrow.here{opacity:.55;outline:1px dashed #d3cabb}
.railrow.here .rn{background:transparent;font-style:italic}
.railrow.locked{opacity:.5}
.railtray{margin-top:6px;border-top:1px solid var(--line);border-radius:0 0 8px 8px;padding-top:7px;color:var(--ink2)}
.railslots.toright{right:auto;left:calc(100% - 11px)}
.railslots{position:absolute;right:calc(100% - 11px);display:flex;flex-direction:column;gap:2px;
  background:var(--paper2);border:1px solid #d3cabb;border-radius:9px;padding:4px;
  box-shadow:var(--shadow-lift);width:calc(126px * var(--ts))}
.railslot{border:1px solid transparent;border-radius:6px;padding:3px 8px;background:var(--paper);
  font-size:calc(11.5px * var(--ts));color:var(--ink2);white-space:nowrap}
.railslot:hover{border-color:#d3cabb;color:var(--ink)}
@media (max-width:820px){#dayrail{width:118px}.railslots{width:112px}}

/* ---------- calendar ---------- */
.cal{display:flex;flex-direction:column;gap:12px}
.day{background:var(--paper2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day.today{border-color:var(--accent)}
.dayhead{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.6),transparent);flex-wrap:wrap}
.dayhead .dnum{font-family:ui-monospace,Menlo,monospace;font-size:calc(15px * var(--ts));font-weight:650}
.dayhead .dow{font-size:calc(12.5px * var(--ts));color:var(--ink2);text-transform:uppercase;letter-spacing:.07em}
.dayhead .idx{font-size:calc(11.5px * var(--ts));color:var(--ink2);background:var(--line);border-radius:999px;padding:1px 7px}
.basecity{border:1px solid var(--line);background:var(--paper2);border-radius:999px;
  padding:2px 8px;font-size:calc(12px * var(--ts));color:var(--ink2);max-width:170px}
.wx{display:flex;align-items:center;gap:8px;font-size:calc(12px * var(--ts));color:var(--ink2);margin-left:auto;flex-wrap:wrap}
.wxchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);
  border-radius:999px;padding:2px 9px;background:var(--paper2);white-space:nowrap}
.wxchip.live{border-color:var(--accent);background:var(--accent2);color:var(--accent)}
.wxchip b{font-weight:600;color:var(--ink)}
.wxchip.live b{color:var(--accent)}
.wxtag{font-size:calc(10px * var(--ts));letter-spacing:.06em;text-transform:uppercase;opacity:.75}

.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
@media (max-width:760px){.slots{grid-template-columns:1fr}}
.slot{background:var(--paper2);padding:9px 11px 11px;min-height:78px;transition:background .12s;min-width:0}
.slot h4{margin:0 0 7px;font-size:calc(10.5px * var(--ts));text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);font-weight:600}
.slot .stack{display:flex;flex-direction:column;gap:6px;min-height:26px}
.transit{background:#F7F4EE;padding:4px 11px 10px}
.transit>h4{margin:0 0 7px;font-size:calc(10.5px * var(--ts));text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);font-weight:600;
  display:flex;align-items:center;gap:8px}
.transit .stack{display:flex;flex-wrap:wrap;gap:6px;min-height:26px}
.drop-on{background:var(--accent2) !important;box-shadow:inset 0 0 0 2px var(--accent)}
.placeholder{font-size:calc(12px * var(--ts));color:#b9b0a1;font-style:italic;padding:2px 0}

.meals{display:flex;gap:1px;background:var(--line);border-top:1px solid var(--line)}
.meal{flex:1;background:#FBF7F1;padding:7px 11px 9px;display:flex;align-items:center;gap:9px;
  flex-wrap:wrap;min-width:0;transition:background .12s}
.meal .mlab{font-size:calc(10.5px * var(--ts));text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);
  font-weight:600;flex:none;min-width:52px}
.mpick{border:1px dashed var(--line);background:transparent;border-radius:8px;padding:5px 11px;
  font-size:calc(12.5px * var(--ts));color:var(--ink2);transition:.12s}
.mpick:hover{border-color:var(--m-eat);color:var(--m-eat);border-style:solid}
@media (max-width:560px){.meals{flex-direction:column}}

.shortpanel{background:var(--paper2);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin-bottom:14px}
.shortpanel h3{margin:0 0 3px;font-size:calc(13px * var(--ts));text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.slcity{border-top:1px solid var(--line);margin-top:9px;padding-top:9px;border-radius:9px;transition:.12s}
.slhead{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.slhead b{font-size:calc(13px * var(--ts))}
.slcap{margin-left:auto;font-size:calc(11px * var(--ts));color:var(--ink2);font-family:ui-monospace,Menlo,monospace}
.slcap.full{color:#B3402C}
.slarea{margin-top:8px}
.slareahead{display:flex;align-items:center;gap:7px;font-size:calc(10.5px * var(--ts));text-transform:uppercase;
  letter-spacing:.07em;color:var(--ink2);font-weight:600;margin-bottom:5px}
.slareahead:before{content:"";width:4px;height:4px;border-radius:50%;background:var(--m-see);flex:none}
.slareahead span{margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:calc(10px * var(--ts));
  background:var(--line);border-radius:999px;padding:0 6px;color:var(--ink2)}
.slstack{display:flex;flex-direction:column;gap:6px}

.capbox{background:var(--accent2);border:1px solid #cadfd8;border-radius:11px;padding:12px 13px;margin-top:14px}
.capbox.over{background:#FFF6E0;border-color:#EBD9A8}
.caprow{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:calc(12.5px * var(--ts));color:var(--ink2)}
.caprow>b{font-size:calc(13.5px * var(--ts));color:var(--ink)}
.caprow span:last-child{margin-left:auto}
.capbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);margin:9px 0 8px}
.capbar i{display:block;height:100%}
.capbar .fit{background:var(--accent)}
.capbar .spill{background:var(--m-do)}
.capbox p{margin:0;font-size:calc(12.5px * var(--ts));line-height:1.5;color:var(--ink2)}
.capbox.over p b{color:#7A5C14}
.deckextras{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* ---------- day notes and images ---------- */
/* ---------- where you are sleeping ---------- */
.stays{background:var(--paper2);border:1px solid var(--line);border-radius:14px;
  padding:13px 15px;margin-bottom:14px}
.stays>summary{cursor:pointer;font-size:calc(13px * var(--ts));font-weight:650;display:flex;align-items:center;
  gap:9px;list-style:none;flex-wrap:wrap}
.stays>summary::-webkit-details-marker{display:none}
.stays>summary::before{content:"▸";color:var(--ink2);font-size:calc(11px * var(--ts));transition:transform .15s}
.stays[open]>summary::before{content:"▾"}
.stays>summary span{font-weight:400;font-size:calc(11.5px * var(--ts));color:var(--ink2)}
.stgrid{margin-top:11px;display:flex;flex-direction:column;gap:3px}
.strow{display:flex;align-items:center;gap:var(--tlGap)}
.stname{width:var(--tlLabel);flex:none;display:flex;align-items:center;gap:5px;border:1px solid transparent;
  background:transparent;border-radius:7px;padding:2px 5px;cursor:pointer;font:inherit;
  font-size:calc(11.5px * var(--ts));text-align:left;color:var(--ink);min-width:0}
.stname:hover{border-color:var(--line);background:var(--paper)}
.stname.flat{cursor:default;color:var(--ink2);font-size:calc(10px * var(--ts));text-transform:uppercase;
  letter-spacing:.07em;font-weight:600}
.stname.flat:hover{border-color:transparent;background:transparent}
.stdot{width:8px;height:8px;border-radius:3px;flex:none;background:var(--tint);opacity:.45}
.stname.booked .stdot{opacity:1}
.sttext{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.stname.booked .sttext{font-weight:600}
.stshots{font-size:calc(10px * var(--ts));color:var(--ink2);flex:none}
.stcaret{font-size:calc(9px * var(--ts));color:var(--ink2);flex:none;width:8px}
.stitem{display:flex;flex-direction:column;gap:0}
.stitem.open{background:var(--paper);border-radius:10px;padding:4px 6px;margin:2px -6px}
.stitem.open .stname{background:transparent;border-color:transparent}
.stdetail{margin:7px 0 3px;padding:10px 12px;background:var(--paper2);border:1px solid var(--line);
  border-left:3px solid var(--tint);border-radius:9px}
.sdfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px 16px;margin:0}
.sdf dt{font-size:calc(9.5px * var(--ts));text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);
  font-weight:600;margin-bottom:2px}
.sdf dd{margin:0;font-size:calc(12.5px * var(--ts));color:var(--ink);line-height:1.35}
.sdn{font-size:calc(11px * var(--ts));color:var(--ink2)}
.sdnone{font-size:calc(12px * var(--ts));color:var(--ink2);font-style:italic;opacity:.8}
.sdbooked{color:#3E7C55}
.sdidea{color:#8A6A2F;font-weight:500}
.sdnote{margin:10px 0 0;font-size:calc(12.5px * var(--ts));line-height:1.5;color:var(--ink);white-space:pre-wrap;
  border-left:2px solid var(--line);padding-left:9px}
.sdshots{margin-top:10px}
.sdacts{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.sttimes{width:calc(74px * var(--ts));flex:none;display:flex;align-items:center;justify-content:center;gap:3px;
  font-family:ui-monospace,Menlo,monospace;font-size:calc(10.5px * var(--ts));color:var(--ink2);white-space:nowrap}
.sttimes b{font-weight:600;color:var(--ink)}
.sttimes i{font-style:normal;opacity:.5;font-size:calc(9px * var(--ts))}
.sttimes.none{border:1px dashed var(--line);border-radius:7px;background:transparent;cursor:pointer;
  font-family:inherit;font-size:calc(10px * var(--ts));color:var(--ink2);padding:2px 4px;height:19px}
.sttimes.none:hover{border-color:var(--accent);color:var(--accent)}
.sttimes.flat{font-family:inherit;font-size:calc(9.5px * var(--ts));text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink2);opacity:.75}
.stlink{width:22px;flex:none;height:19px;border:1px solid var(--line);border-radius:7px;
  background:var(--paper);color:var(--ink2);cursor:pointer;font-size:calc(11px * var(--ts));line-height:1;padding:0}
.stlink:hover{border-color:var(--accent);color:var(--accent);background:var(--accent2)}
.stlink.off{border-style:dashed;opacity:.4}
.stlink.off:hover{opacity:.9}
.stlink.flat{border:0;background:transparent;cursor:default}
@media (max-width:820px){.sttimes{width:calc(62px * var(--ts));font-size:calc(9.5px * var(--ts))}}
@media (max-width:700px){.sttimes{width:calc(54px * var(--ts));font-size:calc(9px * var(--ts))}.stn{width:20px}}
.stcells{flex:1;display:flex;gap:2px;min-width:0}
.stmeta{width:var(--tlMeta);flex:none;display:flex;align-items:center;justify-content:flex-end;gap:5px}
.stc{flex:1;min-width:0;height:19px;border:0;border-radius:3px;padding:0;background:var(--line);
  opacity:.35;cursor:pointer;touch-action:none}
.stc.last{background:transparent;opacity:1;cursor:default}
.stc.on{opacity:1;background:var(--tint)}
.stc.idea.on{background:repeating-linear-gradient(45deg,var(--tint),var(--tint) 3px,
  rgba(255,255,255,.62) 3px,rgba(255,255,255,.62) 6px)}
.stc.on.start{border-top-left-radius:9px;border-bottom-left-radius:9px}
.stc.on.end{border-top-right-radius:9px;border-bottom-right-radius:9px}
.stc:hover:not(.last):not(.cov){opacity:.8}
.stn{width:calc(24px * var(--ts));flex:none;text-align:right;font-family:ui-monospace,Menlo,monospace;
  font-size:calc(10.5px * var(--ts));color:var(--ink2)}
.stn.zero{opacity:.4}
.sthead .sth{flex:1;min-width:0;text-align:center;font-size:calc(9.5px * var(--ts));color:var(--ink2);line-height:1.15}
.sthead .sth.last{opacity:.4}
.stempty{font-size:calc(12px * var(--ts));color:var(--ink2);line-height:1.5;margin:9px 0 0;max-width:62ch}
.stwarn{font-size:calc(11.5px * var(--ts));color:#B3402C;margin:9px 0 0}
.stwarn.soft{color:#8A6A2F}
.stacts{display:flex;align-items:center;gap:11px;margin-top:11px;flex-wrap:wrap}
.sthint{font-size:calc(11px * var(--ts));color:var(--ink2)}
.stayed .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.stayed .row2{grid-template-columns:1fr}}
.stswitch{display:flex;gap:4px;margin-left:auto}
.stnights{font-size:calc(11.5px * var(--ts));color:var(--ink2);margin:2px 0 10px}
.stnights.bad{color:#B3402C}
.stlinkrow{display:flex;gap:7px;align-items:center}
.stlinkrow .inp{flex:1;min-width:0}
.stayed label .cnt{font-family:ui-monospace,Menlo,monospace;font-size:calc(10px * var(--ts));opacity:.7;margin-left:6px}

.stayed .modrow{margin-top:16px}

/* ---------- text size ----------
   One knob on the board itself rather than browser zoom, so it survives a
   reload and leaves the toolbar and dialogs at a readable size. */
/* Real text resizing, not zoom. Every font size in this stylesheet is written
   as calc(Npx * var(--ts)), so changing --ts changes type only — the browser's
   own zoom still works on top of it, and the two are independent. The few fixed
   widths that exist to hold text scale with it, so rows don't clip at 125%. */
:root{--ts:1}
body[data-scale="75"]{--ts:.8}
body[data-scale="85"]{--ts:.875}
body[data-scale="93"]{--ts:.94}
body[data-scale="110"]{--ts:1.09}
body[data-scale="125"]{--ts:1.2}
body.printing{--ts:1}

.viewctl{display:flex;align-items:center;gap:8px;margin-left:auto;padding-left:10px}
.tsize{display:inline-flex;align-items:center;gap:1px;border:1px solid var(--line);
  border-radius:999px;background:var(--paper2);padding:1px}
.vbtn{border:0;background:transparent;color:var(--ink2);cursor:pointer;border-radius:999px;
  padding:3px 8px;line-height:1.1;font-family:inherit}
.vbtn:hover:not(:disabled){background:var(--line);color:var(--ink)}
.vbtn:disabled{opacity:.3;cursor:default}
.vbtn.small{font-size:calc(10.5px * var(--ts))}
.vbtn.big{font-size:calc(15px * var(--ts));font-weight:600}
.vpct{font-family:ui-monospace,Menlo,monospace;font-size:calc(10.5px * var(--ts));color:var(--ink2);
  min-width:34px;text-align:center}
.vbtn.wide{border:1px solid var(--line);background:var(--paper2);font-size:calc(11.5px * var(--ts));
  padding:4px 10px;display:inline-flex;align-items:center;gap:6px;list-style:none}
.vbtn.wide::-webkit-details-marker{display:none}
.vbtn.wide i{font-style:normal;font-size:calc(10px * var(--ts));background:var(--accent2);color:var(--accent);
  border-radius:999px;padding:1px 6px}
.secmenu{position:relative}
.secpop{position:absolute;right:0;top:calc(100% + 6px);z-index:40;width:214px;
  background:var(--paper2);border:1px solid var(--line);border-radius:11px;padding:9px;
  box-shadow:0 14px 34px -14px rgba(35,32,28,.42)}
.secpop p{margin:0 0 7px;font-size:calc(11px * var(--ts));color:var(--ink2);line-height:1.4}
.secrow{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:0;

.fchip b{font-weight:400;font-size:calc(12px * var(--ts));opacity:.75}
.feffort{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;
  padding:3px 11px;font-size:calc(12px * var(--ts));color:var(--ink2);background:var(--paper)}
.feffort .bars{display:inline-flex;gap:2px;align-items:flex-end;height:10px}
.feffort .bars i{width:3px;background:var(--line);border-radius:1px;display:block}
.feffort .bars i:nth-child(1){height:4px}
.feffort .bars i:nth-child(2){height:7px}
.feffort .bars i:nth-child(3){height:10px}
.feffort.e1 .bars i.on{background:var(--m-stay)}
.feffort.e2 .bars i.on{background:var(--m-do)}
.feffort.e3 .bars i.on{background:var(--m-eat)}
.fcard h4{margin:14px 0 3px;font-size:calc(21px * var(--ts));letter-spacing:-.01em;line-height:1.2}
.farea{font-size:calc(12.5px * var(--ts));color:var(--ink2);font-family:ui-monospace,Menlo,monospace}
.fblurb{margin:12px 0 44px;font-size:calc(14.5px * var(--ts));line-height:1.5;color:var(--ink)}
.fstamp{position:absolute;top:18px;font-size:calc(15px * var(--ts));font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;border:2.5px solid;border-radius:8px;padding:4px 11px;opacity:0;transition:opacity .12s}
.fs-must{right:18px;color:var(--m-stay);border-color:var(--m-stay);transform:rotate(11deg)}
.fs-no{left:18px;color:#B3402C;border-color:#B3402C;transform:rotate(-11deg)}
.fs-maybe{left:50%;transform:translateX(-50%);color:var(--m-see);border-color:var(--m-see)}
.fs-skip{left:50%;top:auto;bottom:18px;transform:translateX(-50%);color:var(--ink2);border-color:var(--ink2)}
.fcard[data-hint="must"] .fs-must,.fcard[data-hint="no"] .fs-no,
.fcard[data-hint="maybe"] .fs-maybe,.fcard[data-hint="skip"] .fs-skip{opacity:1}
.dpad{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:center}
.dpadmid{display:flex;flex-direction:column;gap:7px}
.vbtn{border:1px solid var(--line);background:var(--paper2);border-radius:11px;padding:10px 12px;
  display:flex;align-items:center;justify-content:center;gap:7px;font-size:calc(13px * var(--ts));font-weight:550;transition:.12s}
.vbtn .vic{font-size:calc(15px * var(--ts))}
.vbtn em{font-style:normal;font-size:calc(11px * var(--ts));color:var(--ink2);font-family:ui-monospace,Menlo,monospace}
.dpadmid .vbtn{padding:6px 12px;font-size:calc(12.5px * var(--ts))}
.vbtn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.v-must:hover{border-color:var(--m-stay);color:var(--m-stay)}
.v-no:hover{border-color:#B3402C;color:#B3402C}
.v-maybe:hover{border-color:var(--m-see);color:var(--m-see)}
.v-skip:hover{border-color:var(--ink2)}
.deckhint{text-align:center;font-size:calc(12px * var(--ts));color:var(--ink2);margin:11px 0 0}
.cheer{text-align:center;padding:6px 0 14px}
.cheer .big{font-size:calc(24px * var(--ts));font-weight:650;letter-spacing:-.02em;display:block;color:var(--accent)}
.cheer p{margin:6px 0 0;font-size:calc(13.5px * var(--ts));color:var(--ink2)}
.dsec{margin:16px 0 8px;font-size:calc(12px * var(--ts));text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.glist,.dlist{display:flex;flex-direction:column;gap:6px}
.grow,.drow{background:var(--paper2);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:calc(13px * var(--ts))}
.grow b{margin-right:8px}
.grow span{font-size:calc(11.5px * var(--ts));color:var(--ink2);font-family:ui-monospace,Menlo,monospace}
.grow em{display:block;font-style:normal;font-size:calc(12px * var(--ts));color:var(--ink2);margin-top:3px}
.drow b{display:inline-block;min-width:64px;font-family:ui-monospace,Menlo,monospace;font-size:calc(12.5px * var(--ts))}
.drow span{font-size:calc(12.5px * var(--ts));color:var(--ink2)}
.drow em{display:block;font-style:normal;font-size:calc(11.5px * var(--ts));color:var(--accent);margin:3px 0 0 64px}
.drow u{text-decoration:none;font-size:calc(10px * var(--ts));text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink2);margin-right:4px}
.drow opt{font-size:calc(9px * var(--ts));text-transform:uppercase;letter-spacing:.06em;color:var(--m-see);
  border:1px solid var(--m-see);border-radius:3px;padding:0 3px;margin-left:3px}
.grow .ficon{float:right;font-size:calc(11px * var(--ts))}
@media (max-width:560px){
  .deckstage{height:300px}
  .dpad{grid-template-columns:1fr 1fr;gap:8px}
  .dpadmid{grid-column:1/3;flex-direction:row}
  .dpadmid .vbtn{flex:1}
}

/* ---------- file-backed storage ----------
   Browser storage always holds a mirror, so nothing is ever lost. On top of that
   you can link a real trips.json and every change is written straight to it. */
const STORE = {handle:null, mode:"local", needsPermission:false, lastSaved:null, writing:false, again:false};
const FSA = typeof window!=="undefined" && !!window.showSaveFilePicker;

function idb(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB) return rej(new Error("no idb"));
    const r = window.indexedDB.open("tripBoard", 1);
    r.onupgradeneeded = ()=>{ r.result.createObjectStore("kv"); };
    r.onsuccess = ()=>res(r.result);
    r.onerror = ()=>rej(r.error);
  });
}
async function idbSet(k,v){
  const db = await idb();
  return new Promise((res,rej)=>{
    const tx = db.transaction("kv","readwrite");
    tx.objectStore("kv").put(v,k);
    tx.oncomplete = ()=>res(); tx.onerror = ()=>rej(tx.error);
  });
}
async function idbGet(k){
  const db = await idb();
  return new Promise((res,rej)=>{
    const tx = db.transaction("kv","readonly");
    const q = tx.objectStore("kv").get(k);
    q.onsuccess = ()=>res(q.result); q.onerror = ()=>rej(q.error);
  });
}

async function initStorage(){
  if(!FSA) return;
  let h = null;
  try{ h = await idbGet("fileHandle"); }catch(e){ return; }
  if(!h) return;
  STORE.handle = h;
  let perm = "prompt";
  try{ perm = await h.queryPermission({mode:"readwrite"}); }catch(e){}
  if(perm === "granted"){ await adoptFile(); }
  else { STORE.needsPermission = true; STORE.mode = "file-locked"; render(); }
}
async function adoptFile(){
  try{
    const f = await STORE.handle.getFile();
    const txt = await f.text();
    if(txt.trim()){
      const j = JSON.parse(txt);
      if(j && Array.isArray(j.trips)){
        DB = j;
        DB.trips.forEach(normalize);
        localStorage.setItem(KEY, JSON.stringify(DB));
      }
    }
    STORE.mode = "file";
    STORE.needsPermission = false;
    STORE.lastSaved = Date.now();
    render();
  }catch(e){
    STORE.mode = "local"; STORE.needsPermission = true; render();
  }
}
async function reconnectFile(){
  if(!STORE.handle) return;
  try{
    const p = await STORE.handle.requestPermission({mode:"readwrite"});
    if(p==="granted"){ await adoptFile(); toast("Reconnected to your trips file"); }
    else toast("Still using browser storage");
  }catch(e){ toast("Couldn't reconnect"); }
}
async function linkFile(){
  if(!FSA){ toast("This browser can't link files — Chrome or Edge can"); return; }
  try{
    STORE.handle = await window.showSaveFilePicker({
      suggestedName: "trips.json",
      types:[{description:"Trip Board data", accept:{"application/json":[".json"]}}]
    });
    STORE.mode = "file"; STORE.needsPermission = false;
    try{ await idbSet("fileHandle", STORE.handle); }
    catch(e){ toast("Linked for this session — your browser wouldn't remember the file"); }
    await writeFile();
    render();
    toast("Linked. Every change now writes straight to that file.");
  }catch(e){ /* user cancelled */ }
}
async function openFile(){
  if(!FSA){ document.getElementById("importfile").click(); return; }
  try{
    const [h] = await window.showOpenFilePicker({
      types:[{description:"Trip Board data", accept:{"application/json":[".json"]}}]
    });
    STORE.handle = h;
    try{ await idbSet("fileHandle", h); }catch(e){}
    await adoptFile();
    toast("Opened — this file is now where your trips live");
  }catch(e){ /* cancelled */ }
}
async function unlinkFile(){
  STORE.handle = null; STORE.mode = "local"; STORE.needsPermission = false;
  try{ await idbSet("fileHandle", null); }catch(e){}
  render();
  toast("Back to browser storage — your trips are still here");
}
async function writeFile(){
  if(!STORE.handle) return;
  if(STORE.writing){ STORE.again = true; return; }
  STORE.writing = true;
  try{
    const w = await STORE.handle.createWritable();
    await w.write(JSON.stringify(DB,null,2));
    await w.close();
    STORE.lastSaved = Date.now();
    STORE.mode = "file";
  }catch(e){
    STORE.needsPermission = true;
    STORE.mode = "file-locked";
  }
  STORE.writing = false;
  if(STORE.again){ STORE.again = false; return writeFile(); }
  const chip = document.getElementById("savechip");
  if(chip) chip.outerHTML = storageChipHTML();
}
let writeTimer = null;
function scheduleWrite(){
  if(!STORE.handle) return;
  clearTimeout(writeTimer);
  writeTimer = setTimeout(writeFile, 400);
}
function storageChipHTML(){
  if(STORE.mode==="file"){
    const t = STORE.lastSaved ? new Date(STORE.lastSaved) : null;
    return `<button class="savechip ok" id="savechip" data-act="storage" title="Click for storage options">
      <span class="dotok"></span>${esc(STORE.handle && STORE.handle.name || "trips.json")}
      ${t?`<span class="ago">saved ${d2(t.getHours())}:${d2(t.getMinutes())}</span>`:""}</button>`;
  }
  if(STORE.mode==="file-locked"){
    return `<button class="savechip warn" id="savechip" data-act="storage">
      <span class="dotwait"></span>File needs reconnecting</button>`;
  }
  return `<button class="savechip" id="savechip" data-act="storage" title="Click for storage options">
    <span class="dotwait"></span>Saved in this browser</button>`;
}

/* =========================================================
   3. UTILITIES
   ========================================================= */
const MON = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const DOW = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
const MONL = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function dayLabel(d){ const x=parseD(d); return MONL[x.getMonth()]+" "+x.getDate(); }

function d2(n){ return String(n).padStart(2,"0"); }
function parseD(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function fmtD(dt){ return dt.getFullYear()+"-"+d2(dt.getMonth()+1)+"-"+d2(dt.getDate()); }
function addDays(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return fmtD(d); }
function daysBetween(a,b){ return Math.round((parseD(b)-parseD(a))/86400000); }
function todayStr(){ return fmtD(new Date()); }

const MAX_TRIP_DAYS = 400;
function dateRange(a,b){
  if(!a||!b) return [];
  const n = daysBetween(a,b);
  if(n<0 || n>MAX_TRIP_DAYS-1) return [];
  const out=[]; for(let i=0;i<=n;i++) out.push(addDays(a,i));
  return out;
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmt12(t){
  if(!t) return "";
  const [h,m] = t.split(":").map(Number);
  const ap = h>=12 ? "pm" : "am";
  const hh = h%12===0 ? 12 : h%12;
  return hh + (m ? ":"+d2(m) : "") + ap;
}
function mins2h(m){
  m = Math.round(m/5)*5;
  const h = Math.floor(m/60), r = m%60;
  if(h===0) return r+"m";
  return h+"h"+(r?" "+d2(r)+"m":"");
}
const isNum = v => typeof v === "number" && isFinite(v);
const isPoint = p => !!p && isNum(p.lat) && isNum(p.lon);
function haversine(a,b){
  if(!isPoint(a) || !isPoint(b)) return null;
  const R=6371, rad=x=>x*Math.PI/180;
  const dLat=rad(b.lat-a.lat), dLon=rad(b.lon-a.lon);
  const s = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function estimateMins(modeId, from, to){
  const m = TRANSPORT_MODES.find(x=>x.id===modeId);
  const km = haversine(from,to);
  if(!m || km==null) return null;
  const road = m.id==="flight" ? km*1.02 : km*1.25;   // flights near direct, ground routes wander
  return Math.round(road/m.kmh*60 + m.over);
}
let lastDeleted = null;
let lastOptimise = null;
let lastMove = null;
const fmtKm = km => km < 1 ? Math.round(km*1000)+"m" : km.toFixed(1)+"km";
function toastUndo(msg, act){
  const old = document.querySelector(".toast");
  if(old) old.remove();
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = esc(msg) + ' <button class="undo" data-act="'+(act||"undodel")+'">Undo</button>';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 6000);
}
function toast(msg){
  const el = document.createElement("div");
  el.className="toast"; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2400);
}
function c2f(c){ return c*9/5+32; }
function temp(c){
  if(c==null || isNaN(c)) return "–";
  return Math.round(c)+"°/"+Math.round(c2f(c))+"°F";
}

/* =========================================================
   4. TRIP HELPERS
   ========================================================= */
function tripDays(t){ return dateRange(t.arr.date, t.dep.date); }

function tripCodes(t){
  const out = [t.arr.code];
  t.cities.forEach(c=>{ if(c.code && !out.includes(c.code)) out.push(c.code); });
  if(t.dep.code && t.dep.code!==out[out.length-1]) out.push(t.dep.code);
  return out.filter(Boolean);
}
function cityById(t,id){ return t.cities.find(c=>c.id===id) || null; }

// which city are we in on a given day? seeded by arrival, moved by transport magnets
// Pin one day to a city. Days after it follow along until the next pin or
// transport magnet, so you only mark the days you actually move.
function pinDay(t, day, cityId){
  if(!day || !cityId) return;
  t.dayCity = t.dayCity || {};
  t.dayCity[day] = cityId;
}
function computeDayCities(t){
  const days = tripDays(t);
  const map = {};
  if(!days.length) return map;

  const hasMoves = t.magnets.some(m=>m.board==="cal" && m.kind==="move" && m.toCity);
  const hasManual = t.dayCity && Object.keys(t.dayCity).length>0;

  // Nothing said otherwise and there's more than one city? Split the trip evenly
  // in the order you listed them, so every city owns some days from the start.
  // Any transport magnet or manual pick overrides this straight away.
  if(!hasMoves && !hasManual && t.cities.length>1){
    const per = days.length / t.cities.length;
    days.forEach((d,i)=>{
      const ix = Math.min(t.cities.length-1, Math.floor(i/per));
      map[d] = t.cities[ix].id;
    });
    return map;
  }

  let cur = t.cities[0] ? t.cities[0].id : null;
  days.forEach(d=>{
    if(t.dayCity && t.dayCity[d]) cur = t.dayCity[d];
    map[d] = cur;
    // a transport magnet on this day moves you for subsequent days
    const moves = t.magnets.filter(m=>m.board==="cal" && m.day===d && m.kind==="move" && m.toCity);
    if(moves.length) cur = moves[moves.length-1].toCity;
  });
  return map;
}
function magnetsIn(t, pred){ return t.magnets.filter(pred).sort((a,b)=>(a.order||0)-(b.order||0)); }

/* ---------- days folded away, and days that are settled ----------
   Two different ideas, deliberately kept apart. Folding is about clutter: ten
   days is a lot of screen and you are usually working on one of them. Finalising
   is about intent: this day is booked, stop moving it. You fold days that are
   done and days you have not started; you finalise only the ones that are real. */
function dayFolded(t, day){ return !!(t && t.dayFold && t.dayFold[day]); }
function dayLocked(t, day){ return !!(t && t.dayLock && t.dayLock[day]); }
function toggleDayFold(t, day){
  t.dayFold = t.dayFold || {};
  if(t.dayFold[day]) delete t.dayFold[day]; else t.dayFold[day] = true;
  save(); render();
}
function toggleDayLock(t, day){
  t.dayLock = t.dayLock || {};
  if(t.dayLock[day]){
    delete t.dayLock[day];
    save(); render();
    toast(dayLabel(day)+" unlocked — it can move again");
  }else{
    t.dayLock[day] = true;
    save(); render();
    toast(dayLabel(day)+" is finalised — nothing moves in or out");
  }
}
function foldDays(t, mode){
  const days = tripDays(t);
  t.dayFold = t.dayFold || {};
  if(mode==="none") t.dayFold = {};
  else if(mode==="all") days.forEach(d=>{ t.dayFold[d] = true; });
  else if(mode==="locked") days.forEach(d=>{ if(dayLocked(t, d)) t.dayFold[d] = true; });
  save(); render();
}
/* what a folded day says about itself in one line */
function daySummary(t, day){
  const all = magnetsIn(t, m=>m.board==="cal" && m.day===day);
  return {
    acts:  all.filter(m=>m.slot!=="transit" && m.slot!=="lunch" && m.slot!=="dinner"),
    meals: all.filter(m=>m.slot==="lunch" || m.slot==="dinner"),
    trans: all.filter(m=>m.slot==="transit"),
    notes: !!dayNote(t, day),
    stickies: stickies(t, day).length,
    images: dayImages(t, day).length
  };
}

function newTripObject(data){
  const t = {
    id: uid(),
    name: data.name || "",
    createdAt: Date.now(),
    arr: data.arr, dep: data.dep,
    cities: data.cities,
    interests: data.interests,
    custom: data.custom || {},
    pace: data.pace || "balanced",
    dayCity: {}, dayNotes: {}, dayImages: {}, stickies: {}, dayPin: {}, stays: [],
    magnets: [],
    wx: {seasonal:{}, live:{}, liveAt:null},
    decks: {}, verdicts: {},
    tray: {dismissed:[]}
  };
  // locked flight magnets
  t.magnets.push({
    id:uid(), kind:"fly", board:"cal", day:t.arr.date, slot:slotForTime(t.arr.time),
    label:"Land "+t.arr.code+(t.arr.time?" "+fmt12(t.arr.time):""),
    note:t.arr.flightNo ? t.arr.flightNo : "arrival", locked:true, order:-1000, time:t.arr.time
  });
  t.magnets.push({
    id:uid(), kind:"fly", board:"cal", day:t.dep.date, slot:slotForTime(t.dep.time),
    label:"Fly out "+t.dep.code+(t.dep.time?" "+fmt12(t.dep.time):""),
    note:t.dep.flightNo ? t.dep.flightNo : "departure", locked:true, order:1000, time:t.dep.time
  });
  // hotel checkin/checkout scaffolding
  t.magnets.push({id:uid(),kind:"stay",board:"todo",col:"before",label:"Book accommodation",note:"",order:1});
  t.magnets.push({id:uid(),kind:"note",board:"todo",col:"before",label:"Check visa / entry rules",note:"",order:2});
  return t;
}
function slotForTime(t){
  if(!t) return "morning";
  const h = +t.split(":")[0];
  if(h<12) return "morning";
  if(h<17) return "afternoon";
  return "evening";
}

/* =========================================================
   5b. CLOCK TIME PICKER
   ========================================================= */
function faceTheme(h){
  if(h>=6 && h<8)   return {bg:"#FDE9CE",ring:"#E9C79A",num:"#6B4A22",hand:"#8A5A22",tag:"dawn"};
  if(h>=8 && h<17)  return {bg:"#FFFDF4",ring:"#E3DCCC",num:"#4A4437",hand:"#23201C",tag:"daytime"};
  if(h>=17 && h<20) return {bg:"#F7D4AE",ring:"#DFA873",num:"#6B3E1C",hand:"#8A4A1C",tag:"dusk"};
  return {bg:"#252B47",ring:"#3C456F",num:"#C6CEEE",hand:"#EDF1FF",tag:"night"};
}
function snap30(t){
  if(!t) return t;
  let [h,m] = t.split(":").map(Number);
  m = m<15 ? 0 : (m<45 ? 30 : 0);
  if(m===0 && +t.split(":")[1] >= 45) h = (h+1)%24;
  return d2(h)+":"+d2(m);
}
// one ring, 48 half-hour stops. midnight at the top, noon at the bottom.
function minOfDay(t){ const [h,m]=t.split(":").map(Number); return h*60+m; }
function fromMin(v){ v=((v%1440)+1440)%1440; return d2(Math.floor(v/60))+":"+d2(v%60); }
function angToTime(ang){ return fromMin(Math.round(((ang%360)+360)%360/360*48)%48*30); }
function timeToAng(t){ return minOfDay(t)/1440*360; }

function clockHTML(key, label, value, hint){
  const set = !!value;
  const val = set ? value : "12:00";
  const H = +val.split(":")[0];
  const th = faceTheme(H);
  const ang = timeToAng(val);
  const R=62, cx=84, cy=84;
  const pos = a => {
    const r=(a-90)*Math.PI/180;
    return [cx+Math.cos(r)*R, cy+Math.sin(r)*R];
  };
  const [hx,hy] = pos(ang);
  const ticks = [];
  for(let i=0;i<24;i++){
    const a=(i*15-90)*Math.PI/180, big = i%6===0, len = big?8:4;
    ticks.push(`<line x1="${(cx+Math.cos(a)*(R+9)).toFixed(1)}" y1="${(cy+Math.sin(a)*(R+9)).toFixed(1)}"
      x2="${(cx+Math.cos(a)*(R+9-len)).toFixed(1)}" y2="${(cy+Math.sin(a)*(R+9-len)).toFixed(1)}"
      stroke="${th.num}" stroke-width="${big?1.6:1}" opacity="${big?.75:.35}"/>`);
  }
  const marks = [[0,"12a"],[6,"6a"],[12,"12p"],[18,"6p"]].map(([h,lbl])=>{
    const a=(h*15-90)*Math.PI/180;
    return `<text x="${(cx+Math.cos(a)*(R-15)).toFixed(1)}" y="${(cy+Math.sin(a)*(R-15)+3.5).toFixed(1)}"
      text-anchor="middle" font-size="9.5" font-family="ui-monospace,Menlo,monospace"
      fill="${th.num}" opacity=".55">${lbl}</text>`;
  }).join("");
  // arc from midnight round to the handle, so you can read the elapsed day at a glance
  const large = ang>180 ? 1 : 0;
  const [sx,sy] = pos(0);
  const arc = ang>0.5 ? `<path d="M ${sx.toFixed(1)} ${sy.toFixed(1)} A ${R} ${R} 0 ${large} 1 ${hx.toFixed(1)} ${hy.toFixed(1)}"
    fill="none" stroke="${th.hand}" stroke-width="3" stroke-linecap="round" opacity="${set?.5:.2}"/>` : "";
  return `<div class="clockbox" data-clock="${key}">
    <div class="clocklbl">${esc(label)}</div>
    <svg class="clockface" width="168" height="168" viewBox="0 0 168 168" role="slider"
         aria-label="${esc(label)} time" aria-valuetext="${set?fmt12(val):"not set"}" tabindex="0">
      <circle cx="${cx}" cy="${cy}" r="${R+9}" fill="${th.bg}" stroke="${th.ring}" stroke-width="1.5"/>
      ${th.tag==="night"?`<circle cx="122" cy="46" r="7" fill="#EDF1FF" opacity=".5"/>
        <circle cx="125" cy="43" r="6" fill="${th.bg}"/>`:""}
      ${th.tag==="daytime"?`<circle cx="122" cy="46" r="6.5" fill="#F2C14E" opacity=".5"/>`:""}
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${th.num}" stroke-width="1" opacity=".18"/>
      ${ticks.join("")}${marks}${arc}
      <text x="${cx}" y="${cy+2}" text-anchor="middle" font-size="21" font-weight="650"
        font-family="ui-monospace,Menlo,monospace" fill="${th.hand}" opacity="${set?1:.35}">${set?fmt12(val):"--:--"}</text>
      <text x="${cx}" y="${cy+19}" text-anchor="middle" font-size="9.5" letter-spacing="1.2"
        font-family="ui-sans-serif,sans-serif" fill="${th.num}" opacity=".6">${set?th.tag.toUpperCase():"DRAG THE DOT"}</text>
      <circle class="knob" cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="11"
        fill="${th.hand}" stroke="${th.bg}" stroke-width="3" opacity="${set?1:.45}"/>
      <circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="3.5" fill="${th.bg}" opacity="${set?.9:.4}"/>
    </svg>
    <div class="nudge">
      <button type="button" data-act="nudge" data-clock="${key}" data-d="-30">−30m</button>
      <button type="button" data-act="nudge" data-clock="${key}" data-d="30">+30m</button>
      ${set?`<button type="button" data-act="clearclock" data-clock="${key}">clear</button>`:""}
    </div>
    <div class="clockhint">${set?"":esc(hint||"drag the dot anywhere round the ring")}</div>
  </div>`;
}
// which model field a clock writes to
const CLOCK_TARGETS = {}; // key -> {get(), set(v)}

function mountClocks(){
  document.querySelectorAll("[data-clock] .clockface").forEach(svg=>{
    const key = svg.closest("[data-clock]").getAttribute("data-clock");
    let dragging = false;
    const angleAt = e=>{
      const r = svg.getBoundingClientRect();
      const src = e.touches && e.touches[0] ? e.touches[0] : e;
      const x = src.clientX - r.left - r.width/2;
      const y = src.clientY - r.top - r.height/2;
      if(Math.hypot(x,y) < 6) return null;         // dead zone at the very centre
      return (Math.atan2(y,x)*180/Math.PI + 90 + 360)%360;
    };
    const apply = e=>{
      const a = angleAt(e);
      if(a==null) return;
      const tgt = CLOCK_TARGETS[key];
      if(tgt) tgt.set(angToTime(a));
    };
    const down = e=>{
      e.preventDefault();
      dragging = true;
      apply(e);
      if(svg.setPointerCapture && e.pointerId!=null){ try{ svg.setPointerCapture(e.pointerId); }catch(_){} }
    };
    const move = e=>{ if(!dragging) return; e.preventDefault(); apply(e); };
    const up = ()=>{ dragging = false; };
    svg.addEventListener("pointerdown", down);
    svg.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    svg.addEventListener("touchstart", down, {passive:false});
    svg.addEventListener("touchmove", move, {passive:false});
    window.addEventListener("touchend", up);
    svg.addEventListener("keydown", e=>{
      const tgt = CLOCK_TARGETS[key];
      if(!tgt) return;
      const step = e.key==="ArrowLeft"||e.key==="ArrowDown" ? -30
                 : e.key==="ArrowRight"||e.key==="ArrowUp" ? 30 : 0;
      if(!step) return;
      e.preventDefault();
      tgt.set(fromMin(minOfDay(tgt.get()||"12:00") + step));
    });
  });
}

// distance-ranked neighbours, plus the big-name cities in the same country that
// distance alone would bury — Beijing shouldn't hide Chengdu
function nearbyCities(origin, excludeNames, limit){
  if(!origin || origin.lat==null) return [];
  const ex = new Set((excludeNames||[]).map(s=>s.toLowerCase()));
  return CITIES
    .map(c=>({city:c, km:haversine(origin,c)}))
    .filter(x=>x.km!=null && x.km<1300 && !ex.has(x.city.name.toLowerCase()))
    .sort((a,b)=>a.km-b.km)
    .slice(0, limit||14);
}
function countryCities(origin, country, excludeNames, limit){
  if(!country) return [];
  const ex = new Set((excludeNames||[]).map(s=>s.toLowerCase()));
  return CITIES
    .filter(c=>c.country===country && MAJOR.has(c.name) && !ex.has(c.name.toLowerCase()))
    .map(c=>({city:c, km:origin&&origin.lat!=null ? haversine(origin,c) : null}))
    .sort((a,b)=>(a.km==null?1e9:a.km)-(b.km==null?1e9:b.km))
    .slice(0, limit||12);
}
// how much room this city actually has, at your chosen pace
function citySlots(t, cityId){
  return daysForCity(t, cityId).length * paceOf(t.pace).per;
}
function shortlistFor(t, cityId){
  return magnetsIn(t, m=>m.board==="short" && m.col===cityId);
}
function citySuggestions(origin, country, excludeNames){
  const near = nearbyCities(origin, excludeNames, 12);
  const seen = new Set(near.map(x=>x.city.name.toLowerCase()).concat((excludeNames||[]).map(s=>s.toLowerCase())));
  const rest = countryCities(origin, country, [...seen], 10);
  return {near, rest};
}

function suggestName(codes, dateStr){
  const clean = (codes||[]).filter(c=>c && c!=="???");
  const uniq = [];
  clean.forEach(c=>{ if(!uniq.includes(c)) uniq.push(c); });
  const year = dateStr ? dateStr.slice(0,4) : new Date().getFullYear();
  if(!uniq.length) return "";
  if(uniq.length===1) return uniq[0]+" "+year;
  return uniq.slice(0,4).join("-")+" "+year;
}

function loadScript(src){
  return new Promise((res,rej)=>{
    if(document.querySelector('script[src="'+src+'"]')) return res();
    const s = document.createElement("script");
    s.src = src; s.onload = ()=>res(); s.onerror = ()=>rej(new Error("load failed"));
    document.head.appendChild(s);
  });
}
const PDFJS_URL = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const TESS_URL = "https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js";

async function textFromPDF(file){
  await loadScript(PDFJS_URL);
  const lib = window.pdfjsLib;
  lib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  const buf = await file.arrayBuffer();
  const pdf = await lib.getDocument({data:buf}).promise;
  let out = "";
  for(let i=1;i<=Math.min(pdf.numPages,8);i++){
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    out += tc.items.map(x=>x.str).join(" ") + "\n";
  }
  return out;
}
async function textFromImage(file, onProgress){
  await loadScript(TESS_URL);
  const r = await window.Tesseract.recognize(file, "eng", {
    logger: m => { if(m.status==="recognizing text" && onProgress) onProgress(Math.round(m.progress*100)); }
  });
  return r.data.text || "";
}

const MONTHS_RE = "jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec";
const MON_IX = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};

function findDates(text){
  const out = [];
  const push = (y,m,d)=>{
    if(m<0||m>11||d<1||d>31) return;
    const dt = new Date(y,m,d);
    if(dt.getMonth()!==m) return;
    out.push(fmtD(dt));
  };
  const nowY = new Date().getFullYear();
  let re, x;
  // 2026-10-12
  re = /\b(20\d{2})[-/.](\d{1,2})[-/.](\d{1,2})\b/g;
  while((x=re.exec(text))) push(+x[1], +x[2]-1, +x[3]);
  // 12 Oct 2026 / 12 October
  re = new RegExp("\\b(\\d{1,2})\\s*(?:st|nd|rd|th)?[\\s.-]*("+MONTHS_RE+")[a-z]*\\.?[\\s,.-]*(20\\d{2})?\\b","gi");
  while((x=re.exec(text))) push(x[3]?+x[3]:nowY, MON_IX[x[2].toLowerCase().slice(0,x[2].length>3?4:3)] ?? MON_IX[x[2].toLowerCase().slice(0,3)], +x[1]);
  // Oct 12, 2026
  re = new RegExp("\\b("+MONTHS_RE+")[a-z]*\\.?\\s+(\\d{1,2})\\s*(?:st|nd|rd|th)?[\\s,]*(20\\d{2})?\\b","gi");
  while((x=re.exec(text))) push(x[3]?+x[3]:nowY, MON_IX[x[1].toLowerCase().slice(0,3)], +x[2]);
  // 12/10/2026 or 10/12/26
  re = /\b(\d{1,2})\/(\d{1,2})\/(20\d{2}|\d{2})\b/g;
  while((x=re.exec(text))){
    let y = +x[3]; if(y<100) y += 2000;
    const a=+x[1], b=+x[2];
    if(a>12 && b<=12) push(y, b-1, a); else push(y, a-1, b);
  }
  const uniq = [...new Set(out)].sort();
  // booking confirmations also carry issue dates and fare deadlines; travel dates are
  // almost always still ahead of you, so prefer those and only fall back if there are none
  const future = uniq.filter(d=>d>=todayStr());
  if(future.length) return future;
  const floor = fmtD(new Date(Date.now()-86400000*400));
  return uniq.filter(d=>d>=floor);
}
function findTimes(text){
  const out = [];
  const re = /\b(\d{1,2}):(\d{2})\s*(a\.?m\.?|p\.?m\.?)?/gi;
  let x;
  while((x=re.exec(text))){
    let h=+x[1], m=+x[2];
    const ap = (x[3]||"").toLowerCase().replace(/\./g,"");
    if(m>59) continue;
    if(ap==="pm" && h<12) h+=12;
    if(ap==="am" && h===12) h=0;
    if(h>23) continue;
    out.push(d2(h)+":"+d2(m));
  }
  return out;
}
function findCodes(text){
  const out = [];
  const re = /\b([A-Z]{3})\b/g;
  let x;
  while((x=re.exec(text))){ if(AIRPORTS[x[1]]) out.push(x[1]); }
  return out;
}
function findFlightNos(text){
  const out = [];
  const re = /\b([A-Z]{2}|[A-Z]\d|\d[A-Z])\s?-?\s?(\d{1,4})\b/g;
  let x;
  while((x=re.exec(text))){
    const code = x[1];
    if(/^\d/.test(code) && +x[2] > 999) continue;
    if(["AM","PM","ID","NO","TO"].includes(code)) continue;
    out.push(code+" "+x[2]);
  }
  return [...new Set(out)];
}
function findCityNames(text){
  const low = " "+text.toLowerCase()+" ";
  return CITIES.filter(c=>low.includes(" "+c.name.toLowerCase()+" ") ||
                          low.includes(" "+c.name.toLowerCase()+","));
}

function parseItinerary(text){
  const codes = findCodes(text);
  const dates = findDates(text);
  const times = findTimes(text);
  const fns   = findFlightNos(text);
  const cities= findCityNames(text);
  const r = {codes, dates, times, fns, cities, arr:{}, dep:{}};
  if(codes.length===1){ r.arr.code = codes[0]; r.dep.code = codes[0]; }
  else if(codes.length===2){ r.arr.code = codes[1]; r.dep.code = codes[1]; }
  else if(codes.length>=3){ r.arr.code = codes[1]; r.dep.code = codes[codes.length-2]; }
  if(dates.length){
    // confirmations carry fare deadlines and return-by dates; a trip is the
    // window starting at the first date, not everything in the document
    r.arr.date = dates[0];
    const within = dates.filter(d=>daysBetween(r.arr.date, d) <= 60);
    r.dep.date = within.length ? within[within.length-1] : dates[0];
    r.ignoredDates = dates.filter(d=>within.indexOf(d)<0);
  }
  if(times.length){
    r.arr.time = snap30(times.length>=2 ? times[1] : times[0]);
    r.dep.time = snap30(times.length>=3 ? times[times.length-2] : times[times.length-1]);
  }
  if(fns.length){ r.arr.flightNo = fns[0]; r.dep.flightNo = fns[fns.length-1]; }
  return r;
}

                      market:60, eats:75, nature:90, walk:90, shop:60, night:150};
const MINS_WORDS = [
  [/\bday trip\b|\bovernight\b/i, 480],
  [/\bhike|\btrek|\bsummit|\bclimb\b/i, 240],
  [/\bclass\b|\bworkshop\b|\bcourse\b/i, 180],
  [/\bshow\b|\bconcert\b|\bopera\b|\bcircus\b|\bmatch\b|\bgame\b/i, 150],
  [/\bcruise\b|\bferry\b|\bboat\b|\bsail|\bkayak/i, 90],
  [/\bcoffee\b|\bcafe\b|\bcafé\b|\bbreakfast\b|\btea\b/i, 45],
  [/\bdinner\b|\bbarbecue\b|\bbbq\b|\bkaiseki\b|\bbrunch\b/i, 105],
  [/\bsunset\b|\bsunrise\b|\bdusk\b|\bviewpoint\b/i, 45],
  [/\bbath|\bonsen\b|\bspa\b|\bsauna\b|\bhammam\b|\bmassage\b/i, 120],
  [/\bcrawl\b|\bwalk\b|\bwander\b|\bcycle\b|\bbike\b/i, 90],
  [/\bmarket\b|\bbazaar\b|\bsouk\b/i, 75]
];
// how much it asks of your legs
const EFFORT_WORDS = [
  [/\bhike|\btrek|\bsummit|\bclimb\b|\bgrind\b|\bmountain\b|\bgorge\b|\bpeak\b|\bsteps\b|\bascent\b/i, 3],
  [/\bwalk\b|\bwander\b|\bcycle\b|\bbike\b|\bseawall\b|\btrail\b|\bcrawl\b|\bramble\b|\bquarter\b|\bmedina\b/i, 2],
  [/\bcruise\b|\bferry\b|\bboat\b|\bshow\b|\bconcert\b|\bopera\b|\bbar\b|\bdinner\b|\blunch\b|\bcafe\b|\bcoffee\b/i, 0]
];
const EFFORT_BY_SUIT = {nature:2, walk:2, landmark:1, view:1, market:1, temple:1,
                        museum:1, art:1, shop:1, eats:0, night:0};

function cardFacts(card, index, deckSize){
  const key = (card.name||"").toLowerCase();
  const hit = CARD_FACTS[key];
  if(hit) return {iconic:hit.iconic, mins:hit.mins, effort:hit.effort, exact:true};

  let mins = null;
  for(const [re,v] of MINS_WORDS){ if(re.test(card.name)||re.test(card.blurb||"")){ mins = v; break; } }
  if(mins==null) mins = MINS_BY_SUIT[card.suit] || 60;

  let effort = null;
  for(const [re,v] of EFFORT_WORDS){ if(re.test(card.name)||re.test(card.blurb||"")){ effort = v; break; } }
  if(effort==null) effort = EFFORT_BY_SUIT[card.suit];
  if(effort==null) effort = 1;
  if(mins >= 300 && effort < 2) effort = 2;

  // decks are written most-essential first, which is a fair proxy when nothing else is known
  const i = index==null ? 99 : index;
  const iconic = i<=3 ? 5 : i<=7 ? 4 : i<=12 ? 3 : 2;
  return {iconic, mins, effort, exact:false};
}
function fameToIconic(fame){
  if(fame>=80) return 5;
  if(fame>=45) return 4;
  if(fame>=20) return 3;
  if(fame>=8)  return 2;
  return 1;
}
function durLabel(m){
  if(m==null) return "";
  if(m>=1400) return "overnight";
  if(m>=420) return "full day";
  if(m>=300) return "most of a day";
  if(m<60) return m+" min";
  const h = m/60;
  const whole = Math.floor(h);
  const half = (h-whole)>=0.5;
  return (half ? whole+"½" : String(whole)) + (whole===1 && !half ? " hr" : " hrs");
}
const EFFORT_LABEL = ["Flat", "Easy walking", "On your feet", "Strenuous"];
const SHOW_EFFORT = new Set(["nature","walk","landmark","view","temple"]);

function curatedDeck(cityName){
  const raw = DECKS[cityName];
  if(!raw) return null;
  const rows = raw.trim().split("\n").map(l=>l.split("|")).filter(p=>p.length>=6);
  return rows.map((p,i)=>{
    const c = {name:p[0], suit:p[1], area:p[2], blurb:p[3], lat:+p[4], lon:+p[5], src:"curated"};
    return Object.assign(c, cardFacts(c, i, rows.length));
  });
}
