yuan.","why":"The same view as the cruise, at one percent of the price.","mins":30},{"name":"A cocktail bar crawl in the Concession","what":"Three or four of the small bars around Anfu and Yongkang.","why":"Shanghai's bartending is genuinely world class.","mins":180},{"name":"Shikumen lane wandering","what":"Push into the residential lanes off Anfu or Wukang and see laundry, mahjong and daily life.","why":"The city at domestic scale, thirty seconds from the boutiques.","mins":60},{"name":"Tailoring at the fabric market","what":"South Bund Fabric Market: pick cloth, get measured, collect in a few days.","why":"A shirt or coat for a fraction of the price, if your timing allows.","mins":90},{"name":"Hairy crab dinner in autumn","what":"A guided, messy, wine-fuelled seasonal meal.","why":"The most local thing you can do in October.","mins":150}],"neighbourhoodGuide":[{"name":"Former French Concession","vibe":"Plane trees, low villas, coffee, boutiques","bestFor":"Walking, eating, browsing, doing nothing","sights":"Wukang Mansion, Fuxing Park, Propaganda Poster Centre","food":"Everything, particularly coffee and small restaurants","mins":240},{"name":"The Bund and Huangpu","vibe":"Grand, granite, riverfront","bestFor":"Architecture, views, rooftop drinks","sights":"The Bund, Yu Garden, Shanghai Museum","food":"Xiaolongbao, high-end dining","mins":180},{"name":"Jing'an","vibe":"Polished, temple-and-tower contrast","bestFor":"Shopping, good restaurants","sights":"Jing'an Temple, Zhangyuan","food":"Serious restaurants and bars","mins":150},{"name":"Xuhui and West Bund","vibe":"Riverside, cultural, spacious","bestFor":"Museums, cycling the waterfront","sights":"Long Museum, Yuz, Longhua Temple","food":"Cafes, riverside restaurants","mins":240},{"name":"Hongkou and North Bund","vibe":"Working city, layered history","bestFor":"Breakfast streets, Jewish quarter","sights":"Jewish Refugees Museum, 1933 Old Millfun","food":"Cheap and local","mins":150},{"name":"Pudong Lujiazui","vibe":"Vertical and corporate","bestFor":"One evening, one tower, one view","sights":"Shanghai Tower, riverside promenade","food":"Hotel and mall dining","mins":120}],"timeGuidance":{"three":"Day 1 the Bund, Yu Garden and Shanghai Museum. Day 2 the Concession on foot, all day, with a museum and a rooftop. Day 3 a water town or Suzhou.","fivePlus":"Add West Bund or Power Station of Art, Hongkou, a fabric-market fitting, a bar night, and a second unhurried Concession afternoon."},"dayTrips":[{"name":"Suzhou","travel":"25-30 min by high-speed rail","why":"Classical scholar gardens, canals and silk. The single best day trip in eastern China.","duration":"Full day","suits":"Everyone.","logistics":"Trains every few minutes from Hongqiao. Book the Humble Administrator's Garden ahead.","verdict":"Worth it"},{"name":"Hangzhou","travel":"45-60 min by high-speed rail","why":"West Lake, tea villages and temples. Better as an overnight than a day trip.","duration":"Full day minimum, overnight better","suits":"Anyone with a spare day and a taste for landscape.","logistics":"Trains from Hongqiao constantly.","verdict":"Worth it, ideally overnight"},{"name":"Zhujiajiao","travel":"1 hr by metro line 17","why":"The closest canal town. Pretty, restored and busy at weekends.","duration":"Half day","suits":"Anyone short of time.","logistics":"Metro all the way; go on a weekday morning.","verdict":"Worth it if you cannot reach Suzhou"},{"name":"Wuzhen or Xitang","travel":"1.5-2 hrs by coach","why":"Larger, better-preserved water towns; Wuzhen's east gate is lovely in the evening.","duration":"Full day or overnight","suits":"Photographers, second-time visitors.","logistics":"Coach or organised transfer.","verdict":"Worth it if you stay overnight"},{"name":"Nanjing","travel":"1.5 hrs by high-speed rail","why":"Ming walls, the tomb, and the Nanjing Massacre Memorial. Historically heavy, rewarding.","duration":"Long day or overnight","suits":"Anyone interested in modern Chinese history.","logistics":"Rail from Hongqiao.","verdict":"Only if you have extra time"}],"practical":{"gettingAround":"The metro is excellent, cheap and signed in English; lines 2 and 10 cover most of what you want. Set up a transit code in Alipay before you arrive. Didi for taxis. The Concession is best walked, and bike-share works well on flat ground. The Maglev from Pudong airport is fun for eight minutes but drops you at Longyang Road, which is inconvenient unless you are heading east.","whenToGo":"October and November are the best: dry, mild, and hairy crab season. Late March to May is good, with magnolia and plane trees coming into leaf. Summer is hot, humid and typhoon-prone. Winter is grey, damp and colder than the latitude suggests because buildings are poorly heated. Avoid the first week of October.","howLong":{"one":"The Bund, Yu Garden and a Concession walk. Rushed but coherent.","twoThree":"Add the Shanghai Museum, a rooftop, and a proper Shanghainese dinner. This is the sweet spot.","fourFive":"Add a water town or Suzhou, a contemporary art half day, and Hongkou.","week":"Use it as a base for Suzhou, Hangzhou and a water town overnight."},"culture":["Bring your passport; it is needed for museums, rail and hotels.","Payment is by phone. Set up Alipay or WeChat Pay with a foreign card before arrival.","A VPN installed before you land is necessary for most non-Chinese services.","Shanghainese is a distinct language, not a dialect of Mandarin, and older residents may prefer it.","Tipping is not expected.","Restaurants turn tables quickly at lunch; lingering is a dinner and cafe activity.","Book the big-name restaurants well ahead; the good small ones do not take bookings at all."]},"whatIdDo":[{"day":"Day 1","plan":"Yu Garden at opening, then walk to the Bund and along it. Shanghai Museum after lunch. Sunset from a Bund rooftop, dinner at Jia Jia Tang Bao or a Concession noodle shop."},{"day":"Day 2","plan":"Fuxing Park before nine, then the entire day walking the Concession: Wukang Mansion, Anfu Road, the Propaganda Poster Centre, coffee twice. Cocktails, then dinner at Fu 1088 or Old Jesse if you booked."},{"day":"Day 3","plan":"High-speed rail to Suzhou at eight. Humble Administrator's Garden, the Master of the Nets, lunch, a canal walk, back by seven."},{"day":"Day 4","plan":"Power Station of Art or the West Bund museums, riverside cycling, Longhua Temple. Evening ferry across the river and a last look at the skyline."}],"quickRef":{"musts":["The Bund at dusk and dawn","Former French Concession on foot","Shanghai Museum","Yu Garden at opening","One elevated view"],"eats":["Xiaolongbao","Shengjianbao","Hongshao rou","Scallion oil noodles","Hairy crab in autumn"],"areas":["Former French Concession","The Bund","Jing'an","West Bund","Hongkou"],"experiences":["Fuxing Park at 8am","Public ferry across the Huangpu","A Concession cocktail crawl"],"dayTrip":"Suzhou by high-speed rail","stay":"3-4 days"},"coords":{"Anfu Road and Wulumuqi Road":[31.213,121.443],"Bund rooftop bars":[31.239,121.49],"Century Park":[31.219,121.552],"Fairmont Peace Hotel jazz bar":[31.24,121.49],"Former French Concession":[31.213,121.452],"Fu 1088":[31.222,121.438],"Fu He Hui":[31.213,121.418],"Fuxing Park":[31.216,121.466],"Hangzhou":[30.274,120.155],"Hongkou and North Bund":[31.256,121.505],"Huxinting Teahouse":[31.227,121.492],"Jazz at the Fairmont Peace Hotel":[31.24,121.49],"Jewish Refugees Museum":[31.256,121.505],"Jia Jia Tang Bao":[31.229,121.47],"Jing'an":[31.224,121.446],"Jing'an Temple":[31.224,121.446],"Live music at Yuyintang":[31.222,121.416],"Longhua Temple":[31.164,121.451],"M50":[31.253,121.446],"Mr & Mrs Bund":[31.24,121.49],"Nanjing":[32.06,118.797],"Nanjing Road":[31.235,121.475],"Nanxiang Steamed Bun Restaurant":[31.227,121.492],"Old Jesse (Lao Ji Shi)":[31.201,121.442],"Power Station of Art":[31.187,121.489],"Propaganda Poster Art Centre":[31.208,121.435],"Pudong Lujiazui":[31.24,121.5],"Shanghai Botanical Garden or Chenshan":[31.155,121.45],"Shanghai Museum":[31.229,121.475],"Shanghai Tower":[31.234,121.505],"Shikumen Open House Museum":[31.221,121.475],"Shouning Road":[31.226,121.478],"Speakeasy cocktail bars":[31.213,121.45],"Suzhou":[31.299,120.585],"Suzhou Creek walkway":[31.245,121.46],"The Bund":[31.24,121.49],"Tianzifang":[31.208,121.468],"Ultraviolet":[31.24,121.49],"West Bund museum mile":[31.176,121.457],"Wukang Road":[31.203,121.437],"Wuzhen or Xitang":[30.745,120.492],"Xintiandi":[31.221,121.475],"Yang's Fry Dumpling":[31.235,121.475],"Yu Garden":[31.227,121.492],"Zhangyuan":[31.229,121.451],"Zhujiajiao":[31.113,121.055]}},"suzhou":{"schema":"cityreport.v1","city":"Suzhou","country":"China","lat":31.2989,"lon":120.5853,"generated":"2026-08-13","by":"Claude","note":"Opening hours, bookings and restaurants change. Treat specifics as a starting point and confirm before you commit.","glance":{"why":"Suzhou is what wealthy, retired Chinese officials built when they wanted to demonstrate taste rather than power. Nine of its classical gardens are UNESCO-listed, and they are not parks but compositions: every window frames a view, every path is designed to slow you down. Add canals, silk, the most refined regional opera in China, and a modern city that has quietly become an industrial giant, and you have somewhere far more substantial than a Shanghai day trip.","bestFor":["Gardens","Canals","Crafts and silk","Classical culture","Quiet"],"idealStay":"2 days, 1 if you are coming from Shanghai","character":["Refined","Watery","Scholarly","Understated","Crowded at the famous sites"],"dontMiss":["The Humble Administrator's Garden, booked ahead and entered at opening","The Master of the Nets Garden, ideally in the late afternoon","Pingjiang Road canal walk, early or late","Suzhou Museum, I.M. Pei's last major building","Silk, either the museum or a working shop","Kunqu opera, even thirty minutes of it","Tiger Hill and its leaning pagoda"],"neighbourhoods":["Pingjiang historic quarter","Shantang Street","Guanqian Street","Tiger Hill","Jinji Lake and SIP"]},"history":{"story":"Suzhou was rich for a thousand years before Shanghai existed, and it got rich from silk, water and paperwork. The Grand Canal made it the hinge of China's north-south trade; the silk trade made its merchants wealthy; and the imperial examination system meant those merchants' sons became officials who retired home and spent their fortunes building gardens. That sequence explains everything you will see.","origins":"Founded in 514 BCE as the capital of the state of Wu, laid out with a double moat and water gates. The street plan on a Song-dynasty stone map still broadly matches the modern city.","periods":[{"name":"Sui and Tang","text":"The Grand Canal connected the Yangtze delta to the northern capitals, and Suzhou became one of the richest cities in the empire."},{"name":"Ming and Qing","text":"The golden age. Silk workshops, publishing, painting schools, and the garden-building boom that produced almost everything you will visit."},{"name":"Taiping Rebellion, 1860s","text":"The city was devastated and much was lost. A great deal of what you see is careful reconstruction of what was there."},{"name":"Twentieth century","text":"Overtaken economically by Shanghai, Suzhou became a provincial city known for handicrafts and gardens."},{"name":"Since 1994","text":"The Singapore-China industrial park east of the old town turned Suzhou into one of the country's biggest manufacturing economies. The old town was protected, height-limited and restored while the money was made elsewhere."}],"modern":"You are effectively visiting two cities: a low-rise, canal-laced historic core with strict building limits, and a glass-and-lake business district to the east that looks like Singapore. The separation was deliberate policy and it is the reason the gardens survived.","whyItMatters":"Garden design here is a literary art, not a horticultural one. Rocks stand in for mountains, ponds for lakes, and the point is to compress a landscape into a courtyard so a scholar could contemplate it without travelling. Once you see that, the gardens stop looking repetitive.","visible":["Pingjiang Road follows the same canal alignment as the Song stone map.","White walls, grey tiles and black timber are the strict local palette; note how the modern museum obeys it.","Water gates and stone bridges show how goods actually moved.","Silk workshops still operate in the lanes off Shantang Street."]},"thingsToDo":{"historic":[{"name":"Humble Administrator's Garden","area":"Old town north","why":"The largest and most famous, built by a demoted official in 1509. Water-centred, endlessly framed. Book several days ahead and be there at opening or it is a procession.","mins":120},{"name":"Master of the Nets Garden","area":"Old town south","why":"Small, and the best-composed of them all. Evening opera performances in the courtyards in season.","mins":75},{"name":"Lingering Garden","area":"West of the old town","why":"Famous for its rockery and its covered walkways; less crowded than the Humble Administrator's.","mins":90},{"name":"Tiger Hill","area":"Northwest","why":"A burial mound, a leaning tenth-century pagoda and the legendary tomb of the king of Wu. Green, hilly and a good change of register.","mins":120},{"name":"Panmen Gate","area":"Southwest","why":"The only surviving combined land and water gate, with a stretch of city wall.","mins":60}],"arts":[{"name":"Suzhou Museum","area":"Next to the Humble Administrator's Garden","why":"I.M. Pei's 2006 building, a modern reading of the local white-and-grey vernacular, with a first-rate collection of Wu-region art. Free, timed entry.","mins":90},{"name":"Suzhou Silk Museum","area":"North old town","why":"Live silkworms, working looms and 4,000 years of the trade that funded the gardens.","mins":75},{"name":"Kunqu Opera Museum","area":"Pingjiang","why":"The oldest surviving Chinese operatic form, in a beautiful old guild hall. Short performances most days.","mins":60},{"name":"Suzhou Embroidery Research Institute","area":"West","why":"Double-sided silk embroidery so fine it looks printed. Watching it worked is the point.","mins":60}],"neighbourhoods":[{"name":"Pingjiang Road","character":"Canal on one side, shophouses on the other, willows overhead","highlights":"The canal itself, small museums, tea houses","food":"Snacks, tea, noodle shops","bestTime":"Before 9am or after 7pm","mins":120},{"name":"Shantang Street","character":"Longer, older canal street running toward Tiger Hill","highlights":"Boat rides, evening lanterns","food":"Street snacks","bestTime":"Evening","mins":120},{"name":"Guanqian Street","character":"The main commercial street, busy and local","highlights":"Xuanmiao Taoist temple in the middle","food":"Old-brand snack shops","bestTime":"Afternoon","mins":90},{"name":"Jinji Lake and SIP","character":"Glass towers, lakeside promenade, Singapore-planned","highlights":"Ferris wheel, lakeside walk, the 'gate of the east' building","food":"Malls and international dining","bestTime":"Evening","mins":90}],"nature":[{"name":"Canal boat ride","area":"Pingjiang or Shantang","why":"Twenty minutes on the water re-orients the whole city.","mins":30},{"name":"Tiger Hill grounds","area":"Northwest","why":"Gardens, bamboo, a stream and a pagoda you can circle.","mins":120},{"name":"Jinji Lake promenade","area":"East","why":"Long, flat, breezy and good for cycling at dusk.","mins":90},{"name":"Tianping Mountain","area":"West","why":"Red maples in November; a real if modest walk.","mins":180}],"shopping":[{"name":"Silk shops","area":"Off Shantang and Guanqian","why":"Scarves, quilts, and made-to-measure. Buy where you can see the loom.","mins":60},{"name":"Embroidery workshops","area":"Zhenhu village or in-town institutes","why":"The real thing is expensive and extraordinary; the cheap versions are printed.","mins":60},{"name":"Pingjiang craft shops","area":"Pingjiang","why":"Fans, tea, woodblock prints, some genuinely good.","mins":60},{"name":"Guanqian old brands","area":"Centre","why":"Cake shops and sweet-makers a century or more old.","mins":45}],"nightlife":[{"name":"Kunqu or pingtan performance","area":"Pingjiang","why":"Pingtan storytelling with a lute in a tea house is the local evening, and short sets are easy to sit through.","mins":60},{"name":"Shantang Street after dark","area":"Northwest","why":"Lanterns on the water; touristy but genuinely lovely.","mins":90},{"name":"Jinji Lake light show","area":"SIP","why":"The modern city showing off.","mins":60}]},"essential10":[{"rank":1,"name":"Humble Administrator's Garden at opening","why":"The definitive classical garden. Only pleasant in the first hour.","mins":120,"label":"Essential","popularity":5,"cultural":5,"worth":5},{"rank":2,"name":"Master of the Nets Garden","why":"Smaller and better composed. If you only see one, some would argue for this.","mins":75,"label":"Essential","popularity":4,"cultural":5,"worth":5},{"rank":3,"name":"Suzhou Museum","why":"Pei's building is a lesson in how to be modern and local at once.","mins":90,"label":"Essential","popularity":4,"cultural":5,"worth":5},{"rank":4,"name":"Pingjiang Road early or late","why":"The canal town Suzhou actually is, once the coaches leave.","mins":90,"label":"Essential","popularity":5,"cultural":4,"worth":5},{"rank":5,"name":"A bowl of Suzhou noodles for breakfast","why":"The local ritual, and the broth is genuinely refined.","mins":40,"label":"Essential","popularity":3,"cultural":5,"worth":5},{"rank":6,"name":"Kunqu or pingtan, even briefly","why":"600-year-old opera, and Suzhou is its home.","mins":60,"label":"Recommended","popularity":3,"cultural":5,"worth":4},{"rank":7,"name":"Tiger Hill","why":"Landscape and legend, and a break from courtyards.","mins":120,"label":"Recommended","popularity":4,"cultural":4,"worth":4},{"rank":8,"name":"Silk museum or a working workshop","why":"Explains why this city was rich.","mins":75,"label":"Recommended","popularity":3,"cultural":4,"worth":4},{"rank":9,"name":"Lingering Garden","why":"Excellent, and the third garden is where diminishing returns start.","mins":90,"label":"Optional","popularity":4,"cultural":4,"worth":3},{"rank":10,"name":"Jinji Lake at night","why":"The other Suzhou, if you are curious about what paid for the restoration.","mins":60,"label":"Optional","popularity":3,"cultural":2,"worth":2}],"food":{"identity":"Su cuisine is one of China's classical schools: delicate, seasonal, faintly sweet, built on freshwater fish, shrimp, lotus and river vegetables. It is subtle to the point that visitors expecting bold flavour sometimes find it plain. The city's real everyday genius is its noodles, where the broth, the toppings and the timing are all separately fussed over.","mustTry":[{"dish":"Suzhou noodles (tang mian)","what":"Thin noodles in a clear, long-simmered broth with a topping served alongside.","why":"Breakfast for the whole city, with a vocabulary of orders locals use to specify hardness, broth and oil.","flavour":"Clean, savoury, delicate.","howLocalsEat":"Before 9am. Order the topping separately and add it yourself.","importance":"Essential"},{"dish":"Songshu guiyu (squirrel-shaped mandarin fish)","what":"Fish scored, fried into a pinecone shape and drenched in sweet-and-sour sauce.","why":"The showpiece dish of the Su school.","flavour":"Sweet, sour, crisp.","howLocalsEat":"Shared at a banquet table.","importance":"Recommended"},{"dish":"Biluochun tea","what":"A green tea from the hills by Lake Tai, rolled into tight spirals.","why":"One of China's ten famous teas and grown twenty minutes away.","flavour":"Floral, delicate, faintly fruity.","howLocalsEat":"Brewed weak, in a glass, all day.","importance":"Essential"},{"dish":"Sweet osmanthus everything","what":"Osmanthus flower in cakes, syrups, wine and glutinous rice.","why":"The city's signature scent, especially in autumn.","flavour":"Honeyed, floral.","howLocalsEat":"As a dessert or a drink.","importance":"Recommended"},{"dish":"Hairy crab from Yangcheng Lake","what":"The famous freshwater crab, from the lake just east of the city.","why":"This is the source; Shanghai just eats it.","flavour":"Sweet roe, delicate meat.","howLocalsEat":"October and November, with warm yellow wine.","importance":"Essential in autumn"},{"dish":"Su-style mooncakes and pastries","what":"Flaky, layered pastry with savoury or sweet fillings, unlike the dense Cantonese kind.","why":"A distinct regional pastry tradition still made in old shops.","flavour":"Buttery, layered, mildly sweet.","howLocalsEat":"With tea, any time.","importance":"Recommended"},{"dish":"Freshwater shrimp with biluochun","what":"Tiny river shrimp stir-fried with tea leaves.","why":"The most local dish on any menu here.","flavour":"Sweet, grassy, very light.","howLocalsEat":"As one dish among several.","importance":"Recommended"}]},"mustEat10":[{"dish":"Suzhou noodles","where":"Tongdexing or Zhu Hongxing","order":"Nen ji mian, or the seasonal eel topping","price":"CNY 20-50"},{"dish":"Squirrel mandarin fish","where":"Songhelou","order":"The fish, plus watermelon chicken if in season","price":"CNY 150-300"},{"dish":"Freshwater shrimp with tea","where":"Wumen Renjia","order":"Biluo shrimp, plus lotus root","price":"CNY 100-200"},{"dish":"Hairy crab","where":"A Yangcheng Lake restaurant in season","order":"One each, with yellow wine","price":"CNY 200-500"},{"dish":"Su-style pastries","where":"Huangtianyuan","order":"Osmanthus cake, glutinous rice sweets","price":"CNY 10-30"},{"dish":"Wontons in clear broth","where":"Any old-town noodle shop","order":"Fresh meat wontons","price":"CNY 12-20"},{"dish":"Biluochun tea","where":"A Dongshan or Xishan tea house by Lake Tai","order":"First-flush spring leaf","price":"CNY 50-200"},{"dish":"Braised pork with soy","where":"Deyuelou","order":"Cherry-sauce pork, plus the eel","price":"CNY 120-250"},{"dish":"Sweet plum juice and osmanthus drinks","where":"Street stalls on Pingjiang","order":"Chilled, in summer","price":"CNY 10-20"},{"dish":"Tofu skin and river vegetables","where":"Any local restaurant","order":"Seasonal greens, water shield soup","price":"CNY 30-80"}],"restaurants":{"iconic":[{"name":"Songhelou","cuisine":"Su cuisine","price":"Mid-high","area":"Guanqian","desc":"Claims a Qianlong Emperor connection and has been trading on it since. Touristy but the classics are correct.","dishes":"Squirrel mandarin fish","whyGo":"The canonical Suzhou banquet dish in its canonical setting.","booking":"Recommended"},{"name":"Deyuelou","cuisine":"Su cuisine","price":"Mid","area":"Guanqian","desc":"Another old house, generally better value than Songhelou.","dishes":"Braised eel, sweet-and-sour fish","whyGo":"Classical cooking without the full markup.","booking":"Recommended"},{"name":"Wumen Renjia","cuisine":"Su cuisine","price":"Mid","area":"Pingjiang","desc":"In a restored courtyard house off the canal street.","dishes":"Tea shrimp, lotus root with glutinous rice","whyGo":"The setting and the food both feel like Suzhou.","booking":"Recommended"}],"bestFood":[{"name":"Xin Kai Yuan or a garden-hotel restaurant","cuisine":"Refined Su","price":"High","area":"Various","desc":"Precise, seasonal cooking in courtyard settings.","dishes":"Seasonal set menu","whyGo":"Su cuisine at full attention.","booking":"Essential"},{"name":"Yangcheng Lake crab restaurants","cuisine":"Seasonal crab","price":"High in season","area":"East of the city","desc":"Lakeside houses that do little else in October and November.","dishes":"Steamed hairy crab","whyGo":"At the source, in season.","booking":"Essential in season"}],"bestValue":[{"name":"Tongdexing","cuisine":"Noodles","price":"Low","area":"Old town","desc":"Famous noodle house, queue at breakfast.","dishes":"Aozao noodles, eel topping","whyGo":"The city's best cheap meal.","booking":"No"},{"name":"Zhu Hongxing","cuisine":"Noodles","price":"Low","area":"Several","desc":"Long-established chain, consistent broth.","dishes":"Nen ji mian","whyGo":"Reliable, cheap, everywhere.","booking":"No"},{"name":"Huangtianyuan","cuisine":"Sweets and snacks","price":"Low","area":"Guanqian","desc":"Glutinous rice cakes and osmanthus sweets since 1821.","dishes":"Osmanthus cake","whyGo":"A hundred years of the same recipe.","booking":"No"}],"special":[{"name":"A garden-side private kitchen","cuisine":"Su","price":"High","area":"Pingjiang","desc":"Small courtyard restaurants with set menus and a handful of tables.","dishes":"Seasonal menu","whyGo":"The most atmospheric dinner in the city.","booking":"Essential"}],"casual":[{"name":"Pingjiang Road snack shops","cuisine":"Street food","price":"Low","area":"Pingjiang","desc":"Stinky tofu, sweet soups, grilled things.","dishes":"Whatever smells right","whyGo":"Grazing while you walk the canal.","booking":"No"},{"name":"Shantang Street food stalls","cuisine":"Street food","price":"Low","area":"Shantang","desc":"Busiest in the evening.","dishes":"Snacks and sweets","whyGo":"Lantern-lit and cheap.","booking":"No"}],"cafes":[{"name":"Pingjiang tea houses","cuisine":"Tea and pingtan","price":"Low-mid","area":"Pingjiang","desc":"Tea with a live storyteller and a three-stringed lute in the afternoon.","dishes":"Biluochun","whyGo":"The single most Suzhou hour available.","booking":"No"},{"name":"Dongshan and Xishan tea villages","cuisine":"Tea","price":"Low-mid","area":"Lake Tai","desc":"Growers' houses on the lake where biluochun is picked.","dishes":"Spring leaf","whyGo":"Worth a half day in April.","booking":"No"}]},"experiences":[{"name":"A garden at opening, alone","what":"First entry, before the tour groups, in the Humble Administrator's or the Lingering Garden.","why":"The gardens were designed for solitude and only work that way.","mins":120},{"name":"Pingtan storytelling in a tea house","what":"Two performers, a lute, and a story in Suzhou dialect.","why":"You will not understand a word and it is still lovely.","mins":60},{"name":"Canal boat at dusk","what":"A short rowed or motored trip on the old canals.","why":"The water level is the level the city was designed from.","mins":30},{"name":"Silk or embroidery workshop visit","what":"Watch a loom or a double-sided embroidery being worked.","why":"Both crafts are still alive here, not staged.","mins":60},{"name":"Tea picking or tasting at Lake Tai","what":"A half day in the biluochun villages, best in April.","why":"Seasonal, beautiful, and the tea is transformed by freshness.","mins":240},{"name":"Kunqu at the Master of the Nets Garden","what":"Evening performances staged in the courtyards in season.","why":"Opera in the space it was written for.","mins":90}],"neighbourhoodGuide":[{"name":"Pingjiang historic quarter","vibe":"Canal, willows, white walls, tea houses","bestFor":"Walking, tea, small museums","sights":"Pingjiang Road, Kunqu Museum, Couple's Garden","food":"Noodles, snacks, courtyard restaurants","mins":180},{"name":"North old town","vibe":"Garden district, busiest part of the city","bestFor":"The major gardens and the museum","sights":"Humble Administrator's Garden, Suzhou Museum, Silk Museum","food":"Tourist-facing but decent","mins":240},{"name":"Shantang and Tiger Hill","vibe":"Long canal street leading to a wooded hill","bestFor":"Evening lanterns, boat rides","sights":"Shantang Street, Tiger Hill pagoda","food":"Street snacks","mins":180},{"name":"Guanqian","vibe":"Local commercial centre","bestFor":"Old-brand shops, eating","sights":"Xuanmiao Temple","food":"Songhelou, Deyuelou, Huangtianyuan","mins":120},{"name":"Jinji Lake and SIP","vibe":"Modern, planned, glassy","bestFor":"Evening walk, contrast","sights":"Lakeside promenade, Gate of the East","food":"Malls, international","mins":90}],"timeGuidance":{"three":"You do not need three days. Two is generous: gardens and museum on day one, Pingjiang, Tiger Hill and opera on day two.","fivePlus":"Add Lake Tai and the tea villages, Tongli or Mudu water towns, and a slower pass at two more gardens."},"dayTrips":[{"name":"Tongli","travel":"40 min by car or bus","why":"A quieter, prettier water town than the famous ones, with the Retreat and Reflection Garden.","duration":"Half to full day","suits":"Anyone wanting canals without Zhouzhuang's crowds.","logistics":"Bus or taxi; easy.","verdict":"Worth it"},{"name":"Mudu","travel":"30 min by metro and bus","why":"An old merchant town with several small gardens, on the way to Lake Tai.","duration":"Half day","suits":"Garden completists.","logistics":"Metro line 1 then a short bus.","verdict":"Only if you have extra time"},{"name":"Zhouzhuang","travel":"1 hr","why":"The most famous water town, and the most commercialised.","duration":"Half to full day","suits":"First-timers who want the classic canal photograph.","logistics":"Coach or taxi.","verdict":"Skip unless particularly interested; Tongli is better"},{"name":"Lake Tai, Dongshan and Xishan","travel":"1 hr","why":"Tea villages, orchards, lake views, and the source of biluochun.","duration":"Full day","suits":"Spring visitors.","logistics":"Car is easiest.","verdict":"Worth it in April"},{"name":"Shanghai","travel":"25-30 min by high-speed rail","why":"It works in both directions.","duration":"Full day","suits":"Anyone based in Suzhou.","logistics":"Trains every few minutes.","verdict":"Worth it"}],"practical":{"gettingAround":"The old town is small and flat; walking and bike-share cover most of it. The metro is clean and useful for reaching Tiger Hill, the station and Jinji Lake. Didi works well. The high-speed station is north of the old town, about fifteen minutes by taxi.","whenToGo":"Late March to May for magnolia, tea and mild weather. October and November for hairy crab, osmanthus and clear light. Avoid July and August, which are humid and heavy, and the national holiday weeks when the gardens are genuinely unbearable.","howLong":{"one":"Humble Administrator's Garden at opening, Suzhou Museum, lunch, Pingjiang Road, Master of the Nets in the late afternoon. Full but rewarding.","twoThree":"Add Tiger Hill, Shantang in the evening, a silk workshop and an opera performance. Two days is the right length.","fourFive":"Add Tongli, Lake Tai and a slower pass at the remaining gardens.","week":"Only as a base for the whole Jiangnan region."},"culture":["Book the Humble Administrator's Garden days ahead; it caps entries and sells out.","Passport needed for garden and museum entry.","Gardens open around 7:30am and the first hour is a different experience entirely.","Payment by phone; set up Alipay or WeChat Pay before arriving.","Suzhou dialect is distinct and older residents are proud of it.","Tipping is not expected."]},"whatIdDo":[{"day":"Day 1","plan":"Humble Administrator's Garden at opening, Suzhou Museum next door, noodles for lunch. Afternoon on Pingjiang Road with a tea-house pingtan set. Master of the Nets Garden late, dinner at Wumen Renjia."},{"day":"Day 2","plan":"Tiger Hill in the morning, then Shantang Street and a canal boat. Silk museum or a workshop in the afternoon. Songhelou or Deyuelou for the squirrel fish, then Shantang after dark."}],"quickRef":{"musts":["Humble Administrator's Garden at opening","Master of the Nets Garden","Suzhou Museum","Pingjiang Road early or late","Suzhou noodles for breakfast"],"eats":["Suzhou noodles","Squirrel mandarin fish","Biluochun tea","Hairy crab in autumn","Osmanthus sweets"],"areas":["Pingjiang","North old town","Shantang and Tiger Hill","Guanqian"],"experiences":["A garden alone at opening","Pingtan in a tea house","Canal boat at dusk"],"dayTrip":"Tongli water town, or Lake Tai in spring","stay":"2 days"},"coords":{"Canal boat ride":[31.316,120.632],"Deyuelou":[31.311,120.622],"Dongshan and Xishan tea villages":[31.07,120.428],"Embroidery workshops":[31.315,120.59],"Guanqian":[31.31,120.622],"Guanqian Street":[31.31,120.622],"Guanqian old brands":[31.31,120.622],"Huangtianyuan":[31.311,120.621],"Humble Administrator's Garden":[31.324,120.628],"Jinji Lake":[31.32,120.68],"Jin stern suburbs where the migration history is on the menu.","bestFor":["Harbour and coastline","Beaches and swimming","Coastal walks","Food","Outdoor living","Architecture","Wildlife and bushland","Day trips"],"idealStay":"4-5 days; 6-7 if you want the Blue Mountains unhurried and a full beach day","character":["Coastal","Bright","Outdoorsy","Casual","Expensive"],"dontMiss":["The Opera House and Circular Quay, seen from the water rather than only from the forecourt","A ferry to Manly, ideally late afternoon","The Bondi to Coogee coastal walk","Walking across the Harbour Bridge, or the Pylon Lookout","The Royal Botanic Garden out to Mrs Macquarie's Chair","An inner-west food evening in Newtown or Marrickville","One day in the Blue Mountains"],"neighbourhoods":["Circular Quay and The Rocks","Surry Hills and Darlinghurst","Newtown and Marrickville","Bondi and the eastern beaches","Barangaroo and the CBD","Manly and the northern beaches"]},"history":{"story":"Sydney's harbour was home to the Gadigal and other clans of the Eora Nation for tens of thousands of years before 1788, when the First Fleet established a British penal colony at Sydney Cove. The convict city became a free one through the 1840s and 50s, boomed on gold and wool, and spread along tram and rail lines into the suburbs that still define it. Postwar migration - Italian and Greek, then Lebanese, Vietnamese, Chinese, Korean and more - rebuilt the city's food and culture, and the Opera House in 1973 gave it the image it has traded on ever since.","origins":"Sydney Cove was chosen for fresh water and a deep, sheltered anchorage: the Tank Stream fed the settlement and the harbour let ships come right into the town. That geography still shapes the city - the water fragments it into peninsulas and bays, which is why ferries are transport and why the suburbs feel like separate villages.","periods":[{"name":"Before 1788","text":"Gadigal and neighbouring Eora clans lived around the harbour; rock engravings and middens survive in the headland parks and are the oldest visible layer of the city."},{"name":"Penal colony, 1788-1840s","text":"Convict labour built the sandstone town. The Rocks and Hyde Park Barracks are the clearest surviving pieces of it."},{"name":"Gold and expansion, 1850s-1900","text":"Wealth from gold and wool produced the Victorian terraces, arcades and public buildings of the inner city."},{"name":"Federation to the Bridge, 1901-1932","text":"Sydney becomes a national city; the Harbour Bridge opens in 1932 and finally ties the north shore to the centre."},{"name":"Postwar migration","text":"European, then Middle Eastern and Asian migration reshapes the suburbs, the food and the accent of the city."},{"name":"Opera House to now, 1973-","text":"Utzon's building gives Sydney a global image; later decades bring the 2000 Olympics, the Barangaroo waterfront and a metro line under the harbour."}],"whyItMatters":"Sydney wears its history lightly and unevenly. Twenty minutes of walking takes you from Aboriginal engravings on a headland to convict sandstone, Victorian terraces, an Art Deco bridge and a waterfront built in the last decade. The city is young enough that all of it is still legible.","visible":["Aboriginal Sydney: rock engravings and middens in Ku-ring-gai Chase, North Head and the coastal headlands","Convict Sydney: The Rocks, Hyde Park Barracks, Cadmans Cottage","Victorian Sydney: Queen Victoria Building, the Strand Arcade, Paddington terraces","Interwar Sydney: the Harbour Bridge, Art Deco apartment blocks in Potts Point","Modern Sydney: the Opera House, Barangaroo, the metro line under the harbour"]},"thingsToDo":{"historic":[{"name":"Sydney Opera House","area":"Bennelong Point","why":"Take the interior tour or, better, book any performance at all - the building only makes sense from inside during a show.","mins":90},{"name":"Sydney Harbour Bridge","area":"The Rocks / Milsons Point","why":"Walk the pedestrian path across for free, climb the Pylon Lookout for the view, or do BridgeClimb if the money is worth the story.","mins":90},{"name":"The Rocks","area":"The Rocks","why":"The oldest part of the colonial city; go for the sandstone lanes and pub history rather than the souvenir shops.","mins":120},{"name":"Hyde Park Barracks","area":"CBD","why":"A World Heritage convict site with an excellent, unsentimental museum about who was sent here and why.","mins":90},{"name":"Queen Victoria Building","area":"CBD","why":"A grand Victorian shopping arcade worth ten minutes even if you buy nothing.","mins":45},{"name":"Cockatoo Island","area":"Sydney Harbour","why":"Convict prison, then shipyard, reached by ferry; an unusually raw piece of harbour history.","mins":180}],"arts":[{"name":"Art Gallery of New South Wales","area":"The Domain","why":"Strong Australian and Aboriginal collections, and the newer Naala Badu building is a good piece of architecture in its own right. Free entry to the main collection.","mins":120},{"name":"Museum of Contemporary Art","area":"Circular Quay","why":"Contemporary Australian work with a rooftop that looks straight at the Opera House.","mins":90},{"name":"Australian Museum","area":"CBD","why":"Natural history plus a serious First Nations collection; the best single stop for understanding the continent.","mins":120},{"name":"White Rabbit Gallery","area":"Chippendale","why":"Contemporary Chinese art, free, and consistently more interesting than its size suggests.","mins":90},{"name":"Chau Chak Wing Museum","area":"Camperdown","why":"The university's museum: antiquities, natural history and art in one well-designed building.","mins":90},{"name":"Carriageworks","area":"Eveleigh","why":"Performance and installation in a converted rail workshop; check what is on before making the trip.","mins":90}],"neighbourhoods":[{"name":"Surry Hills and Darlinghurst","character":"Terraces, small bars, restaurants, design shops","highlights":"Crown Street, Bourke Street, the small-bar circuit","food":"Some of the city's best restaurants and cafes","bestTime":"Late afternoon into evening","mins":240},{"name":"Newtown and Marrickville","character":"Inner-west, scruffy, live music, migrant food","highlights":"King Street, Enmore Road, breweries and record shops","food":"Vietnamese, Greek, Thai, Portuguese tarts, brewpubs","bestTime":"Afternoon into night","mins":240},{"name":"The Rocks and Circular Quay","character":"Sandstone lanes, ferries, tourists, harbour","highlights":"Opera House, MCA, weekend markets, historic pubs","food":"Harbourside dining, pub lunches","bestTime":"Morning, or evening for the lights","mins":180},{"name":"Bondi and Bronte","character":"Beach suburb, gym-and-coffee, open sky","highlights":"Bondi Beach, Icebergs, the coastal walk","food":"Cafes, casual seafood, brunch","bestTime":"Early morning or late afternoon","mins":240},{"name":"Potts Point and Woolloomooloo","character":"Art Deco apartments, plane trees, wharf","highlights":"Macleay Street, Finger Wharf, Harry's Cafe de Wheels","food":"Italian, wine bars, long breakfasts","bestTime":"Morning or evening","mins":150},{"name":"Barangaroo and Walsh Bay","character":"New waterfront, headland park, harbour walk","highlights":"Barangaroo Reserve, the harbour foreshore walk to Circular Quay","food":"Waterfront restaurants and bars","bestTime":"Late afternoon","mins":120}],"nature":[{"name":"Bondi to Coogee coastal walk","area":"Eastern beaches","why":"Six kilometres of cliff path past four beaches and an ocean pool at each end. Do it early, and swim at the far end.","mins":180},{"name":"Royal Botanic Garden and Mrs Macquarie's Chair","area":"The Domain","why":"Free, on the harbour, and the walk out to the point gives the classic Bridge-and-Opera-House view together.","mins":90},{"name":"Taronga Zoo","area":"Mosman","why":"Worth it mostly for Australian species and the ferry ride there; the harbour view from the giraffe enclosure is the running joke.","mins":240},{"name":"North Head and Manly","area":"Manly","why":"Ferry over, walk the Manly to Spit track or out to North Head for the harbour mouth and whale season views.","mins":240},{"name":"Royal National Park","area":"Sutherland Shire","why":"The world's second-oldest national park: coastal heath, cliff walks and Wattamolla. A full day.","mins":480},{"name":"Watsons Bay and South Head","area":"Eastern suburbs","why":"Ferry, cliff walk at The Gap, fish and chips and a beer garden; one of the easiest half-days in the city.","mins":180}],"shopping":[{"name":"Queen Victoria Building and the Strand Arcade","area":"CBD","why":"Victorian arcades with Australian designers upstairs.","mins":90},{"name":"Paddington and Oxford Street","area":"Paddington","why":"Australian fashion, galleries and the Saturday Paddington Markets.","mins":150},{"name":"King Street, Newtown","area":"Newtown","why":"Vintage, records, books and a dense run of cheap food.","mins":120},{"name":"Carriageworks Farmers Market","area":"Eveleigh","why":"Saturday mornings; the best single place to eat and buy produce in one go.","mins":120},{"name":"Sydney Fish Market","area":"Pyrmont","why":"Go early, eat oysters and prawns on the spot rather than treating it as a sightseeing stop.","mins":90},{"name":"Bondi Markets","area":"Bondi","why":"Sunday, in the school grounds above the beach; vintage and small designers.","mins":90}],"nightlife":[{"name":"Surry Hills small bars","area":"Surry Hills","why":"The heart of Sydney's small-bar culture; a few streets will fill an evening.","mins":180},{"name":"CBD laneway bars","area":"CBD","why":"Basement and upstairs bars hidden around Clarence, York and Barrack streets.","mins":150},{"name":"Newtown and Enmore","area":"Inner west","why":"Live music, pubs and late cheap food; the Enmore Theatre is the city's best mid-size venue.","mins":180},{"name":"Opera Bar and Circular Quay","area":"Circular Quay","why":"Touristy and worth it once, at sunset, standing up, with the Bridge in front of you.","mins":90},{"name":"Darlinghurst and Oxford Street","area":"Darlinghurst","why":"The historic heart of Sydney's queer nightlife and still its liveliest strip.","mins":180},{"name":"Manly and the beaches","area":"Manly","why":"Beachside pubs and a last ferry back across a dark harbour.","mins":150}]},"essential10":[{"rank":1,"name":"Opera House and Circular Quay from the water","why":"Take any ferry out and back rather than only photographing the building from the forecourt. The harbour is the city's best single experience and it costs the price of a fare.","mins":120,"label":"Essential","popularity":5,"cultural":5,"worth":5},{"rank":2,"name":"Ferry to Manly","why":"Thirty minutes across the open harbour, past the heads, for the cost of a bus ride. Go late afternoon and eat there.","mins":180,"label":"Essential","popularity":5,"cultural":4,"worth":5},{"rank":3,"name":"Bondi to Coogee coastal walk","why":"Cliffs, four beaches and two ocean pools. The clearest demonstration of why people live here.","mins":180,"label":"Essential","popularity":5,"cultural":3,"worth":5},{"rank":4,"name":"Walk across the Harbour Bridge","why":"Free, twenty minutes, and the deck view is the one the postcards use. The Pylon Lookout adds height cheaply.","mins":90,"label":"Essential","popularity":5,"cultural":5,"worth":5},{"rank":5,"name":"Blue Mountains day trip","why":"Sandstone escarpment, eucalypt haze and proper bushwalking ninety minutes from the city.","mins":480,"label":"Essential","popularity":5,"cultural":4,"worth":5},{"rank":6,"name":"Royal Botanic Garden to Mrs Macquarie's Chair","why":"The walk that gives you the Bridge and the Opera House in one frame, free and rarely crowded at either end of the day.","mins":90,"label":"Recommended","popularity":4,"cultural":3,"worth":5},{"rank":7,"name":"Art Gallery of New South Wales","why":"The best place to take Australian and Aboriginal art seriously, and the entry to the permanent collection is free.","mins":120,"label":"Recommended","popularity":4,"cultural":5,"worth":4},{"rank":8,"name":"Inner-west food evening","why":"Newtown and Marrickville are where the city's migration history is easiest to eat your way through.","mins":180,"label":"Recommended","popularity":3,"cultural":4,"worth":5},{"rank":9,"name":"The Rocks and Hyde Park Barracks","why":"Convict Sydney in one compact walk, with a museum that treats it honestly.","mins":150,"label":"Recommended","popularity":4,"cultural":5,"worth":4},{"rank":10,"name":"Watsons Bay and South Head","why":"Ferry, cliff walk, fish and chips, beer garden. The most efficient good afternoon in Sydney.","mins":180,"label":"Recommended","popularity":3,"cultural":3,"worth":4}],"food":{"identity":"There is no single Sydney dish, and chasing one wastes the trip. What the city has is superb seafood, a Modern Australian style built on wood fire and restraint, and suburbs whose Cantonese, Vietnamese, Lebanese, Korean, Thai and Greek cooking is as good as the fine dining and a tenth of the price. Coffee and breakfast are taken seriously to a degree visitors find surprising: brunch is a real meal here, not a novelty. Eat one harbourside splurge, one wood-fired dinner, and several cheap meals in the inner west or the south-west, and you will have understood the place.","mustTry":[{"dish":"Sydney rock oysters","what":"A small, briny native oyster grown along the NSW estuaries, best eaten unadorned.","why":"The single most local thing on any Sydney menu.","flavour":"Sweet, mineral, less creamy than a Pacific oyster.","howLocalsEat":"A dozen natural with lemon, before anything else.","importance":"Essential"},{"dish":"Australian seafood on the grill","what":"Kingfish, snapper, barramundi or Moreton Bay bugs, usually cooked simply.","why":"The cooking is deliberately plain because the fish is the point.","flavour":"Clean and firm; charred edges from wood or grill.","importance":"Essential"},{"dish":"Flat white and a proper brunch","what":"Espresso and steamed milk, with eggs, ricotta hotcakes or avocado toast alongside.","why":"Sydney and Melbourne exported this format to the world.","flavour":"Short, strong, and never served with cream.","howLocalsEat":"Mid-morning, sitting down, with the newspaper.","importance":"Essential"},{"dish":"Banh mi","what":"Vietnamese pork roll from a suburban bakery, usually under fifteen dollars.","why":"Marrickville, Cabramatta and Bankstown have some of the best outside Vietnam.","flavour":"Crackling crust, pate, pickle, chilli, coriander.","importance":"Essential"},{"dish":"Yum cha","what":"Cantonese trolley or menu dim sum, usually a weekend lunch.","why":"Sydney's Cantonese community is old and its yum cha is a genuine institution.","flavour":"Steamed, fried and sweet, in a very loud room.","howLocalsEat":"Late morning, with family, ordering too much.","importance":"Recommended"},{"dish":"Lebanese food","what":"Charcoal chicken, mixed grills, manoush and sweets from the south-west.","why":"Lakemba and Punchbowl are central to how Sydney actually eats.","flavour":"Garlicky, smoky, generous.","importance":"Recommended"},{"dish":"Meat pie","what":"A hand-sized pie, sometimes topped with mash and peas.","why":"The classic Australian cheap eat; Harry's Cafe de Wheels is the pilgrimage version.","flavour":"Rich, salty, best late at night.","importance":"Recommended"},{"dish":"Thai food in Thai Town","what":"Regional Thai cooking in the blocks around Campbell and Pitt streets.","why":"Sydney's Thai scene is deep and mostly cheap.","flavour":"Sharper and hotter than the export version.","importance":"Recommended"},{"dish":"Gelato and summer desserts","what":"Messina and its many competitors, plus pavlova and lamingtons in their traditional form.","why":"Dessert is a genuine evening activity in a hot city.","flavour":"Cold, sweet, occasionally ridiculous.","importance":"Optional"},{"dish":"Australian wine by the glass","what":"Hunter Valley semillon, cool-climate shiraz and orange-wine oddities in the small bars.","why":"The by-the-glass lists are strong and the mark-ups are gentler than in the restaurants.","importance":"Recommended"}]},"mustEat10":[{"dish":"Sydney rock oysters","where":"Sydney Fish Market, Pyrmont","order":"A dozen natural, shucked to order","price":"AUD 30-45"},{"dish":"Harbourside seafood","where":"Doyles or a Watsons Bay kiosk","order":"Grilled fish or fish and chips, outside","price":"AUD 25-45"},{"dish":"Modern Australian tasting menu","where":"Quay","order":"The set menu, at a window table","price":"AUD 275-400 pp"},{"dish":"Wood-fired everything","where":"Firedoor, Surry Hills","order":"Whatever is on the fire that night","price":"AUD 150-220 pp"},{"dish":"Banh mi","where":"Marrickville pork roll shops","order":"Pork roll with pate and extra chilli","price":"AUD 8-14"},{"dish":"Yum cha","where":"Mr. Wong, CBD","order":"Dumplings, char siu and roast duck","price":"AUD 40-70 pp"},{"dish":"Thai","where":"Chat Thai, Thai Town","order":"Boat noodles, curry and a Thai iced tea","price":"AUD 25-45 pp"},{"dish":"Meat pie","where":"Harry's Cafe de Wheels, Woolloomooloo","order":"The Tiger, with mash, peas and gravy","price":"AUD 10-16"},{"dish":"Coffee and brunch","where":"Single O or Bourke Street Bakery","order":"Flat white plus whatever the pastry case is proudest of","price":"AUD 15-30"},{"dish":"Gelato","where":"Gelato Messina","order":"Two scoops of the seasonal specials","price":"AUD 8-14"}],"restaurants":{"iconic":[{"name":"Quay","cuisine":"Modern Australian","price":"High","area":"The Rocks","desc":"The harbour-view fine-dining room, looking straight at the Opera House and the Bridge.","dishes":"The set menu; the snow egg if it is on","whyGo":"The one Sydney restaurant where the view and the cooking are both worth the money.","booking":"Book weeks ahead, and ask for a window"},{"name":"Bennelong","cuisine":"Modern Australian","price":"High","area":"Sydney Opera House","desc":"Inside the Opera House sails, under the ribs of the building itself.","dishes":"Seafood entrees, the pavlova","whyGo":"Eating inside the building is a different experience from touring it.","booking":"Book well ahead; pre-theatre sittings are easier"},{"name":"Icebergs Dining Room and Bar","cuisine":"Italian / seafood","price":"High","area":"Bondi","desc":"Above the Bondi Icebergs pool, with the whole beach in the window.","dishes":"Crudo, pasta, whole fish","whyGo":"The definitive Sydney beach lunch.","booking":"Book, especially for weekend lunch"}],"bestFood":[{"name":"Firedoor","cuisine":"Wood fire","price":"High","area":"Surry Hills","desc":"No gas, no electricity in the kitchen: everything cooked over wood.","dishes":"Whatever the daily menu says; the aged fish","whyGo":"The most distinctive serious cooking in the city.","booking":"Essential"},{"name":"Saint Peter","cuisine":"Seafood","price":"High","area":"Paddington","desc":"Whole-fish butchery taken as seriously as a butcher takes beef.","dishes":"The fish of the day, cooked whatever way they recommend","whyGo":"It changed how Australia thinks about cooking fish.","booking":"Book ahead"},{"name":"Ester","cuisine":"Modern Australian","price":"Mid-high","area":"Chippendale","desc":"Wood oven, small plates, a room that has stayed good for a decade.","dishes":"Blood sausage, wood-fired bread, whatever the vegetable dish is","whyGo":"The best value at the serious end of the city's cooking.","booking":"Book ahead"}],"bestValue":[{"name":"Chat Thai","cuisine":"Thai","price":"Low","area":"Thai Town and branches","desc":"Loud, fast, open late, and consistently good across every branch.","dishes":"Boat noodles, khanom jeeb, Thai iced tea","whyGo":"The default cheap dinner in the middle of the city.","booking":"No; queue and wait"},{"name":"Marrickville pork roll shops","cuisine":"Vietnamese","price":"Low","area":"Marrickville","desc":"Bakery counters selling banh mi to a queue of locals.","dishes":"Pork roll with pate and chilli","whyGo":"Ten dollars for one of the best things you will eat here.","booking":"No"},{"name":"Mamak","cuisine":"Malaysian","price":"Low","area":"Haymarket","desc":"Roti thrown at the window, curries, satay, permanent queue.","dishes":"Roti canai, satay, nasi lemak","whyGo":"Cheap, fast and reliably excellent before or after a show.","booking":"No"}],"special":[{"name":"Aria","cuisine":"Modern Australian","price":"High","area":"Circular Quay","desc":"Polished harbour-front fine dining beside the Opera House.","dishes":"Tasting menu","whyGo":"The safest choice for a celebratory night with a view.","booking":"Book well ahead"},{"name":"Yoshii's Omakase","cuisine":"Japanese","price":"High","area":"Barangaroo","desc":"Counter omakase using Australian seafood.","dishes":"The omakase","whyGo":"Shows what Sydney's fish can do in Japanese hands.","booking":"Essential, limited seats"}],"casual":[{"name":"Harry's Cafe de Wheels","cuisine":"Pies","price":"Low","area":"Woolloomooloo","desc":"A pie caravan on the wharf that has been there since 1938.","dishes":"The Tiger pie","whyGo":"Late-night Sydney in one paper tray.","booking":"No"},{"name":"Bourke Street Bakery","cuisine":"Bakery","price":"Low","area":"Surry Hills and branches","desc":"Sausage rolls, tarts and sourdough from a corner shop with a permanent line.","dishes":"Sausage roll, ginger brulee tart","whyGo":"The best cheap breakfast in the inner city.","booking":"No"},{"name":"Sydney Fish Market","cuisine":"Seafood","price":"Low-mid","area":"Pyrmont","desc":"Buy oysters, prawns and sashimi from the counters and eat them outside.","dishes":"Oysters, prawns, a tray of sashimi","whyGo":"Excellent seafood without a restaurant bill.","booking":"No; go early"}],"cafes":[{"name":"Single O","cuisine":"Coffee","price":"Low","area":"Surry Hills","desc":"One of the roasters that built Sydney's specialty coffee scene.","dishes":"Flat white, batch brew","whyGo":"A quick, correct introduction to Australian coffee.","booking":"No"},{"name":"Reuben Hills","cuisine":"Coffee and brunch","price":"Mid","area":"Surry Hills","desc":"Warehouse cafe with Latin-leaning food and its own roastery.","dishes":"Coffee, baleadas, fried chicken","whyGo":"The full Sydney brunch experience without the Bondi queue.","booking":"No"},{"name":"Gelato Messina","cuisine":"Gelato","price":"Low","area":"Darlinghurst and branches","desc":"The city's gelato institution, with weekly specials.","dishes":"Two scoops of the specials board","whyGo":"An evening walk here is a genuine local habit.","booking":"No"}]},"experiences":[{"name":"Swim at an ocean pool","what":"Bondi Icebergs, Bronte or Wylie's Baths: seawater pools cut into the rocks.","why":"The most Sydney thing there is, and it costs almost nothing.","mins":90},{"name":"Take a ferry with no destination","what":"Ride to Manly, Watsons Bay or Cockatoo Island and come back.","why":"The harbour is the city; the ferry is how you read it.","mins":120},{"name":"Aboriginal-guided harbour walk","what":"A First Nations guide through the Royal Botanic Garden or the harbour headlands.","why":"It reframes everything you have been looking at for the rest of the trip.","mins":120},{"name":"Surf lesson","what":"A group lesson at Bondi, Manly or Maroubra.","why":"Two hours to understand why the coastline runs this city's weekends.","mins":120},{"name":"Sydney Fish Market early","what":"Arrive before the crowd, buy from the counters and eat outside.","why":"The best-value seafood in the city and a working market rather than a display.","mins":90},{"name":"A performance at the Opera House","what":"Opera, theatre, orchestra or a gig in the Concert Hall or Studio.","why":"The building was built for this, and tickets are often cheaper than the tour.","mins":150},{"name":"Saturday at Carriageworks Farmers Market","what":"Producers, coffee and breakfast under a rail workshop roof.","why":"The most enjoyable hour of food in the inner city.","mins":120},{"name":"Bushwalk in the Blue Mountains","what":"Walk down into the valley at Katoomba or Blackheath rather than only looking from the lookout.","why":"The escarpment is only impressive from below.","mins":300},{"name":"Coastal walk at dawn","what":"Bondi to Coogee or the Spit to Manly track before the day heats up.","why":"Empty paths, cool air, and swimming afterwards.","mins":180},{"name":"An evening in the inner west","what":"Eat in Marrickville or Newtown, then see a band at the Enmore or a pub.","why":"The half of Sydney that has nothing to do with the harbour.","mins":240}],"neighbourhoodGuide":[{"name":"Circular Quay and The Rocks","vibe":"Sandstone, ferries, the postcard","bestFor":"First day, harbour landmarks, museums","sights":"Opera House, Harbour Bridge, MCA, historic pubs","food":"Harbourside dining and old pubs","mins":240},{"name":"Surry Hills and Darlinghurst","vibe":"Terraces, small bars, design","bestFor":"Eating and drinking, evening wandering","sights":"Crown Street, Brett Whiteley Studio, small galleries","food":"The city's densest run of good restaurants","mins":240},{"name":"Newtown and Marrickville","vibe":"Inner-west, scruffy, musical","bestFor":"Cheap food, live music, vintage","sights":"King Street, Enmore Theatre, breweries","food":"Vietnamese, Greek, Thai, Portuguese","mins":240},{"name":"Bondi and the eastern beaches","vibe":"Beach, sun, activewear","bestFor":"Swimming, the coastal walk, brunch","sights":"Bondi Beach, Icebergs, Bronte, Coogee","food":"Cafes, seafood, casual Italian","mins":300},{"name":"Barangaroo and the CBD","vibe":"New waterfront against an old grid","bestFor":"Harbour walking, shopping, dinner","sights":"Barangaroo Reserve, QVB, Hyde Park Barracks","food":"Waterfront restaurants, laneway bars","mins":180},{"name":"Manly and the northern beaches","vibe":"Relaxed, salty, ferry-connected","bestFor":"A half-day of beach and headland","sights":"Manly Beach, North Head, Shelly Beach","food":"Beachfront casual and good coffee","mins":300},{"name":"Potts Point and Woolloomooloo","vibe":"Art Deco, plane trees, wharf","bestFor":"Breakfast, wine bars, a short walk to the gardens","sights":"Macleay Street, Finger Wharf, Harry's","food":"Italian, wine bars, cafes","mins":150},{"name":"Chippendale and Redfern","vibe":"Post-industrial, student, artistic","bestFor":"Galleries, small restaurants, markets","sights":"White Rabbit Gallery, Carriageworks, Spice Alley","food":"Ester, cheap Asian, third-wave coffee","mins":180}],"timeGuidance":{"three":"Day 1 the harbour: Circular Quay, the Bridge walk, the Botanic Garden and a ferry. Day 2 the coast: Bondi to Coogee, a swim, and dinner in Surry Hills. Day 3 the Blue Mountains, or the inner west plus a museum if you would rather stay in town.","fivePlus":"Add Manly and North Head, the Art Gallery of NSW, Watsons Bay, a market morning at Carriageworks, an evening in Newtown or Marrickville, and either the Royal National Park or a second mountains day."},"dayTrips":[{"name":"Blue Mountains","travel":"About 2 hr by train to Katoomba","why":"Sandstone cliffs, waterfalls and eucalypt forest, with walks from easy to demanding.","duration":"Full day","suits":"Everyone; the lookouts are step-free and the valley walks are not.","logistics":"Train from Central to Katoomba or Blackheath; buses and walking tracks from there. Go early, and check the weather - fog closes the views.","verdict":"Worth it"},{"name":"Royal National Park","travel":"About 1 hr by train to Otford or Cronulla","why":"Coastal heath, cliff-top walking and swimming holes in the world's second-oldest national park.","duration":"Full day","suits":"Walkers; the coast track is 26 km but sections are easy.","logistics":"Train plus the Cronulla ferry to Bundeena for the coast track.","verdict":"Worth it"},{"name":"Ku-ring-gai Chase National Park","travel":"About 1 hr","why":"Aboriginal rock engravings, Hawkesbury views and quiet bush close to the city.","duration":"Half or full day","suits":"Anyone interested in Aboriginal Sydney.","logistics":"Easiest with a car; some access by bus and ferry.","verdict":"Worth it"},{"name":"Hunter Valley","travel":"About 2-2.5 hr","why":"Australia's oldest wine region, known for semillon and shiraz.","duration":"Full day or overnight","suits":"Wine drinkers with a designated driver or a tour booking.","logistics":"Needs a car or an organised tour; not practical by public transport.","verdict":"Only if you have extra time"},{"name":"Wollongong and the Sea Cliff Bridge","travel":"About 1.5 hr","why":"The coast road south, a bridge that hangs off the cliff, and beaches without crowds.","duration":"Full day","suits":"Drivers and anyone wanting the coastline without the tourists.","logistics":"Best by car; the train is scenic but misses the bridge.","verdict":"Only if you have extra time"},{"name":"Palm Beach and the northern beaches","travel":"About 1.5 hr","why":"A long chain of beaches ending at a lighthouse headland.","duration":"Half or full day","suits":"Beach days and a slower pace.","logistics":"Bus from the city, or ferry and bus combinations from Manly.","verdict":"Only if you have extra time"}],"practical":{"gettingAround":"Tap on and off with a contactless credit or debit card, a linked phone or watch, or an Opal card - the fare is the same and visitors rarely need a physical card. Daily and weekly caps apply, and Sundays are capped low enough that a full day of ferries costs very little. Trains and the metro cover the centre and the airport (note the separate station access fee at the airport stations, which makes a taxi competitive for two or more people). Ferries are both transport and the best sightseeing in the city, so use them as routes rather than tours. Buses fill the gaps to the eastern beaches, and light rail runs from Circular Quay through the CBD to the inner east and south. The inner suburbs are walkable and hilly; distances on the map are shorter than they feel in summer heat.","whenToGo":"Seasons are inverted: summer is December to February - hot, humid, beach weather, but crowded and expensive around Christmas and New Year. Autumn, March to May, is the sweet spot: warm water, mild days and thinner crowds. Winter, June to August, is mild by most standards, with clear light, whale migration off the heads and Vivid Sydney lighting the city in late May and June. Spring, September to November, brings jacarandas, good walking weather and the start of beach season.","howLong":{"one":"Circular Quay, walk the Bridge, the Botanic Garden, a ferry, and dinner in Surry Hills.","twoThree":"Add the Bondi to Coogee walk, a museum and either the inner west or Manly. This is the honest minimum.","fourFive":"The right length: the harbour, the coast, the Blue Mountains and time to eat properly.","week":"Add the Royal National Park, the northern beaches, a second mountains day and the suburbs where the food is."},"culture":["The UV is genuinely extreme. Hat, sunscreen and shade between 10am and 3pm, even on cloudy days.","Swim between the red and yellow flags; rips are the real danger at ocean beaches, not sharks.","Tipping is not expected. Rounding up or ten per cent for very good service is generous, not standard.","Dress is casual almost everywhere, including expensive restaurants.","Alcohol is sold in bottle shops, not supermarkets, and many small bars close earlier than visitors expect.","Traffic drives on the left; look right first when crossing.","Order coffee by style - flat white, long black, piccolo - rather than by size."]},"whatIdDo":[{"day":"Day 1","plan":"Walk across the Harbour Bridge from Milsons Point, down into The Rocks, through Circular Quay and the Royal Botanic Garden to Mrs Macquarie's Chair. Late-afternoon ferry to Watsons Bay, fish and chips, ferry back at dusk. Dinner in Surry Hills."},{"day":"Day 2","plan":"Bondi early, swim at Icebergs, then walk the coast path to Coogee and swim again. Bus back, afternoon at the Art Gallery of NSW. Evening drinks in Darlinghurst."},{"day":"Day 3","plan":"Train to Katoomba. Walk down into the valley rather than only looking at it from the lookouts. Back by early evening; something easy and cheap in Newtown."},{"day":"Day 4","plan":"Sydney Fish Market or the Carriageworks market for breakfast, White Rabbit Gallery, then the ferry to Manly, North Head and a swim at Shelly Beach. Dinner in Manly and the last ferry home."},{"day":"Day 5","plan":"Slow morning in Potts Point, Hyde Park Barracks or the Australian Museum, an afternoon in Marrickville eating, and one splurge dinner at Quay or Firedoor to finish."}],"quickRef":{"musts":["The harbour by ferry","Opera House and Circular Quay","Bondi to Coogee walk","Walking the Harbour Bridge","A day in the Blue Mountains"],"eats":["Sydney rock oysters","Grilled Australian fish","Banh mi in Marrickville","Flat white and brunch","One wood-fired dinner"],"areas":["Circular Quay and The Rocks","Surry Hills","Newtown and Marrickville","Bondi","Manly"],"experiences":["Swimming at an ocean pool","A ferry at sunset","An Aboriginal-guided harbour walk"],"dayTrip":"The Blue Mountains, or the Royal National Park coast track if you would rather walk by the sea","stay":"4-5 days"},"coords":{"Sydney Opera House":[-33.8568,151.2153],"Opera House and Circular Quay from the water":[-33.86,151.211],"A performance at the Opera House":[-33.8568,151.2153],"Sydney Harbour Bridge":[-33.8523,151.2108],"Walk across the Harbour Bridge":[-33.8523,151.2108],"The Rocks":[-33.8599,151.209],"Circular Quay and The Rocks":[-33.861,151.21],"The Rocks and Hyde Park Barracks":[-33.8629,151.2124],"Hyde Park Barracks":[-33.8688,151.2124],"Queen Victoria Building":[-33.8717,151.2067],"Queen Victoria Building and the Strand Arcade":[-33.871,151.2069],"Cockatoo Island":[-33.8465,151.172],"Art Gallery of New South Wales":[-33.8688,151.217],"Museum of Contemporary Art":[-33.8599,151.2089],"Australian Museum":[-33.8746,151.213],"White Rabbit Gallery":[-33.8853,151.199],"Chau Chak Wing Museum":[-33.888,151.189],"Carriageworks":[-33.8965,151.186],"Carriageworks Farmers Market":[-33.8965,151.186],"Surr throne. It spent centuries as Beijing's port and grain depot, and then in 1860 it was forced open to foreign trade and carved into concessions. What makes it unusual is how many: British, French, German, Japanese, Russian, Italian, Austro-Hungarian, Belgian and American, each building in its own national style within walking distance of the others.","origins":"A garrison and canal town where the Grand Canal met the Hai River, feeding Beijing.","periods":[{"name":"Ming and Qing","text":"Walled garrison, salt trade and grain transhipment. Wealthy merchants, no prestige."},{"name":"Concessions, 1860-1945","text":"Nine foreign settlements, each with its own architecture, police and rules. The city became a refuge for deposed politicians and the last emperor, and an experiment in every European building style at once."},{"name":"Republican era","text":"Banking, industry, and a famously sharp popular culture: crosstalk, storytelling, opera and street food."},{"name":"People's Republic","text":"Heavy industry and port work. The 1976 Tangshan earthquake did severe damage."},{"name":"Since 2000","text":"The Binhai new area, a high-speed rail link to Beijing in half an hour, and a restoration programme that cleaned up the concession districts for tourism."}],"modern":"Tianjin is a large port and industrial city that has struggled economically relative to its neighbours, and it wears that lightly. The restored districts are genuinely handsome; the rest is ordinary working China. The comedy tradition is alive and the food culture is taken very seriously.","whyItMatters":"Walking the Five Great Avenues you can read the whole nineteenth-century carve-up of China in domestic architecture: mock-Tudor next to Beaux-Arts next to Spanish revival, all built for Chinese and foreign elites who wanted out of imperial politics.","visible":["The Five Great Avenues hold over 2,000 pre-war villas in a dozen national styles.","The Italian Concession is the only surviving Italian settlement in g on painting.","mins":120,"label":"Optional","popularity":2,"cultural":4,"worth":3},{"rank":9,"name":"Tianjin Eye","why":"Novel, brief, best at night.","mins":45,"label":"Optional","popularity":4,"cultural":2,"worth":3},{"rank":10,"name":"Binhai Library","why":"Photogenic, forty minutes out, and half the books are painted on. Know that going in.","mins":60,"label":"Optional","popularity":4,"cultural":2,"worth":2}],"food":{"identity":"Tianjin food is northern port food: wheat, sesame, fried dough and a great deal of humour about it. The city takes its snacks more seriously than its restaurants, and the three famous ones are treated as civic institutions. There is also excellent seafood, being on the Bohai gulf, and a strong Hui Muslim tradition.","mustTry":[{"dish":"Goubuli baozi","what":"Pleated steamed pork buns with an eighteen-fold crimp, from an 1858 shop.","why":"The most famous baozi in China, though locals will tell you the fame outran the quality decades ago.","flavour":"Juicy, savoury, mild.","howLocalsEat":"For breakfast, and often at a neighbourhood shop rather than the famous one.","importance":"Essential as a rite, Recommended as a meal"},{"dish":"Jianbing guozi","what":"The Tianjin original: a mung bean crepe with egg, folded round a crisp fried dough stick, with fermented bean sauce and chilli.","why":"This is the source of the dish Beijing sells. The local version uses guozi, a length of fried dough, not a cracker.","flavour":"Savoury, crunchy, eggy.","howLocalsEat":"From a cart, before nine, standing up.","importance":"Essential"},{"dish":"Shibajie mahua","what":"A large, hard, deep-fried dough twist studded with sugar, sesame and nuts.","why":"One of the three famous snacks and the classic gift to take home.","flavour":"Sweet, crunchy, very rich.","howLocalsEat":"Broken up and shared with tea.","importance":"Recommended"},{"dish":"Erduoyan zhagao","what":"Fried glutinous rice cakes with red bean paste.","why":"The third of the famous three, from a ee":"Add a crosstalk show, the museum, Shenyang Dao market and a proper breakfast crawl. Two days is generous.","fourFive":"Only with Huangyaguan and Panshan added.","week":"Not warranted."},"culture":["Passport needed for rail and hotels.","Payment by phone; set up Alipay or WeChat Pay before arriving.","Tianjin people are famously quick and jokey; the crosstalk tradition is a source of civic pride.","Book Beijing-Tianjin trains ahead at weekends and holidays.","Goubuli is a tourist rite rather than the best baozi in town, and locals enjoy saying so.","Tipping is not expected."]},"whatIdDo":[{"day":"Day 1","plan":"Early train from Beijing. Jianbing guozi from a cart on arrival. Five Great Avenues on foot for two hours, coffee at Minyuan. Ancient Culture Street and Tianhou Temple after lunch. Jiefang North Road, then the Italian Concession as the light goes. Dinner on the piazza, river walk and the Eye after dark. Late train back, or stay."},{"day":"Day 2","plan":"Breakfast crawl: guobacai, then a neighbourhood baozi shop. Tianjin Museum or Shenyang Dao market. Afternoon free. Crosstalk at a tea house in the evening."}],"quickRef":{"musts":["Five Great Avenues","Italian Concession at dusk","Jianbing guozi from a cart","The riverfront at night","A crosstalk show"],"eats":["Jianbing guozi","Goubuli baozi","Shibajie mahua","Guobacai","Bohai seafood"],"areas":["Five Great Avenues","Italian Concession","Jiefang North Road","Ancient Culture Street"],"experiences":["Crosstalk in a tea house","Breakfast crawl","Hai River night cruise"],"dayTrip":"Huangyaguan Great Wall, or Beijing in reverse","stay":"1-2 days"},"coords":{"Ancient Culture Street":[39.146,117.185],"Ancient Culture Street and Nankai":[39.146,117.185],"Ancient Culture Street and Tianhou Temple":[39.146,117.185],"Beijing":[39.904,116.407],"Binhai Library":[39.011,117.694],"Binhai and the port":[39.011,117.694],"Binjiang Dao":[39.126,117.201],"Crosstalk clubs":[39.135,117.19],"Crosstalk theatre":[39.135,117.19]," s and exploring them on foot between train rides. Tokyo is not improved by adding more pins to a map; the biggest mistake is trying to 'complete' it instead of choosing districts and spending time in them.","bestFor":["Food","Contemporary culture","Traditional Japanese culture","Shopping","Architecture","Nightlife","Design","Anime and manga","Gardens","Neighborhood exploration"],"idealStay":"4-5 days for a strong first visit; 3 days works if tightly curated; 7+ days for deeper neighborhoods, day trips and specialist interests","character":["Vast","Precise","Layered","Energetic","Endlessly curious"],"dontMiss":["Senso-ji and Asakusa","Meiji Jingu and Harajuku","Shibuya Crossing","Shinjuku at night","Tsukiji Outer Market","Tokyo Station, Marunouchi and the Imperial Palace area","One major museum or contemporary-art experience","An izakaya or yokocho evening"],"neighbourhoods":["Asakusa","Ueno and Yanaka","Ginza and Nihonbashi","Shibuya, Harajuku and Omotesando","Shinjuku and Kabukicho","Shimokitazawa and Nakameguro"]},"history":{"story":"Tokyo makes more sense when you understand that today's city is essentially several cities layered together. Edo began as a relatively small settlement, then changed dramatically when Tokugawa Ieyasu established the shogunate there in 1603. Over roughly 265 years of Tokugawa rule, peace, commerce, population growth and urban culture transformed Edo into one of the world's largest cities. In 1868, the Meiji Restoration ended the shogunate, Edo was renamed Tokyo, and the city became the imperial capital and a symbol of Japan's rapid modernization.","origins":"Edo's position on the Kanto plain, its river and bay connections, and its role as the seat of Tokugawa power made it an ideal political and commercial center. Nihonbashi, established in 1603, became the starting point of the major highways radiating from Edo and remains a symbolic 'kilometer zero' of the city.","periods":[{"name":"Edo / Tokugawa era, 1603-1867","text":"The foundational period for Tokyo's urban culture, merchant districts, theater, food stalls, gardens, crafts and many enduring traditions."},{"name":"Meiji era, 1868-1912","text":"Edo becomes Tokyo and rapidly adopts railways, Western-style architecture, new institutions and industrial infrastructure."},{"name":"20th century","text":"Tokyo experiences wartime destruction, postwar reconstruction and extraordinary economic growth, becoming a global business and cultural capital."},{"name":"Late 20th to 21st century","text":"The city continues to reinvent itself through high-density redevelopment, design, technology, pop culture, global dining and renewed interest in historic neighborhoods."}],"whyItMatters":"Tokyo's history is visible rather than confined to museums. Asakusa preserves a traditional temple-and-shopping-street experience; Nihonbashi still reflects its historic commercial role; gardens such as Rikugien preserve Edo aesthetics; Ryogoku remains associated with sumo; and modern districts grew from different waves of railway, commercial and postwar development.","visible":["Edo religion and entertainment, in Asakusa: Senso-ji, Nakamise, old-style shops and the former entertainment district","Edo commerce, in Nihonbashi: the historic bridge, department stores, traditional merchants and modern towers","Tokugawa power, around the Imperial Palace, Marunouchi and Ueno: the former castle core, gardens and Tokugawa-linked sites","Traditional urban life, in Yanaka and Nezu: low-rise streets, temples, small shops and surviving neighborhood texture","Performing arts, in Ginza at Kabukiza: kabuki as a living continuation of Tokyo's theatrical culture","Sumo culture, in Ryogoku: the Kokugikan area, chanko restaurants and sumo institutions"]},"thingsToDo":{"historic":[{"name":"Senso-ji","area":"Asakusa","why":"Tokyo's essential historic temple experience. Go early for a quieter look at the temple precinct and surrounding streets.","mins":120},{"name":"Meiji Jingu","area":"Shibuya /
