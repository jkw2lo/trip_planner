const HOUR_LABELS = (()=>{
  const out = [];
  for(let h=0; h<24; h++){
    const ap = h>=12 ? "pm" : "am";
    const hh = h%12===0 ? 12 : h%12;
    out.push({v:d2(h), label:hh+ap});
  }
  return out;
})();
function timeSelectHTML(value){
  const has = !!value;
  const hh = has ? value.split(":")[0] : "";
  const mm = has ? value.split(":")[1] : "00";
  return `<div class="timepick">
    <select class="inp" id="e-hour">
      <option value="" ${has?"":"selected"}>no time</option>
      ${HOUR_LABELS.map(h=>`<option value="${h.v}" ${h.v===hh?"selected":""}>${h.label}</option>`).join("")}
    </select>
    <select class="inp" id="e-min" ${has?"":"disabled"}>
      <option value="00" ${mm==="00"?"selected":""}>:00</option>
      <option value="30" ${mm==="30"?"selected":""}>:30</option>
    </select>
  </div>`;
}
function magnetHTML(m, opts){
  const k = KIND_META[m.kind] || KIND_META.note;
  const o = opts || {};
  const noteText = o.sub != null ? o.sub : m.note;
  const sub = noteText ? `<span class="sub2">${esc(noteText)}</span>` : "";
  const vague = !m.cardId && !m.place && m.board==="cal" && m.kind!=="fly" && m.kind!=="move";
  const optTag = m.optional ? '<span class="optbadge" title="Optional — decide on the day">opt</span>' : "";
  const stamp = o.stamp ? " stamp" : "";
  // frozen: the day it sits on is finalised, so it is readable but immovable
  const frozen = !!o.frozen;
  return `<div class="magnet ${k.cls} ${m.locked?"locked":""} ${vague?"vague":""} ${m.optional?"optional":""}${stamp}${frozen?" frozen":""}" data-mag="${m.id}"
      draggable="${(m.locked||frozen)?"false":"true"}" title="${esc(m.label)}${noteText?" — "+esc(noteText):""}">
      <span class="ic">${k.ic}</span>
      <span class="body"><span class="lbl">${optTag}${m.time?`<b class="mtime">${esc(fmt12(m.time))}</b>`:""}${esc(m.label)}</span>${sub}</span>
      ${o.stamp || frozen ? "" : `<button class="pin" data-act="lock" data-mag="${m.id}"
        title="${m.locked?"Locked — click to unpin":"Pin this down"}">${m.locked?"\u{1F4CD}":"\u{1F4CC}"}</button>`}
      ${o.stamp || frozen || m.kind==="fly" ? "" : `<button class="trash" data-act="delmag" data-mag="${m.id}" title="Remove">\u{1F5D1}</button>`}
    </div>`;
}

// Grouped by the interest that produced them, so it's obvious where they came from.
function trayItems(t){
  if(view.tab === "todo") return todoTrayItems(t);
  const real = magnetsIn(t, m=>m.board==="tray");
  const dismissed = new Set((t.tray && t.tray.dismissed) || []);
  const groups = [];
  if(real.length) groups.push({name:"Saved for this trip", kind:"saved", items:real});

  // One per interest, not one per interest per city. These are stamps: drag the
  // same one onto as many days as you like and it stays put.
  const byInterest = t.interests.map(iid=>{
    const m = interestMagnet(iid, t.custom);
    return {id:"sug:interest:"+iid, kind:m.kind, label:m.label,
            hint:interestLabel(iid, t.custom), interest:iid, virtual:true, reusable:true};
  });
  if(byInterest.length) groups.push({name:"Because you said you like…", kind:"interest", items:byInterest});

  const base = BASE_SUGGEST.map((tpl,ix)=>
    ({id:"sug:base:"+ix, kind:tpl[1], label:tpl[0], hint:tpl[2], virtual:true, reusable:true}));
  if(base.length) groups.push({name:"Everyday rhythm", kind:"base", items:base});
  return groups;
}
function todoTrayItems(t){
  const groups = [];
  const real = magnetsIn(t, m=>m.board==="tray");
  if(real.length) groups.push({name:"Saved for this trip", kind:"saved", items:real});
  const done = new Set(t.magnets.filter(m=>m.board==="todo").map(m=>m.label.toLowerCase()));
  Object.keys(TODO_GROUPS).forEach(g=>{
    const items = TODO_SUGGEST
      .map((x,ix)=>({g:x[0], label:x[1], ix}))
      .filter(x=>x.g===g && !done.has(x.label.toLowerCase()))
      .map(x=>({id:"sug:todo:"+x.ix, kind:"note", label:x.label, hint:"",
                virtual:true, reusable:true, todoCol:x.g}));
    if(items.length) groups.push({name:TODO_GROUPS[g], kind:"todo", items});
  });
  return groups;
}
function traySub(i){
  return [i.city, i.hint].filter(Boolean).join(" · ");
}
const isReusableId = id => /^sug:(interest|base):/.test(id||"");

function resolveDragged(t, id){
  if(!id) return null;
  if(id.startsWith("sug:")){
    let found = null;
    trayItems(t).forEach(g=>g.items.forEach(i=>{ if(i.id===id) found=i; }));
    if(!found) return null;
    if(!found.reusable) t.tray.dismissed.push(id);   // older one-shot suggestions
    const m = {id:uid(), kind:found.kind, label:found.label, note:"",
               board:"tray", locked:false, order:Date.now(),
               interest:found.interest||null, todoCol:found.todoCol||null, fromIdea:true};
    t.magnets.push(m);
    return m;
  }
  return t.magnets.find(m=>m.id===id) || null;
}

function orderBetween(t, target, beforeId){
  const p = target.split(":");
  const inSame = m => p[0]==="cal"
    ? (m.board==="cal" && m.day===p[1] && m.slot===p[2])
    : p[0]==="transit" ? (m.board==="cal" && m.day===p[1] && m.slot==="transit")
    : (m.board===p[0] && (p[1]==null || m.col===p[1]));
  const list = magnetsIn(t, inSame);
  if(!beforeId) return list.length ? (list[list.length-1].order||0) + 1000 : Date.now();
  const ix = list.findIndex(m=>m.id===beforeId);
  if(ix < 0) return Date.now();
  const next = list[ix].order || 0;
  const prev = ix > 0 ? (list[ix-1].order || next - 2000) : next - 2000;
  return prev + (next - prev)/2;
}
function moveMagnet(t, magId, target, beforeId){
  lastMove = null;
  const pre = target.split(":");
  const existing = t.magnets.find(x=>x.id===magId);
  // a finalised day is finalised both ways: nothing leaves it, nothing lands on it
  if(existing && existing.board==="cal" && existing.day && dayLocked(t, existing.day)){
    toast(dayLabel(existing.day)+" is finalised — unlock the day to move this");
    return;
  }
  if((pre[0]==="cal" || pre[0]==="transit") && dayLocked(t, pre[1])){
    toast(dayLabel(pre[1])+" is finalised — unlock it to drop anything on it");
    return;
  }
  const m = resolveDragged(t, magId);
  if(!m || m.locked) return;
  // "same" means whatever slot it is already in. The rail drops that way, so an
  // evening thing moved to another day is still an evening thing.
  if(pre[0]==="cal" && pre[2]==="same"){
    const keep = (m.board==="cal" && m.slot && m.slot!=="transit") ? m.slot
               : (m.time ? slotForTime(m.time) : "morning");
    target = "cal:"+pre[1]+":"+keep;
  }
  lastMove = {trip:t.id, id:m.id, prev:{board:m.board, day:m.day||null, slot:m.slot||null,
              col:m.col||null, order:m.order||0, kind:m.kind}};
  const newOrder = orderBetween(t, target, beforeId);
  const wasVague = !m.cardId && !m.place;
  const cameFromTray = m.board === "tray";
  const p = target.split(":");
  if(p[0]==="tray"){ m.board="tray"; m.day=null; m.slot=null; m.col=null; }
  else if(p[0]==="cal"){ m.board="cal"; m.day=p[1]; m.slot=p[2]; m.col=null; }
  else if(p[0]==="transit"){ m.board="cal"; m.day=p[1]; m.slot="transit"; m.col=null;
    if(m.kind!=="move" && m.kind!=="fly") m.kind="move"; }
  else if(p[0]==="short"){ m.board="short"; m.col=p[1]; m.day=null; m.slot=null; }
  else if(p[0]==="todo"){ m.board="todo"; m.col=p[1]||m.todoCol||"before"; m.day=null; m.slot=null; }
  else if(p[0]==="eats"){ m.board="eats"; m.col=p[1]; m.day=null; m.slot=null; }
  m.order = newOrder;
  save();
  render();
  // dragged a place onto a day you'll be in a different city?
  if(m.board === "cal" && m.day && (m.cardId || m.place)){
    const owner = computeDayCities(t)[m.day];
    const home = m.cardId ? Object.keys(t.decks||{}).find(k=>
      (t.decks[k].cards||[]).some(c=>c.id===m.cardId)) : null;
    if(home && owner && home !== owner){
      const hc = cityById(t, home), oc = cityById(t, owner);
      if(hc && oc) toast(hc.name+" spot on a "+oc.name+" day — moved anyway, but check it");
    }
  }
  // an idea with no place attached lands on a day -> ask which place it is
  if(cameFromTray && wasVague && m.board==="cal" && m.slot!=="transit" && m.kind!=="fly"){
    openMagnetEditor(m.id, {justDropped:true});
  }
}

function gapsHTML(t, days){
  if(view.tab!=="cal") return "";
  if(!days.length) return "";
  if(days.length > 45){
    return `<div class="nodays">
      <h3>${days.length} days?</h3>
      <p>That's how far apart your arrival and departure dates are. If this really is a
         ${Math.round(days.length/30)}-month trip, carry on — otherwise the wrong pair of dates got picked up.
         Booking confirmations carry fare deadlines and rebooking cut-offs that look a lot like travel dates.</p>
      <div class="ndates">
        <span><b>Arrive</b>${esc(t.arr.date)}</span>
        <span><b>Depart</b>${esc(t.dep.date)}</span>
      </div>
      <button class="btn primary" data-act="settings">Fix the dates</button>
    </div>` + gapNotes(t, days);
  }
  return gapNotes(t, days);
}
function gapNotes(t, days){
  const notes = [];
  const pace = paceOf(t.pace);
  const MEALSLOT = {lunch:1, dinner:1, transit:1};
  const count = d => t.magnets.filter(m=>m.board==="cal"&&m.day===d&&m.kind!=="fly"&&
                                          !MEALSLOT[m.slot]&&!m.optional).length;
  const short = d => MON[parseD(d).getMonth()]+" "+parseD(d).getDate();
  const empty = days.filter(d=>count(d)===0);
  if(empty.length && empty.length<days.length){
    notes.push(`${empty.length} day${empty.length===1?"":"s"} still bare — ${empty.map(short).slice(0,4).join(", ")}${empty.length>4?"…":""}`);
  }
  const over = days.filter(d=>count(d) > pace.per+1);
  if(over.length){
    notes.push(`Busier than ${pace.label.toLowerCase()} on ${over.map(short).slice(0,4).join(", ")}${over.length>4?"…":""} — you said about ${pace.per} a day.`);
  }
  const dayCities = computeDayCities(t);
  const visited = new Set(Object.values(dayCities));
  const unvisited = t.cities.filter(c=>!visited.has(c.id));
  if(unvisited.length){
    notes.push(`No travel planned to ${unvisited.map(c=>c.name).join(", ")} — drop a transport magnet on the day you move.`);
  }
  if(!notes.length) return "";
  return `<div class="gap">${notes.map(esc).join("<br>")}</div>`;
}

const CITY_TINTS = ["#1F5C4D","#B4703A","#5B6BB8","#8A5AA8","#3F8FA0","#A05A5A","#6B8A3A"];
const cityTint = i => CITY_TINTS[i % CITY_TINTS.length];

function overviewHTML(t, days){
  if(!days.length) return "";
  const dc = computeDayCities(t);
  const pins = t.dayCity || {};
  const moves = {};
  t.magnets.filter(m=>m.board==="cal"&&m.kind==="move"&&m.toCity)
           .forEach(m=>{ moves[m.day] = m.toCity; });
  const open = t.cities.length > 1;

  const head = days.map(d=>{
    const dt = parseD(d);
    return `<div class="ovh ${d===todayStr()?"today":""}">
      <span class="ovdow">${DOW[dt.getDay()][0]}</span>
      <span class="ovnum">${dt.getDate()}</span>
    </div>`;
  }).join("");

  const rows = t.cities.map((c,i)=>{
    const cells = days.map((d,ix)=>{
      const on = dc[d] === c.id;
      const prev = ix>0 && dc[days[ix-1]] === c.id;
      const next = ix<days.length-1 && dc[days[ix+1]] === c.id;
      return `<button class="ovc ${on?"on":""} ${on&&!prev?"start":""} ${on&&!next?"end":""}"
        style="--tint:${cityTint(i)}"
        data-act="setday" data-day="${d}" data-city="${c.id}"
        title="${esc(c.name)} on ${esc(dayLabel(d))}">
        ${pins[d]===c.id?'<i class="ovpin"></i>':""}
        ${moves[d]===c.id?'<i class="ovmove">\u2192</i>':""}
      </button>`;
    }).join("");
    const n = days.filter(d=>dc[d]===c.id).length;
    return `<div class="ovrow">
      <div class="ovname" style="--tint:${cityTint(i)}">${esc(c.name)}</div>
      <div class="ovcells">${cells}</div>
      <div class="ovmeta"><span class="ovn ${n?"":"zero"}">${n}d</span></div>
    </div>`;
  }).join("");

  return `<details class="overview" ${open?"open":""}>
    <summary>Trip overview<span>${t.cities.map(c=>{
      const n = days.filter(d=>dc[d]===c.id).length;
      return n ? esc(c.name)+" "+n+"d" : "";
    }).filter(Boolean).join(" \u00b7 ")}</span></summary>
    <div class="ovgrid">
      <div class="ovrow ovhead"><div class="ovname"></div><div class="ovcells">${head}</div>
        <div class="ovmeta"><span class="ovn">days</span></div></div>
      ${rows}
    </div>
    <p class="ovhint">Click a cell to put that day in that city \u2014 drag across to do several.
      Every day after it follows along until the next change, so you only mark the days you move.</p>
  </details>`;
}

/* =========================================================
   5o2. DAY NOTES AND ANNOTATED IMAGES
   Images are downscaled hard before they are stored, because a trip file with
   two dozen phone screenshots in it stops fitting anywhere.
   ========================================================= */
const MAX_DAY_IMAGES = 3;
const IMG_MAX_PX = 1200;
const IMG_QUALITY = 0.72;
const PEN_COLORS = [["#E2725B","red"],["#F2C14E","amber"],["#5B8DB8","blue"],["#4F9D69","green"],["#23201C","black"]];

function dayNote(t, day){ return (t.dayNotes||{})[day] || ""; }
function dayImages(t, day){ return (t.dayImages||{})[day] || []; }

function downscaleImage(file){
  return new Promise((res, rej)=>{
    const fr = new FileReader();
    fr.onerror = ()=>rej(new Error("read failed"));
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>rej(new Error("not an image"));
      img.onload = ()=>{
        const scale = Math.min(1, IMG_MAX_PX/Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width*scale));
        const h = Math.max(1, Math.round(img.height*scale));
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        res({src: cv.toDataURL("image/jpeg", IMG_QUALITY), w, h});
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function addStayImage(t, stayId, file){
  const st = stayById(t, stayId);
  if(!st) return;
  st.images = st.images || [];
  if(st.images.length >= MAX_STAY_IMAGES){ toast("Four screenshots per hotel is the limit"); return; }
  if(!/^image\//.test(file.type||"")){ toast("That isn't an image"); return; }
  downscaleImage(file).then(out=>{
    st.images.push({id:uid(), src:out.src, w:out.w, h:out.h, strokes:[], caption:""});
    save();
    if(stayEdit === stayId) drawStay();
  }).catch(()=>toast("Couldn't read that image"));
}
async function addDayImage(t, day, file){
  t.dayImages = t.dayImages || {};
  const list = t.dayImages[day] = t.dayImages[day] || [];
  if(list.length >= MAX_DAY_IMAGES){ toast("Three images a day is the limit"); return; }
  if(!/^image\//.test(file.type||"")){ toast("That isn't an image"); return; }
  let out;
  try{ out = await downscaleImage(file); }
  catch(e){ toast("Couldn't read that image"); return; }
  list.push({id:uid(), src:out.src, w:out.w, h:out.h, strokes:[], caption:""});
  save();
  render();
  toast("Added — click it to draw on it");
}

/* ---------- strokes drawn over an image ----------
   NaN turns into null the moment it is written to JSON, so a stroke captured
   with a bad coordinate comes back as [null,null] and used to take the whole
   board down. Nothing here trusts what it is handed. */
const okPt = p => Array.isArray(p) && isNum(p[0]) && isNum(p[1]);
function repairStrokes(t){
  let dropped = 0;
  const lists = Object.keys(t.dayImages||{}).map(k=>t.dayImages[k])
    .concat((t.stays||[]).map(st=>st.images));
  lists.forEach(list=>{
    (list||[]).forEach(img=>{
      if(!Array.isArray(img.strokes)){ img.strokes = []; return; }
      const before = img.strokes.length;
      img.strokes = img.strokes.map(st=>{
        if(!st || typeof st !== "object") return null;
        if(st.tool === "pen"){
          const pts = (st.pts||[]).filter(okPt);
          return pts.length >= 2 ? Object.assign({}, st, {pts}) : null;
        }
        if(st.tool === "ellipse")
          return (isNum(st.x)&&isNum(st.y)&&isNum(st.rx)&&isNum(st.ry)) ? st : null;
        if(st.tool === "arrow")
          return (isNum(st.x1)&&isNum(st.y1)&&isNum(st.x2)&&isNum(st.y2)) ? st : null;
        return null;
      }).filter(Boolean);
      if(!isNum(img.w) || !isNum(img.h) || img.w <= 0 || img.h <= 0){ img.w = 1000; img.h = 750; }
      dropped += before - img.strokes.length;
    });
  });
  return dropped;
}

function strokeSVG(st){
  if(!st) return "";
  const c = esc(st.color||"#E2725B"), w = st.w||6;
  if(st.tool === "pen"){
    const pts = (st.pts||[]).filter(okPt);
    if(pts.length < 2) return "";
    return `<polyline points="${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}"
      fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  if(st.tool === "ellipse"){
    if(!isNum(st.x)||!isNum(st.y)||!isNum(st.rx)||!isNum(st.ry)) return "";
    return `<ellipse cx="${st.x.toFixed(1)}" cy="${st.y.toFixed(1)}" rx="${Math.abs(st.rx).toFixed(1)}"
      ry="${Math.abs(st.ry).toFixed(1)}" fill="none" stroke="${c}" stroke-width="${w}"/>`;
  }
  if(st.tool === "arrow"){
    if(!isNum(st.x1)||!isNum(st.y1)||!isNum(st.x2)||!isNum(st.y2)) return "";
    const ang = Math.atan2(st.y2-st.y1, st.x2-st.x1);
    const hl = Math.max(14, w*3);
    const p1 = [st.x2 - hl*Math.cos(ang - 0.4), st.y2 - hl*Math.sin(ang - 0.4)];
    const p2 = [st.x2 - hl*Math.cos(ang + 0.4), st.y2 - hl*Math.sin(ang + 0.4)];
    return `<line x1="${st.x1.toFixed(1)}" y1="${st.y1.toFixed(1)}" x2="${st.x2.toFixed(1)}" y2="${st.y2.toFixed(1)}"
        stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>
      <polygon points="${st.x2.toFixed(1)},${st.y2.toFixed(1)} ${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}"
        fill="${c}"/>`;
  }
  return "";
}
function imgH(img){
  return (isNum(img.w) && isNum(img.h) && img.w > 0) ? 1000*(img.h/img.w) : 750;
}
function imageSVG(img, extra, box){
  const H = imgH(img);
  const v = box || {x:0, y:0, w:1000, h:H};
  return `<svg class="annosvg" viewBox="${v.x.toFixed(1)} ${v.y.toFixed(1)} ${v.w.toFixed(1)} ${v.h.toFixed(1)}" preserveAspectRatio="xMidYMid meet">
    <image href="${img.src}" x="0" y="0" width="1000" height="${H.toFixed(0)}"/>
    <g class="strokes">${(img.strokes||[]).map(strokeSVG).join("")}${extra||""}</g>
  </svg>`;
}

/* ---------- the annotate window ----------
   The image is shown through a moving viewBox rather than a CSS transform, so
   zoom, pan and drawing all speak the same coordinate system and a stroke drawn
   at 4x lands exactly where it was drawn. */
const ZOOMS = [1, 1.5, 2, 3, 4, 6, 8];
let anno = null;
let annoCleanup = null;

function annoBox(img){
  const H = imgH(img);
  const z = (anno && isNum(anno.zoom)) ? Math.max(1, anno.zoom) : 1;
  const w = 1000/z, h = H/z;
  let cx = (anno && isNum(anno.cx)) ? anno.cx : 500;
  let cy = (anno && isNum(anno.cy)) ? anno.cy : H/2;
  cx = Math.min(1000 - w/2, Math.max(w/2, cx));
  cy = Math.min(H - h/2, Math.max(h/2, cy));
  return {x:cx - w/2, y:cy - h/2, w, h};
}
function annoZoomTo(z, ax, ay){
  const img = annoImages().find(x=>x.id===anno.imgId);
  if(!img) return;
  const H = imgH(img);
  z = Math.max(1, Math.min(ZOOMS[ZOOMS.length-1], z));
  if(z <= 1.001){ anno.zoom = 1; anno.cx = 500; anno.cy = H/2; }
  else{
    // keep the point under the cursor where it is
    if(isNum(ax) && isNum(ay)){
      const b = annoBox(img);
      const k = anno.zoom / z;
      anno.cx = ax + (b.x + b.w/2 - ax) * k;
      anno.cy = ay + (b.y + b.h/2 - ay) * k;
    }
    anno.zoom = z;
  }
  drawAnnotate();
}
function annoStep(dir){
  const cur = anno.zoom || 1;
  const i = ZOOMS.findIndex(z => z > cur + 0.01);
  const next = dir > 0
    ? (i < 0 ? ZOOMS[ZOOMS.length-1] : ZOOMS[i])
    : (() => { for(let j=ZOOMS.length-1;j>=0;j--) if(ZOOMS[j] < cur - 0.01) return ZOOMS[j]; return 1; })();
  annoZoomTo(next);
}

function annoImages(){
  const t = trip();
  if(!t || !anno) return [];
  if(anno.stayId){ const st = stayById(t, anno.stayId); return st ? (st.images||[]) : []; }
  return dayImages(t, anno.day);
}
function annoTitle(){
  const t = trip();
  if(anno && anno.stayId){
    const st = t && stayById(t, anno.stayId);
    return st ? (st.name || "Hotel") : "Hotel";
  }
  return anno ? dayLabel(anno.day) : "";
}
function openAnnotate(day, imgId, stayId){
  const t = trip();
  anno = {day, imgId, stayId:stayId||null, tool:"pen", color:PEN_COLORS[0][0], w:6,
          drawing:null, zoom:1, cx:500, cy:0};
  const img = annoImages().find(x=>x.id===imgId);
  if(!img){ anno = null; return; }
  anno.cy = imgH(img)/2;
  drawAnnotate();
}
function drawAnnotate(){
  const t = trip();
  if(!anno) return;
  const imgs = annoImages();
  const img = imgs.find(x=>x.id===anno.imgId);
  if(!img){ closeModal(); anno = null; return; }
  const tools = [["pen","Draw"],["ellipse","Circle"],["arrow","Arrow"],["pan","Move"]];
  const zoomed = (anno.zoom||1) > 1.001;
  openModal(`<div class="annowrap">
    <div class="annohead">
      <h3>${esc(annoTitle())}</h3>
      ${imgs.length > 1 ? `<div class="annoswitch">${imgs.map((im,i)=>
        `<button class="tbtn ${im.id===anno.imgId?"on":""}" data-act="anno-switch" data-img="${im.id}"
           title="${esc(im.caption||("Image "+(i+1)))}">${i+1}</button>`).join("")}</div>` : ""}
      <button class="btn ghost sm" data-act="anno-close">Done</button>
    </div>
    <div class="annobar">
      ${tools.map(([id,label])=>`<button class="tbtn ${anno.tool===id?"on":""}"
        data-act="anno-tool" data-tool="${id}">${label}</button>`).join("")}
      <span class="tsep"></span>
      ${PEN_COLORS.map(([hex,name])=>`<button class="cbtn ${anno.color===hex?"on":""}"
        style="--c:${hex}" data-act="anno-color" data-color="${hex}" title="${name}"></button>`).join("")}
      <span class="tsep"></span>
      <div class="zoomer">
        <button class="tbtn" data-act="anno-zoom" data-dir="-1" ${zoomed?"":"disabled"} title="Zoom out">−</button>
        <span class="zlvl">${Math.round((anno.zoom||1)*100)}%</span>
        <button class="tbtn" data-act="anno-zoom" data-dir="1" title="Zoom in">+</button>
        <button class="tbtn" data-act="anno-fit" ${zoomed?"":"disabled"} title="Fit to window">Fit</button>
      </div>
      <span class="tsep"></span>
      <button class="btn sm" data-act="anno-undo" ${(img.strokes||[]).length?"":"disabled"}>Undo</button>
      <button class="btn sm" data-act="anno-clear" ${(img.strokes||[]).length?"":"disabled"}>Clear</button>
      <button class="btn sm danger" data-act="anno-del">Delete image</button>
    </div>
    <div class="annostage ${anno.tool==="pan"?"panning":""} ${zoomed?"zoomed":""}" id="annostage">
      ${imageSVG(img, "", annoBox(img))}
    </div>
    <div class="annofoot">
      <input class="inp" id="anno-cap" placeholder="Caption (optional)" value="${esc(img.caption||"")}">
      <span class="hint">${zoomed
        ? "Scroll to zoom · pick Move to drag the image around"
        : "Scroll to zoom in, or use + above"}</span>
    </div>
  </div>`);
  mountAnnotate();
}

function mountAnnotate(){
  // each redraw builds a new canvas; without this the listeners from the old
  // one keep firing against a detached element whose width is zero, which is
  // how strokes full of NaN got written in the first place
  if(annoCleanup){ annoCleanup(); annoCleanup = null; }
  const stage = document.getElementById("annostage");
  if(!stage) return;
  const svg = stage.querySelector("svg");
  if(!svg) return;
  const img = annoImages().find(x=>x.id===anno.imgId);
  if(!img) return;
  const box = annoBox(img);

  // exact inverse of preserveAspectRatio="xMidYMid meet"
  const at = e =>{
    const r = svg.getBoundingClientRect();
    if(!r.width || !r.height) return null;
    const src = (e.touches && e.touches[0]) ? e.touches[0] : e;
    if(!isNum(src.clientX) || !isNum(src.clientY)) return null;
    const sc = Math.min(r.width/box.w, r.height/box.h);
    if(!isNum(sc) || sc <= 0) return null;
    const ox = (r.width  - box.w*sc)/2;
    const oy = (r.height - box.h*sc)/2;
    const x = box.x + (src.clientX - r.left - ox)/sc;
    const y = box.y + (src.clientY - r.top  - oy)/sc;
    return (isNum(x) && isNum(y)) ? [x, y] : null;
  };
  const paint = ()=>{
    const g = svg.querySelector(".strokes");
    if(g) g.innerHTML = (img.strokes||[]).map(strokeSVG).join("") +
      (anno.drawing ? strokeSVG(anno.drawing) : "");
  };

  let panFrom = null;
  const down = e=>{
    const pt = at(e);
    if(!pt) return;
    e.preventDefault();
    const [x,y] = pt;
    if(anno.tool === "pan"){ panFrom = {x, y, cx:box.x + box.w/2, cy:box.y + box.h/2}; return; }
    anno.drawing = anno.tool==="pen"
      ? {tool:"pen", color:anno.color, w:anno.w, pts:[[x,y]]}
      : anno.tool==="ellipse"
      ? {tool:"ellipse", color:anno.color, w:anno.w, x, y, rx:0, ry:0, _ox:x, _oy:y}
      : {tool:"arrow", color:anno.color, w:anno.w, x1:x, y1:y, x2:x, y2:y};
    paint();
  };
  const move = e=>{
    if(!anno) return;
    if(panFrom){
      const r = svg.getBoundingClientRect();
      if(!r.width || !r.height) return;
      const src = (e.touches && e.touches[0]) ? e.touches[0] : e;
      if(!isNum(src.clientX)) return;
      e.preventDefault();
      const sc = Math.min(r.width/box.w, r.height/box.h);
      const ox = (r.width - box.w*sc)/2, oy = (r.height - box.h*sc)/2;
      const nx = box.x + (src.clientX - r.left - ox)/sc;
      const ny = box.y + (src.clientY - r.top  - oy)/sc;
      if(!isNum(nx) || !isNum(ny)) return;
      anno.cx = panFrom.cx - (nx - panFrom.x);
      anno.cy = panFrom.cy - (ny - panFrom.y);
      const b = annoBox(img);
      svg.setAttribute("viewBox",
        b.x.toFixed(1)+" "+b.y.toFixed(1)+" "+b.w.toFixed(1)+" "+b.h.toFixed(1));
      return;
    }
    if(!anno.drawing) return;
    const pt = at(e);
    if(!pt) return;
    e.preventDefault();
    const [x,y] = pt;
    const d = anno.drawing;
    if(d.tool==="pen") d.pts.push([x,y]);
    else if(d.tool==="ellipse"){
      d.x = (d._ox + x)/2; d.y = (d._oy + y)/2;
      d.rx = Math.abs(x - d._ox)/2; d.ry = Math.abs(y - d._oy)/2;
    }else{ d.x2 = x; d.y2 = y; }
    paint();
  };
  const up = ()=>{
    if(!anno) return;
    if(panFrom){ panFrom = null; drawAnnotate(); return; }
    if(!anno.drawing) return;
    const d = anno.drawing;
    anno.drawing = null;
    // at 4x a small gesture covers a quarter of the distance, so scale the
    // "did they mean it" thresholds with the zoom
    const z = anno.zoom || 1;
    const worth = d.tool==="pen" ? d.pts.filter(okPt).length > 1
      : d.tool==="ellipse" ? (d.rx > 4/z || d.ry > 4/z)
      : Math.hypot(d.x2-d.x1, d.y2-d.y1) > 10/z;
    if(worth){
      delete d._ox; delete d._oy;
      if(d.tool==="pen") d.pts = d.pts.filter(okPt);
      img.strokes = (img.strokes||[]).concat([d]);
      save();
    }
    drawAnnotate();
  };
  const wheel = e=>{
    e.preventDefault();
    const pt = at(e);
    const cur = anno.zoom || 1;
    const next = cur * (e.deltaY < 0 ? 1.25 : 0.8);
    annoZoomTo(next, pt ? pt[0] : null, pt ? pt[1] : null);
  };

  svg.addEventListener("pointerdown", down);
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
  svg.addEventListener("touchstart", down, {passive:false});
  window.addEventListener("touchmove", move, {passive:false});
  window.addEventListener("touchend", up);
  stage.addEventListener("wheel", wheel, {passive:false});
  annoCleanup = ()=>{
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    window.removeEventListener("touchmove", move);
    window.removeEventListener("touchend", up);
    stage.removeEventListener("wheel", wheel);
  };
}
function endAnnotate(){
  if(annoCleanup){ annoCleanup(); annoCleanup = null; }
  anno = null;
}

/* ---------- the pad: sticky notes and one pinned image ----------
   The right-hand plan is for what is decided. This column is for what is not:
   scraps, a map screenshot with a circle round the area, things to look up. */
const STICKY_COLORS = [["#F6E7A8","Yellow"],["#DCEBF7","Blue"],["#E6F2E0","Green"],
                       ["#F8DDD4","Pink"],["#EDE6F5","Violet"]];
function stickies(t, day){ return (t.stickies||{})[day] || []; }
function pinnedImage(t, day){
  const imgs = dayImages(t, day);
  if(!imgs.length) return null;
  const id = (t.dayPin||{})[day];
  return imgs.find(x=>x.id===id) || imgs[0];
}
function addSticky(t, day){
  t.stickies = t.stickies || {};
  const list = t.stickies[day] = t.stickies[day] || [];
  if(list.length >= 8){ toast("That is a lot of notes for one day"); return; }
  const used = list.map(n=>n.color);
  const colour = (STICKY_COLORS.find(c=>used.indexOf(c[0])<0) || STICKY_COLORS[list.length % STICKY_COLORS.length])[0];
  list.push({id:uid(), text:"", color:colour});
  save(); render();
  setTimeout(()=>{
    const box = document.querySelector('[data-sticky="' + list[list.length-1].id + '"]');
    if(box) box.focus();
  }, 0);
}
function stickyHTML(t, day){
  const list = stickies(t, day);
  const locked = dayLocked(t, day);
  return `<div class="pad">
    <label>Notes to self${locked ? "" : `<button class="padadd" data-act="addsticky" data-day="${day}"
      title="New sticky note">+</button>`}</label>
    <div class="stickies">
      ${list.map(n=>`<div class="sticky" style="--s:${esc(n.color||STICKY_COLORS[0][0])}">
        <textarea data-act="stickytext" data-sticky="${n.id}" data-day="${day}" ${locked?"readonly":""}
          rows="2" placeholder="…">${esc(n.text||"")}</textarea>
        <div class="stickyacts" ${locked?'style="display:none"':""}>
          <button class="sbtn" data-act="stickycolor" data-sticky="${n.id}" data-day="${day}"
            title="Change colour">◍</button>
          <button class="sbtn" data-act="stickydel" data-sticky="${n.id}" data-day="${day}"
            title="Remove">×</button>
        </div>
      </div>`).join("") || (locked
        ? `<div class="lockedhint">no notes</div>`
        : `<button class="stickyempty" data-act="addsticky" data-day="${day}">
        Jot something down</button>`)}
    </div>
  </div>`;
}
function padImageHTML(t, day){
  const imgs = dayImages(t, day);
  const pin = pinnedImage(t, day);
  const locked = dayLocked(t, day);

      <span class="padzoom">⤢</span>
    </button>
    ${pin.caption ? `<div class="padcap">${esc(pin.caption)}</div>` : ""}
  </div>`;
}
function dayPadHTML(t, day){

function dayExtrasHTML(t, day){

            data-day="${day}" data-img="${im.id}"

/* ---------- moving a whole day ----------
   Flights keep their real dates; everything else is a plan and plans slide. */
function swapDays(t, a, b){
  if(!a || !b || a === b) return false;
  const movable = m => m.board === "cal" && m.kind !== "fly";
  t.magnets.forEach(m=>{
    if(!movable(m)) return;
    if(m.day === a) m.day = b;
    else if(m.day === b) m.day = a;
  });
  ["dayNotes","dayImages","stickies","dayPin","dayCity"].forEach(k=>{
    const o = t[k] = t[k] || {};
    const va = o[a], vb = o[b];
    if(vb === undefined) delete o[a]; else o[a] = vb;
    if(va === undefined) delete o[b]; else o[b] = va;
  });
  return true;
}
function moveDay(day, dir){
  const t = trip();
  const days = dateRange(t.arr.date, t.dep.date);
  const i = days.indexOf(day);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= days.length){ toast("Nowhere to move it to"); return; }
  if(dayLocked(t, day) || dayLocked(t, days[j])){
    toast("One of those two days is finalised \u2014 unlock it first");
    return;
  }
  if(swapDays(t, day, days[j])){
    save(); render();
    toast(dayLabel(day) + " swapped with " + dayLabel(days[j]));
  }
}

/* =========================================================
   5p. DAY MAP
   A drawn map rather than a tile map: no network, works offline and in print,
   and the only question it needs to answer is "how spread out is this day".
   ========================================================= */
const MAP_KIND_COLOR = {see:"#5B8DB8", eat:"#E2725B", do:"#F2C14E", stay:"#4F9D69",
                        note:"#B4ADA0", move:"#7C6BAD", fly:"#2F3E46"};
const SLOT_ORDER = {morning:0, lunch:1, afternoon:2, dinner:3, evening:4, transit:5};
const SCALE_STEPS = [0.1,0.2,0.5,1,2,5,10,20,50,100];

function dayPoints(t, day){
  const ms = magnetsIn(t, m=>m.board==="cal" && m.day===day && m.kind!=="move" && m.kind!=="fly");
  const out = [];
  ms.forEach(m=>{
    const p = magnetPoint(t, m);
    if(isPoint(p)) out.push({m, lat:p.lat, lon:p.lon});
  });
  out.sort((a,b)=>{
    const oa = SLOT_ORDER[a.m.slot], ob = SLOT_ORDER[b.m.slot];
    return (oa==null?9:oa) - (ob==null?9:ob) || (a.m.order||0)-(b.m.order||0);
  });
  return out;
}

/* ---------- reorder a day to cut the walking ----------
   Meals stay where they are; the morning, afternoon and evening blocks swap
   around them, but only into slots each thing is actually suited to. */
const VISIT_ORDER = ["morning","lunch","afternoon","dinner","evening"];

function magnetAsCard(t, m){
  const card = findCard(t, m.cardId);
  return {name:m.label, blurb:(card&&card.blurb)||m.note||"", mins:m.mins||(card&&card.mins)||60,
          suit:(card&&card.suit)|| (m.kind==="eat"?"eats":m.kind==="see"?"landmark":"walk")};
}
function allowedInSlot(t, m, slot){
  const pref = slotPrefs(magnetAsCard(t, m));
  if(pref.full) return slot === "morning";
  return pref.slots.indexOf(slot) >= 0;
}
function permutations(arr){
  if(arr.length <= 1) return [arr];
  const out = [];
  arr.forEach((x,i)=>{
    const rest = arr.slice(0,i).concat(arr.slice(i+1));
    permutations(rest).forEach(p=>out.push([x].concat(p)));
  });
  return out;
}
// total ground covered walking the day in order
function routeLength(t, seq){
  let total = 0, prev = null;
  seq.forEach(m=>{
    const p = magnetPoint(t, m);
    if(!p) return;
    if(prev){ const d = haversine(prev, p); if(d != null) total += d; }
    prev = p;
  });
  return total;
}
function daySequence(t, day, assignment){
  // flights and transport are fixed points, not stops to be reordered
  const at = sl => assignment && assignment[sl] ? assignment[sl]
    : magnetsIn(t, m=>m.board==="cal" && m.day===day && m.slot===sl &&
                      m.kind!=="fly" && m.kind!=="move");
  return VISIT_ORDER.reduce((acc,sl)=>acc.concat(at(sl)), []);
}
function optimiseDay(t, day){
  const blocks = SLOTS.map(sl=>({slot:sl.id,
    items: magnetsIn(t, m=>m.board==="cal" && m.day===day && m.slot===sl.id &&
                           m.kind!=="fly" && m.kind!=="move")}))
    .filter(b=>b.items.length);
  const before = routeLength(t, daySequence(t, day));
  if(blocks.length < 2) return {before, after:before, changed:false, reason:"one block"};

  const slotIds = blocks.map(b=>b.slot);
  let best = null;
  permutations(blocks).forEach(perm=>{
    // anything you gave a time to stays where you put it
    const keepsTimes = perm.every((b,i)=>
      b.slot === slotIds[i] || !b.items.some(m=>m.time));
    if(!keepsTimes) return;
    const fits = perm.every((b,i)=>b.items.every(m=>allowedInSlot(t, m, slotIds[i])));
    if(!fits) return;
    const assignment = {};
    perm.forEach((b,i)=>{ assignment[slotIds[i]] = b.items; });
    const d = routeLength(t, daySequence(t, day, assignment));
    if(!best || d < best.d - 0.001) best = {d, perm, assignment};
  });
  if(!best) return {before, after:before, changed:false, reason:"nothing may move"};
  const sameOrder = best.perm.every((b,i)=>b.slot === slotIds[i]);
  return {before, after:best.d, changed: !sameOrder && best.d < before - 0.001,
          assignment: best.assignment, slotIds, perm: best.perm};
}
function applyOptimise(t, day, plan){
  const undo = [];
  Object.keys(plan.assignment).forEach(sl=>{
    plan.assignment[sl].forEach(m=>{
      undo.push({id:m.id, slot:m.slot});
      m.slot = sl;
    });
  });
  return undo;
}

/* =========================================================
   5p2. COVERAGE BY CITY
   Every day you spend in a city, drawn on one map, so you can see which
   parts of town you have covered, which days overlap, and what you kept
   but never scheduled that happens to sit inside a day you're already having.
   ========================================================= */
const DAY_TINTS = ["#1F5C4D","#B4703A","#5B6BB8","#8A5AA8","#3F8FA0","#A05A5A",
                   "#6B8A3A","#B0577F","#4C7A9E","#8A7A2A"];
let cityFocus = {};   // cityId -> day being highlighted

function centroidOf(pts){
  if(!pts.length) return null;
  return {lat: pts.reduce((a,p)=>a+p.lat,0)/pts.length,
          lon: pts.reduce((a,p)=>a+p.lon,0)/pts.length};
}
// what ground does this day actually cover
function dayFootprint(t, day){
  const pts = dayPoints(t, day);
  if(!pts.length) return null;
  const c = centroidOf(pts);
  let r = 0;
  pts.forEach(p=>{ const d = haversine(c, p); if(d != null && d > r) r = d; });
  return {day, pts, c, km: Math.max(r, 0.25), stops: pts.length,
          route: routeLength(t, daySequence(t, day))};
}
function cityFootprints(t, cityId){
  return daysForCity(t, cityId).map(d=>dayFootprint(t, d)).filter(Boolean);
}
// two days sitting on top of each other is the thing worth noticing
function overlappingDays(fps){
  const out = [];
  for(let i=0;i<fps.length;i++) for(let j=i+1;j<fps.length;j++){
    const d = haversine(fps[i].c, fps[j].c);
    if(d == null) continue;
    if(d < (fps[i].km + fps[j].km) * 0.55) out.push([fps[i], fps[j], d]);
  }
  return out;
}

function cityMapHTML(t, city, idx){
  const fps = cityFootprints(t, city.id);
  const waiting = shortlistFor(t, city.id)
    .map(m=>({m, p:magnetPoint(t, m)}))
    .filter(x=>isPoint(x.p));
  if(!fps.length && !waiting.length) return "";

  const W = 560, H = 260, PAD = 26;
  const all = fps.flatMap(f=>f.pts).concat(waiting.map(x=>x.p));
  const lats = all.map(p=>p.lat), lons = all.map(p=>p.lon);
  const latC = (Math.min.apply(null,lats)+Math.max.apply(null,lats))/2;
  const lonC = (Math.min.apply(null,lons)+Math.max.apply(null,lons))/2;
  const cosL = Math.cos(latC*Math.PI/180) || 1;
  const MIN_SPAN = 0.012;
  const spanY = Math.max(Math.max.apply(null,lats)-Math.min.apply(null,lats), MIN_SPAN);
  const spanX = Math.max((Math.max.apply(null,lons)-Math.min.apply(null,lons))*cosL, MIN_SPAN);
  const scale = Math.min((W-PAD*2)/spanX, (H-PAD*2)/spanY);
  const X = lon => W/2 + (lon-lonC)*cosL*scale;
  const Y = lat => H/2 - (lat-latC)*scale;
  const kmToPx = km => km/111.32*scale;

  const focus = cityFocus[city.id] || null;
  const tint = i => DAY_TINTS[i % DAY_TINTS.length];

  const blobs = fps.map((f,i)=>{
    const dim = focus && focus !== f.day;
    return `<circle cx="${X(f.c.lon).toFixed(1)}" cy="${Y(f.c.lat).toFixed(1)}"
      r="${Math.max(14, kmToPx(f.km)).toFixed(1)}" fill="${tint(i)}" fill-opacity="${dim?.05:.13}"
      stroke="${tint(i)}" stroke-opacity="${dim?.15:.5}" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  }).join("");

  const routes = fps.map((f,i)=>{
    if(f.pts.length < 2) return "";
    const dim = focus && focus !== f.day;
    return `<polyline points="${f.pts.map(p=>X(p.lon).toFixed(1)+","+Y(p.lat).toFixed(1)).join(" ")}"
      fill="none" stroke="${tint(i)}" stroke-width="1.6" stroke-opacity="${dim?.15:.75}"/>`;
  }).join("");

  const pins = fps.map((f,i)=>{
    const dim = focus && focus !== f.day;
    return f.pts.map(p=>`<g opacity="${dim?.25:1}">
      <circle cx="${X(p.lon).toFixed(1)}" cy="${Y(p.lat).toFixed(1)}" r="7" fill="${tint(i)}"
        stroke="var(--paper2)" stroke-width="1.5"><title>${esc(p.m.label)} · ${esc(dayLabel(f.day))}</title></circle>
      <text x="${X(p.lon).toFixed(1)}" y="${(Y(p.lat)+2.6).toFixed(1)}" text-anchor="middle"
        font-size="7.5" font-weight="700" fill="#fff">${i+1}</text></g>`).join("");
  }).join("");

  const waitPins = waiting.map(x=>`<circle cx="${X(x.p.lon).toFixed(1)}" cy="${Y(x.p.lat).toFixed(1)}" r="4.5"
      fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-dasharray="2 2" opacity=".8">
      <title>${esc(x.m.label)} — on the waiting list</title></circle>`).join("");

  const unitsPerKm = scale/111.32;
  let barKm = SCALE_STEPS[0];
  SCALE_STEPS.forEach(v=>{ if(v <= (W*0.22)/unitsPerKm) barKm = v; });

  const legend = fps.map((f,i)=>{
    const dt = parseD(f.day);
    return `<button class="cmday ${focus===f.day?"on":""}" data-act="cityfocus"
      data-city="${city.id}" data-day="${f.day}" style="--t:${tint(i)}">
      <i></i><b>${MON[dt.getMonth()]} ${dt.getDate()}</b>
      <span>${f.stops} stop${f.stops===1?"":"s"} · ${f.km<1?Math.round(f.km*1000)+"m":f.km.toFixed(1)+"km"} across</span>
    </button>`;
  }).join("");

  const overlaps = overlappingDays(fps);
  const notes = [];
  if(overlaps.length){
    notes.push(overlaps.slice(0,2).map(([a,b])=>
      dayLabel(a.day)+" and "+dayLabel(b.day)+" cover much the same ground").join("; ") + ".");
  }
  if(waiting.length){
    const inside = waiting.filter(x=>fps.some(f=>{
      const d = haversine(f.c, x.p);
      return d != null && d <= f.km * 1.3;
    }));
    if(inside.length) notes.push(inside.length + " waiting item" + (inside.length===1?" sits":"s sit") +
      " inside ground you're already covering — worth slotting in.");
  }

  return `<div class="citymap">
    <div class="cmhead">
      <b>${esc(city.name)}</b>
      <span>${fps.length} day${fps.length===1?"":"s"}${waiting.length?" · "+waiting.length+" waiting":""}</span>
    </div>
    <div class="cmbody">
      <svg viewBox="0 0 ${W} ${H}" class="cmsvg" role="img" aria-label="Where you're going in ${esc(city.name)}">
        <rect x="0" y="0" width="${W}" height="${H}" fill="var(--paper)" rx="10"/>
        <g opacity=".45">${[0.25,0.5,0.75].map(f=>
          `<line x1="0" y1="${(H*f).toFixed(0)}" x2="${W}" y2="${(H*f).toFixed(0)}" stroke="var(--line)" stroke-width=".5"/>
           <line x1="${(W*f).toFixed(0)}" y1="0" x2="${(W*f).toFixed(0)}" y2="${H}" stroke="var(--line)" stroke-width=".5"/>`).join("")}</g>
        ${blobs}${routes}${waitPins}${pins}
        <g transform="translate(12,${H-11})">
          <line x1="0" y1="0" x2="${kmToPx(barKm).toFixed(1)}" y2="0" stroke="var(--ink2)" stroke-width="1.5"/>
          <line x1="0" y1="-3" x2="0" y2="3" stroke="var(--ink2)" stroke-width="1.5"/>
          <line x1="${kmToPx(barKm).toFixed(1)}" y1="-3" x2="${kmToPx(barKm).toFixed(1)}" y2="3" stroke="var(--ink2)" stroke-width="1.5"/>
          <text x="${(kmToPx(barKm)+5).toFixed(1)}" y="3" font-size="8.5" fill="var(--ink2)">${barKm<1?(barKm*1000)+"m":barKm+"km"}</text>
        </g>
      </svg>
      <div class="cmside">
        <div class="cmdays">${legend}</div>
        ${waiting.length?`<div class="cmwait"><i></i>${waiting.length} on the waiting list</div>`:""}
        ${notes.length?`<p class="cmnote">${esc(notes.join(" "))}</p>`:""}
        ${focus?`<button class="btn sm" data-act="cityfocus" data-city="${city.id}" data-day="">Show all days</button>`:""}
      </div>
    </div>
  </div>`;
}

function coverageHTML(t){
  const maps = t.cities.map((c,i)=>cityMapHTML(t, c, i)).filter(Boolean);
  if(!maps.length) return "";
  return `<details class="coverage" ${maps.length?"open":""}>
    <summary>Coverage by city<span>where each day takes you</span></summary>
    ${maps.join("")}
  </details>`;
}
/* Its own tab: it answers "have I seen enough of this city", which is a
   different question from "what am I doing on Tuesday". */
function coverTabHTML(t){
  const maps = t.cities.map((c,i)=>cityMapHTML(t, c, i)).filter(Boolean);
  if(!maps.length){
    return `<div class="nodays"><h3>Nothing to draw yet</h3>
      <p>This builds a map per city as you put real places on the calendar. Pick a few
         from the deck or pin your own, and the shape of each city fills in.</p></div>`;
  }
  return `<div class="covertab">
    <p class="covintro">Everywhere you've planned to be, city by city, with each day drawn on top
      of the last. Overlapping days mean you're covering the same ground twice.</p>
    ${maps.join("")}
  </div>`;
}

function dayMapHTML(t, day){
  const pts = dayPoints(t, day);
  const city = cityById(t, computeDayCities(t)[day]);
  if(!pts.length){
    return `<div class="daymap empty">Nothing with a location on this day yet — pick real places and they'll appear here.</div>`;
  }
  const W = 340, H = 128, PAD = 16;
  // frame the day's own stops; the city marker is a bonus if it happens to fit
  const lats = pts.map(p=>p.lat), lons = pts.map(p=>p.lon);
  const latC = (Math.min.apply(null,lats)+Math.max.apply(null,lats))/2;
  const cosL = Math.cos(latC*Math.PI/180) || 1;
  const lonC = (Math.min.apply(null,lons)+Math.max.apply(null,lons))/2;

  // never zoom in so far that a tight cluster looks spread out
  const MIN_SPAN_DEG = 0.008;                       // roughly 900m
  const spanY = Math.max(Math.max.apply(null,lats)-Math.min.apply(null,lats), MIN_SPAN_DEG);
  const spanX = Math.max((Math.max.apply(null,lons)-Math.min.apply(null,lons))*cosL, MIN_SPAN_DEG);
  const scale = Math.min((W-PAD*2)/spanX, (H-PAD*2)/spanY);
  const X = lon => W/2 + (lon-lonC)*cosL*scale;
  const Y = lat => H/2 - (lat-latC)*scale;

  const unitsPerKm = scale/111.32;
  const want = (W*0.28)/unitsPerKm;
  let barKm = SCALE_STEPS[0];
  SCALE_STEPS.forEach(v=>{ if(v <= want) barKm = v; });
  const barPx = barKm*unitsPerKm;

  // the city marker is only useful if it actually lands on the map
  const cx0 = city && city.lat!=null ? X(city.lon) : null;
  const cy0 = city && city.lat!=null ? Y(city.lat) : null;
  const cityInFrame = cx0!=null && cx0 > 6 && cx0 < W-46 && cy0 > 10 && cy0 < H-14;
  const cityDot = (cityInFrame && pts.length>1)
    ? `<g opacity=".45"><circle cx="${cx0.toFixed(1)}" cy="${cy0.toFixed(1)}" r="3.5"
         fill="none" stroke="var(--ink2)" stroke-width="1"/>
       <text x="${(cx0+6).toFixed(1)}" y="${(cy0+3).toFixed(1)}" font-size="7.5"
         fill="var(--ink2)">${esc(city.name)}</text></g>` : "";

  const path = pts.length>1
    ? `<polyline points="${pts.map(p=>X(p.lon).toFixed(1)+","+Y(p.lat).toFixed(1)).join(" ")}"
        fill="none" stroke="var(--ink2)" stroke-width="1.2" stroke-dasharray="3 3" opacity=".55"/>` : "";

  const dots = pts.map((p,i)=>{
    const c = MAP_KIND_COLOR[p.m.kind] || MAP_KIND_COLOR.note;
    return `<g><circle cx="${X(p.lon).toFixed(1)}" cy="${Y(p.lat).toFixed(1)}" r="8.5"
        fill="${c}" stroke="var(--paper2)" stroke-width="1.5"${p.m.optional?' opacity=".6"':''}>
        <title>${esc(p.m.label)}</title></circle>
      <text x="${X(p.lon).toFixed(1)}" y="${(Y(p.lat)+3).toFixed(1)}" text-anchor="middle"
        font-size="9" font-weight="700" fill="#fff">${i+1}</text></g>`;
  }).join("");

  // how far apart the day actually is
  let far = 0;
  for(let i=1;i<pts.length;i++){
    const d = haversine(pts[i-1], pts[i]);
    if(d!=null) far += d;
  }
  const legend = pts.map((p,i)=>
    `<span class="dmleg"><i style="background:${MAP_KIND_COLOR[p.m.kind]||MAP_KIND_COLOR.note}">${i+1}</i>${esc(p.m.label)}</span>`
  ).join("");
  const gmaps = "https://www.google.com/maps/dir/" +
    pts.filter(isPoint).map(p=>p.lat.toFixed(5)+","+p.lon.toFixed(5)).join("/");

  return `<div class="daymap">
    <svg viewBox="0 0 ${W} ${H}" class="dmsvg" role="img" aria-label="Map of this day's stops">
      <rect x="0" y="0" width="${W}" height="${H}" fill="var(--paper)" rx="8"/>
      <g opacity=".5">${[0.25,0.5,0.75].map(f=>
        `<line x1="0" y1="${(H*f).toFixed(0)}" x2="${W}" y2="${(H*f).toFixed(0)}" stroke="var(--line)" stroke-width=".5"/>
         <line x1="${(W*f).toFixed(0)}" y1="0" x2="${(W*f).toFixed(0)}" y2="${H}" stroke="var(--line)" stroke-width=".5"/>`).join("")}</g>
      ${cityDot}${path}${dots}
      <g transform="translate(10,${H-9})">
        <line x1="0" y1="0" x2="${barPx.toFixed(1)}" y2="0" stroke="var(--ink2)" stroke-width="1.5"/>
        <line x1="0" y1="-3" x2="0" y2="3" stroke="var(--ink2)" stroke-width="1.5"/>
        <line x1="${barPx.toFixed(1)}" y1="-3" x2="${barPx.toFixed(1)}" y2="3" stroke="var(--ink2)" stroke-width="1.5"/>
        <text x="${(barPx+5).toFixed(1)}" y="3" font-size="8" fill="var(--ink2)">${barKm<1?(barKm*1000)+"m":barKm+"km"}</text>
      </g>
      <text x="${W-11}" y="16" text-anchor="middle" font-size="9" fill="var(--ink2)" opacity=".7">N</text>
      <path d="M${W-11} 18 l0 7 M${W-11} 18 l-2.5 3 M${W-11} 18 l2.5 3" stroke="var(--ink2)" stroke-width="1"
        fill="none" opacity=".7"/>
    </svg>
    <div class="dmside">
      <div class="dmlegs">${legend}</div>
      ${pts.length>1?`<div class="dmspread ${far>12?"wide":""}">${far<1?Math.round(far*1000)+"m":far.toFixed(1)+"km"} of ground${far>12?" — that's a lot for one day":""}</div>`:""}
      <div class="dmacts">
        ${pts.length>1?`<button class="btn sm" data-act="optday" data-day="${day}">Optimise order</button>`:""}
        <a class="dmlink" href="${gmaps}" target="_blank" rel="noopener">Open in Maps →</a>
      </div>
    </div>
  </div>`;
}

/* =========================================================
   5o2. WHERE YOU ARE SLEEPING
   A hotel covers nights, not days, which is why this is its own strip rather
   than another row on the overview: a week in Beijing across two hotels is the
   normal case, and the thing you actually need to see is whether every night
   has a bed. Pencilled options and confirmed bookings live together on purpose
   — you compare them in the same place you commit.
   ========================================================= */
const STAY_TINTS = ["#5B8DB8","#4F9D69","#B07BA8","#C98A3E","#5E8C8C","#A2705E"];
const MAX_STAY_IMAGES = 4;
const stayTint = i => STAY_TINTS[i % STAY_TINTS.length];

function stays(t){ return t.stays || (t.stays = []); }
/* the row is only so wide, so "3p" rather than "3:00pm" */
function shortTime(v){
  if(!v) return "";
  const [h,m] = v.split(":").map(Number);
  if(!isNum(h)) return "";
  const ap = h >= 12 ? "p" : "a";
  const hh = h % 12 === 0 ? 12 : h % 12;
  return hh + (m ? ":" + d2(m) : "") + ap;
}
function stayById(t, id){ return stays(t).find(x=>x.id===id) || null; }
function tripNights(t, days){
  const d = days || tripDays(t);
  return d.length > 1 ? d.slice(0, -1) : [];
}
/* the night of the 12th belongs to a stay checking in on the 12th and out on
   the 13th, so the range is closed at the front and open at the back */
function stayNights(st){
  if(!st || !st.from || !st.to) return [];
  const n = daysBetween(st.from, st.to);
  if(!(n > 0) || n > MAX_TRIP_DAYS) return [];
  const out = [];
  for(let i=0;i<n;i++) out.push(addDays(st.from, i));
  return out;
}
function stayCovers(st, night){ return stayNights(st).indexOf(night) >= 0; }
function bookedOn(t, night){
  return stays(t).filter(st=>st.status==="booked" && stayCovers(st, night));
}
function stayGaps(t, days){
  return tripNights(t, days).filter(n=>bookedOn(t, n).length === 0);
}
function stayClashes(t, days){
  return tripNights(t, days).filter(n=>bookedOn(t, n).length > 1);
}
function stayNightCount(st){ return stayNights(st).length; }

function newStay(t, days){
  const nights = tripNights(t, days);
  const gap = stayGaps(t, days)[0] || nights[0] || t.arr.date;
  // run the new stay to the end of the unbooked run it starts, so the common
  // case — filling the hole you can see — takes one click
  let end = gap;
  while(nights.indexOf(end) >= 0 && bookedOn(t, end).length === 0) end = addDays(end, 1);
  const st = {id:uid(), name:"", area:"", cityId:(computeDayCities(t)[gap] || (t.cities[0]||{}).id || ""),
              from:gap, to:end > gap ? end : addDays(gap, 1),
              checkIn:"15:00", checkOut:"11:00", status:"idea",
              link:"", note:"", images:[]};
  stays(t).push(st);
  save();
  openStay(st.id);
}

function stayCityName(t, st){
  const c = t.cities.find(x=>x.id===st.cityId);
  return c ? c.name : "";
}
function stayWhere(t, st){
  const bits = [st.area, stayCityName(t, st)].filter(x=>(x||"").trim());
  return bits.join(", ");
}

function staysHTML(t, days){
  if(!days.length) return "";
  const nights = tripNights(t, days);
  const list = stays(t);
  const gaps = stayGaps(t, days);
  const booked = list.filter(st=>st.status==="booked");
  const ideas = list.filter(st=>st.status!=="booked");

  const head = days.map((d,i)=>{
    const dt = parseD(d);
    return `<div class="sth ${i===days.length-1?"last":""}">
      <span class="ovdow">${DOW[dt.getDay()][0]}</span>
      <span class="ovnum">${dt.getDate()}</span>
    </div>`;
  }).join("");

  const rows = list.map((st,i)=>{
    const mine = stayNights(st);
    const open = stayOpen[st.id];
    const times = (st.checkIn || st.checkOut)
      ? `<span class="sttimes" title="Check in ${st.checkIn?esc(fmt12(st.checkIn)):"—"}, check out ${st.checkOut?esc(fmt12(st.checkOut)):"—"}">
          <b>${st.checkIn?esc(shortTime(st.checkIn)):"—"}</b><i>→</i><b>${st.checkOut?esc(shortTime(st.checkOut)):"—"}</b>
        </span>`
      : `<button class="sttimes none" data-act="stayopen" data-stay="${st.id}"
           title="No check-in or check-out time set yet">set times</button>`;
    const cells = days.map((d,ix)=>{
      const last = ix === days.length-1;
      const on = !last && mine.indexOf(d) >= 0;
      const prev = on && mine.indexOf(days[ix-1]) >= 0;
      const next = on && ix < days.length-2 && mine.indexOf(days[ix+1]) >= 0;
      const cls = ["stc", st.status==="booked"?"booked":"idea"];
      if(on) cls.push("on");
      if(on && !prev) cls.push("start");
      if(on && !next) cls.push("end");
      if(last) cls.push("last");
      return `<button class="${cls.join(" ")}"
        style="--tint:${stayTint(i)}" data-act="stayset" data-stay="${st.id}" data-night="${d}"
        ${last?"disabled":""}
        title="${last?"You check out this morning":esc((st.name||"This hotel")+" — night of "+dayLabel(d))}"></button>`;
    }).join("");
    const n = stayNightCount(st);
    return `<div class="stitem ${open?"open":""}"><div class="strow">
      <button class="stname ${st.status==="booked"?"booked":""} ${open?"open":""}"
        style="--tint:${stayTint(i)}"
        data-act="stayexpand" data-stay="${st.id}"
        title="${open?"Hide the details":"Show the details"}">
        <span class="stcaret">${open?"▾":"▸"}</span>
        <span class="stdot"></span>
        <span class="sttext">${esc(st.name || "Untitled hotel")}</span>
        ${(st.images||[]).length?`<span class="stshots" title="${(st.images||[]).length} screenshot(s)">▣</span>`:""}
      </button>
      <div class="stcells">${cells}</div>
      <div class="stmeta">
        ${times}
        ${st.link
          ? `<button class="stlink" data-act="stayrowlink" data-stay="${st.id}"
               title="Open the booking for ${esc(st.name || "this hotel")}">↗</button>`
          : `<button class="stlink off" data-act="stayopen" data-stay="${st.id}"
               title="No link saved yet — click to add one">↗</button>`}
        <span class="stn ${n?"":"zero"}">${n?n+"n":"—"}</span>
      </div>
    </div>${open ? stayDetailHTML(t, st, i) : ""}</div>`;
  }).join("");

  const clashes = stayClashes(t, days);
  const summary = !list.length
    ? "nothing logged yet"
    : [booked.length ? booked.length + " booked" : "",
       ideas.length ? ideas.length + " pencilled in" : "",
       nights.length ? (gaps.length ? gaps.length + " night" + (gaps.length>1?"s":"") + " with no bed"
                                    : "every night covered") : ""
      ].filter(Boolean).join(" · ");

  return `<details class="stays" ${list.length?"open":""}>
    <summary>Hotels<span>${esc(summary)}</span></summary>
    ${list.length ? `<div class="stgrid">
      <div class="strow sthead"><div class="stname flat"></div>
        <div class="stcells">${head}</div>
        <div class="stmeta"><span class="sttimes flat">in / out</span>
          <span class="stlink flat"></span><span class="stn">n</span></div></div>
      ${rows}
    </div>` : `<p class="stempty">No beds logged yet. Add the places you're considering as well as the
      ones you've booked — pencilled options sit alongside confirmed ones so you can compare them.</p>`}
    ${gaps.length ? `<p class="stwarn">No booking yet for ${esc(gapSummary(gaps))}.</p>` : ""}
    ${clashes.length ? `<p class="stwarn soft">Two confirmed bookings overlap on ${esc(gapSummary(clashes))}
      — worth a check.</p>` : ""}
    <div class="stacts">
      <button class="btn sm" data-act="stayadd">+ add a hotel</button>
      ${list.length ? `<span class="sthint">Drag across the strip to change which nights a hotel covers.</span>` : ""}
    </div>
  </details>`;
}

/* ---------- reading a hotel without opening the editor ----------
   Checking where you're staying is a glance; changing it is a decision. They
   shouldn't cost the same number of clicks. */
let stayOpen = {};
function stayDetailHTML(t, st, i){
  const nights = stayNights(st);
  const where = stayWhere(t, st);
  const imgs = st.images || [];
  const fact = (label, value, cls) => value
    ? `<div class="sdf ${cls||""}"><dt>${esc(label)}</dt><dd>${value}</dd></div>` : "";
  return `<div class="stdetail" style="--tint:${stayTint(i)}">
    <dl class="sdfacts">
      ${fact("Status", st.status==="booked"
        ? '<b class="sdbooked">Booked</b>'
        : '<b class="sdidea">Pencilled in</b>')}
      ${fact("Where", esc(where) || '<span class="sdnone">not set</span>')}
      ${fact("Nights", nights.length
        ? esc(gapSummary(nights)) + ' <span class="sdn">' + nights.length + " night" +
          (nights.length>1?"s":"") + "</span>"
        : '<span class="sdnone">dates need fixing</span>')}
      ${fact("Check in", st.checkIn ? esc(fmt12(st.checkIn)) + ' <span class="sdn">' +
        esc(dayLabel(st.from)) + "</span>" : '<span class="sdnone">no time set</span>')}
      ${fact("Check out", st.checkOut ? esc(fmt12(st.checkOut)) + ' <span class="sdn">' +
        (st.to ? esc(dayLabel(st.to)) : "") + "</span>" : '<span class="sdnone">no time set</span>')}
    </dl>
    ${st.note ? `<p class="sdnote">${esc(st.note)}</p>` : ""}
    ${imgs.length ? `<div class="dithumbs sdshots">${imgs.map(im=>
      `<button class="dithumb" data-act="stayshot" data-stay="${st.id}" data-img="${im.id}"
         title="${esc(im.caption||"Open this screenshot")}">${imageSVG(im)}
         ${(im.strokes||[]).length?`<span class="dimark">${im.strokes.length}</span>`:""}</button>`).join("")}</div>` : ""}
    <div class="sdacts">
      ${st.link ? `<button class="btn sm" data-act="stayrowlink" data-stay="${st.id}">Open booking ↗</button>` : ""}
      <button class="btn sm" data-act="stayopen" data-stay="${st.id}">Edit</button>
    </div>
  </div>`;
}

/* "Sep 12–14 and Sep 19" reads better than a list of fifteen dates */
function gapSummary(nights){
  if(!nights.length) return "";
  const runs = [];
  nights.forEach(n=>{
    const last = runs[runs.length-1];
    if(last && addDays(last[1], 1) === n) last[1] = n;
    else runs.push([n, n]);
  });
  const parts = runs.map(([a,b]) => a===b ? dayLabel(a) : dayLabel(a) + "–" + dayLabel(b));
  if(parts.length === 1) return parts[0];
  return parts.slice(0,-1).join(", ") + " and " + parts[parts.length-1];
}

/* ---------- dragging a stay across the nights ---------- */
let stayDrag = null;
function wireStays(){
  const cells = document.querySelectorAll(".stc[data-stay]");
  if(!cells.length) return;
  cells.forEach(cell=>{
    cell.addEventListener("pointerdown", e=>{
      const night = cell.getAttribute("data-night");
      stayDrag = {id: cell.getAttribute("data-stay"), anchor: night, moved:false};
      e.preventDefault();
    });
    cell.addEventListener("pointerenter", e=>{
      if(!stayDrag || !(e.buttons & 1)) return;
      if(cell.getAttribute("data-stay") !== stayDrag.id) return;
      stayDrag.moved = true;
      setStayRange(stayDrag.id, stayDrag.anchor, cell.getAttribute("data-night"));
    });
  });
  armDragRelease();
}
function setStayRange(id, a, b){
  const t = trip();
  const st = stayById(t, id);
  if(!st) return;
  const from = a < b ? a : b;
  const to   = a < b ? b : a;
  st.from = from;
  st.to = addDays(to, 1);          // the night of `to` ends the morning after
}

function openStayLink(st){
  const url = st && (st.link||"").trim();
  if(!url){ toast("No link saved yet"); return; }
  if(!/^https?:\/\//i.test(url)){ toast("That doesn't look like a web address — it needs to start with http"); return; }
  window.open(url, "_blank", "noopener");
}

/* ---------- one hotel, up close ---------- */
let stayEdit = null;
function openStay(id){
  const t = trip();
  if(!stayById(t, id)) return;
  stayEdit = id;
  drawStay();
}
function stayTimeSelect(which, value){
  const v = (value||"").trim();
  const hh = v ? v.split(":")[0] : "";
  const mm = v && v.split(":")[1] === "30" ? "30" : "00";
  return `<div class="timepick">
    <select class="inp" id="st-${which}-h">
      <option value="" ${v?"":"selected"}>not set</option>
      ${HOUR_LABELS.map(h=>`<option value="${h.v}" ${h.v===hh?"selected":""}>${h.label}</option>`).join("")}
    </select>
    <select class="inp" id="st-${which}-m">
      <option value="00" ${mm==="00"?"selected":""}>:00</option>
      <option value="30" ${mm==="30"?"selected":""}>:30</option>
    </select>
  </div>`;
}
function drawStay(){
  const t = trip();
  const st = stayById(t, stayEdit);
  if(!st){ closeModal(); stayEdit = null; return; }
  const n = stayNightCount(st);
  const imgs = st.images || [];
  const cityOpts = `<option value="">no city set</option>` + t.cities.map(c=>
    `<option value="${c.id}" ${c.id===st.cityId?"selected":""}>${esc(c.name)}</option>`).join("");
  openModal(`<div class="stayed">
    <div class="annohead">
      <h3>${esc(st.name || "New hotel")}</h3>
      <div class="stswitch">
        <button class="tbtn ${st.status!=="booked"?"on":""}" data-act="staystatus" data-status="idea">Pencilled in</button>
        <button class="tbtn ${st.status==="booked"?"on":""}" data-act="staystatus" data-status="booked">Booked</button>
      </div>
    </div>
    <div class="field"><label>Hotel</label>
      <input class="inp" id="st-name" value="${esc(st.name||"")}" placeholder="Which hotel"></div>
    <div class="row2">
      <div class="field"><label>Area</label>
        <input class="inp" id="st-area" value="${esc(st.area||"")}" placeholder="Neighbourhood or street"></div>
      <div class="field"><label>City</label>
        <select class="inp" id="st-city">${cityOpts}</select></div>
    </div>
    <div class="row2">
      <div class="field"><label>Check in</label>
        <input class="inp" type="date" id="st-from" value="${esc(st.from||"")}"></div>
      <div class="field"><label>Check out</label>
        <input class="inp" type="date" id="st-to" value="${esc(st.to||"")}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Check-in time</label>${stayTimeSelect("in", st.checkIn)}</div>
      <div class="field"><label>Check-out time</label>${stayTimeSelect("out", st.checkOut)}</div>
    </div>
    <p class="stnights ${n?"":"bad"}">${n
      ? n + " night" + (n>1?"s":"") + " — " + esc(gapSummary(stayNights(st)))
      : "Check-out needs to be after check-in."}</p>
    <div class="field"><label>Link</label>
      <div class="stlinkrow">
        <input class="inp" id="st-link" value="${esc(st.link||"")}" placeholder="Paste the booking or listing link">
        ${st.link ? `<button class="btn sm" data-act="stayopenlink" data-stay="${st.id}">Open ↗</button>` : ""}
      </div></div>
    <div class="field"><label>Notes</label>
      <textarea class="inp" id="st-note" rows="3"
        placeholder="Cancellation deadline, price, breakfast, what put you off">${esc(st.note||"")}</textarea></div>
    <div class="field"><label>Screenshots<span class="cnt">${imgs.length}/${MAX_STAY_IMAGES}</span></label>
      <div class="dithumbs">
        ${imgs.map(im=>`<button class="dithumb" data-act="stayshot" data-stay="${st.id}" data-img="${im.id}"
            title="${esc(im.caption||"Click to view or draw on it")}">
            ${imageSVG(im)}
            ${(im.strokes||[]).length?`<span class="dimark">${im.strokes.length}</span>`:""}
          </button>`).join("")}
        ${imgs.length < MAX_STAY_IMAGES
          ? `<button class="diadd" data-act="stayaddshot" data-stay="${st.id}">+<span>add</span></button>` : ""}
      </div></div>
    <div class="modrow">
      <button class="btn danger left" data-act="staydel" data-stay="${st.id}">Delete</button>
      <button class="btn primary" data-act="staysave">Done</button>
    </div>
  </div>`);
}
function readStay(){
  const t = trip();
  const st = stayById(t, stayEdit);
  if(!st) return null;
  const g = id => { const el = document.getElementById(id); return el ? el.value : null; };
  const nm = g("st-name");   if(nm !== null) st.name = nm.trim();
  const ar = g("st-area");   if(ar !== null) st.area = ar.trim();
  const ci = g("st-city");   if(ci !== null) st.cityId = ci;
  const fr = g("st-from");   if(fr) st.from = fr;
  const to = g("st-to");     if(to) st.to = to;
  const ln = g("st-link");   if(ln !== null) st.link = ln.trim();
  const nt = g("st-note");   if(nt !== null) st.note = nt;
  ["in","out"].forEach(w=>{
    const h = g("st-"+w+"-h"), m = g("st-"+w+"-m");
    if(h === null) return;
    const key = w === "in" ? "checkIn" : "checkOut";
    st[key] = h ? h + ":" + (m || "00") : "";
  });
  return st;
}

function calendarHTML(t, days){
  if(!days.length) return noDaysHTML(t);
  const dayCities = computeDayCities(t);
  const overview = overviewHTML(t, days);
  const today = todayStr();
  const nFold = days.filter(d=>dayFolded(t, d)).length;
  const nLock = days.filter(d=>dayLocked(t, d)).length;
  const bits = [];
  if(nFold) bits.push(nFold + " folded");
  if(nLock) bits.push(nLock + " finalised");
  const tools = `<div class="caltools">
    <span class="ctlab">Days</span>
    <button class="ctbtn" data-act="foldall" data-mode="all" ${nFold===days.length?"disabled":""}
      title="Fold every day to a single line">Fold all</button>
    <button class="ctbtn" data-act="foldall" data-mode="none" ${nFold?"":"disabled"}
      title="Open every day back up">Open all</button>
    ${nLock ? `<button class="ctbtn" data-act="foldall" data-mode="locked"
      title="Get the settled days out of the way">Fold the finalised</button>` : ""}
    <span class="ctnote">${esc(bits.join(" \u00b7 "))}</span>
  </div>`;
  return overview + staysHTML(t, days) + tools + `<div class="cal">` +
    days.map((d,i)=>dayCardHTML(t, d, i, days, dayCities[d], today)).join("") + `</div>`;
}

/* One day. Two things change its shape: folded (one line instead of a card) and
   finalised (everything still shows, nothing can be moved). They compose — a
   finalised day can be folded away, which is the usual reason to fold one. */
function dayCardHTML(t, d, i, days, cid, today){
  const locked = dayLocked(t, d);
  const folded = dayFolded(t, d);
  const cls = ["day"];
  if(d===today) cls.push("today");
  if(locked) cls.push("locked");
  if(folded) cls.push("folded");
  const dropAttr = (folded && !locked) ? ` data-drop="cal:${d}:same"` : "";
  return `<div class="${cls.join(" ")}"${dropAttr}>
    ${dayHeadHTML(t, d, i, days, cid, folded, locked)}
    ${folded ? dayFoldedHTML(t, d, locked) : dayOpenHTML(t, d, locked)}
  </div>`;
}

function dayHeadHTML(t, d, i, days, cid, folded, locked){
  const dt = parseD(d);
  const city = cityById(t, cid);
  const cityOpts = t.cities.map(c=>
    `<option value="${c.id}" ${c.id===cid?"selected":""}>${esc(c.name)}</option>`).join("");
  const n = t.magnets.filter(m=>m.board==="cal" && m.day===d && m.kind!=="fly").length;
  return `<div class="dayhead">
    <button class="dayfold" data-act="dayfold" data-day="${d}"
      title="${folded?"Open "+esc(dayLabel(d)):"Fold "+esc(dayLabel(d))+" away"}"
      aria-expanded="${folded?"false":"true"}">${folded?"\u25B8":"\u25BE"}</button>
    <span class="dnum">${MON[dt.getMonth()]} ${d2(dt.getDate())}</span>
    <span class="dow">${DOW[dt.getDay()]}</span>
    <span class="idx">Day ${i+1}</span>
    ${folded && n ? `<span class="idx">${n}</span>` : ""}
    <span class="daymove">
      <button class="mvbtn" data-act="moveday" data-day="${d}" data-dir="-1"
        ${i===0?"disabled":""} title="Swap this day's plan with ${i===0?"":esc(dayLabel(days[i-1]))}">\u2191</button>
      <button class="mvbtn" data-act="moveday" data-day="${d}" data-dir="1"
        ${i===days.length-1?"disabled":""} title="Swap this day's plan with ${i===days.length-1?"":esc(dayLabel(days[i+1]))}">\u2193</button>
    </span>
    <button class="lockbtn ${locked?"on":""}" data-act="daylock" data-day="${d}"
      title="${locked?"Finalised \u2014 click to unlock this day":"Plans finalised? Lock this day so nothing moves"}"
      >${locked?"\u{1F512}":"\u{1F513}"}</button>
    ${locked ? `<span class="finchip">finalised</span>` : ""}
    ${locked
      ? `<span class="basecity" title="Unlock the day to change the city">${esc(city?city.name:"\u2014")}</span>`
      : `<select class="basecity" data-act="setcity" data-day="${d}">${cityOpts}</select>`}
    <div class="wx">${wxHTML(t, d, cid)}</div>
  </div>`;
}

/* Folded: one readable line, and — only while something is being dragged — a row
   of slot targets, so a fold never costs you a drop. */
function dayFoldedHTML(t, d, locked){
  const s = daySummary(t, d);
  const items = s.acts.concat(s.meals);
  const chips = items.slice(0,4).map(m=>
    `<span class="dsumchip" style="--c:var(--m-${m.kind})" data-mag="${m.id}"
       draggable="${(locked || m.locked)?"false":"true"}"
       title="${esc(m.label)}${locked?"":" — drag it somewhere else, or click to open it"}"
       ><i></i>${esc(m.label)}</span>`).join("");
  const more = items.length>4 ? `<span class="dsumn">+${items.length-4} more</span>` : "";
  const extras = [];
  if(s.trans.length) extras.push(s.trans.length + (s.trans.length===1?" transfer":" transfers"));
  if(s.stickies)     extras.push(s.stickies + (s.stickies===1?" sticky":" stickies"));
  if(s.notes)        extras.push("a day note");
  if(s.images)       extras.push(s.images + (s.images===1?" image":" images"));
  const tail = extras.length ? `<span class="dsumn">\u00b7 ${esc(extras.join(" \u00b7 "))}</span>` : "";
  const line = items.length
    ? chips + more + tail
    : `<span class="dsumn">${locked?"Finalised as an empty day":"Nothing planned yet"}${
        extras.length ? " \u00b7 " + esc(extras.join(" \u00b7 ")) : ""}</span>`;
  // no slot picker down here: the whole folded card takes a drop (keeping the slot
  // the thing already had) and the rail is where you pick a different one
  return `<div class="dsum">${line}</div>`;
}
