function askResultsHTML(t){
  const rs = guide.results;
  if(!rs.length) return `<div class="askout"><p class="msub">Nothing in the reports matches that.
    Try fewer words, or hand the question to Claude with the button below.</p>
    <button class="btn sm" data-act="copyask">Copy question and context for Claude</button></div>`;
  return `<div class="askout">
    <div class="traygroup">${rs.length} passage${rs.length===1?"":"s"} from your reports</div>
    ${rs.map(h=>`<div class="askhit">
      <div class="ah"><b>${esc(h.title)}</b><span>${esc(h.city)} · ${esc(h.section)}</span></div>
      <p>${esc(h.text.length>380 ? h.text.slice(0,377)+"…" : h.text)}</p>
    </div>`).join("")}
    <button class="btn sm" data-act="copyask" style="margin-top:10px">Copy question and context for Claude</button>
  </div>`;
}

/* ---------- rendering one report ---------- */
function rlist(arr, fn){ return (arr||[]).map(fn).join(""); }
function rsec(title, inner){ return inner ? `<section class="rsec"><h3>${title}</h3>${inner}</section>` : ""; }
function chips(arr){ return `<div class="rchips">${rlist(arr,x=>`<span>${esc(x)}</span>`)}</div>`; }
function bullets(arr){ return `<ul class="rbul">${rlist(arr,x=>`<li>${esc(x)}</li>`)}</ul>`; }
function labelClass(l){ return (l||"").toLowerCase().indexOf("essential")===0 ? "ess"
  : (l||"").toLowerCase().indexOf("recommended")===0 ? "rec" : "opt"; }

function reportHTML(r){
  if(!r) return "";
  const g = r.glance||{}, h = r.history||{}, td = r.thingsToDo||{}, p = r.practical||{}, q = r.quickRef||{};
  const doGroup = (title, arr) => arr && arr.length ? `<h4 class="rsub">${title}</h4>
    <div class="rcards">${rlist(arr, x=>`<div class="rcard">
      <b>${esc(x.name)}</b>${x.area?`<span class="rarea">${esc(x.area)}</span>`:""}
      <p>${esc(x.why||x.character||"")}</p>
      ${x.mins?`<em>${esc(durLabel(x.mins))}</em>`:""}
    </div>`)}</div>` : "";
  const rest = (title, arr) => arr && arr.length ? `<h4 class="rsub">${title}</h4>
    <div class="rcards">${rlist(arr, x=>`<div class="rcard">
      <b>${esc(x.name)}</b><span class="rarea">${esc(x.cuisine||"")}${x.price?" · "+esc(x.price):""}${x.area?" · "+esc(x.area):""}</span>
      <p>${esc(x.desc||"")}</p>
      ${x.dishes?`<p class="rmeta"><b>Order</b> ${esc(x.dishes)}</p>`:""}
      ${x.whyGo?`<p class="rmeta"><b>Why</b> ${esc(x.whyGo)}</p>`:""}
      ${x.booking?`<em>Booking: ${esc(x.booking)}</em>`:""}
    </div>`)}</div>` : "";

  const origin = REPORT_ORIGIN[reportSlug(r.city)];
  const originTag = origin === "builtin"
    ? `<span class="rorigin" title="Ships with this file. Put your own ${esc(reportSlug(r.city))}.json in a linked folder and it takes over.">built in</span>`
    : origin === "pasted" ? `<span class="rorigin">pasted in</span>`
    : origin === "folder" ? `<span class="rorigin">from ${esc(reportDirName||"your folder")}</span>` : "";
  return `<article class="report">
    <header class="rhead">
      <h2>${esc(r.city)}${originTag}</h2>
      <p>${esc(g.why||"")}</p>
      <div class="rfacts">
        ${g.idealStay?`<span><b>Ideal stay</b>${esc(g.idealStay)}</span>`:""}
        ${g.bestFor?`<span><b>Best for</b>${esc(g.bestFor.join(", "))}</span>`:""}
      </div>
      ${g.character?chips(g.character):""}
      ${r.note?`<p class="rnote">${esc(r.note)}</p>`:""}
    </header>

    ${rsec("Don't miss", g.dontMiss?bullets(g.dontMiss):"")}

    ${rsec("A little history", `
      ${h.story?`<p>${esc(h.story)}</p>`:""}
      ${h.origins?`<p><b>Origins.</b> ${esc(h.origins)}</p>`:""}
      ${rlist(h.periods, x=>`<p><b>${esc(x.name)}.</b> ${esc(x.text)}</p>`)}
      ${h.modern?`<p><b>Modern transformation.</b> ${esc(h.modern)}</p>`:""}
      ${h.whyItMatters?`<p><b>Why it matters today.</b> ${esc(h.whyItMatters)}</p>`:""}
      ${h.visible?`<h4 class="rsub">History you can actually see</h4>${bullets(h.visible)}`:""}`)}

    ${rsec("Things to do", `
      ${doGroup("Historic and cultural", td.historic)}
      ${doGroup("Arts, museums and culture", td.arts)}
      ${td.neighbourhoods&&td.neighbourhoods.length?`<h4 class="rsub">Neighbourhoods worth wandering</h4>
        <div class="rcards">${rlist(td.neighbourhoods, x=>`<div class="rcard">
          <b>${esc(x.name)}</b><span class="rarea">${esc(x.character||"")}</span>
          ${x.highlights?`<p class="rmeta"><b>Highlights</b> ${esc(x.highlights)}</p>`:""}
          ${x.food?`<p class="rmeta"><b>Food</b> ${esc(x.food)}</p>`:""}
          ${x.bestTime?`<p class="rmeta"><b>Best time</b> ${esc(x.bestTime)}</p>`:""}
          ${x.mins?`<em>${esc(durLabel(x.mins))}</em>`:""}
        </div>`)}</div>`:""}
      ${doGroup("Parks and nature", td.nature)}
      ${doGroup("Shopping and markets", td.shopping)}
      ${doGroup("Nightlife and evening", td.nightlife)}`)}

    ${rsec("The essential ten", r.essential10?`<ol class="ress">${rlist(r.essential10, x=>`<li>
      <div class="eh"><b>${esc(x.name)}</b>
        <span class="elab ${labelClass(x.label)}">${esc(x.label||"")}</span></div>
      <p>${esc(x.why||"")}</p>
      <div class="escores">
        ${x.mins?`<span>${esc(durLabel(x.mins))}</span>`:""}
        ${x.popularity?`<span>Popularity ${x.popularity}/5</span>`:""}
        ${x.cultural?`<span>Cultural ${x.cultural}/5</span>`:""}
        ${x.worth?`<span>Worth your time ${x.worth}/5</span>`:""}
      </div></li>`)}</ol>`:"")}

    ${rsec("Food guide", `
      ${r.food&&r.food.identity?`<p>${esc(r.food.identity)}</p>`:""}
      ${r.food&&r.food.mustTry?`<div class="rcards">${rlist(r.food.mustTry, x=>`<div class="rcard">
        <b>${esc(x.dish)}</b>${x.importance?`<span class="elab ${labelClass(x.importance)}">${esc(x.importance)}</span>`:""}
        <p>${esc(x.what||"")}</p>
        ${x.why?`<p class="rmeta"><b>Why</b> ${esc(x.why)}</p>`:""}
        ${x.flavour?`<p class="rmeta"><b>Tastes like</b> ${esc(x.flavour)}</p>`:""}
        ${x.howLocalsEat?`<p class="rmeta"><b>How locals eat it</b> ${esc(x.howLocalsEat)}</p>`:""}
      </div>`)}</div>`:""}`)}

    ${rsec("Must-eat shortlist", r.mustEat10?`<table class="rtab"><tbody>${rlist(r.mustEat10, x=>`<tr>
      <th>${esc(x.dish)}</th>
      <td><b>${esc(x.where||"")}</b><br>${esc(x.order||"")}</td>
      <td class="rprice">${esc(x.price||"")}</td></tr>`)}</tbody></table>`:"")}

    ${rsec("Restaurant shortlist", r.restaurants?`
      ${rest("Iconic / first visit", r.restaurants.iconic)}
      ${rest("Best food", r.restaurants.bestFood)}
      ${rest("Best value", r.restaurants.bestValue)}
      ${rest("Special occasion", r.restaurants.special)}
      ${rest("Casual local favourites", r.restaurants.casual)}
      ${rest("Cafes and tea houses", r.restaurants.cafes)}`:"")}

    ${rsec("Local experiences", r.experiences?`<div class="rcards">${rlist(r.experiences, x=>`<div class="rcard">
      <b>${esc(x.name)}</b>
      <p>${esc(x.what||"")}</p>
      ${x.why?`<p class="rmeta"><b>Why</b> ${esc(x.why)}</p>`:""}
      ${x.mins?`<em>${esc(durLabel(x.mins))}</em>`:""}</div>`)}</div>`:"")}

    ${rsec("Neighbourhood guide", r.neighbourhoodGuide?`<div class="rcards">${rlist(r.neighbourhoodGuide, x=>`<div class="rcard">
      <b>${esc(x.name)}</b><span class="rarea">${esc(x.vibe||"")}</span>
      ${x.bestFor?`<p class="rmeta"><b>Best for</b> ${esc(x.bestFor)}</p>`:""}
      ${x.sights?`<p class="rmeta"><b>Sights</b> ${esc(x.sights)}</p>`:""}
      ${x.food?`<p class="rmeta"><b>Food</b> ${esc(x.food)}</p>`:""}
      ${x.mins?`<em>${esc(durLabel(x.mins))}</em>`:""}</div>`)}</div>
      ${r.timeGuidance?`<h4 class="rsub">With limited time</h4>
        <p><b>Three days.</b> ${esc(r.timeGuidance.three||"")}</p>
        <p><b>Five or more.</b> ${esc(r.timeGuidance.fivePlus||"")}</p>`:""}`:"")}

    ${rsec("Day trips", r.dayTrips?`<div class="rcards">${rlist(r.dayTrips, x=>`<div class="rcard">
      <b>${esc(x.name)}</b><span class="elab ${/^worth/i.test(x.verdict||"")?"ess":/^skip/i.test(x.verdict||"")?"opt":"rec"}">${esc(x.verdict||"")}</span>
      <span class="rarea">${esc(x.travel||"")}${x.duration?" · "+esc(x.duration):""}</span>
      <p>${esc(x.why||"")}</p>
      ${x.suits?`<p class="rmeta"><b>Suits</b> ${esc(x.suits)}</p>`:""}
      ${x.logistics?`<p class="rmeta"><b>Logistics</b> ${esc(x.logistics)}</p>`:""}
    </div>`)}</div>`:"")}

    ${rsec("Practical context", `
      ${p.gettingAround?`<p><b>Getting around.</b> ${esc(p.gettingAround)}</p>`:""}
      ${p.whenToGo?`<p><b>When to go.</b> ${esc(p.whenToGo)}</p>`:""}
      ${p.howLong?`<h4 class="rsub">How long to stay</h4><table class="rtab"><tbody>
        <tr><th>1 day</th><td>${esc(p.howLong.one||"")}</td></tr>
        <tr><th>2-3 days</th><td>${esc(p.howLong.twoThree||"")}</td></tr>
        <tr><th>4-5 days</th><td>${esc(p.howLong.fourFive||"")}</td></tr>
        <tr><th>A week+</th><td>${esc(p.howLong.week||"")}</td></tr></tbody></table>`:""}
      ${p.culture?`<h4 class="rsub">Cultural notes</h4>${bullets(p.culture)}`:""}`)}

    ${rsec("What I'd actually do", r.whatIdDo?`<div class="rdays">${rlist(r.whatIdDo, x=>`<div class="rday">
      <b>${esc(x.day)}</b><p>${esc(x.plan)}</p></div>`)}</div>`:"")}

    ${rsec("Quick reference", q?`<div class="rquick">
      ${q.musts?`<div><b>Absolute musts</b>${bullets(q.musts)}</div>`:""}
      ${q.eats?`<div><b>Must-eat</b>${bullets(q.eats)}</div>`:""}
      ${q.areas?`<div><b>Key neighbourhoods</b>${bullets(q.areas)}</div>`:""}
      ${q.experiences?`<div><b>Best experiences</b>${bullets(q.experiences)}</div>`:""}
      ${q.dayTrip?`<div><b>Best day trip</b><p>${esc(q.dayTrip)}</p></div>`:""}
      ${q.stay?`<div><b>Ideal length of stay</b><p>${esc(q.stay)}</p></div>`:""}
    </div>`:"")}

    <footer class="rfoot">${esc(r.city)} report${r.generated?` · written ${esc(r.generated)}`:""}${r.by?` by ${esc(r.by)}`:""}</footer>
  </article>`;
}

/* ---------- pasting a report in ---------- */
let mealPick = null;
function openMealPicker(day, meal){
  const t = trip();
  const ctx = dayContext(t, day, null);
  const city = ctx.city;
  mealPick = {day, meal, osm:null, osmState:"idle"};
  drawMealPicker();
}
function drawMealPicker(){
  const t = trip();
  const {day, meal} = mealPick;
  const ctx = dayContext(t, day, null);
  const city = ctx.city;
  const label = meal === "lunch" ? "Lunch" : "Dinner";
  const r = city ? reportFor(city.name) : null;

  const chip = (name, note, lat, lon) =>
    `<button class="sugchip" data-act="setmeal" data-name="${esc(name)}" data-note="${esc(note||"")}"
       data-lat="${lat!=null?lat:""}" data-lon="${lon!=null?lon:""}">
      <span class="sn">${esc(name)}</span><span class="sm">${esc(note||"")}</span></button>`;

  let fromReport = "";
  if(r){
    const f = foodFromReport(r);
    const picks = [].concat(
      f.places.filter(x=>meal==="lunch" ? !/special/i.test(x.note) : true).slice(0,8),
      f.eat.slice(0,6));
    if(picks.length) fromReport = `<div class="traygroup">From the ${esc(city.name)} report</div>
      <div class="sugwrap">${picks.map(x=>{
        const co = reportCoord(r, x.label);
        return chip(x.label, x.note, co?co.lat:null, co?co.lon:null);
      }).join("")}</div>`;
  }
  const saved = t.magnets.filter(m=>m.board==="eats" && (m.col===ctx.cityId || m.col==="any"));
  const fromSaved = saved.length ? `<div class="traygroup" style="margin-top:10px">Already on your eat list</div>
    <div class="sugwrap">${saved.slice(0,10).map(m=>chip(m.label, m.note)).join("")}</div>` : "";

  const osmBlock =
    mealPick.osmState==="loading" ? `<div class="sugload">Looking for places near the rest of the day…</div>` :
    mealPick.osmState==="error" ? `<div class="sugload">Couldn't reach OpenStreetMap.</div>` :
    (mealPick.osm && mealPick.osm.length) ? `<div class="traygroup" style="margin-top:10px">Near ${esc(ctx.area||"the rest of this day")}</div>
      <div class="sugwrap">${mealPick.osm.map(x=>chip(x.name, (x.area?x.area+" · ":"")+(x.km<1?Math.round(x.km*1000)+"m":x.km.toFixed(1)+"km"), x.lat, x.lon)).join("")}</div>` :
    (mealPick.osm && !mealPick.osm.length) ? `<div class="sugload">Nothing nearby in OpenStreetMap.</div>` : "";

  openModal(`
    <h3>${label} on ${esc(dayLabel(day))}</h3>
    <p class="msub">You will eat either way — this is just where. ${ctx.anchored
      ? "Suggestions are near what is already on this day"+(ctx.area?" around "+esc(ctx.area):"")+"."
      : "Nothing else is on this day yet, so these are from across the city."}</p>
    <div class="field sugbox">
      ${fromReport}${fromSaved}${osmBlock}
      ${!fromReport && !fromSaved && !osmBlock ? `<div class="sugload">No report for this city yet.</div>` : ""}
      ${mealPick.osmState!=="loading" && !mealPick.osm && ctx.anchor
        ? `<button class="btn sm" data-act="meal-osm" style="margin-top:10px">Search nearby restaurants →</button>` : ""}
    </div>
    <div class="field"><label>Or type it yourself</label>
      <input class="inp" id="mealfree" placeholder="Somewhere you already have in mind"></div>
    <div class="modrow">
      <button class="btn" data-act="close">Cancel</button>
      <button class="btn primary" data-act="setmealfree">Add</button>
    </div>`);
}

function copyText(s, msg){
  const done = ()=>toast(msg||"Copied");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(s).then(done, ()=>fallback());
  }else fallback();
  function fallback(){
    const ta = document.createElement("textarea");
    ta.value = s; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){ toast("Couldn't copy"); }
    ta.remove();
  }

async function geocode(name){
  const url = "https://geocoding-api.open-meteo.com/v1/search?count=1&format=json&language=en&name="
              + encodeURIComponent(name);
  const r = await fetch(url);
  if(!r.ok) throw new Error("geocode failed");
  const j = await r.json();
  if(!j.results || !j.results.length) return null;
  const g = j.results[0];
  return {name:g.name, country:g.country||"", lat:g.latitude, lon:g.longitude, tz:g.timezone||"auto"};
}

function wireStep0(){

  const sync = ()=>{
    ["arr","dep"].forEach(k=>{
      const code = (document.getElementById(`w-${k}-code`).value||"").toUpperCase().trim();

        wiz[k].city=""; wiz[k].lat=null; wiz[k].lon=null;

    if(wiz.arr.date && wiz.dep.date && n>0){
      box.classList.remove("hide");

    }else{

  };
  ["arr","dep"].forEach(k=>["code","date","fn"].forEach(f=>{
    const el = document.getElementById(`w-${k}-${f}`);

/* ---------- itinerary drop zone ---------- */
function wireDropzone(){
  const zone = document.getElementById("w-drop");
  const file = document.getElementById("w-file");
  if(!zone || !file) return;
  file.onchange = e => { if(e.target.files[0]) ingestFile(e.target.files[0]); };
  ["dragenter","dragover"].forEach(ev=>zone.addEventListener(ev, e=>{
    e.preventDefault(); e.stopPropagation(); zone.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev=>zone.addEventListener(ev, e=>{
    e.preventDefault(); e.stopPropagation(); zone.classList.remove("over"); }));
  zone.addEventListener("drop", e=>{
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) ingestFile(f);
  });
}

async function ingestFile(f){
  const isPDF = /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name);
  const isImg = /^image\//i.test(f.type) || /\.(png|jpe?g|webp|gif|bmp|heic)$/i.test(f.name);
  if(!isPDF && !isImg){ toast("Drop a PDF or an image"); return; }
  wiz.importing = isPDF ? "Reading the PDF… " : "Reading the image… ";
  render();
  let text = "";
  try{
    text = isPDF ? await textFromPDF(f)
                 : await textFromImage(f, p=>{
                     const z = document.getElementById("w-drop");
                     if(z) z.innerHTML = `<b>Reading the image… ${p}%</b>optical character recognition runs in your browser`;
                   });
  }catch(e){
    wiz.importing = "";
    render();
    toast(isImg ? "Couldn't read that image — needs an internet connection the first time"
                : "Couldn't read that PDF");
    return;
  }
  wiz.importing = "";
  const r = parseItinerary(text);
  wiz.imported = r;

  // fill anything we found, without clobbering what you already typed
  ["arr","dep"].forEach(k=>{
    ["code","date","time","flightNo"].forEach(f2=>{
      if(r[k][f2] && !wiz[k][f2]) wiz[k][f2] = r[k][f2];
    });
    const a = airportLookup(wiz[k].code);
    if(a){ wiz[k].city=a.city; wiz[k].lat=a.lat; wiz[k].lon=a.lon; wiz[k].country=a.country; }
  });
  // cities named in the document become suggested stops
  const have = new Set(wiz.cities.map(c=>c.name.toLowerCase()));
  r.cities.slice(0,6).forEach(c=>{
    if(have.has(c.name.toLowerCase())) return;
    have.add(c.name.toLowerCase());
    wiz.cities.push({id:uid(), name:c.name, country:c.country, lat:c.lat, lon:c.lon, code:""});
  });
  render();
  const n = (r.codes.length?1:0)+(r.dates.length?1:0)+(r.times.length?1:0);
  toast(n>=2 ? "Pulled the details out — give them a check" : "Read the file, but not much was recognisable");
}

async function addCityFromInput(){
  const el = document.getElementById("w-city");
  const hint = document.getElementById("w-city-hint");
  const name = el.value.trim();
  if(!name) return;
  el.value = "";
  const entry = {id:uid(), name, country:"", lat:null, lon:null, code:""};
  wiz.cities.push(entry);
  renderWizard();
  const h2 = document.getElementById("w-city-hint");
  if(h2) h2.textContent = "Looking up "+name+"…";
  try{
    const g = await geocode(name);
    if(g){ entry.name=g.name; entry.country=g.country; entry.lat=g.lat; entry.lon=g.lon; entry.tz=g.tz; }
  }catch(e){ /* offline — keep the city, just no coords */ }
  if(view.name==="wizard" && wiz.step===1){
    renderWizard();
    const h3 = document.getElementById("w-city-hint");
    if(h3) h3.innerHTML = entry.lat==null
      ? "Couldn't reach the location service — the city still works, but weather needs coordinates."
      : "&nbsp;";
  }
}

function seedCitiesFromFlights(){
  const seen = new Set(wiz.cities.map(c=>c.name.toLowerCase()));
  [wiz.arr, wiz.dep].forEach(f=>{
    if(f.city && !seen.has(f.city.toLowerCase())){
      seen.add(f.city.toLowerCase());
      wiz.cities.push({id:uid(), name:f.city, country:f.country||"", lat:f.lat, lon:f.lon, code:f.code});
    }
  });
}

function wizNext(){
  if(wiz.step===0){
    if(!wiz.arr.date || !wiz.dep.date){ toast("Add both dates to continue"); return; }
    if(daysBetween(wiz.arr.date, wiz.dep.date) < 0){ toast("Departure is before arrival"); return; }
    if(daysBetween(wiz.arr.date, wiz.dep.date) > MAX_TRIP_DAYS-1){
      toast("Those dates are "+(daysBetween(wiz.arr.date,wiz.dep.date)+1)+" days apart — check the years"); return; }
    if(!wiz.arr.code) wiz.arr.code = "???";
    if(!wiz.dep.code) wiz.dep.code = wiz.arr.code;
    seedCitiesFromFlights();
  }
  if(wiz.step===1){
    if(!wiz.cities.length){ toast("Add at least one city"); return; }
  }
  if(wiz.step===3){
    const nm = document.getElementById("w-name");
    wiz.name = nm ? nm.value.trim() : "";
    const t = newTripObject(wiz);
    DB.trips.push(t);
    save();
    view = {name:"trip", tripId:t.id, tab:"cal"};
    wiz = null;
    guide = {city:null, q:"", results:null, paste:false};
    resolveReports(t);
    fetchSeasonal(t);
    if(!DB.tourDone) startTour(); else render();
    toast("Trip created");
    return;
  }
  wiz.step++;
  render();
}

const HOUR_LABELS = (()=>{
  const out = [];
  for(let h=0; h<24; h++){
    const ap = h>=12 ? "pm" : "am";
    const hh = h%12===0 ? 12 : h%12;
    out.push({v:d2(h), label:hh+ap});
  }
  return out;
})();
function timeSelectHTML(value){
  const has = !!value;
  const hh = has ? value.split(":")[0] : "";
  const mm = has ? value.split(":")[1] : "00";
  return `<div class="timepick">
    <select class="inp" id="e-hour">
      <option value="" ${has?"":"selected"}>no time</option>
      ${HOUR_LABELS.map(h=>`<option value="${h.v}" ${h.v===hh?"selected":""}>${h.label}</option>`).join("")}
    </select>
    <select class="inp" id="e-min" ${has?"":"disabled"}>
      <option value="00" ${mm==="00"?"selected":""}>:00</option>
      <option value="30" ${mm==="30"?"selected":""}>:30</option>
    </select>
  </div>`;
}
function magnetHTML(m, opts){
  const k = KIND_META[m.kind] || KIND_META.note;
  const o = opts || {};
  const noteText = o.sub != null ? o.sub : m.note;
  const sub = noteText ? `<span class="sub2">${esc(noteText)}</span>` : "";
  const vague = !m.cardId && !m.place && m.board==="cal" && m.kind!=="fly" && m.kind!=="move";
  const optTag = m.optional ? '<span class="optbadge" title="Optional — decide on the day">opt</span>' : "";
  const shut = magnetShut(m);
  const shutTag = shut
    ? `<span class="shutbadge" title="Closed ${esc(shut)} — and this is one">shut</span>` : "";
  const stamp = o.stamp ? " stamp" : "";
  // frozen: the day it sits on is finalised, so it is readable but immovable
  const frozen = !!o.frozen;
  return `<div class="magnet ${k.cls} ${m.locked?"locked":""} ${vague?"vague":""} ${m.optional?"optional":""}${shut?" shut":""}${stamp}${frozen?" frozen":""}" data-mag="${m.id}"
      draggable="${(m.locked||frozen)?"false":"true"}" title="${esc(m.label)}${noteText?" — "+esc(noteText):""}">
      <span class="ic">${k.ic}</span>
      <span class="body"><span class="lbl">${shutTag}${optTag}${m.time?`<b class="mtime">${esc(fmt12(m.time))}</b>`:""}${esc(m.label)}</span>${sub}</span>
      ${o.stamp || frozen ? "" : `<button class="pin" data-act="lock" data-mag="${m.id}"
        title="${m.locked?"Locked — click to unpin":"Pin this down"}">${m.locked?"\u{1F4CD}":"\u{1F4CC}"}</button>`}
      ${o.stamp || frozen || m.kind==="fly" ? "" : `<button class="trash" data-act="delmag" data-mag="${m.id}" title="Remove">\u{1F5D1}</button>`}
    </div>`;
}

// Grouped by the interest that produced them, so it's obvious where they came from.
function trayItems(t){
  if(view.tab === "todo") return todoTrayItems(t);
  const real = magnetsIn(t, m=>m.board==="tray");
  const dismissed = new Set((t.tray && t.tray.dismissed) || []);
  const groups = [];
  if(real.length) groups.push({name:"Saved for this trip", kind:"saved", items:real});

  // One per interest, not one per interest per city. These are stamps: drag the
  // same one onto as many days as you like and it stays put.
  const byInterest = t.interests.map(iid=>{
    const m = interestMagnet(iid, t.custom);
    return {id:"sug:interest:"+iid, kind:m.kind, label:m.label,
            hint:interestLabel(iid, t.custom), interest:iid, virtual:true, reusable:true};
  });
  if(byInterest.length) groups.push({name:"Because you said you like…", kind:"interest", items:byInterest});

  const base = BASE_SUGGEST.map((tpl,ix)=>
    ({id:"sug:base:"+ix, kind:tpl[1], label:tpl[0], hint:tpl[2], virtual:true, reusable:true}));
  if(base.length) groups.push({name:"Everyday rhythm", kind:"base", items:base});
  return groups;
}
function todoTrayItems(t){
  const groups = [];
  const real = magnetsIn(t, m=>m.board==="tray");
  if(real.length) groups.push({name:"Saved for this trip", kind:"saved", items:real});
  const done = new Set(t.magnets.filter(m=>m.board==="todo").map(m=>m.label.toLowerCase()));
  Object.keys(TODO_GROUPS).forEach(g=>{
    const items = TODO_SUGGEST
      .map((x,ix)=>({g:x[0], label:x[1], ix}))
      .filter(x=>x.g===g && !done.has(x.label.toLowerCase()))
      .map(x=>({id:"sug:todo:"+x.ix, kind:"note", label:x.label, hint:"",
                virtual:true, reusable:true, todoCol:x.g}));
    if(items.length) groups.push({name:TODO_GROUPS[g], kind:"todo", items});
  });
  return groups;
}
function traySub(i){
  return [i.city, i.hint].filter(Boolean).join(" · ");
}
const isReusableId = id => /^sug:(interest|base):/.test(id||"");

function resolveDragged(t, id){
  if(!id) return null;
  if(id.startsWith("sug:")){
    let found = null;
    trayItems(t).forEach(g=>g.items.forEach(i=>{ if(i.id===id) found=i; }));
    if(!found) return null;
    if(!found.reusable) t.tray.dismissed.push(id);   // older one-shot suggestions
    const m = {id:uid(), kind:found.kind, label:found.label, note:"",
               board:"tray", locked:false, order:Date.now(),
               interest:found.interest||null, todoCol:found.todoCol||null, fromIdea:true};
    t.magnets.push(m);
    return m;
  }
  return t.magnets.find(m=>m.id===id) || null;
}

function orderBetween(t, target, beforeId){
  const p = target.split(":");
  const inSame = m => p[0]==="cal"
    ? (m.board==="cal" && m.day===p[1] && m.slot===p[2])
    : p[0]==="transit" ? (m.board==="cal" && m.day===p[1] && m.slot==="transit")
    : (m.board===p[0] && (p[1]==null || m.col===p[1]));
  const list = magnetsIn(t, inSame);
  if(!beforeId) return list.length ? (list[list.length-1].order||0) + 1000 : Date.now();
  const ix = list.findIndex(m=>m.id===beforeId);
  if(ix < 0) return Date.now();
  const next = list[ix].order || 0;
  const prev = ix > 0 ? (list[ix-1].order || next - 2000) : next - 2000;
  return prev + (next - prev)/2;
}
function moveMagnet(t, magId, target, beforeId){
  lastMove = null;
  const pre = target.split(":");
  const existing = t.magnets.find(x=>x.id===magId);
  // a finalised day is finalised both ways: nothing leaves it, nothing lands on it
  if(existing && existing.board==="cal" && existing.day && dayLocked(t, existing.day)){
    toast(dayLabel(existing.day)+" is finalised — unlock the day to move this");
    return;
  }
  if((pre[0]==="cal" || pre[0]==="transit") && dayLocked(t, pre[1])){
    toast(dayLabel(pre[1])+" is finalised — unlock it to drop anything on it");
    return;
  }
  const m = resolveDragged(t, magId);
  if(!m || m.locked) return;
  // "same" means whatever slot it is already in. The rail drops that way, so an
  // evening thing moved to another day is still an evening thing.
  if(pre[0]==="cal" && pre[2]==="same"){
    const keep = (m.board==="cal" && m.slot && m.slot!=="transit") ? m.slot
               : (m.time ? slotForTime(m.time) : "morning");
    target = "cal:"+pre[1]+":"+keep;
  }
  lastMove = {trip:t.id, id:m.id, prev:{board:m.board, day:m.day||null, slot:m.slot||null,
              col:m.col||null, order:m.order||0, kind:m.kind}};
  const newOrder = orderBetween(t, target, beforeId);
  const wasVague = !m.cardId && !m.place;
  const cameFromTray = m.board === "tray";
  const p = target.split(":");
  if(p[0]==="tray"){ m.board="tray"; m.day=null; m.slot=null; m.col=null; }
  else if(p[0]==="cal"){ m.board="cal"; m.day=p[1]; m.slot=p[2]; m.col=null; }
  else if(p[0]==="transit"){ m.board="cal"; m.day=p[1]; m.slot="transit"; m.col=null;
    if(m.kind!=="move" && m.kind!=="fly") m.kind="move"; }
  else if(p[0]==="short"){ m.board="short"; m.col=p[1]; m.day=null; m.slot=null; }
  else if(p[0]==="todo"){ m.board="todo"; m.col=p[1]||m.todoCol||"before"; m.day=null; m.slot=null; }
  else if(p[0]==="eats"){ m.board="eats"; m.col=p[1]; m.day=null; m.slot=null; }
  m.order = newOrder;
  save();
  render();
  // dragged a place onto a day you'll be in a different city?
  if(m.board === "cal" && m.day && (m.cardId || m.place)){
    const owner = computeDayCities(t)[m.day];
    const home = m.cardId ? Object.keys(t.decks||{}).find(k=>
      (t.decks[k].cards||[]).some(c=>c.id===m.cardId)) : null;
    if(home && owner && home !== owner){
      const hc = cityById(t, home), oc = cityById(t, owner);
      if(hc && oc) toast(hc.name+" spot on a "+oc.name+" day — moved anyway, but check it");
    }
  }
  // an idea with no place attached lands on a day -> ask which place it is
  if(cameFromTray && wasVague && m.board==="cal" && m.slot!=="transit" && m.kind!=="fly"){
    openMagnetEditor(m.id, {justDropped:true});
  }
}

/* =========================================================
   8b. TODAY
   Planning and travelling want different things on screen. While you are planning,
   ten days at once is the point. On the third morning, standing in a hotel lobby,
   the only day that matters is this one — what is on, where you sleep tonight, and
   whether there is a train. So while the trip is actually running, that lives at
   the top and the board waits underneath.
   ========================================================= */
function tripIsRunning(t){
  const days = tripDays(t);
  return days.length ? days.indexOf(todayStr()) >= 0 : false;
}
function bedTonight(t, night){
  const list = stays(t).filter(st=>st.from <= night && night < st.to);
  return list.length ? list[0] : null;
}
function nextLeg(t, from){
  const legs = t.magnets.filter(m=>m.board==="cal" && m.day && m.day >= from &&
                                   (m.kind==="move" || m.kind==="fly" || m.slot==="transit"));
  legs.sort((a,b)=>a.day.localeCompare(b.day) || minOfDay(a.time||"23:59") - minOfDay(b.time||"23:59"));
  return legs[0] || null;
}
function todayStripHTML(t, days){
  const today = todayStr();
  const i = days.indexOf(today);
  if(i < 0) return "";
  const cid = computeDayCities(t)[today];
  const city = cityById(t, cid);
  const L = dayLoad(t, today);
  const order = VISIT_ORDER.filter(sl=>sl!=="transit");
  const items = order.concat(["transit"]).map(sl=>
    magnetsIn(t, m=>m.board==="cal" && m.day===today && m.slot===sl)).flat();
  const bed = bedTonight(t, today);
  const leg = nextLeg(t, today);
  const wx = wxHTML(t, today, cid);
  const line = items.length
    ? `<ol class="tdlist">${items.map(m=>{
        const shut = magnetShut(m);
        return `<li class="${m.optional?"opt":""}" data-act="goto" data-mag="${m.id}">
          <i style="background:${MAP_KIND_COLOR[m.kind]||MAP_KIND_COLOR.note}"></i>
          ${m.time?`<b>${esc(fmt12(m.time))}</b>`:""}
          <span>${esc(m.label)}</span>
          ${m.optional?'<em>optional</em>':""}${shut?`<em class="bad">closed ${esc(shut)}</em>`:""}
        </li>`;}).join("")}</ol>`
    : `<p class="tdnone">Nothing planned for today — which is allowed.</p>`;
  return `<section class="todaybar">
    <div class="tdhead">
      <span class="tdtag">Today</span>
      <b>${DOW[parseD(today).getDay()]} ${MON[parseD(today).getMonth()]} ${parseD(today).getDate()}</b>
      <span class="tdsub">Day ${i+1} of ${days.length}${city?" · "+esc(city.name):""}${
        L.total?" · about "+hm(L.total)+" of plan":""}</span>
      <div class="tdwx">${wx}</div>
      <button class="btn sm" data-act="jumptoday">Go to today on the board</button>
    </div>
    ${line}
    <div class="tdfoot">
      ${bed ? `<span class="tdbit"><b>Tonight</b> ${esc(bed.name||"a hotel")}${
        bed.area?" · "+esc(bed.area):""}${bed.status!=="booked"?' <em>not booked</em>':""}</span>`
            : `<span class="tdbit bad"><b>Tonight</b> nowhere booked</span>`}
      ${leg ? `<span class="tdbit"><b>${leg.day===today?"Next leg":"Next leg "+esc(dayLabel(leg.day))}</b> ${
        leg.time?esc(fmt12(leg.time))+" · ":""}${esc(leg.label)}</span>` : ""}
    </div>
  </section>`;
}
/* ---------- finding something again ----------
   A trip of any size stops fitting in your head: you know you saved that noodle
   place, you cannot remember which day you put it on. Reports were searchable and
   the board was not, which was the wrong way round. */
let boardQ = "";
let boardOpen = false;      // were the results showing when the board last redrew?
let boardFocus = false;     // was the cursor in the box?
let flashId = null;         // what we are pointing at, so a redraw keeps pointing
function boardWhere(t, m){
  if(m.board === "cal"){
    const i = tripDays(t).indexOf(m.day);
    const when = i >= 0 ? "Day " + (i+1) + " · " + dayLabel(m.day) : dayLabel(m.day || "");
    return when + (m.slot === "transit" ? " · getting around" : m.slot ? " · " + m.slot : "");
  }
  if(m.board === "tray") return "Your magnets";
  if(m.board === "short"){ const c = cityById(t, m.col); return "Waiting list" + (c ? " · " + c.name : ""); }
  if(m.board === "todo"){ const c = TODO_COLS.find(x=>x.id === m.col); return "To-do" + (c ? " · " + c.label : ""); }
  if(m.board === "eats"){ const c = cityById(t, m.col); return "Eat & drink" + (c ? " · " + c.name : ""); }
  return "";
}
function boardHits(t, q){
  const term = String(q || "").toLowerCase().trim();
  if(term.length < 2) return [];
  const hit = m => ((m.label || "") + " " + (m.note || "")).toLowerCase().indexOf(term) >= 0;
  const all = t.magnets.filter(hit);
  // whatever is on a day first: that is usually the one you are looking for
  all.sort((a,b)=>(a.board === "cal" ? 0 : 1) - (b.board === "cal" ? 0 : 1)
                || String(a.day||"").localeCompare(String(b.day||"")));
  return all.slice(0, 8).map(m=>({m, where: boardWhere(t, m)}));
}
function boardResultsHTML(t, q){
  const term = String(q || "").trim();
  if(term.length < 2) return "";
  const hits = boardHits(t, q);
  if(!hits.length) return `<div class="findnone">Nothing on this trip matches “${esc(term)}”.</div>`;
  return hits.map(({m, where})=>`<button class="findhit" data-act="goto" data-mag="${m.id}">
      <i style="background:${MAP_KIND_COLOR[m.kind] || MAP_KIND_COLOR.note}"></i>
      <span class="fl">${esc(m.label)}</span>
      <span class="fw">${esc(where)}</span>
    </button>`).join("");
}
function wireBoardSearch(){
  const box = document.getElementById("boardq");
  const out = document.getElementById("boardres");
  if(!box || !out || box.getAttribute("data-wired")) return;
  box.setAttribute("data-wired", "1");
  const draw = ()=>{
    const t = trip();
    if(!t) return;
    boardQ = box.value;
    // a redraw can replace these nodes underneath a keystroke, so always write to
    // whichever pair is currently on screen rather than the pair we started with
    const liveBox = document.getElementById("boardq");
    const dest = document.getElementById("boardres") || out;
    if(liveBox && liveBox !== box && liveBox.value !== boardQ) liveBox.value = boardQ;
    const html = boardResultsHTML(t, boardQ);
    dest.innerHTML = html;
    boardOpen = !!html;
    dest.classList.toggle("on", boardOpen);
  };
  box.addEventListener("input", draw);
  box.addEventListener("focus", draw);
  box.addEventListener("blur", ()=>setTimeout(()=>{ out.classList.remove("on"); boardOpen = false; }, 180));
  box.addEventListener("keydown", e=>{
    if(e.key === "Escape"){ box.value = ""; boardQ = ""; boardOpen = false; draw(); box.blur(); }
  });
  // something else redrew the board while you were mid-search: put it back
  if(boardQ && boardOpen) draw();
  if(boardFocus){
    boardFocus = false;
    box.focus();
    try{ box.setSelectionRange(box.value.length, box.value.length); }catch(_){}
  }
}
function flashNode(id){
  // the same id can appear in the Today list and on the board; the board is the
  // one you asked to be taken to
  const all = [].slice.call(document.querySelectorAll('[data-mag="' + id + '"]'));
  return all.filter(n=>n.classList.contains("magnet"))[0] || all[0] || null;
}
let flashSeq = 0;
function flashMagnet(id){
  const node = flashNode(id);
  if(!node) return false;
  const seq = ++flashSeq;          // point at the same thing twice and the second one wins
  flashId = id;
  node.scrollIntoView({behavior:"smooth", block:"center"});
  node.classList.remove("flash");
  void node.offsetWidth;           // let the animation start again
  node.classList.add("flash");
  setTimeout(()=>{
    if(seq !== flashSeq) return;   // an older timer must not clear a newer flash
    flashId = null;
    const n = flashNode(id);
    if(n) n.classList.remove("flash");
  }, 1600);
  return true;
}

function scrollToToday(){
  const el = document.querySelector(".cal .day.today");
  if(!el){ toast("Today isn't one of the trip's days"); return; }
  el.scrollIntoView({behavior:"smooth", block:"start"});
  el.classList.add("flash");
  setTimeout(()=>el.classList.remove("flash"), 1600);
}

function gapsHTML(t, days){
  if(view.tab!=="cal") return "";
  if(!days.length) return "";
  if(days.length > 45){
    return `<div class="nodays">
      <h3>${days.length} days?</h3>
      <p>That's how far apart your arrival and departure dates are. If this really is a
         ${Math.round(days.length/30)}-month trip, carry on — otherwise the wrong pair of dates got picked up.
         Booking confirmations carry fare deadlines and rebooking cut-offs that look a lot like travel dates.</p>
      <div class="ndates">
        <span><b>Arrive</b>${esc(t.arr.date)}</span>
        <span><b>Depart</b>${esc(t.dep.date)}</span>
      </div>
      <button class="btn primary" data-act="settings">Fix the dates</button>
    </div>` + gapNotes(t, days);
  }
  return gapNotes(t, days);
}
function gapNotes(t, days){
  const notes = [];
  const pace = paceOf(t.pace);
  const MEALSLOT = {lunch:1, dinner:1, transit:1};
  const count = d => t.magnets.filter(m=>m.board==="cal"&&m.day===d&&m.kind!=="fly"&&
                                          !MEALSLOT[m.slot]&&!m.optional).length;
  const short = d => MON[parseD(d).getMonth()]+" "+parseD(d).getDate();
  const empty = days.filter(d=>count(d)===0);
  if(empty.length && empty.length<days.length){
    notes.push(`${empty.length} day${empty.length===1?"":"s"} still bare — ${empty.map(short).slice(0,4).join(", ")}${empty.length>4?"…":""}`);
  }
  const over = days.filter(d=>count(d) > pace.per+1);
  if(over.length){
    notes.push(`Busier than ${pace.label.toLowerCase()} on ${over.map(short).slice(0,4).join(", ")}${over.length>4?"…":""} — you said about ${pace.per} a day.`);
  }
  // busy is a matter of taste; not fitting in a day is arithmetic
  const wont = days.map(d=>({d, L:dayLoad(t, d)})).filter(x=>x.L.over > 30);
  if(wont.length){
    notes.push(`${wont.map(x=>short(x.d)+" needs about "+hm(x.L.total)).slice(0,3).join(", ")}${
      wont.length>3 ? " and "+(wont.length-3)+" more" : ""} — longer than the day has, once you count getting about.`);
  }
  const shut = [];
  days.forEach(d=>{
    t.magnets.filter(m=>m.board==="cal" && m.day===d).forEach(m=>{
      const c = magnetShut(m);
      if(c) shut.push(m.label + " is closed " + c + " — " + short(d) + " is one");
    });
  });
  if(shut.length){
    notes.push(shut.slice(0,3).join("; ") + (shut.length>3 ? "; and "+(shut.length-3)+" more" : "") + ".");
  }

  const dayCities = computeDayCities(t);
  const visited = new Set(Object.values(dayCities));
  const unvisited = t.cities.filter(c=>!visited.has(c.id));
  if(unvisited.length){
    notes.push(`No travel planned to ${unvisited.map(c=>c.name).join(", ")} — drop a transport magnet on the day you move.`);
  }
  if(!notes.length) return "";
  return `<div class="gap">${notes.map(esc).join("<br>")}</div>`;
}

  }).join("");

    <div class="ovgrid">

        <div class="ovmeta"><span class="ovn">days</span></div></div>

    <p class="ovhint">Click a cell to put that day in that city \u2014 drag across to do several.

/* =========================================================
   5o2. DAY NOTES AND ANNOTATED IMAGES
   Images are downscaled hard before they are stored, because a trip file with
   two dozen phone screenshots in it stops fitting anywhere.
   ========================================================= */
const MAX_DAY_IMAGES = 3;
const IMG_MAX_PX = 1200;
const IMG_QUALITY = 0.72;
const PEN_COLORS = [["#E2725B","red"],["#F2C14E","amber"],["#5B8DB8","blue"],["#4F9D69","green"],["#23201C","black"]];

function dayNote(t, day){ return (t.dayNotes||{})[day] || ""; }
function dayImages(t, day){ return (t.dayImages||{})[day] || []; }

function downscaleImage(file){
  return new Promise((res, rej)=>{
    const fr = new FileReader();
    fr.onerror = ()=>rej(new Error("read failed"));
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>rej(new Error("not an image"));
      img.onload = ()=>{
        const scale = Math.min(1, IMG_MAX_PX/Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width*scale));
        const h = Math.max(1, Math.round(img.height*scale));
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        res({src: cv.toDataURL("image/jpeg", IMG_QUALITY), w, h});
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function addStayImage(t, stayId, file){
  const st = stayById(t, stayId);
  if(!st) return;
  st.images = st.images || [];
  if(st.images.length >= MAX_STAY_IMAGES){ toast("Four screenshots per hotel is the limit"); return; }
  if(!/^image\//.test(file.type||"")){ toast("That isn't an image"); return; }
  downscaleImage(file).then(out=>{
    st.images.push({id:uid(), src:out.src, w:out.w, h:out.h, strokes:[], caption:""});
    save();
    if(stayEdit === stayId) drawStay();
  }).catch(()=>toast("Couldn't read that image"));
}
async function addDayImage(t, day, file){
  t.dayImages = t.dayImages || {};
  const list = t.dayImages[day] = t.dayImages[day] || [];
  if(list.length >= MAX_DAY_IMAGES){ toast("Three images a day is the limit"); return; }
  if(!/^image\//.test(file.type||"")){ toast("That isn't an image"); return; }
  let out;
  try{ out = await downscaleImage(file); }
  catch(e){ toast("Couldn't read that image"); return; }
  list.push({id:uid(), src:out.src, w:out.w, h:out.h, strokes:[], caption:""});
  save();
  render();
  toast("Added — click it to draw on it");
}

/* ---------- strokes drawn over an image ----------
   NaN turns into null the moment it is written to JSON, so a stroke captured
   with a bad coordinate comes back as [null,null] and used to take the whole
   board down. Nothing here trusts what it is handed. */
const okPt = p => Array.isArray(p) && isNum(p[0]) && isNum(p[1]);
function repairStrokes(t){
  let dropped = 0;
  const lists = Object.keys(t.dayImages||{}).map(k=>t.dayImages[k])
    .concat((t.stays||[]).map(st=>st.images));
  lists.forEach(list=>{
    (list||[]).forEach(img=>{
      if(!Array.isArray(img.strokes)){ img.strokes = []; return; }
      const before = img.strokes.length;
      img.strokes = img.strokes.map(st=>{
        if(!st || typeof st !== "object") return null;
        if(st.tool === "pen"){
          const pts = (st.pts||[]).filter(okPt);
          return pts.length >= 2 ? Object.assign({}, st, {pts}) : null;
        }
        if(st.tool === "ellipse")
          return (isNum(st.x)&&isNum(st.y)&&isNum(st.rx)&&isNum(st.ry)) ? st : null;
        if(st.tool === "arrow")
          return (isNum(st.x1)&&isNum(st.y1)&&isNum(st.x2)&&isNum(st.y2)) ? st : null;
        return null;
      }).filter(Boolean);
      if(!isNum(img.w) || !isNum(img.h) || img.w <= 0 || img.h <= 0){ img.w = 1000; img.h = 750; }
      dropped += before - img.strokes.length;
    });
  });
  return dropped;
}

function strokeSVG(st){
  if(!st) return "";
  const c = esc(st.color||"#E2725B"), w = st.w||6;
  if(st.tool === "pen"){
    const pts = (st.pts||[]).filter(okPt);
    if(pts.length < 2) return "";
    return `<polyline points="${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}"
      fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  if(st.tool === "ellipse"){
    if(!isNum(st.x)||!isNum(st.y)||!isNum(st.rx)||!isNum(st.ry)) return "";
    return `<ellipse cx="${st.x.toFixed(1)}" cy="${st.y.toFixed(1)}" rx="${Math.abs(st.rx).toFixed(1)}"
      ry="${Math.abs(st.ry).toFixed(1)}" fill="none" stroke="${c}" stroke-width="${w}"/>`;
  }
  if(st.tool === "arrow"){
    if(!isNum(st.x1)||!isNum(st.y1)||!isNum(st.x2)||!isNum(st.y2)) return "";
    const ang = Math.atan2(st.y2-st.y1, st.x2-st.x1);
    const hl = Math.max(14, w*3);
    const p1 = [st.x2 - hl*Math.cos(ang - 0.4), st.y2 - hl*Math.sin(ang - 0.4)];
    const p2 = [st.x2 - hl*Math.cos(ang + 0.4), st.y2 - hl*Math.sin(ang + 0.4)];
    return `<line x1="${st.x1.toFixed(1)}" y1="${st.y1.toFixed(1)}" x2="${st.x2.toFixed(1)}" y2="${st.y2.toFixed(1)}"
        stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>
      <polygon points="${st.x2.toFixed(1)},${st.y2.toFixed(1)} ${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}"
        fill="${c}"/>`;
  }
  return "";
}
function imgH(img){
  return (isNum(img.w) && isNum(img.h) && img.w > 0) ? 1000*(img.h/img.w) : 750;
}
function imageSVG(img, extra, box){
  const H = imgH(img);
  const v = box || {x:0, y:0, w:1000, h:H};
  return `<svg class="annosvg" viewBox="${v.x.toFixed(1)} ${v.y.toFixed(1)} ${v.w.toFixed(1)} ${v.h.toFixed(1)}" preserveAspectRatio="xMidYMid meet">
    <image href="${img.src}" x="0" y="0" width="1000" height="${H.toFixed(0)}"/>
    <g class="strokes">${(img.strokes||[]).map(strokeSVG).join("")}${extra||""}</g>
  </svg>`;
}

/* ---------- the annotate window ----------
   The image is shown through a moving viewBox rather than a CSS transform, so
   zoom, pan and drawing all speak the same coordinate system and a stroke drawn
   at 4x lands exactly where it was drawn. */
const ZOOMS = [1, 1.5, 2, 3, 4, 6, 8];
let anno = null;
let annoCleanup = null;

function annoBox(img){
  const H = imgH(img);
  const z = (anno && isNum(anno.zoom)) ? Math.max(1, anno.zoom) : 1;
  const w = 1000/z, h = H/z;
  let cx = (anno && isNum(anno.cx)) ? anno.cx : 500;
  let cy = (anno && isNum(anno.cy)) ? anno.cy : H/2;
  cx = Math.min(1000 - w/2, Math.max(w/2, cx));
  cy = Math.min(H - h/2, Math.max(h/2, cy));
  return {x:cx - w/2, y:cy - h/2, w, h};
}
function annoZoomTo(z, ax, ay){
  const img = annoImages().find(x=>x.id===anno.imgId);
  if(!img) return;
  const H = imgH(img);
  z = Math.max(1, Math.min(ZOOMS[ZOOMS.length-1], z));
  if(z <= 1.001){ anno.zoom = 1; anno.cx = 500; anno.cy = H/2; }
  else{
    // keep the point under the cursor where it is
    if(isNum(ax) && isNum(ay)){
      const b = annoBox(img);
      const k = anno.zoom / z;
      anno.cx = ax + (b.x + b.w/2 - ax) * k;
      anno.cy = ay + (b.y + b.h/2 - ay) * k;
    }
    anno.zoom = z;
  }
  drawAnnotate();
}
function annoStep(dir){
  const cur = anno.zoom || 1;
  const i = ZOOMS.findIndex(z => z > cur + 0.01);
  const next = dir > 0
    ? (i < 0 ? ZOOMS[ZOOMS.length-1] : ZOOMS[i])
    : (() => { for(let j=ZOOMS.length-1;j>=0;j--) if(ZOOMS[j] < cur - 0.01) return ZOOMS[j]; return 1; })();
  annoZoomTo(next);
}

function annoImages(){
  const t = trip();
  if(!t || !anno) return [];
  if(anno.stayId){ const st = stayById(t, anno.stayId); return st ? (st.images||[]) : []; }
  return dayImages(t, anno.day);
}
function annoTitle(){
  const t = trip();
  if(anno && anno.stayId){
    const st = t && stayById(t, anno.stayId);
    return st ? (st.name || "Hotel") : "Hotel";
  }
  return anno ? dayLabel(anno.day) : "";
}
function openAnnotate(day, imgId, stayId){
  const t = trip();
  anno = {day, imgId, stayId:stayId||null, tool:"pen", color:PEN_COLORS[0][0], w:6,
          drawing:null, zoom:1, cx:500, cy:0};
  const img = annoImages().find(x=>x.id===imgId);
  if(!img){ anno = null; return; }
  anno.cy = imgH(img)/2;
  drawAnnotate();
}
function drawAnnotate(){
  const t = trip();
  if(!anno) return;
  const imgs = annoImages();
  const img = imgs.find(x=>x.id===anno.imgId);
  if(!img){ closeModal(); anno = null; return; }
  const tools = [["pen","Draw"],["ellipse","Circle"],["arrow","Arrow"],["pan","Move"]];
  const zoomed = (anno.zoom||1) > 1.001;
  openModal(`<div class="annowrap">
    <div class="annohead">
      <h3>${esc(annoTitle())}</h3>
      ${imgs.length > 1 ? `<div class="annoswitch">${imgs.map((im,i)=>
        `<button class="tbtn ${im.id===anno.imgId?"on":""}" data-act="anno-switch" data-img="${im.id}"
           title="${esc(im.caption||("Image "+(i+1)))}">${i+1}</button>`).join("")}</div>` : ""}
      <button class="btn ghost sm" data-act="anno-close">Done</button>
    </div>
    <div class="annobar">
      ${tools.map(([id,label])=>`<button class="tbtn ${anno.tool===id?"on":""}"
        data-act="anno-tool" data-tool="${id}">${label}</button>`).join("")}
      <span class="tsep"></span>
      ${PEN_COLORS.map(([hex,name])=>`<button class="cbtn ${anno.color===hex?"on":""}"
        style="--c:${hex}" data-act="anno-color" data-color="${hex}" title="${name}"></button>`).join("")}
      <span class="tsep"></span>
      <div class="zoomer">
        <button class="tbtn" data-act="anno-zoom" data-dir="-1" ${zoomed?"":"disabled"} title="Zoom out">−</button>
        <span class="zlvl">${Math.round((anno.zoom||1)*100)}%</span>
        <button class="tbtn" data-act="anno-zoom" data-dir="1" title="Zoom in">+</button>
        <button class="tbtn" data-act="anno-fit" ${zoomed?"":"disabled"} title="Fit to window">Fit</button>
      </div>
      <span class="tsep"></span>
      <button class="btn sm" data-act="anno-undo" ${(img.strokes||[]).length?"":"disabled"}>Undo</button>
      <button class="btn sm" data-act="anno-clear" ${(img.strokes||[]).length?"":"disabled"}>Clear</button>
      <button class="btn sm danger" data-act="anno-del">Delete image</button>
    </div>
    <div class="annostage ${anno.tool==="pan"?"panning":""} ${zoomed?"zoomed":""}" id="annostage">
      ${imageSVG(img, "", annoBox(img))}
    </div>
    <div class="annofoot">
      <input class="inp" id="anno-cap" placeholder="Caption (optional)" value="${esc(img.caption||"")}">
      <span class="hint">${zoomed
        ? "Scroll to zoom · pick Move to drag the image around"
        : "Scroll to zoom in, or use + above"}</span>
    </div>
  </div>`);
  mountAnnotate();
}

function mountAnnotate(){
  // each redraw builds a new canvas; without this the listeners from the old
  // one keep firing against a detached element whose width is zero, which is
  // how strokes full of NaN got written in the first place
  if(annoCleanup){ annoCleanup(); annoCleanup = null; }
  const stage = document.getElementById("annostage");
  if(!stage) return;
  const svg = stage.querySelector("svg");
  if(!svg) return;
  const img = annoImages().find(x=>x.id===anno.imgId);
  if(!img) return;
  const box = annoBox(img);

  // exact inverse of preserveAspectRatio="xMidYMid meet"
  const at = e =>{
    const r = svg.getBoundingClientRect();
    if(!r.width || !r.height) return null;
    const src = (e.touches && e.touches[0]) ? e.touches[0] : e;
    if(!isNum(src.clientX) || !isNum(src.clientY)) return null;
    const sc = Math.min(r.width/box.w, r.height/box.h);
    if(!isNum(sc) || sc <= 0) return null;
    const ox = (r.width  - box.w*sc)/2;
    const oy = (r.height - box.h*sc)/2;
    const x = box.x + (src.clientX - r.left - ox)/sc;
    const y = box.y + (src.clientY - r.top  - oy)/sc;
    return (isNum(x) && isNum(y)) ? [x, y] : null;
  };
  const paint = ()=>{
    const g = svg.querySelector(".strokes");
    if(g) g.innerHTML = (img.strokes||[]).map(strokeSVG).join("") +
      (anno.drawing ? strokeSVG(anno.drawing) : "");
  };

  let panFrom = null;
  const down = e=>{
    const pt = at(e);
    if(!pt) return;
    e.preventDefault();
    const [x,y] = pt;
    if(anno.tool === "pan"){ panFrom = {x, y, cx:box.x + box.w/2, cy:box.y + box.h/2}; return; }
    anno.drawing = anno.tool==="pen"
      ? {tool:"pen", color:anno.color, w:anno.w, pts:[[x,y]]}
      : anno.tool==="ellipse"
      ? {tool:"ellipse", color:anno.color, w:anno.w, x, y, rx:0, ry:0, _ox:x, _oy:y}
      : {tool:"arrow", color:anno.color, w:anno.w, x1:x, y1:y, x2:x, y2:y};
    paint();
  };
  const move = e=>{
    if(!anno) return;
    if(panFrom){
      const r = svg.getBoundingClientRect();
      if(!r.width || !r.height) return;
      const src = (e.touches && e.touches[0]) ? e.touches[0] : e;
      if(!isNum(src.clientX)) return;
      e.preventDefault();
      const sc = Math.min(r.width/box.w, r.height/box.h);
      const ox = (r.width - box.w*sc)/2, oy = (r.height - box.h*sc)/2;
      const nx = box.x + (src.clientX - r.left - ox)/sc;
      const ny = box.y + (src.clientY - r.top  - oy)/sc;
      if(!isNum(nx) || !isNum(ny)) return;
      anno.cx = panFrom.cx - (nx - panFrom.x);
      anno.cy = panFrom.cy - (ny - panFrom.y);
      const b = annoBox(img);
      svg.setAttribute("viewBox",
        b.x.toFixed(1)+" "+b.y.toFixed(1)+" "+b.w.toFixed(1)+" "+b.h.toFixed(1));
      return;
    }
    if(!anno.drawing) return;
    const pt = at(e);
    if(!pt) return;
    e.preventDefault();
    const [x,y] = pt;
    const d = anno.drawing;
    if(d.tool==="pen") d.pts.push([x,y]);
    else if(d.tool==="ellipse"){
      d.x = (d._ox + x)/2; d.y = (d._oy + y)/2;
      d.rx = Math.abs(x - d._ox)/2; d.ry = Math.abs(y - d._oy)/2;
    }else{ d.x2 = x; d.y2 = y; }
    paint();
  };
  const up = ()=>{
    if(!anno) return;
    if(panFrom){ panFrom = null; drawAnnotate(); return; }
    if(!anno.drawing) return;
    const d = anno.drawing;
    anno.drawing = null;
    // at 4x a small gesture covers a quarter of the distance, so scale the
    // "did they mean it" thresholds with the zoom
    const z = anno.zoom || 1;
    const worth = d.tool==="pen" ? d.pts.filter(okPt).length > 1
      : d.tool==="ellipse" ? (d.rx > 4/z || d.ry > 4/z)
      : Math.hypot(d.x2-d.x1, d.y2-d.y1) > 10/z;
    if(worth){
      delete d._ox; delete d._oy;
      if(d.tool==="pen") d.pts = d.pts.filter(okPt);
      img.strokes = (img.strokes||[]).concat([d]);
      save();
    }
    drawAnnotate();
  };
  const wheel = e=>{
    e.preventDefault();
    const pt = at(e);
    const cur = anno.zoom || 1;
    const next = cur * (e.deltaY < 0 ? 1.25 : 0.8);
    annoZoomTo(next, pt ? pt[0] : null, pt ? pt[1] : null);
  };

  svg.addEventListener("pointerdown", down);
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
  svg.addEventListener("touchstart", down, {passive:false});
  window.addEventListener("touchmove", move, {passive:false});
  window.addEventListener("touchend", up);
  stage.addEventListener("wheel", wheel, {passive:false});
  annoCleanup = ()=>{
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    window.removeEventListener("touchmove", move);
    window.removeEventListener("touchend", up);
    stage.removeEventListener("wheel", wheel);
  };
}
function endAnnotate(){
  if(annoCleanup){ annoCleanup(); annoCleanup = null; }
  anno = null;
}

/* ---------- the pad: sticky notes and one pinned image ----------
   The right-hand plan is for what is decided. This column is for what is not:
   scraps, a map screenshot with a circle round the area, things to look up. */
const STICKY_COLORS = [["#F6E7A8","Yellow"],["#DCEBF7","Blue"],["#E6F2E0","Green"],
                       ["#F8DDD4","Pink"],["#EDE6F5","Violet"]];
function stickies(t, day){ return (t.stickies||{})[day] || []; }
function pinnedImage(t, day){
  const imgs = dayImages(t, day);
  if(!imgs.length) return null;
  const id = (t.dayPin||{})[day];
  return imgs.find(x=>x.id===id) || imgs[0];
}
function addSticky(t, day){
  t.stickies = t.stickies || {};
  const list = t.stickies[day] = t.stickies[day] || [];
  if(list.length >= 8){ toast("That is a lot of notes for one day"); return; }
  const used = list.map(n=>n.color);
  const colour = (STICKY_COLORS.find(c=>used.indexOf(c[0])<0) || STICKY_COLORS[list.length % STICKY_COLORS.length])[0];
  list.push({id:uid(), text:"", color:colour});
  save(); render();
  setTimeout(()=>{
    const box = document.querySelector('[data-sticky="' + list[list.length-1].id + '"]');
    if(box) box.focus();
  }, 0);
}
function stickyHTML(t, day){
  const list = stickies(t, day);

      ${list.map(n=>`<div class="sticky" style="--s:${esc(n.color||STICKY_COLORS[0][0])}">
        <textarea data-act="stickytext" data-sticky="${n.id}" data-day="${day}" ${locked?"readonly":""}
          rows="2" placeholder="…">${esc(n.text||"")}</textarea>
        <div class="stickyacts" ${locked?'style="display:none"':""}>
          <button class="sbtn" data-act="stickycolor" data-sticky="${n.id}" data-day="${day}"
            title="Change colour">◍</button>
          <button class="sbtn" data-act="stickydel" data-sticky="${n.id}" data-day="${day}"
            title="Remove">×</button>
        </div>
      </div>`).join("") || (locked
        ? `<div class="lockedhint">no notes</div>`
        : `<button class="stickyempty" data-act="addsticky" data-day="${day}">
        Jot something down</button>`)}
    </div>
  </div>`;
}
function padImageHTML(t, day){

function dayPadHTML(t, day){

}

function dayExtrasHTML(t, day){

        placeholder="Anything for this day — booking references, who you're meeting, what to remember">${esc(note)}</textarea>
