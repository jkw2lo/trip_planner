/* ---------- moving a whole day ----------
   Flights keep their real dates; everything else is a plan and plans slide. */
function swapDays(t, a, b){
  if(!a || !b || a === b) return false;
  const movable = m => m.board === "cal" && m.kind !== "fly";
  t.magnets.forEach(m=>{
    if(!movable(m)) return;
    if(m.day === a) m.day = b;
    else if(m.day === b) m.day = a;
  });
  ["dayNotes","dayImages","stickies","dayPin","dayCity"].forEach(k=>{
    const o = t[k] = t[k] || {};
    const va = o[a], vb = o[b];
    if(vb === undefined) delete o[a]; else o[a] = vb;
    if(va === undefined) delete o[b]; else o[b] = va;
  });
  return true;
}
function moveDay(day, dir){
  const t = trip();
  const days = dateRange(t.arr.date, t.dep.date);
  const i = days.indexOf(day);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= days.length){ toast("Nowhere to move it to"); return; }
  if(dayLocked(t, day) || dayLocked(t, days[j])){
    toast("One of those two days is finalised \u2014 unlock it first");
    return;
  }
  if(swapDays(t, day, days[j])){
    save(); render();
    toast(dayLabel(day) + " swapped with " + dayLabel(days[j]));
  }
}

/* =========================================================
   5p. DAY MAP
   A drawn map rather than a tile map: no network, works offline and in print,
   and the only question it needs to answer is "how spread out is this day".
   ========================================================= */
const MAP_KIND_COLOR = {see:"#5B8DB8", eat:"#E2725B", do:"#F2C14E", stay:"#4F9D69",
                        note:"#B4ADA0", move:"#7C6BAD", fly:"#2F3E46"};
const SLOT_ORDER = {morning:0, lunch:1, afternoon:2, dinner:3, evening:4, transit:5};
const SCALE_STEPS = [0.1,0.2,0.5,1,2,5,10,20,50,100];

function dayPoints(t, day){
  const ms = magnetsIn(t, m=>m.board==="cal" && m.day===day && m.kind!=="move" && m.kind!=="fly");
  const out = [];
  ms.forEach(m=>{
    const p = magnetPoint(t, m);
    if(isPoint(p)) out.push({m, lat:p.lat, lon:p.lon});
  });
  out.sort((a,b)=>{
    const oa = SLOT_ORDER[a.m.slot], ob = SLOT_ORDER[b.m.slot];
    return (oa==null?9:oa) - (ob==null?9:ob) || (a.m.order||0)-(b.m.order||0);
  });
  return out;
}

/* ---------- does the day fit in a day? ----------
   The board could always say a day looked busy. It could never say it was
   impossible, which is the more useful sentence: time on site, plus the time it
   takes to get between the stops, against the hours the day actually has. Rough
   on purpose — it is there to catch the day with the Wall and a dinner across
   town, not to schedule you to the minute. */
const DEFAULT_MINS = {see:90, do:90, eat:75, stay:30, note:20, move:0, fly:0};
function stopMinutes(m){
  if(m.mins != null && m.mins > 0) return Math.min(m.mins, 600);
  return DEFAULT_MINS[m.kind] != null ? DEFAULT_MINS[m.kind] : 60;
}
/* walkable is walked; anything further is the metro or a taxi, because that is
   what people do rather than what the crow does */
function hopMinutes(km){
  if(km == null) return 0;
  return km < 1.2 ? Math.round(km/4.5*60) + 4 : Math.round(km/20*60) + 10;
}
function hm(mins){
  const m = Math.max(0, Math.round(mins));
  if(m < 60) return m + "m";
  return Math.floor(m/60) + "h" + (m%60 ? d2(m%60) : "");
}
function dayLoad(t, day){
  const all = magnetsIn(t, m=>m.board==="cal" && m.day===day);
  const stops = all.filter(m=>m.kind!=="fly" && m.slot!=="transit" && m.kind!=="move");
  let onSite = 0, optional = 0;
  stops.forEach(m=>{
    const v = stopMinutes(m);
    if(m.optional) optional += v; else onSite += v;
  });
  let legs = 0;                                  // trains and transfers carry their own estimate
  all.filter(m=>m.slot==="transit" || m.kind==="move").forEach(m=>{ legs += (m.mins || 0); });
  const pts = dayPoints(t, day).filter(p=>!p.m.optional);
  let hops = 0;
  for(let i=1;i<pts.length;i++) hops += hopMinutes(haversine(pts[i-1], pts[i]));
  const total = onSite + legs + hops;
  // the day starts when its first fixed time does, or nine, and stays a holiday until ten
  const timed = all.filter(m=>m.time).map(m=>minOfDay(m.time));
  const start = timed.length ? Math.min(Math.min.apply(null, timed), 9*60) : 9*60;
  const room = 22*60 - start;
  return {onSite, hops, legs, optional, total, room, over: total - room, stops: stops.length};
}

/* ---------- reorder a day to cut the walking ----------
   Meals stay where they are; the morning, afternoon and evening blocks swap
   around them, but only into slots each thing is actually suited to. */
const VISIT_ORDER = ["morning","lunch","afternoon","dinner","evening"];

function magnetAsCard(t, m){
  const card = findCard(t, m.cardId);
  return {name:m.label, blurb:(card&&card.blurb)||m.note||"", mins:m.mins||(card&&card.mins)||60,
          suit:(card&&card.suit)|| (m.kind==="eat"?"eats":m.kind==="see"?"landmark":"walk")};
}
function allowedInSlot(t, m, slot){
  const pref = slotPrefs(magnetAsCard(t, m));
  if(pref.full) return slot === "morning";
  return pref.slots.indexOf(slot) >= 0;
}
function permutations(arr){
  if(arr.length <= 1) return [arr];
  const out = [];
  arr.forEach((x,i)=>{
    const rest = arr.slice(0,i).concat(arr.slice(i+1));
    permutations(rest).forEach(p=>out.push([x].concat(p)));
  });
  return out;
}
// total ground covered walking the day in order
function routeLength(t, seq){
  let total = 0, prev = null;
  seq.forEach(m=>{
    const p = magnetPoint(t, m);
    if(!p) return;
    if(prev){ const d = haversine(prev, p); if(d != null) total += d; }
    prev = p;
  });
  return total;
}
function daySequence(t, day, assignment){
  // flights and transport are fixed points, not stops to be reordered
  const at = sl => assignment && assignment[sl] ? assignment[sl]
    : magnetsIn(t, m=>m.board==="cal" && m.day===day && m.slot===sl &&
                      m.kind!=="fly" && m.kind!=="move");
  return VISIT_ORDER.reduce((acc,sl)=>acc.concat(at(sl)), []);
}
function optimiseDay(t, day){
  const blocks = SLOTS.map(sl=>({slot:sl.id,
    items: magnetsIn(t, m=>m.board==="cal" && m.day===day && m.slot===sl.id &&
                           m.kind!=="fly" && m.kind!=="move")}))
    .filter(b=>b.items.length);
  const before = routeLength(t, daySequence(t, day));
  if(blocks.length < 2) return {before, after:before, changed:false, reason:"one block"};

  const slotIds = blocks.map(b=>b.slot);
  let best = null;
  permutations(blocks).forEach(perm=>{
    // anything you gave a time to stays where you put it
    const keepsTimes = perm.every((b,i)=>
      b.slot === slotIds[i] || !b.items.some(m=>m.time));
    if(!keepsTimes) return;
    const fits = perm.every((b,i)=>b.items.every(m=>allowedInSlot(t, m, slotIds[i])));
    if(!fits) return;
    const assignment = {};
    perm.forEach((b,i)=>{ assignment[slotIds[i]] = b.items; });
    const d = routeLength(t, daySequence(t, day, assignment));
    if(!best || d < best.d - 0.001) best = {d, perm, assignment};
  });
  if(!best) return {before, after:before, changed:false, reason:"nothing may move"};
  const sameOrder = best.perm.every((b,i)=>b.slot === slotIds[i]);
  return {before, after:best.d, changed: !sameOrder && best.d < before - 0.001,
          assignment: best.assignment, slotIds, perm: best.perm};
}
function applyOptimise(t, day, plan){
  const undo = [];
  Object.keys(plan.assignment).forEach(sl=>{
    plan.assignment[sl].forEach(m=>{
      undo.push({id:m.id, slot:m.slot});
      m.slot = sl;
    });
  });
  return undo;
}

/* =========================================================
   5p1. MAP TILES
   The drawn map knows where your stops are. It does not know that the gap between
   two of them is a park, or a river, or six lanes of traffic. Tiles do.

   They come from OpenStreetMap, and they cost two things the drawn map does not:
   the network has to be there, and the tile server sees roughly which corner of
   the world you are looking at. That is why this is a switch and not a rewrite —
   turn it off and every map goes back to being drawn from coordinates alone:
   offline, private, and it prints. Tiles load lazily, so days you never scroll
   to never ask for anything.
   ========================================================= */
const TILE_PX = 256;
const TILE_URL = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
let tilesBroken = false;      // the network said no; stop asking for the rest of the session

function tilesOn(){ return !tilesBroken && prefs().tiles !== false; }
function toggleTiles(){
  const p = prefs();
  if(tilesBroken){                     // asking again after they failed: try again
    tilesBroken = false; tileFails = 0; p.tiles = true;
  }else{
    p.tiles = (p.tiles === false);     // unset or on -> off, off -> on
  }
  save(); render();
  toast(p.tiles ? "Street map on — tiles come from OpenStreetMap"
                : "Back to the drawn map — no network, nothing sent");
}
function mapModeBtn(){
  return `<button class="btn sm" data-act="maptoggle" title="${tilesOn()
    ? "Switch to the drawn map — works offline and tells no one where you are looking"
    : "Show real streets, from OpenStreetMap"}">${tilesOn() ? "Plain map" : "Street map"}</button>`;
}

const lon2px = (lon, z) => (lon + 180) / 360 * TILE_PX * Math.pow(2, z);
const lat2px = (lat, z) => {
  const s = Math.max(-0.9999, Math.min(0.9999, Math.sin(lat * Math.PI / 180)));
  return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * TILE_PX * Math.pow(2, z);
};
/* An integer zoom that fits every point, and the projection that goes with it.
   Tiles only exist at whole zooms, so the frame is chosen, not scaled. */
function tileFrame(pts, W, H, pad, maxZ){
  const lats = pts.map(p=>p.lat), lons = pts.map(p=>p.lon);
  const minLat = Math.min.apply(null,lats), maxLat = Math.max.apply(null,lats);
  const minLon = Math.min.apply(null,lons), maxLon = Math.max.apply(null,lons);
  let z = Math.min(maxZ == null ? 16 : maxZ, 18);
  for(; z > 2; z--){
    if(lon2px(maxLon,z) - lon2px(minLon,z) <= W - pad*2 &&
       lat2px(minLat,z) - lat2px(maxLat,z) <= H - pad*2) break;
  }
  const cx = (lon2px(minLon,z) + lon2px(maxLon,z)) / 2;
  const cy = (lat2px(minLat,z) + lat2px(maxLat,z)) / 2;
  return {
    z, W, H, left: cx - W/2, top: cy - H/2,
    X: lon => lon2px(lon,z) - cx + W/2,
    Y: lat => lat2px(lat,z) - cy + H/2,
    // metres per pixel here, so the scale bar stays honest
    mpp: 156543.03392 * Math.cos((minLat+maxLat)/2 * Math.PI/180) / Math.pow(2, z)
  };
}
function tileLayerHTML(f){
  const n = Math.pow(2, f.z);
  const x0 = Math.floor(f.left / TILE_PX), x1 = Math.floor((f.left + f.W - 1) / TILE_PX);
  const y0 = Math.floor(f.top / TILE_PX),  y1 = Math.floor((f.top + f.H - 1) / TILE_PX);
  let out = "";
  for(let x = x0; x <= x1; x++){
    for(let y = y0; y <= y1; y++){
      if(y < 0 || y >= n) continue;
      const wx = ((x % n) + n) % n;
      out += `<img class="tile" alt="" loading="lazy" decoding="async"
        src="${TILE_URL.replace("{z}", f.z).replace("{x}", wx).replace("{y}", y)}"
        style="left:${Math.round(x*TILE_PX - f.left)}px;top:${Math.round(y*TILE_PX - f.top)}px">`;
    }
  }
  return `<div class="tiles">${out}</div>`;
}
function tileBoxHTML(f, inner){
  return `<div class="tilemap" style="width:${f.W}px;height:${f.H}px">
    ${tileLayerHTML(f)}${inner}
    <span class="tilewarn">No map tiles — offline?</span>
    <span class="tileattr">© OpenStreetMap</span>
  </div>`;
}
/* One failed tile means the whole layer is not coming. Say so once, keep the drawn
   grid underneath, and stop asking for the rest of the session. */
let tileFails = 0;
function wireTiles(){
  document.querySelectorAll("img.tile").forEach(img=>{
    if(img.getAttribute("data-wired")) return;
    img.setAttribute("data-wired", "1");
    img.addEventListener("error", ()=>{
      const box = img.closest(".tilemap");
      if(box) box.classList.add("notiles");
      // a few in a row means there is no tile server for us today; stop asking,
      // and give every map back its drawn version rather than an empty square
      if(++tileFails === 3 && !tilesBroken){
        tilesBroken = true;
        toast("No map tiles here — drawn maps instead");
        render();
      }
    });
  });
}
function gmapsSearch(city){
  if(!city) return "";
  const q = encodeURIComponent(city.name + (city.country ? ", " + city.country : ""));
  return `<a class="dmlink" href="https://www.google.com/maps/search/?api=1&query=${q}"
    target="_blank" rel="noopener">Open ${esc(city.name)} in Maps →</a>`;
}

/* =========================================================
   5p2. COVERAGE BY CITY
   Every day you spend in a city, drawn on one map, so you can see which
   parts of town you have covered, which days overlap, and what you kept
   but never scheduled that happens to sit inside a day you're already having.
   ========================================================= */
const DAY_TINTS = ["#1F5C4D","#B4703A","#5B6BB8","#8A5AA8","#3F8FA0","#A05A5A",
                   "#6B8A3A","#B0577F","#4C7A9E","#8A7A2A"];
let cityFocus = {};   // cityId -> day being highlighted

function centroidOf(pts){
  if(!pts.length) return null;
  return {lat: pts.reduce((a,p)=>a+p.lat,0)/pts.length,
          lon: pts.reduce((a,p)=>a+p.lon,0)/pts.length};
}
// what ground does this day actually cover
function dayFootprint(t, day){
  const pts = dayPoints(t, day);
  if(!pts.length) return null;
  const c = centroidOf(pts);
  let r = 0;
  pts.forEach(p=>{ const d = haversine(c, p); if(d != null && d > r) r = d; });
  return {day, pts, c, km: Math.max(r, 0.25), stops: pts.length,
          route: routeLength(t, daySequence(t, day))};
}
function cityFootprints(t, cityId){
  return daysForCity(t, cityId).map(d=>dayFootprint(t, d)).filter(Boolean);
}
// two days sitting on top of each other is the thing worth noticing
function overlappingDays(fps){
  const out = [];
  for(let i=0;i<fps.length;i++) for(let j=i+1;j<fps.length;j++){
    const d = haversine(fps[i].c, fps[j].c);
    if(d == null) continue;
    if(d < (fps[i].km + fps[j].km) * 0.55) out.push([fps[i], fps[j], d]);
  }
  return out;
}

function cityMapHTML(t, city, idx){
  const fps = cityFootprints(t, city.id);
  const waiting = shortlistFor(t, city.id)
    .map(m=>({m, p:magnetPoint(t, m)}))
    .filter(x=>isPoint(x.p));
  if(!fps.length && !waiting.length) return "";

  const W = 560, H = 260, PAD = 26;
  const all = fps.flatMap(f=>f.pts).concat(waiting.map(x=>x.p));
  const tiles = tilesOn();
  let X, Y, kmToPx, frame = null;
  if(tiles){
    frame = tileFrame(all, W, H, PAD, 15);
    X = frame.X; Y = frame.Y;
    kmToPx = km => km*1000/frame.mpp;
  }else{
    const lats = all.map(p=>p.lat), lons = all.map(p=>p.lon);
    const latC = (Math.min.apply(null,lats)+Math.max.apply(null,lats))/2;
    const lonC = (Math.min.apply(null,lons)+Math.max.apply(null,lons))/2;
    const cosL = Math.cos(latC*Math.PI/180) || 1;
    const MIN_SPAN = 0.012;
    const spanY = Math.max(Math.max.apply(null,lats)-Math.min.apply(null,lats), MIN_SPAN);
    const spanX = Math.max((Math.max.apply(null,lons)-Math.min.apply(null,lons))*cosL, MIN_SPAN);
    const scale = Math.min((W-PAD*2)/spanX, (H-PAD*2)/spanY);
    X = lon => W/2 + (lon-lonC)*cosL*scale;
    Y = lat => H/2 - (lat-latC)*scale;
    kmToPx = km => km/111.32*scale;
  }

  const focus = cityFocus[city.id] || null;
  const tint = i => DAY_TINTS[i % DAY_TINTS.length];

  const blobs = fps.map((f,i)=>{
    const dim = focus && focus !== f.day;
    return `<circle cx="${X(f.c.lon).toFixed(1)}" cy="${Y(f.c.lat).toFixed(1)}"
      r="${Math.max(14, kmToPx(f.km)).toFixed(1)}" fill="${tint(i)}" fill-opacity="${dim?.05:.13}"
      stroke="${tint(i)}" stroke-opacity="${dim?.15:.5}" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  }).join("");

  const routes = fps.map((f,i)=>{
    if(f.pts.length < 2) return "";
    const dim = focus && focus !== f.day;
    return `<polyline points="${f.pts.map(p=>X(p.lon).toFixed(1)+","+Y(p.lat).toFixed(1)).join(" ")}"
      fill="none" stroke="${tint(i)}" stroke-width="1.6" stroke-opacity="${dim?.15:.75}"/>`;
  }).join("");

  const pins = fps.map((f,i)=>{
    const dim = focus && focus !== f.day;
    return f.pts.map(p=>`<g opacity="${dim?.25:1}">
      <circle cx="${X(p.lon).toFixed(1)}" cy="${Y(p.lat).toFixed(1)}" r="7" fill="${tint(i)}"
        stroke="var(--paper2)" stroke-width="1.5"><title>${esc(p.m.label)} · ${esc(dayLabel(f.day))}</title></circle>
      <text x="${X(p.lon).toFixed(1)}" y="${(Y(p.lat)+2.6).toFixed(1)}" text-anchor="middle"
        font-size="7.5" font-weight="700" fill="#fff">${i+1}</text></g>`).join("");
  }).join("");

  const waitPins = waiting.map(x=>`<circle cx="${X(x.p.lon).toFixed(1)}" cy="${Y(x.p.lat).toFixed(1)}" r="4.5"
      fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-dasharray="2 2" opacity=".8">
      <title>${esc(x.m.label)} — on the waiting list</title></circle>`).join("");

  const unitsPerKm = kmToPx(1);
  let barKm = SCALE_STEPS[0];
  SCALE_STEPS.forEach(v=>{ if(v <= (W*0.22)/unitsPerKm) barKm = v; });

  const legend = fps.map((f,i)=>{
    const dt = parseD(f.day);
    return `<button class="cmday ${focus===f.day?"on":""}" data-act="cityfocus"
      data-city="${city.id}" data-day="${f.day}" style="--t:${tint(i)}">
      <i></i><b>${MON[dt.getMonth()]} ${dt.getDate()}</b>
      <span>${f.stops} stop${f.stops===1?"":"s"} · ${f.km<1?Math.round(f.km*1000)+"m":f.km.toFixed(1)+"km"} across</span>
    </button>`;
  }).join("");

  const overlaps = overlappingDays(fps);
  const notes = [];
  if(overlaps.length){
    notes.push(overlaps.slice(0,2).map(([a,b])=>
      dayLabel(a.day)+" and "+dayLabel(b.day)+" cover much the same ground").join("; ") + ".");
  }
  if(waiting.length){
    const inside = waiting.filter(x=>fps.some(f=>{
      const d = haversine(f.c, x.p);
      return d != null && d <= f.km * 1.3;
    }));
    if(inside.length) notes.push(inside.length + " waiting item" + (inside.length===1?" sits":"s sit") +
      " inside ground you're already covering — worth slotting in.");
  }

  return `<div class="citymap">
    <div class="cmhead">
      <b>${esc(city.name)}</b>
      <span>${fps.length} day${fps.length===1?"":"s"}${waiting.length?" · "+waiting.length+" waiting":""}</span>
    </div>
    <div class="cmbody">
      ${(inner=>tiles ? tileBoxHTML(frame, inner) : inner)(`<svg viewBox="0 0 ${W} ${H}"
        width="${W}" height="${H}" class="${tiles?"tileover":"cmsvg"}"
        role="img" aria-label="Where you're going in ${esc(city.name)}">
        ${tiles ? "" : `<rect x="0" y="0" width="${W}" height="${H}" fill="var(--paper)" rx="10"/>
        <g opacity=".45">${[0.25,0.5,0.75].map(f=>
          `<line x1="0" y1="${(H*f).toFixed(0)}" x2="${W}" y2="${(H*f).toFixed(0)}" stroke="var(--line)" stroke-width=".5"/>
           <line x1="${(W*f).toFixed(0)}" y1="0" x2="${(W*f).toFixed(0)}" y2="${H}" stroke="var(--line)" stroke-width=".5"/>`).join("")}</g>`}
        ${blobs}${routes}${waitPins}${pins}
        <g transform="translate(12,${H-11})">
          ${tiles?`<rect x="-5" y="-9" width="${(kmToPx(barKm)+42).toFixed(1)}" height="15" rx="4"
            fill="var(--paper2)" opacity=".8"/>`:""}
          <line x1="0" y1="0" x2="${kmToPx(barKm).toFixed(1)}" y2="0" stroke="var(--ink2)" stroke-width="1.5"/>
          <line x1="0" y1="-3" x2="0" y2="3" stroke="var(--ink2)" stroke-width="1.5"/>
          <line x1="${kmToPx(barKm).toFixed(1)}" y1="-3" x2="${kmToPx(barKm).toFixed(1)}" y2="3" stroke="var(--ink2)" stroke-width="1.5"/>
          <text x="${(kmToPx(barKm)+5).toFixed(1)}" y="3" font-size="8.5" fill="var(--ink2)">${barKm<1?(barKm*1000)+"m":barKm+"km"}</text>
        </g>
      </svg>`)}
      <div class="cmside">
        <div class="cmdays">${legend}</div>
        ${waiting.length?`<div class="cmwait"><i></i>${waiting.length} on the waiting list</div>`:""}
        ${notes.length?`<p class="cmnote">${esc(notes.join(" "))}</p>`:""}
        ${focus?`<button class="btn sm" data-act="cityfocus" data-city="${city.id}" data-day="">Show all days</button>`:""}
      </div>
    </div>
  </div>`;
}

function coverageHTML(t){
  const maps = t.cities.map((c,i)=>cityMapHTML(t, c, i)).filter(Boolean);
  if(!maps.length) return "";
  return `<details class="coverage" ${maps.length?"open":""}>
    <summary>Coverage by city<span>where each day takes you</span></summary>
    ${maps.join("")}
  </details>`;
}
/* Its own tab: it answers "have I seen enough of this city", which is a
   different question from "what am I doing on Tuesday". */
function coverTabHTML(t){
  const maps = t.cities.map((c,i)=>cityMapHTML(t, c, i)).filter(Boolean);
  if(!maps.length){
    return `<div class="nodays"><h3>Nothing to draw yet</h3>
      <p>This builds a map per city as you put real places on the calendar. Pick a few
         from the deck or pin your own, and the shape of each city fills in.</p></div>`;
  }
  return `<div class="covertab">
    <p class="covintro">Everywhere you've planned to be, city by city, with each day drawn on top
      of the last. Overlapping days mean you're covering the same ground twice.
      <span class="covmode">${mapModeBtn()}</span></p>
    ${maps.join("")}
  </div>`;
}

function dayMapHTML(t, day){
  const pts = dayPoints(t, day);
  const city = cityById(t, computeDayCities(t)[day]);
  const tiles = tilesOn();
  const W = 244, H = 158, PAD = 18;

  // Nothing pinned yet. A blank rectangle taught you nothing; the city itself at
  // least shows you the shape of the place you are going.
  if(!pts.length){
    if(tiles && city && isNum(city.lat) && isNum(city.lon)){
      const f = tileFrame([{lat:city.lat, lon:city.lon}], W, H, 0, 12);
      const mark = `<svg viewBox="0 0 ${W} ${H}" class="tileover" aria-hidden="true">
        <circle cx="${(W/2).toFixed(1)}" cy="${(H/2).toFixed(1)}" r="6" fill="none"
          stroke="var(--ink)" stroke-width="1.5" opacity=".65"/>
        <circle cx="${(W/2).toFixed(1)}" cy="${(H/2).toFixed(1)}" r="1.6" fill="var(--ink)" opacity=".65"/>
      </svg>`;
      return `<div class="daymap">${tileBoxHTML(f, mark)}
        <div class="dmside">
          <div class="dmempty">Nothing with a location on this day yet — pick real places and
            they will appear on this map.</div>
          <div class="dmacts">${gmapsSearch(city)}</div>
        </div>
      </div>`;
    }
    return `<div class="daymap empty">Nothing with a location on this day yet — pick real places and they'll appear here.</div>`;
  }

  // Two ways to lay the same points out: tiles pick an integer zoom and Mercator,
  // the drawn map scales to fit. Everything after this is the same either way.
  let X, Y, unitsPerKm, frame = null;
  if(tiles){
    frame = tileFrame(pts, W, H, PAD, 16);
    X = frame.X; Y = frame.Y;
    unitsPerKm = 1000 / frame.mpp;
  }else{
    const lats = pts.map(p=>p.lat), lons = pts.map(p=>p.lon);
    const latC = (Math.min.apply(null,lats)+Math.max.apply(null,lats))/2;
    const cosL = Math.cos(latC*Math.PI/180) || 1;
    const lonC = (Math.min.apply(null,lons)+Math.max.apply(null,lons))/2;
    // never zoom in so far that a tight cluster looks spread out
    const MIN_SPAN_DEG = 0.008;                       // roughly 900m
    const spanY = Math.max(Math.max.apply(null,lats)-Math.min.apply(null,lats), MIN_SPAN_DEG);
    const spanX = Math.max((Math.max.apply(null,lons)-Math.min.apply(null,lons))*cosL, MIN_SPAN_DEG);
    const scale = Math.min((W-PAD*2)/spanX, (H-PAD*2)/spanY);
    X = lon => W/2 + (lon-lonC)*cosL*scale;
    Y = lat => H/2 - (lat-latC)*scale;
    unitsPerKm = scale/111.32;
  }

  const want = (W*0.28)/unitsPerKm;
  let barKm = SCALE_STEPS[0];
  SCALE_STEPS.forEach(v=>{ if(v <= want) barKm = v; });
  const barPx = barKm*unitsPerKm;

  // on a real map you can see where you are; the city marker is for the drawn one
  const cx0 = (!tiles && city && city.lat!=null) ? X(city.lon) : null;
  const cy0 = (!tiles && city && city.lat!=null) ? Y(city.lat) : null;
  const cityInFrame = cx0!=null && cx0 > 6 && cx0 < W-46 && cy0 > 10 && cy0 < H-14;
  const cityDot = (cityInFrame && pts.length>1)
    ? `<g opacity=".45"><circle cx="${cx0.toFixed(1)}" cy="${cy0.toFixed(1)}" r="3.5"
         fill="none" stroke="var(--ink2)" stroke-width="1"/>
       <text x="${(cx0+6).toFixed(1)}" y="${(cy0+3).toFixed(1)}" font-size="8"
         fill="var(--ink2)">${esc(city.name)}</text></g>` : "";

  const path = pts.length>1
    ? `<polyline points="${pts.map(p=>X(p.lon).toFixed(1)+","+Y(p.lat).toFixed(1)).join(" ")}"
        fill="none" stroke="${tiles?"var(--ink)":"var(--ink2)"}" stroke-width="${tiles?2:1.2}"
        stroke-dasharray="4 3" opacity="${tiles?.75:.55}"/>` : "";

  const dots = pts.map((p,i)=>{
    const c = MAP_KIND_COLOR[p.m.kind] || MAP_KIND_COLOR.note;
    return `<g><circle cx="${X(p.lon).toFixed(1)}" cy="${Y(p.lat).toFixed(1)}" r="8.5"
        fill="${c}" stroke="var(--paper2)" stroke-width="1.5"${p.m.optional?' opacity=".6"':''}>
        <title>${esc(p.m.label)}</title></circle>
      <text x="${X(p.lon).toFixed(1)}" y="${(Y(p.lat)+3).toFixed(1)}" text-anchor="middle"
        font-size="9" font-weight="700" fill="#fff">${i+1}</text></g>`;
  }).join("");

  // how far apart the day actually is
  let far = 0;
  for(let i=1;i<pts.length;i++){
    const d = haversine(pts[i-1], pts[i]);
    if(d!=null) far += d;
  }
  const legend = pts.map((p,i)=>
    `<span class="dmleg"><i style="background:${MAP_KIND_COLOR[p.m.kind]||MAP_KIND_COLOR.note}">${i+1}</i>${esc(p.m.label)}</span>`
  ).join("");
  const gmaps = "https://www.google.com/maps/dir/" +
    pts.filter(isPoint).map(p=>p.lat.toFixed(5)+","+p.lon.toFixed(5)).join("/");

  const backdrop = tiles ? "" : `
      <rect x="0" y="0" width="${W}" height="${H}" fill="var(--paper)" rx="8"/>
      <g opacity=".5">${[0.25,0.5,0.75].map(f=>
        `<line x1="0" y1="${(H*f).toFixed(0)}" x2="${W}" y2="${(H*f).toFixed(0)}" stroke="var(--line)" stroke-width=".5"/>
         <line x1="${(W*f).toFixed(0)}" y1="0" x2="${(W*f).toFixed(0)}" y2="${H}" stroke="var(--line)" stroke-width=".5"/>`).join("")}</g>`;
  // over tiles the bar needs something to sit on, or it disappears into a park
  const barPlate = tiles
    ? `<rect x="-4" y="-9" width="${(barPx+40).toFixed(1)}" height="15" rx="4"
         fill="var(--paper2)" opacity=".8"/>` : "";
  const scalebar = `<g transform="translate(10,${H-9})">
        ${barPlate}
        <line x1="0" y1="0" x2="${barPx.toFixed(1)}" y2="0" stroke="var(--ink2)" stroke-width="1.5"/>
        <line x1="0" y1="-3" x2="0" y2="3" stroke="var(--ink2)" stroke-width="1.5"/>
        <line x1="${barPx.toFixed(1)}" y1="-3" x2="${barPx.toFixed(1)}" y2="3" stroke="var(--ink2)" stroke-width="1.5"/>
        <text x="${(barPx+5).toFixed(1)}" y="3" font-size="8.5" fill="var(--ink2)">${barKm<1?(barKm*1000)+"m":barKm+"km"}</text>
      </g>`;
  const compass = tiles ? "" : `
      <text x="${W-11}" y="16" text-anchor="middle" font-size="9" fill="var(--ink2)" opacity=".7">N</text>
      <path d="M${W-11} 18 l0 7 M${W-11} 18 l-2.5 3 M${W-11} 18 l2.5 3" stroke="var(--ink2)" stroke-width="1"
        fill="none" opacity=".7"/>`;

  const svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"
      class="${tiles?"tileover":"dmsvg"}" role="img" aria-label="Map of this day's stops">
      ${backdrop}${cityDot}${path}${dots}${scalebar}${compass}
    </svg>`;

  return `<div class="daymap">
    ${tiles ? tileBoxHTML(frame, svg) : svg}
    <div class="dmside">
      <div class="dmlegs">${legend}</div>
      ${pts.length>1?`<div class="dmspread ${far>12?"wide":""}">${far<1?Math.round(far*1000)+"m":far.toFixed(1)+"km"} of ground${far>12?" — that's a lot for one day":""}</div>`:""}
      <div class="dmacts">
        ${pts.length>1?`<button class="btn sm" data-act="optday" data-day="${day}">Optimise order</button>`:""}
        <a class="dmlink" href="${gmaps}" target="_blank" rel="noopener">Open in Maps →</a>
      </div>
    </div>
  </div>`;
}

/* =========================================================
   5o2. WHERE YOU ARE SLEEPING
   A hotel covers nights, not days, which is why this is its own strip rather
   than another row on the overview: a week in Beijing across two hotels is the
   normal case, and the thing you actually need to see is whether every night
   has a bed. Pencilled options and confirmed bookings live together on purpose
   — you compare them in the same place you commit.
   ========================================================= */
const STAY_TINTS = ["#5B8DB8","#4F9D69","#B07BA8","#C98A3E","#5E8C8C","#A2705E"];
const MAX_STAY_IMAGES = 4;
const stayTint = i => STAY_TINTS[i % STAY_TINTS.length];

function stays(t){ return t.stays || (t.stays = []); }
/* the row is only so wide, so "3p" rather than "3:00pm" */
function shortTime(v){
  if(!v) return "";
  const [h,m] = v.split(":").map(Number);
  if(!isNum(h)) return "";
  const ap = h >= 12 ? "p" : "a";
  const hh = h % 12 === 0 ? 12 : h % 12;
  return hh + (m ? ":" + d2(m) : "") + ap;
}
function stayById(t, id){ return stays(t).find(x=>x.id===id) || null; }
function tripNights(t, days){
  const d = days || tripDays(t);
  return d.length > 1 ? d.slice(0, -1) : [];
}
/* the night of the 12th belongs to a stay checking in on the 12th and out on
   the 13th, so the range is closed at the front and open at the back */
function stayNights(st){
  if(!st || !st.from || !st.to) return [];
  const n = daysBetween(st.from, st.to);
  if(!(n > 0) || n > MAX_TRIP_DAYS) return [];
  const out = [];
  for(let i=0;i<n;i++) out.push(addDays(st.from, i));
  return out;
}
function stayCovers(st, night){ return stayNights(st).indexOf(night) >= 0; }
function bookedOn(t, night){
  return stays(t).filter(st=>st.status==="booked" && stayCovers(st, night));
}
function stayGaps(t, days){
  return tripNights(t, days).filter(n=>bookedOn(t, n).length === 0);
}
function stayClashes(t, days){
  return tripNights(t, days).filter(n=>bookedOn(t, n).length > 1);
}
function stayNightCount(st){ return stayNights(st).length; }

function newStay(t, days){
  const nights = tripNights(t, days);
  const gap = stayGaps(t, days)[0] || nights[0] || t.arr.date;
  // run the new stay to the end of the unbooked run it starts, so the common
  // case — filling the hole you can see — takes one click
  let end = gap;
  while(nights.indexOf(end) >= 0 && bookedOn(t, end).length === 0) end = addDays(end, 1);
  const st = {id:uid(), name:"", area:"", cityId:(computeDayCities(t)[gap] || (t.cities[0]||{}).id || ""),
              from:gap, to:end > gap ? end : addDays(gap, 1),
              checkIn:"15:00", checkOut:"11:00", status:"idea",
              link:"", note:"", images:[]};
  stays(t).push(st);
  save();
  openStay(st.id);
}

function stayCityName(t, st){
  const c = t.cities.find(x=>x.id===st.cityId);
  return c ? c.name : "";
}
function stayWhere(t, st){
  const bits = [st.area, stayCityName(t, st)].filter(x=>(x||"").trim());
  return bits.join(", ");
}

function staysHTML(t, days){
  if(!days.length) return "";
  const nights = tripNights(t, days);
  const list = stays(t);
  const gaps = stayGaps(t, days);
  const booked = list.filter(st=>st.status==="booked");
  const ideas = list.filter(st=>st.status!=="booked");

  const head = days.map((d,i)=>{
    const dt = parseD(d);
    return `<div class="sth ${i===days.length-1?"last":""}">
      <span class="ovdow">${DOW[dt.getDay()][0]}</span>
      <span class="ovnum">${dt.getDate()}</span>
    </div>`;
  }).join("");

  const rows = list.map((st,i)=>{
    const mine = stayNights(st);
    const open = stayOpen[st.id];
    const times = (st.checkIn || st.checkOut)
      ? `<span class="sttimes" title="Check in ${st.checkIn?esc(fmt12(st.checkIn)):"—"}, check out ${st.checkOut?esc(fmt12(st.checkOut)):"—"}">
          <b>${st.checkIn?esc(shortTime(st.checkIn)):"—"}</b><i>→</i><b>${st.checkOut?esc(shortTime(st.checkOut)):"—"}</b>
        </span>`
      : `<button class="sttimes none" data-act="stayopen" data-stay="${st.id}"
           title="No check-in or check-out time set yet">set times</button>`;
    const cells = days.map((d,ix)=>{
      const last = ix === days.length-1;
      const on = !last && mine.indexOf(d) >= 0;
      const prev = on && mine.indexOf(days[ix-1]) >= 0;
      const next = on && ix < days.length-2 && mine.indexOf(days[ix+1]) >= 0;
      const cls = ["stc", st.status==="booked"?"booked":"idea"];
      if(on) cls.push("on");
      if(on && !prev) cls.push("start");
      if(on && !next) cls.push("end");
      if(last) cls.push("last");
      return `<button class="${cls.join(" ")}"
        style="--tint:${stayTint(i)}" data-act="stayset" data-stay="${st.id}" data-night="${d}"
        ${last?"disabled":""}
        title="${last?"You check out this morning":esc((st.name||"This hotel")+" — night of "+dayLabel(d))}"></button>`;
    }).join("");
    const n = stayNightCount(st);
    return `<div class="stitem ${open?"open":""}"><div class="strow">
      <button class="stname ${st.status==="booked"?"booked":""} ${open?"open":""}"
        style="--tint:${stayTint(i)}"
        data-act="stayexpand" data-stay="${st.id}"
        title="${open?"Hide the details":"Show the details"}">
        <span class="stcaret">${open?"▾":"▸"}</span>
        <span class="stdot"></span>
        <span class="sttext">${esc(st.name || "Untitled hotel")}</span>
        ${(st.images||[]).length?`<span class="stshots" title="${(st.images||[]).length} screenshot(s)">▣</span>`:""}
      </button>
      <div class="stcells">${cells}</div>
      <div class="stmeta">
        ${times}
        ${st.link
          ? `<button class="stlink" data-act="stayrowlink" data-stay="${st.id}"
               title="Open the booking for ${esc(st.name || "this hotel")}">↗</button>`
          : `<button class="stlink off" data-act="stayopen" data-stay="${st.id}"
               title="No link saved yet — click to add one">↗</button>`}
        <span class="stn ${n?"":"zero"}">${n?n+"n":"—"}</span>
      </div>
    </div>${open ? stayDetailHTML(t, st, i) : ""}</div>`;
  }).join("");

  const clashes = stayClashes(t, days);
  const summary = !list.length
    ? "nothing logged yet"
    : [booked.length ? booked.length + " booked" : "",
       ideas.length ? ideas.length + " pencilled in" : "",
       nights.length ? (gaps.length ? gaps.length + " night" + (gaps.length>1?"s":"") + " with no bed"
                                    : "every night covered") : ""
      ].filter(Boolean).join(" · ");

  return `<details class="stays" ${list.length?"open":""}>
    <summary>Hotels<span>${esc(summary)}</span></summary>
    ${list.length ? `<div class="stgrid">
      <div class="strow sthead"><div class="stname flat"></div>
        <div class="stcells">${head}</div>
        <div class="stmeta"><span class="sttimes flat">in / out</span>
          <span class="stlink flat"></span><span class="stn">n</span></div></div>
      ${rows}
    </div>` : `<p class="stempty">No beds logged yet. Add the places you're considering as well as the
      ones you've booked — pencilled options sit alongside confirmed ones so you can compare them.</p>`}
    ${gaps.length ? `<p class="stwarn">No booking yet for ${esc(gapSummary(gaps))}.</p>` : ""}
    ${clashes.length ? `<p class="stwarn soft">Two confirmed bookings overlap on ${esc(gapSummary(clashes))}
      — worth a check.</p>` : ""}
    <div class="stacts">
      <button class="btn sm" data-act="stayadd">+ add a hotel</button>
      ${list.length ? `<span class="sthint">Drag across the strip to change which nights a hotel covers.</span>` : ""}
    </div>
  </details>`;
}

/* ---------- reading a hotel without opening the editor ----------
   Checking where you're staying is a glance; changing it is a decision. They
   shouldn't cost the same number of clicks. */
let stayOpen = {};
function stayDetailHTML(t, st, i){
  const nights = stayNights(st);
  const where = stayWhere(t, st);
  const imgs = st.images || [];
  const fact = (label, value, cls) => value
    ? `<div class="sdf ${cls||""}"><dt>${esc(label)}</dt><dd>${value}</dd></div>` : "";
  return `<div class="stdetail" style="--tint:${stayTint(i)}">
    <dl class="sdfacts">
      ${fact("Status", st.status==="booked"
        ? '<b class="sdbooked">Booked</b>'
        : '<b class="sdidea">Pencilled in</b>')}
      ${fact("Where", esc(where) || '<span class="sdnone">not set</span>')}
      ${fact("Nights", nights.length
        ? esc(gapSummary(nights)) + ' <span class="sdn">' + nights.length + " night" +
          (nights.length>1?"s":"") + "</span>"
        : '<span class="sdnone">dates need fixing</span>')}
      ${fact("Check in", st.checkIn ? esc(fmt12(st.checkIn)) + ' <span class="sdn">' +
        esc(dayLabel(st.from)) + "</span>" : '<span class="sdnone">no time set</span>')}
      ${fact("Check out", st.checkOut ? esc(fmt12(st.checkOut)) + ' <span class="sdn">' +
        (st.to ? esc(dayLabel(st.to)) : "") + "</span>" : '<span class="sdnone">no time set</span>')}
    </dl>
    ${st.note ? `<p class="sdnote">${esc(st.note)}</p>` : ""}
    ${imgs.length ? `<div class="dithumbs sdshots">${imgs.map(im=>
      `<button class="dithumb" data-act="stayshot" data-stay="${st.id}" data-img="${im.id}"
         title="${esc(im.caption||"Open this screenshot")}">${imageSVG(im)}
         ${(im.strokes||[]).length?`<span class="dimark">${im.strokes.length}</span>`:""}</button>`).join("")}</div>` : ""}
    <div class="sdacts">
      ${st.link ? `<button class="btn sm" data-act="stayrowlink" data-stay="${st.id}">Open booking ↗</button>` : ""}
      <button class="btn sm" data-act="stayopen" data-stay="${st.id}">Edit</button>
    </div>
  </div>`;
}

/* "Sep 12–14 and Sep 19" reads better than a list of fifteen dates */
function gapSummary(nights){
  if(!nights.length) return "";
  const runs = [];
  nights.forEach(n=>{
    const last = runs[runs.length-1];
    if(last && addDays(last[1], 1) === n) last[1] = n;
    else runs.push([n, n]);
  });
  const parts = runs.map(([a,b]) => a===b ? dayLabel(a) : dayLabel(a) + "–" + dayLabel(b));
  if(parts.length === 1) return parts[0];
  return parts.slice(0,-1).join(", ") + " and " + parts[parts.length-1];
}

/* ---------- dragging a stay across the nights ---------- */
let stayDrag = null;
function wireStays(){
  const cells = document.querySelectorAll(".stc[data-stay]");
  if(!cells.length) return;
  cells.forEach(cell=>{
    cell.addEventListener("pointerdown", e=>{
      const night = cell.getAttribute("data-night");
      stayDrag = {id: cell.getAttribute("data-stay"), anchor: night, moved:false};
      e.preventDefault();
    });
    cell.addEventListener("pointerenter", e=>{
      if(!stayDrag || !(e.buttons & 1)) return;
      if(cell.getAttribute("data-stay") !== stayDrag.id) return;
      stayDrag.moved = true;
      setStayRange(stayDrag.id, stayDrag.anchor, cell.getAttribute("data-night"));
    });
  });
  armDragRelease();
}
function setStayRange(id, a, b){
  const t = trip();
  const st = stayById(t, id);
  if(!st) return;
  const from = a < b ? a : b;
  const to   = a < b ? b : a;
  st.from = from;
  st.to = addDays(to, 1);          // the night of `to` ends the morning after
}

function openStayLink(st){
  const url = st && (st.link||"").trim();
  if(!url){ toast("No link saved yet"); return; }
  if(!/^https?:\/\//i.test(url)){ toast("That doesn't look like a web address — it needs to start with http"); return; }
  window.open(url, "_blank", "noopener");
}

/* ---------- one hotel, up close ---------- */
let stayEdit = null;
function openStay(id){
  const t = trip();
  if(!stayById(t, id)) return;
  stayEdit = id;
  drawStay();
}
function stayTimeSelect(which, value){

    <select class="inp" id="st-${which}-h">

    </select>
    <select class="inp" id="st-${which}-m">
      <option value="00" ${mm==="00"?"selected":""}>:00</option>
      <option value="30" ${mm==="30"?"selected":""}>:30</option>

}

    <div class="annohead">

      <div class="stswitch">
        <button class="tbtn ${st.status!=="booked"?"on":""}" data-act="staystatus" data-status="idea">Pencilled in</button>
        <button class="tbtn ${st.status==="booked"?"on":""}" data-act="staystatus" data-status="booked">Booked</button>
      </div>
    </div>
    <div class="field"><label>Hotel</label>
      <input class="inp" id="st-name" value="${esc(st.name||"")}" placeholder="Which hotel"></div>
    <div class="row2">
      <div class="field"><label>Area</label>
        <input class="inp" id="st-area" value="${esc(st.area||"")}" placeholder="Neighbourhood or street"></div>
      <div class="field"><label>City</label>
        <select class="inp" id="st-city">${cityOpts}</select></div>
    </div>
    <div class="row2">
      <div class="field"><label>Check in</label>
        <input class="inp" type="date" id="st-from" value="${esc(st.from||"")}"></div>
      <div class="field"><label>Check out</label>
        <input class="inp" type="date" id="st-to" value="${esc(st.to||"")}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Check-in time</label>${stayTimeSelect("in", st.checkIn)}</div>

    </div>
    <p class="stnights ${n?"":"bad"}">${n

      : "Check-out needs to be after check-in."}</p>
    <div class="field"><label>Cost for the stay${(trip().currency)?" ("+esc(trip().currency)+")":""}</label>
      <input class="inp" id="st-cost" inputmode="decimal" value="${st.cost!=null&&st.cost!==""?esc(String(st.cost)):""}"
        placeholder="the whole stay, not per night"></div>
    <div class="field"><label>Link</label>
      <div class="stlinkrow">
        <input class="inp" id="st-link" value="${esc(st.link||"")}" placeholder="Paste the booking or listing link">
        ${st.link ? `<button class="btn sm" data-act="stayopenlink" data-stay="${st.id}">Open ↗</button>` : ""}

            title="${esc(im.caption||"Click to view or draw on it")}">
            ${imageSVG(im)}
            ${(im.strokes||[]).length?`<span class="dimark">${im.strokes.length}</span>`:""}
          </button>`).join("")}
        ${imgs.length < MAX_STAY_IMAGES
          ? `<button class="diadd" data-act="stayaddshot" data-stay="${st.id}">+<span>add</span></button>` : ""}
      </div></div>
    <div class="modrow">
      <button class="btn danger left" data-act="staydel" data-stay="${st.id}">Delete</button>

function readStay(){
  const t = trip();
  const st = stayById(t, stayEdit);
  if(!st) return null;
  const g = id => { const el = document.getElementById(id); return el ? el.value : null; };
  const nm = g("st-name");   if(nm !== null) st.name = nm.trim();
  const ar = g("st-area");   if(ar !== null) st.area = ar.trim();
  const ci = g("st-city");   if(ci !== null) st.cityId = ci;
  const fr = g("st-from");   if(fr) st.from = fr;
  const to = g("st-to");     if(to) st.to = to;
  const ln = g("st-link");   if(ln !== null) st.link = ln.trim();
  const cs = g("st-cost");   if(cs !== null) st.cost = cs.trim() === "" ? "" : num(cs);
  const nt = g("st-note");   if(nt !== null) st.note = nt;
  ["in","out"].forEach(w=>{
    const h = g("st-"+w+"-h"), m = g("st-"+w+"-m");
    if(h === null) return;
    const key = w === "in" ? "checkIn" : "checkOut";
    st[key] = h ? h + ":" + (m || "00") : "";
  });
  return st;
}

function calendarHTML(t, days){
  if(!days.length) return noDaysHTML(t);
  const dayCities = computeDayCities(t);
  const overview = overviewHTML(t, days);
  const today = todayStr();
  const nFold = days.filter(d=>dayFolded(t, d)).length;
  const nLock = days.filter(d=>dayLocked(t, d)).length;
  const bits = [];
  if(nFold) bits.push(nFold + " folded");
  if(nLock) bits.push(nLock + " finalised");
  const tools = `<div class="caltools">
    <span class="ctlab">Days</span>
    <button class="ctbtn" data-act="foldall" data-mode="all" ${nFold===days.length?"disabled":""}
      title="Fold every day to a single line">Fold all</button>
    <button class="ctbtn" data-act="foldall" data-mode="none" ${nFold?"":"disabled"}
      title="Open every day back up">Open all</button>
    ${nLock ? `<button class="ctbtn" data-act="foldall" data-mode="locked"
      title="Get the settled days out of the way">Fold the finalised</button>` : ""}
    <span class="ctnote">${esc(bits.join(" \u00b7 "))}</span>
  </div>`;
  return todayStripHTML(t, days) + overview + staysHTML(t, days) + tools + `<div class="cal">` +
    days.map((d,i)=>dayCardHTML(t, d, i, days, dayCities[d], today)).join("") + `</div>`;
}

/* One day. Two things change its shape: folded (one line instead of a card) and
   finalised (everything still shows, nothing can be moved). They compose — a
   finalised day can be folded away, which is the usual reason to fold one. */
function dayCardHTML(t, d, i, days, cid, today){
  const locked = dayLocked(t, d);
  const folded = dayFolded(t, d);
  const cls = ["day"];
  if(d===today) cls.push("today");
  if(locked) cls.push("locked");
  if(folded) cls.push("folded");
  const dropAttr = (folded && !locked) ? ` data-drop="cal:${d}:same"` : "";
  return `<div class="${cls.join(" ")}"${dropAttr}>
    ${dayHeadHTML(t, d, i, days, cid, folded, locked)}
    ${folded ? dayFoldedHTML(t, d, locked) : dayOpenHTML(t, d, locked)}
  </div>`;
}

function dayHeadHTML(t, d, i, days, cid, folded, locked){
  const dt = parseD(d);
  const city = cityById(t, cid);
  const cityOpts = t.cities.map(c=>
    `<option value="${c.id}" ${c.id===cid?"selected":""}>${esc(c.name)}</option>`).join("");
  const n = t.magnets.filter(m=>m.board==="cal" && m.day===d && m.kind!=="fly").length;
  return `<div class="dayhead">
    <button class="dayfold" data-act="dayfold" data-day="${d}"
      title="${folded?"Open "+esc(dayLabel(d)):"Fold "+esc(dayLabel(d))+" away"}"
      aria-expanded="${folded?"false":"true"}">${folded?"\u25B8":"\u25BE"}</button>
    <span class="dnum">${MON[dt.getMonth()]} ${d2(dt.getDate())}</span>
    <span class="dow">${DOW[dt.getDay()]}</span>
    <span class="idx">Day ${i+1}</span>
    ${folded && n ? `<span class="idx">${n}</span>` : ""}
    ${(()=>{
      const C = dayCost(t, d);
      if(!C.sure && !C.maybe) return "";
      return `<span class="dcost" title="${C.maybe ? money(t, C.maybe)+" more if you do the optional ones" : "What this day costs, as far as you have said"}"
        >${money(t, C.sure) || "—"}${C.maybe ? "+" : ""}</span>`;
    })()}
    ${(()=>{
      const L = dayLoad(t, d);
      if(!L.total) return "";
      return `<span class="dload ${L.over > 0 ? "over" : ""}" title="${hm(L.onSite)} on site${
        L.hops ? " · " + hm(L.hops) + " getting between them" : ""}${
        L.legs ? " · " + hm(L.legs) + " travelling" : ""}${
        L.optional ? " · " + hm(L.optional) + " more if you do the optional ones" : ""}${
        L.over > 0 ? " — about " + hm(L.over) + " more than the day holds" : ""}">${hm(L.total)}</span>`;
    })()}
    <span class="daymove">
      <button class="mvbtn" data-act="moveday" data-day="${d}" data-dir="-1"
        ${i===0?"disabled":""} title="Swap this day's plan with ${i===0?"":esc(dayLabel(days[i-1]))}">\u2191</button>
      <button class="mvbtn" data-act="moveday" data-day="${d}" data-dir="1"
        ${i===days.length-1?"disabled":""} title="Swap this day's plan with ${i===days.length-1?"":esc(dayLabel(days[i+1]))}">\u2193</button>
    </span>
    <button class="lockbtn ${locked?"on":""}" data-act="daylock" data-day="${d}"
      title="${locked?"Finalised \u2014 click to unlock this day":"Plans finalised? Lock this day so nothing moves"}"
      >${locked?"\u{1F512}":"\u{1F513}"}</button>
    ${locked ? `<span class="finchip">finalised</span>` : ""}
    ${locked
      ? `<span class="basecity" title="Unlock the day to change the city">${esc(city?city.name:"\u2014")}</span>`
      : `<select class="basecity" data-act="setcity" data-day="${d}">${cityOpts}</select>`}
    <div class="wx">${wxHTML(t, d, cid)}</div>
  </div>`;
}

/* Folded: one readable line, and — only while something is being dragged — a row
   of slot targets, so a fold never costs you a drop. */
function dayFoldedHTML(t, d, locked){
  const s = daySummary(t, d);
  const items = s.acts.concat(s.meals);
  const chips = items.slice(0,4).map(m=>
    `<span class="dsumchip" style="--c:var(--m-${m.kind})" data-mag="${m.id}"
       draggable="${(locked || m.locked)?"false":"true"}"
       title="${esc(m.label)}${locked?"":" — drag it somewhere else, or click to open it"}"
       ><i></i>${esc(m.label)}</span>`).join("");
  const more = items.length>4 ? `<span class="dsumn">+${items.length-4} more</span>` : "";
  const extras = [];
  if(s.trans.length) extras.push(s.trans.length + (s.trans.length===1?" transfer":" transfers"));
  if(s.stickies)     extras.push(s.stickies + (s.stickies===1?" sticky":" stickies"));
  if(s.notes)        extras.push("a day note");
  if(s.images)       extras.push(s.images + (s.images===1?" image":" images"));
  const tail = extras.length ? `<span class="dsumn">\u00b7 ${esc(extras.join(" \u00b7 "))}</span>` : "";
  const line = items.length
    ? chips + more + tail
    : `<span class="dsumn">${locked?"Finalised as an empty day":"Nothing planned yet"}${
        extras.length ? " \u00b7 " + esc(extras.join(" \u00b7 ")) : ""}</span>`;
  // no slot picker down here: the whole folded card takes a drop (keeping the slot
  // the thing already had) and the rail is where you pick a different one
  return `<div class="dsum">${line}</div>`;
}

function dayOpenHTML(t, d, locked){
  const drop = id => locked ? "" : ` data-drop="${id}"`;
  const slots = SLOTS.map(s=>{
    const ms = magnetsIn(t, m=>m.board==="cal"&&m.day===d&&m.slot===s.id);
    return `<div class="slot"${drop("cal:"+d+":"+s.id)}>
      <h4>${s.label}</h4>
      <div class="stack">${ms.map(m=>magnetHTML(m, {frozen:locked})).join("")
        || (locked ? '<div class="lockedhint">nothing here</div>'
                   : '<div class="placeholder">drop here</div>')}</div>
    </div>`;
  }).join("");
  const trans = magnetsIn(t, m=>m.board==="cal"&&m.day===d&&m.slot==="transit");
  const meals = MEALS.map(ml=>{
    const got = magnetsIn(t, m=>m.board==="cal"&&m.day===d&&m.slot===ml.id);
    return `<div class="meal"${drop("cal:"+d+":"+ml.id)}>
      <span class="mlab">${ml.label}</span>
      ${got.length ? got.map(m=>magnetHTML(m, {frozen:locked})).join("")
        : locked ? `<span class="lockedhint">not set</span>`
        : `<button class="mpick" data-act="pickmeal" data-day="${d}" data-meal="${ml.id}">
             Where for ${ml.label.toLowerCase()}?</button>`}
    </div>`;
  }).join("");
  return `<div class="daybody ${secHidden("pad")?"nopad":""}">
    ${secHidden("pad") ? "" : dayPadHTML(t, d)}
    <div class="daymain">
      <div class="slots">${slots}</div>
      ${secHead("map", "Map & order", secHidden("map") ? "" : mapModeBtn())}
      ${secHidden("map") ? "" : dayMapHTML(t, d)}
      ${secHead("meals", "Meals")}
      ${secHidden("meals") ? "" : `<div class="meals">${meals}</div>`}
      ${secHead("extras", "Notes & images")}
      ${secHidden("extras") ? "" : dayExtrasHTML(t, d)}
      ${secHead("transit", "Getting around",
        (secHidden("transit") || locked) ? "" : `<button class="btn sm" data-act="addtransport" data-day="${d}">+ transport</button>`)}
      ${secHidden("transit") ? "" : `<div class="transit"${drop("transit:"+d)}>
        <div class="stack">${trans.map(m=>magnetHTML(m, {frozen:locked})).join("")
          || (locked ? '<div class="lockedhint">nothing booked</div>'
                     : '<div class="placeholder">trains, buses, transfers\u2026</div>')}</div>
      </div>`}
    </div>
  </div>`;
}

function noDaysHTML(t){
  const a = t.arr.date, b = t.dep.date;

  else if(span < 0) why = "Departure (" + b + ") is before arrival (" + a + ").";
  else if(span > MAX_TRIP_DAYS-1) why = "That's " + (span+1) + " days apart — longer than this board handles, so something's off by a year or a month.";

/* =========================================================
   9. DRAG AND DROP
   ========================================================= */
let dragId = null;

let ovDrag = null;
function wireOverview(){
  const cells = document.querySelectorAll(".ovc");
  if(!cells.length) return;
  cells.forEach(cell=>{
    cell.addEventListener("pointerdown", e=>{
      ovDrag = {city: cell.getAttribute("data-city"), touched:false};
    });
    cell.addEventListener("pointerenter", e=>{
      if(!ovDrag || !(e.buttons & 1)) return;
      if(cell.getAttribute("data-city") !== ovDrag.city) return;
      const t = trip();
      if(dayLocked(t, cell.getAttribute("data-day"))) return;   // a finalised day keeps its city
      pinDay(t, cell.getAttribute("data-day"), ovDrag.city);
      ovDrag.touched = true;
      cell.classList.add("on");
      save();
    });
  });
  armDragRelease();
}

/* One release handler for the whole board, installed once. It used to be
   registered {once:true} on every render, which meant a stray click anywhere
   ate it and the next drag quietly did nothing. */
let dragReleaseArmed = false;
function armDragRelease(){
  if(dragReleaseArmed) return;
  dragReleaseArmed = true;
  window.addEventListener("pointerup", ()=>{
    let redraw = false;
    if(ovDrag){
      if(ovDrag.touched) redraw = true;
      ovDrag = null;
    }
    if(stayDrag){
      if(!stayDrag.moved) setStayRange(stayDrag.id, stayDrag.anchor, stayDrag.anchor);
      stayDrag = null;
      save();
      redraw = true;
    }
    if(redraw) render();
  });
}
function wireDnD(){
  document.querySelectorAll("[data-mag][draggable='true']").forEach(el=>{
    el.addEventListener("dragstart", e=>{
      dragId = el.getAttribute("data-mag");
      e.dataTransfer.effectAllowed = "move";
      try{ e.dataTransfer.setData("text/plain", dragId); }catch(_){}
      // Everything else waits a tick. Touching the DOM inside dragstart is how you
      // lose a drag: the browser is still taking the drag image and deciding the
      // gesture happened, and Safari in particular just cancels.
      const at = {x:e.clientX, y:e.clientY};
      setTimeout(()=>{
        if(!dragActive) return;              // already over by the time we got here
        el.classList.add("dragging");
        beginDrag(dragId, el, at);
      }, 0);
      dragActive = true;
    });
    el.addEventListener("dragend", ()=>{ el.classList.remove("dragging"); dragId=null; endDrag(); });
  });
  document.querySelectorAll("[data-drop]").forEach(z=>{
    // The rail lives outside #app and wires its own rows once. A render in the middle
    // of a drag — a weather reply landing, say — would otherwise staple these generic
    // handlers onto it as well, and the first one to run stops the rail ever hearing
    // about the drop: the thing moves, but silently, with no undo.
    if(z.closest("#dayrail")) return;
    z.addEventListener("dragover", e=>{ e.preventDefault(); e.dataTransfer.dropEffect="move";
      // a folded day is itself a drop zone with smaller ones inside it, so only
      // the innermost one under the cursor lights up
      if(e.target.closest("[data-drop]") === z) z.classList.add("drop-on");
      else z.classList.remove("drop-on"); });
    z.addEventListener("dragleave", e=>{ if(!z.contains(e.relatedTarget)) z.classList.remove("drop-on"); });
    z.addEventListener("drop", e=>{
      e.preventDefault(); e.stopPropagation();
      z.classList.remove("drop-on");
      endDrag();
      let id = dragId;
      if(!id){ try{ id = e.dataTransfer.getData("text/plain"); }catch(_){} }
      if(!id) return;
      dropInto(z, id, e.clientY);
      dragId = null;
    });
  });
}

/* Where in the list you let go decides the order, not the clock. Mouse and finger
   both come through here, so there is one answer rather than two. */
function dropInto(zone, id, clientY){
  const t = trip();
  if(!t || !zone || !id) return;
  const sibs = [].slice.call(zone.querySelectorAll("[data-mag]"))
    .filter(el=>el.getAttribute("data-mag") !== id);
  let beforeId = null;
  for(const el of sibs){
    const r = el.getBoundingClientRect();
    if(clientY < r.top + r.height/2){ beforeId = el.getAttribute("data-mag"); break; }
  }
  moveMagnet(t, id, zone.getAttribute("data-drop"), beforeId);
}

/* =========================================================
   9b. THE DAY RAIL
   The complaint this answers: on a ten-day trip the day you want to move
   something to is almost always off-screen, so a drag becomes a fight with the
   scrollbar — pick the thing up, scroll with it, hope nothing scrolls back.

   So: while — and only while — something is in the air, a list of every day
   appears pinned to the edge of the window. Drop on a row and the thing lands on
   that day in the slot it already had, which is nearly always what you meant.
   Hover a row for a beat and its slots fan out to the left if you want a
   different one. It sits over the side column and never over the day cards, so
   rearranging inside a day is exactly as it was.
   ========================================================= */
const RAIL_TARGETS = SLOTS.concat(MEALS).map(s=>({label:s.label, t:"cal:{d}:"+s.id}))
  .concat([{label:"Getting around", t:"transit:{d}"}]);
let rail = null;

let dragActive = false;
function beginDrag(magId, srcEl, at){
  document.body.classList.add("dragging");
  openRail(magId, srcEl, at);
  startDragScroll();
}
function endDrag(){
  dragActive = false;
  document.body.classList.remove("dragging");
  closeRail();
  stopDragScroll();
  if(renderPending){ renderPending = false; render(); }
}
/* A drag can end without telling anyone — the element it started on gets replaced
   by a render, the window loses focus, the browser gives up. A rail left behind
   would sit there swallowing clicks, which looks exactly like "drag and drop
   stopped working", so anything that proves no drag is running clears it. */
function dragWatchdog(){
  if(!dragActive && (rail || document.body.classList.contains("dragging"))) endDrag();
}
document.addEventListener("mousemove", dragWatchdog);
document.addEventListener("pointerdown", dragWatchdog);

/* If a drag fails to take — a slip of the trackpad, a browser that decided the
   gesture was not one — the mouseup still arrives as a click, and clicking a magnet
   opens its editor. Getting the edit box when you meant to move something is worse
   than nothing happening, so a press that travelled is not a click. */
let magPress = null;
document.addEventListener("pointerdown", e=>{
  const mg = e.target && e.target.closest ? e.target.closest("[data-mag]") : null;
  magPress = mg ? {x:e.clientX, y:e.clientY} : null;
});
function pressTravelled(e){
  if(!magPress) return false;
  return Math.abs(e.clientX - magPress.x) > 6 || Math.abs(e.clientY - magPress.y) > 6;
}
window.addEventListener("blur", ()=>{ dragActive = false; endDrag(); });
function closeRail(){
  if(!rail) return;
  clearTimeout(rail.timer);
  if(rail.el && rail.el.parentNode) rail.el.parentNode.removeChild(rail.el);
  rail = null;
}
function openRail(magId, srcEl, at){
  closeRail();
  if(view.name!=="trip" || view.tab!=="cal") return;
  const t = trip();
  if(!t) return;
  const days = tripDays(t);
  if(days.length < 2) return;            // one day: there is nowhere else to go
  const src = t.magnets.find(m=>m.id===magId);
  const srcDay = (src && src.board==="cal") ? src.day : null;
  const dc = computeDayCities(t);
  const el = document.createElement("div");
  el.id = "dayrail";
  el.innerHTML = `<div class="railhead">Drop on a day</div>
    <div class="railscroll">${days.map((d,i)=>{
      const locked = dayLocked(t, d);
      const here = d === srcDay;
      const n = t.magnets.filter(m=>m.board==="cal" && m.day===d && m.kind!=="fly").length;
      const ci = t.cities.findIndex(c=>c.id===dc[d]);
      const open = (!locked && !here) ? ` data-drop="cal:${d}:same" data-day="${d}"` : "";
      return `<div class="railrow ${locked?"locked":""} ${here?"here":""}"${open}
        style="--tint:${ci>=0?cityTint(ci):"#d3cabb"}"
        title="${esc(dayLabel(d))}${locked?" — finalised":here?" — where it is now":""}">
        <span class="rd">${i+1}</span><span class="rcity"></span>
        <span class="rlab">${esc(dayLabel(d))}</span>
        ${locked ? `<span class="rn">\u{1F512}</span>`
          : here ? `<span class="rn">here</span>`
          : `<span class="rn ${n?"":"zero"}">${n}</span>`}
      </div>`;
    }).join("")}</div>
    <div class="railrow railtray" data-drop="tray" title="Off the calendar, back into your magnets">
      <span class="rd">↩</span><span class="rlab">Your magnets</span></div>`;
  el.style.visibility = "hidden";
  document.body.appendChild(el);
  rail = {el, magId, timer:null, leave:null, openRow:null, armed:null, box:null, side:"left"};
  positionRail(el, srcEl, at);
  el.style.visibility = "";

  el.addEventListener("dragover", e=>{
    railScroll(el, e.clientY);
    const z = e.target.closest("[data-drop]");
    if(!z) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    z.classList.add("drop-on");
    if(rail) clearTimeout(rail.leave);
    if(z.classList.contains("railslot")) return;      // already on the fan-out
    railArm(z.classList.contains("railrow") ? z : null);
  });
  el.addEventListener("dragleave", e=>{
    const z = e.target.closest("[data-drop]");
    if(z && !z.contains(e.relatedTarget)) z.classList.remove("drop-on");
    // leaving the rail closes the fan-out, but not instantly: the trip from a row
    // to its own slots passes over a sliver of page in between
    if(rail && !el.contains(e.relatedTarget)){
      clearTimeout(rail.leave);
      rail.leave = setTimeout(railCloseSlots, 400);
    }
  });
  el.addEventListener("drop", e=>{
    const z = e.target.closest("[data-drop]");
    if(!z) return;
    e.preventDefault(); e.stopPropagation();
    railDrop(z.getAttribute("data-drop"));
  });
  requestAnimationFrame(()=>{ if(rail && rail.el===el) el.classList.add("on"); });
}
/* Put it beside the day you are dragging from, with that day's own row under the
   pointer — so the day before and the day after are a few pixels away, and the far
   end of the trip is a short slide rather than a scroll. It goes in the gutter to
   the right of the day card where there is room, so it never lands on top of the
   card you might be rearranging. */
function positionRail(el, srcEl, at){
  const W = el.offsetWidth, H = el.offsetHeight;
  const pad = 8;
  const host = (srcEl && srcEl.closest) ? (srcEl.closest(".day") || srcEl.closest(".traycol")
                || srcEl.closest(".discovercol") || srcEl) : null;
  const hr = host && host.getBoundingClientRect ? host.getBoundingClientRect() : null;
  const sr = (srcEl && srcEl.getBoundingClientRect) ? srcEl.getBoundingClientRect() : null;
  const py = (at && at.y) ? at.y : (sr ? sr.top + sr.height/2 : window.innerHeight/2);

  let left = hr ? hr.right + 12 : window.innerWidth - W - 14;
  let side = "left";                                  // which way the fan-out opens
  if(left + W > window.innerWidth - pad){
    left = (hr ? hr.left : window.innerWidth) - W - 12;
    side = "left";
  }else{
    side = "right";
  }
  left = Math.max(pad, Math.min(left, window.innerWidth - W - pad));

  const sc = el.querySelector(".railscroll");
  const here = el.querySelector(".railrow.here");
  if(sc && here && sc.scrollHeight > sc.clientHeight + 1){
    sc.scrollTop = Math.max(0, Math.min(sc.scrollHeight - sc.clientHeight,
      here.offsetTop - sc.offsetTop - sc.clientHeight/2 + here.offsetHeight/2));
  }
  // offsetTop is measured against the rail, so this is where that row will sit
  const anchor = here ? (here.offsetTop - (sc ? sc.scrollTop : 0) + here.offsetHeight/2) : H/2;
  let top = py - anchor;
  top = Math.max(pad, Math.min(top, window.innerHeight - H - pad));

  el.style.left = Math.round(left) + "px";
  el.style.top  = Math.round(top) + "px";
  el.style.transformOrigin = side === "right" ? "center left" : "center right";
  if(rail) rail.side = side;
}
/* a long trip does not fit: nudge the list along when you hover its ends */
function railScroll(el, y){
  const sc = el.querySelector(".railscroll");
  if(!sc || sc.scrollHeight <= sc.clientHeight) return;
  const r = sc.getBoundingClientRect();
  if(y < r.top + 24) sc.scrollTop -= 14;
  else if(y > r.bottom - 24) sc.scrollTop += 14;
}
/* hovering a row for a beat fans its slots out; anything shorter is a pass-over.
   The fan-out is a child of the rail rather than of the row, because the list of
   days scrolls and a scrolling box clips whatever hangs outside it. */
function railCloseSlots(){
  if(!rail) return;
  clearTimeout(rail.timer);
  if(rail.box && rail.box.parentNode) rail.box.parentNode.removeChild(rail.box);
  rail.box = null; rail.openRow = null; rail.armed = null;
}
function railArm(row){
  if(!rail) return;
  // dragover repeats for as long as the pointer sits there, so a row already
  // waiting its turn must not restart its own timer — that is a wait that never ends
  if(rail.openRow === row || rail.armed === row) return;
  clearTimeout(rail.timer);
  if(!row || !row.getAttribute("data-day")){ railCloseSlots(); return; }
  railCloseSlots();
  rail.armed = row;
  rail.timer = setTimeout(()=>{
    if(!rail || !row.isConnected) return;
    const sc = rail.el.querySelector(".railscroll");
    const day = row.getAttribute("data-day");
    const box = document.createElement("div");
    // fan out into whichever side has the room
    box.className = "railslots" + (rail.side === "right" ? " toright" : "");
    // offsetTop is already measured against the rail, which is the positioned
    // ancestor here; only the list's own scrolling has to be taken off
    box.style.top = Math.max(6, row.offsetTop - (sc ? sc.scrollTop : 0) - 3) + "px";
    box.innerHTML = RAIL_TARGETS.map(x=>
      `<div class="railslot" data-drop="${x.t.replace("{d}", day)}">${esc(x.label)}</div>`).join("");
    rail.el.appendChild(box);
    rail.box = box; rail.openRow = row; rail.armed = null;
  }, 220);
}
function railDrop(target){
  const t = trip();
  const id = rail ? rail.magId : dragId;
  const y = window.scrollY;
  endDrag();
  if(!t || !id || !target) return;
  moveMagnet(t, id, target, null);
  window.scrollTo(0, y);                 // you asked to stay where you were
  const p = target.split(":");
  if(!lastMove) return;                  // it refused — it has already said why
  if(p[0]==="tray") toastUndo("Back in your magnets", "undomove");
  else toastUndo("Moved to " + dayLabel(p[1]), "undomove");
}

/* Dragging near the top or bottom of the window scrolls the board, which is what
   every other planner does and this one did not. */
let dragScroll = {on:false, y:0, raf:0, overRail:false};
function startDragScroll(){
  dragScroll.on = true; dragScroll.y = 0; dragScroll.overRail = false;
  tickDragScroll();
}
function stopDragScroll(){
  dragScroll.on = false;
  if(dragScroll.raf) cancelAnimationFrame(dragScroll.raf);
  dragScroll.raf = 0;
}
function tickDragScroll(){
  if(!dragScroll.on) return;
  dragScroll.raf = requestAnimationFrame(tickDragScroll);
  if(!dragScroll.y || dragScroll.overRail) return;
  const h = window.innerHeight, EDGE = 110;
  let v = 0;
  if(dragScroll.y < EDGE) v = dragScroll.y - EDGE;
  else if(dragScroll.y > h - EDGE) v = dragScroll.y - (h - EDGE);
  if(v) window.scrollBy(0, Math.max(-28, Math.min(28, v/3.5)));
}

/* =========================================================
   9c. DRAGGING WITH A FINGER
   HTML5 drag and drop does not exist on touch: no dragstart, no dragover, nothing.
   Every phone and tablet therefore had a board it could read and not rearrange —
   which is backwards, because the phone is the device you have with you on the
   trip and the laptop is the one you left at home.

   So the same gesture, built out of pointer events: press and hold to pick
   something up, drag, let go. Everything downstream is shared with the mouse — the
   same drop zones, the same rail, the same moveMagnet — so there is one set of
   rules about where things may land, not two that drift apart.

   The hold matters. A finger that starts moving immediately meant to scroll the
   page, and taking that away would make the board unusable. So: hold still for a
   moment and you are dragging; move first and you are scrolling, and the drag
   never starts.
   ========================================================= */
const TOUCH_HOLD_MS = 260;
const TOUCH_SLOP = 10;
let tdrag = null;
let suppressClickUntil = 0;

function touchDragBegin(e, el){
  tdrag = {id: el.getAttribute("data-mag"), el, x: e.clientX, y: e.clientY,
           lastX: e.clientX, lastY: e.clientY, live: false, zone: null, ghost: null, hold: 0};
  tdrag.hold = setTimeout(touchDragEngage, TOUCH_HOLD_MS);
}
function touchDragEngage(){
  if(!tdrag || tdrag.live) return;
  // it travelled while the hold was counting down — that was a scroll after all
  if(Math.abs(tdrag.lastX - tdrag.x) > TOUCH_SLOP || Math.abs(tdrag.lastY - tdrag.y) > TOUCH_SLOP){
    tdrag = null;
    return;
  }
  tdrag.live = true;
  dragId = tdrag.id;
  dragActive = true;
  tdrag.el.classList.add("dragging");
  // the finger covers the thing it is holding, so carry a copy above it
  const g = tdrag.el.cloneNode(true);
  g.classList.add("ghost");
  g.classList.remove("dragging");
  g.style.width = tdrag.el.offsetWidth + "px";
  document.body.appendChild(g);
  tdrag.ghost = g;
  touchGhostTo(tdrag.x, tdrag.y);
  beginDrag(tdrag.id, tdrag.el, {x: tdrag.x, y: tdrag.y});
  try{ if(navigator.vibrate) navigator.vibrate(8); }catch(_){}
}
function touchGhostTo(x, y){
  if(tdrag && tdrag.ghost){
    tdrag.ghost.style.left = Math.round(x) + "px";
    tdrag.ghost.style.top  = Math.round(y) + "px";
  }
}
function touchDragMove(e){
  if(!tdrag) return;
  if(!tdrag.live){
    // moved before the hold finished: that was a scroll, let it be one
    if(Math.abs(e.clientX - tdrag.x) > TOUCH_SLOP || Math.abs(e.clientY - tdrag.y) > TOUCH_SLOP){
      clearTimeout(tdrag.hold);
      tdrag = null;
    }
    return;
  }
  tdrag.lastY = e.clientY;
  tdrag.lastX = e.clientX;
  touchGhostTo(e.clientX, e.clientY);
  dragScroll.y = e.clientY;
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const onRail = !!(under && under.closest && under.closest("#dayrail"));
  dragScroll.overRail = onRail;
  const zone = (under && under.closest) ? under.closest("[data-drop]") : null;
  if(zone !== tdrag.zone){
    if(tdrag.zone) tdrag.zone.classList.remove("drop-on");
    tdrag.zone = zone;
    if(zone) zone.classList.add("drop-on");
  }
  if(onRail && rail){
    railScroll(rail.el, e.clientY);
    if(zone && zone.classList.contains("railrow")) railArm(zone);
    else if(!zone || !zone.classList.contains("railslot")) railArm(null);
  }
}
function touchDragEnd(commit){
  if(!tdrag) return;
  clearTimeout(tdrag.hold);
  const live = tdrag.live, zone = tdrag.zone, id = tdrag.id, y = tdrag.lastY, tx = tdrag.lastX;
  if(tdrag.ghost && tdrag.ghost.parentNode) tdrag.ghost.parentNode.removeChild(tdrag.ghost);
  if(tdrag.el) tdrag.el.classList.remove("dragging");
  tdrag = null;
  if(!live) return;
  // a hold-and-release still ends in a click; that click is not a request to edit
  suppressClickUntil = Date.now() + 350;
  if(zone) zone.classList.remove("drop-on");
  // a node that has been replaced since the last move is no target at all
  let live_zone = zone;
  if(live_zone && !live_zone.isConnected){
    const under = document.elementFromPoint(tx, y);
    live_zone = (under && under.closest) ? under.closest("[data-drop]") : null;
  }
  const target = (commit && live_zone) ? live_zone.getAttribute("data-drop") : null;
  if(commit && live_zone && live_zone.closest("#dayrail")){
    railDrop(target);              // ends the drag itself, and offers the undo
    return;
  }
  endDrag();
  if(target) dropInto(live_zone, id, y);
}

document.addEventListener("pointerdown", e=>{
  if(e.pointerType === "mouse") return;              // the mouse already has a way in
  if(view.name !== "trip" || !e.target.closest) return;
  if(e.target.closest("[data-act]")) return;         // the pin and the bin are buttons
  const el = e.target.closest("[data-mag][draggable='true']");
  if(el) touchDragBegin(e, el);
});
document.addEventListener("pointermove", e=>{
  if(tdrag && e.pointerType !== "mouse") touchDragMove(e);
}, {passive:true});
document.addEventListener("pointerup", ()=>{ if(tdrag) touchDragEnd(true); });
document.addEventListener("pointercancel", ()=>{ if(tdrag) touchDragEnd(false); });
/* Non-passive on purpose: while a finger is dragging, the page must hold still.
   Nothing is prevented before the hold completes, so an ordinary swipe still scrolls. */
document.addEventListener("touchmove", e=>{
  if(tdrag && tdrag.live) e.preventDefault();
}, {passive:false});

const WMO = {0:"☀️",1:"🌤",2:"⛅️",3:"☁️",45:"🌫",48:"🌫",51:"🌦",53:"🌦",55:"🌦",
  61:"🌧",63:"🌧",65:"🌧",66:"🌧",67:"🌧",71:"🌨",73:"🌨",75:"❄️",77:"🌨",
  80:"🌦",81:"🌧",82:"⛈",85:"🌨",86:"❄️",95:"⛈",96:"⛈",99:"⛈"};

function md(dateStr){ return dateStr.slice(5); }

async function fetchSeasonal(t){
  const years = 5;
  const nowY = new Date().getFullYear();
  for(const city of t.cities){
    if(city.lat==null) continue;
    if(t.wx.seasonal[city.id] && t.wx.seasonal[city.id].range === t.arr.date+"|"+t.dep.date) continue;
    const acc = {};
    let ok = false;
    for(let i=1;i<=years;i++){
      const y = nowY - i;
      const start = (y) + "-" + t.arr.date.slice(5);
      // handle trips crossing new year
      const endY = t.dep.date.slice(0,4) > t.arr.date.slice(0,4) ? y+1 : y;
      const end = endY + "-" + t.dep.date.slice(5);
      const url = "https://archive-api.open-meteo.com/v1/archive?latitude="+city.lat+"&longitude="+city.lon+
        "&start_date="+start+"&end_date="+end+
        "&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto";
      try{
        const r = await fetch(url);
        if(!r.ok) continue;
        const j = await r.json();
        const D = j.daily;
        if(!D || !D.time) continue;
        ok = true;
        D.time.forEach((dt,ix)=>{
          const k = md(dt);
          if(!acc[k]) acc[k] = {hi:0,lo:0,wet:0,n:0};
          const hi=D.temperature_2m_max[ix], lo=D.temperature_2m_min[ix], pr=D.precipitation_sum[ix];
          if(hi==null||lo==null) return;
          acc[k].hi+=hi; acc[k].lo+=lo; acc[k].wet += (pr>1?1:0); acc[k].n++;
        });
      }catch(e){ /* offline */ }
    }
    if(!ok) continue;
    const byMD = {};
    Object.keys(acc).forEach(k=>{
      const a = acc[k];
      if(!a.n) return;
      byMD[k] = {hi:a.hi/a.n, lo:a.lo/a.n, wet:a.wet/a.n, n:a.n};
    });
    t.wx.seasonal[city.id] = {byMD, range:t.arr.date+"|"+t.dep.date, at:Date.now()};
  }
  save();
  if(view.name==="trip") render();
}

async function fetchLive(t){
  let any = false;
  for(const city of t.cities){
    if(city.lat==null) continue;
    const base = "https://api.open-meteo.com/v1/forecast?latitude="+city.lat+"&longitude="+city.lon+
      "&forecast_days=16&timezone=auto&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,";
    try{
      let r = await fetch(base+"weather_code");
      if(!r.ok) r = await fetch(base+"weathercode");   // older parameter spelling
      if(!r.ok) continue;
      const j = await r.json();
      const D = j.daily;
      if(!D || !D.time) continue;
      const codes = D.weather_code || D.weathercode || [];
      const byDate = {};
      D.time.forEach((dt,ix)=>{
        byDate[dt] = {hi:D.temperature_2m_max[ix], lo:D.temperature_2m_min[ix],
                      pop:D.precipitation_probability_max[ix], code:codes[ix]};
      });
      t.wx.live[city.id] = byDate;
      any = true;
    }catch(e){ /* offline */ }
  }
  t.wx.liveAt = any ? Date.now() : t.wx.liveAt;
  save();
  render();
  if(!any) toast("Couldn't reach the weather service");
  else {
    const inRange = tripDays(t).some(d=>{
      const c = computeDayCities(t)[d];
      return t.wx.live[c] && t.wx.live[c][d];
    });
    toast(inRange ? "Live forecast added" : "Trip is beyond the 16-day forecast — seasonal only for now");
  }
}

function wxHTML(t, day, cityId){
  const out = [];
  const s = t.wx.seasonal[cityId];
  const sd = s && s.byMD[md(day)];
  if(sd){
    out.push(`<span class="wxchip" title="Average of the last ${sd.n>0?5:0} years, same date">
      <span class="wxtag">typical</span> <b>${temp(sd.hi)}</b> / ${Math.round(sd.lo)}°
      ${sd.wet>=0.34?"· wet "+Math.round(sd.wet*100)+"%":""}</span>`);
  }
  const l = t.wx.live[cityId] && t.wx.live[cityId][day];
  if(l){
    out.push(`<span class="wxchip live" title="Live forecast">
      ${WMO[l.code]||"•"} <span class="wxtag">forecast</span> <b>${temp(l.hi)}</b> / ${Math.round(l.lo)}°
      ${l.pop!=null?"· "+l.pop+"%":""}</span>`);
  }
  if(!out.length && !t.cities.find(c=>c.id===cityId)) return "";
  return out.join("");
}

function syncEditor(){
  const t = trip(), m = t.magnets.find(x=>x.id===edState.id);
  if(!m) return;
  const g = id=>{ const el=document.getElementById(id); return el?el.value:null; };
  const l=g("e-label"); if(l && l.trim()) m.label = l;   // an empty box must not erase the name
  const n=g("e-note");  if(n!=null) m.note = n;
  const k=g("e-kind");  if(k) m.kind = k;
  const h=g("e-hour");
  if(h!=null) m.time = h ? h+":"+(g("e-min")||"00") : "";
  const oh=g("e-hours");  if(oh!=null) m.hours  = oh.trim();
  const cd=g("e-closed"); if(cd!=null) m.closed = cd;
  const cs=g("e-cost");
  if(cs!=null) m.cost = cs.trim() === "" ? "" : num(cs);
  // dragging is the fast way; this is the way that always works
  const nd = g("e-day"), ns = g("e-slot");
  if(nd != null && m.kind !== "fly"){
    if(nd === "tray"){
      if(m.board !== "tray"){ m.board="tray"; m.day=null; m.slot=null; m.col=null; }
    }else if(dayLocked(t, nd)){
      toast(dayLabel(nd)+" is finalised — unlock it first");
    }else{
      const slot = ns || "morning";
      if(m.board!=="cal" || m.day!==nd || m.slot!==slot){
        if(m.board==="cal" && m.day && dayLocked(t, m.day)){
          toast(dayLabel(m.day)+" is finalised — unlock it first");
        }else{
          m.board="cal"; m.day=nd; m.slot=slot; m.col=null;
          m.order = orderBetween(t, slot==="transit" ? "transit:"+nd : "cal:"+nd+":"+slot, null);
        }
      }
    }
  }
}

function saveTransport(){
  const t = trip(), s = tpState;
  if(!s.from || !s.to){ toast("Pick both ends of the trip"); return; }
  const from = cityById(t,s.from), to = cityById(t,s.to);
  const mode = TRANSPORT_MODES.find(m=>m.id===s.mode);
  const mins = s.mins != null ? s.mins : estimateMins(s.mode, from, to);
  const label = `${mode.ic} ${from.name} → ${to.name}`;
  const note = [s.time?fmt12(s.time):"", mins!=null?"≈"+mins2h(mins):"", mode.label]
                 .filter(Boolean).join(" · ");
  if(s.editing){
    const m = t.magnets.find(x=>x.id===s.editing);
    Object.assign(m, {label, note, mode:s.mode, fromCity:s.from, toCity:s.to, time:s.time, mins});
  }else{
    t.magnets.push({id:uid(), kind:"move", board:"cal", day:s.day, slot:"transit",
      label, note, mode:s.mode, fromCity:s.from, toCity:s.to, time:s.time, mins,
      locked:false, order:Date.now()});
  }
  save(); closeModal(); render();
}

async function addSettingsCity(){
  syncSettings();
  const el = document.getElementById("s-city");
  const name = el.value.trim();
  if(!name) return;
  const entry = {id:uid(), name, country:"", lat:null, lon:null, code:""};
  stState.cities.push(entry);
  drawSettings();
  try{
    const g = await geocode(name);
    if(g){ entry.name=g.name; entry.country=g.country; entry.lat=g.lat; entry.lon=g.lon; }
  }catch(e){}
  if(stState) drawSettings();
