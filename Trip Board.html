.rquick p{margin-top:5px;font-size:calc(13.5px * var(--ts))}
.rfoot{border-top:1px solid var(--line);margin-top:22px;padding-top:12px;font-size:calc(11.5px * var(--ts));color:var(--ink2)}

#printarea{display:none}
body.printing>.topbar,body.printing>.wrap,body.printing>#modalslot,
body.printing>#toasts,body.printing>#dayrail{display:none !important}
body.printing #printarea{display:block;padding:0 4mm}
#printarea{font-size:11.5pt;color:#000}
#printarea .phead{border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px}
#printarea .phead h1{font-size:20pt;margin:0 0 4px}
#printarea .phead p{margin:0;font-size:10pt;color:#444}
#printarea .pday{break-inside:avoid;page-break-inside:avoid;margin-bottom:12px}
#printarea .pday h3{font-size:12pt;margin:0 0 5px;border-bottom:1px solid #bbb;padding-bottom:3px}
#printarea .pcity{font-weight:400;color:#555;margin-left:8px}
#printarea .pwx{font-weight:400;color:#777;font-size:9.5pt;float:right}

#printarea th{width:78px;text-align:left;vertical-align:top;font-size:9pt;text-transform:uppercase;
  letter-spacing:.06em;color:#666;font-weight:600;padding:3px 8px 3px 0}
#printarea td{padding:3px 0;vertical-align:top}
#printarea .pi{margin-bottom:2px}
#printarea .pi span{color:#555;font-size:10pt}
#printarea .pi em{color:#777;font-size:9pt}
#printarea .pi u{text-decoration:none;font-family:ui-monospace,Menlo,monospace;font-size:9.5pt;
  color:#333;margin-right:4px}
#printarea .pi i{font-style:normal;font-size:8pt;text-transform:uppercase;letter-spacing:.06em;
  border:1px solid #999;border-radius:3px;padding:0 3px;color:#666;margin-right:4px}
#printarea .pbody{display:flex;gap:12px;align-items:flex-start}
#printarea .pplan{flex:1;min-width:0}
#printarea .pmap{flex:none;width:230px}
#printarea .pmapsvg{width:230px;height:150px;display:block}
#printarea .pwhere{font-size:8.5pt;color:#666;margin:0 0 3px}
#printarea .pnum{display:inline-block;min-width:13px;height:13px;line-height:13px;text-align:center;
  border:1px solid #000;border-radius:50%;font-size:7.5pt;font-weight:700;margin-right:5px;vertical-align:1px}
#printarea .pgeo{font-family:ui-monospace,Menlo,monospace}
#printarea .phours{color:#666}
#printarea .ptot{font-size:9pt;color:#555;margin:5px 0 0;font-family:ui-monospace,Menlo,monospace}
#printarea .pnote{font-size:10pt;color:#333;border-left:2px solid #bbb;padding-left:8px;margin:6px 0 0}
#printarea .pstays{width:100%;border-collapse:collapse;margin:0 0 10px}
#printarea .pstays th{text-align:left;font-size:8.5pt;text-transform:uppercase;
  letter-spacing:.06em;color:#666;border-bottom:1px solid #ccc;padding:3px 6px 3px 0}
#printarea .pstays td{font-size:9.5pt;padding:3px 6px 3px 0;border-bottom:1px solid #eee;vertical-align:top}
#printarea .pstays .pidea{color:#777;font-style:italic}
#printarea .pgap{font-size:9.5pt;color:#a33;margin:0 0 10px}
#printarea .pjots{margin:6px 0 0;padding-left:16px;font-size:9.5pt;color:#444}
#printarea .pjots li{margin:1px 0}
#printarea .pimgs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
#printarea .pimgs figure{margin:0;max-width:32%}
#printarea .pimgs svg{width:100%;height:auto}
#printarea .pimgs figcaption{font-size:8.5pt;color:#666;margin-top:2px}
#printarea .pempty{color:#999;font-style:italic;margin:2px 0 0;font-size:10pt}
#printarea .plist{break-inside:avoid;margin-top:16px}
#printarea .plist h3{font-size:12pt;margin:0 0 6px;border-bottom:1px solid #bbb;padding-bottom:3px}
#printarea .pcols{display:flex;gap:22px;flex-wrap:wrap}
#printarea .pcol{min-width:150px;flex:1}
#printarea .pcol h4{font-size:9.5pt;text-transform:uppercase;letter-spacing:.06em;color:#666;margin:0 0 3px}
#printarea ul{margin:0;padding-left:16px}
#printarea li{margin-bottom:2px}
#printarea .pfoot{margin-top:20px;padding-top:6px;border-top:1px solid #ccc;font-size:8.5pt;color:#888}
@media print{ @page{margin:14mm} body{background:#fff} }

.toast .undo{border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--paper);
  border-radius:6px;padding:2px 9px;font-size:calc(12.5px * var(--ts));margin-left:9px;font-weight:600}
.toast .undo:hover{background:rgba(255,255,255,.15)}
.nodays{background:#FFF6E0;border:1px solid #EBD9A8;border-radius:14px;padding:22px}
.nodays h3{margin:0 0 6px;color:#7A5C14}
.nodays p{margin:0 0 12px;font-size:calc(13.5px * var(--ts));color:#7A5C14}
.ndates{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ndates span{background:var(--paper2);border:1px solid #EBD9A8;border-radius:9px;padding:7px 12px;
  font-family:ui-monospace,Menlo,monospace;font-size:calc(13px * var(--ts));display:flex;gap:9px;align-items:center}
.ndates b{font-family:var(--font,inherit);font-size:calc(10.5px * var(--ts));text-transform:uppercase;
  letter-spacing:.07em;color:#9a7c34;font-weight:600}
.ndhint{font-size:calc(12.5px * var(--ts)) !important;opacity:.85}
.gap{background:#FFF6E0;border:1px solid #EBD9A8;border-radius:10px;padding:9px 12px;
  font-size:calc(13px * var(--ts));color:#7A5C14;margin-bottom:12px}
</style>

<!-- The reports that ship with the board. A folder of your own overrides any of
     them; these are here so the guides tab has something in it on day one, and so

<script type="application/json" id="builtin-reports">{"aliases":{"new-york-city":"new-york"},"reports":{"beijing":{"schema":"cityreport.v1","city":"Beijing","country":"China","lat":39.9042,"lon":116.4074,"generated":"2026-08-13","by":"Claude","note":"Opening hours, bookings and restaurants change. Treat specifics as a starting point and confirm before you commit.","glance":{"why":"Beijing is where Chinese power has been staged for six centuries, and it is still built to make you feel small. The axis running from the Temple of Heaven through Tiananmen to the Drum Tower is one of the great pieces of urban design anywhere. What surprises most first-timers is how much low, grey, ordinary life survives in the hutongs a block from all that monumentality.","bestFor":["Imperial history","Monumental architecture","Food","Markets","Contemporary art"],"idealStay":"4-5 days, 6 if you want the Great Wall unhurried","character":["Monumental","Dusty","Ceremonial","Enormous","Unexpectedly local"],"dontMiss":["Forbidden City, entered from the south and walked north","Jingshan Park immediately after, for the only view of those roofs","The Great Wall at Mutianyu or Jinshanling, not Badaling","Temple of Heaven park at 7am when it belongs to the neighbourhood","A hutong on foot, ideally without a plan","Peking duck carved at the table","The Summer Palace by boat in warm weather"],"neighbourhoods":["Dongcheng hutongs","Gulou and Houhai","Wudaoying and Beiluoguxiang","798 Art District","Sanlitun","Qianmen and Dashilan"]},"history":{"story":"Beijing has been destroyed and rebuilt as a capital more times than almost any city on earth, and each rebuild was an argument about who China belonged to. It is not an ancient city in the way Xi'an is; it is a deliberately constructed one, laid out on a north-south axis by Mongol and then Ming planners to demonstrate that the emperor sat at the centre of the world.","origins":"A frontier settlement on the edge of the north China plain, valuable because it guarded the passes between the steppe and the agricultural heartland. That frontier position is the whole story: whoever held Beijing controlled the meeting point of two worlds.","periods":[{"name":"Yuan, 1271-1368","text":"Kublai Khan built Dadu here and gave the city its grid and its axis. Marco Polo, whether or not he actually came, described a city of unimaginable order."},{"name":"Ming, 1368-1644","text":"The Yongle Emperor moved the capital north from Nanjing, built the Forbidden City and the Temple of Heaven, and rebuilt the Great Wall in the form tourists photograph today. This is the Beijing you are mostly visiting."},{"name":"Qing, 1644-1912","text":"Manchu rulers kept the Ming city almost unchanged and added the garden palaces in the northwest. The Summer Palace and the ruined Old Summer Palace both date from here, and the latter's destruction by British and French troops in 1860 is still taught as the start of the century of humiliation."},{"name":"Republic and war, 1912-1949","text":"The capital moved away, the city was occupied by Japan, and much of the imperial fabric fell into disrepair."},{"name":"People's Republic, 1949-","text":"The city walls came down for ring roads, Tiananmen Square was enlarged to hold a million people, and the hutongs were subdivided into crowded compounds. From the 1990s, whole districts were cleared for towers."}],"modern":"The 2008 Olympics were the hinge. Enormous investment produced the subway network you will actually use, the airport, and a set of landmark buildings by foreign architects. Since then the city has pushed industry and population outward and turned inward toward culture, coffee and preservation, at least in the districts visitors see.","whyItMatters":"The axis is not a museum piece. Watch where the flag ceremony happens, which direction the Forbidden City faces, and where the new national museums sit, and you are watching the same argument about centrality being made in a modern register.","visible":["Walk the axis in one day: Temple of Heaven, Qianmen, Tiananmen, Forbidden City, Jingshan, Drum and Bell Towers.","Hutong courtyard walls show where wealth sat: door piers and the number of beams still signal rank.","The Old Summer Palace ruins are deliberately left broken as a political statement.","798's Bauhaus factory sheds were built by East German engineers in the 1950s, an artefact of socialist-bloc industry."]},"thingsToDo":{"historic":[{"name":"Forbidden City","area":"Dongcheng","why":"980 surviving buildings, and the only way to feel the scale is to walk the full north-south route. Book with your passport several days ahead; entry is timed and caps out.","mins":180},{"name":"Temple of Heaven","area":"Dongcheng","why":"The architecture is extraordinary, but the park is the real experience: dancers, chess, choirs and calligraphy on the paving from dawn.","mins":120},{"name":"Great Wall at Mutianyu","area":"Huairou","why":"Restored, steep, forested and far less crowded than Badaling. Chairlift up, toboggan down if you want. Jinshanling is wilder if you will hike three hours.","mins":300},{"name":"Summer Palace","area":"Haidian","why":"An imperial lake retreat the size of a district. The Long Corridor and Kunming Lake are the point; go by boat in summer or across the ice in winter.","mins":180},{"name":"Lama Temple","area":"Dongcheng","why":"A working Tibetan Buddhist monastery with an 18-metre Maitreya carved from a single sandalwood trunk.","mins":60},{"name":"Ming Tombs and the Sacred Way","area":"Changping","why":"The avenue of stone animals is the good part. Pairs naturally with a wall trip.","mins":180}],"arts":[{"name":"National Museum of China","area":"Tiananmen","why":"Free with ID. The Ancient China galleries in the basement hold the bronzes; the upstairs political narrative is interesting for different reasons.","mins":180},{"name":"Capital Museum","area":"Xicheng","why":"Beijing's own story, well told and rarely crowded.","mins":120},{"name":"798 Art District","area":"Chaoyang","why":"Galleries, bookshops and coffee in 1950s factory halls. Uneven, commercial in parts, still worth an afternoon.","mins":180},{"name":"Peking opera at Huguang Guild Hall","area":"Xicheng","why":"Short tourist-friendly programmes in a historic theatre. Not the deep version, but a real building and a real art form.","mins":90}],"neighbourhoods":[{"name":"Gulou, Houhai and the Drum Tower hutongs","character":"Grey-brick lanes, courtyard gates, lake and willows","highlights":"Drum and Bell Towers, Houhai lakes, Nanluoguxiang side alleys","food":"Jianbing carts, hotpot, Yunnan restaurants","bestTime":"Late afternoon into evening","mins":180},{"name":"Wudaoying and Beiluoguxiang","character":"Quieter, small independent shops and coffee","highlights":"The lane itself, plus the Lama Temple at one end","food":"Third-wave coffee, craft beer, vegetarian","bestTime":"Morning","mins":120},{"name":"Qianmen and Dashilan","character":"Restored commercial street plus genuinely old lanes behind","highlights":"Zhengyangmen gate, Dashilan's old shopfronts","food":"Old brand shops, snack street","bestTime":"Morning before the coaches","mins":120},{"name":"Sanlitun","character":"Modern, glassy, expensive","highlights":"Taikoo Li architecture, bookshop, bars","food":"International, good cocktails","bestTime":"Evening","mins":120}],"nature":[{"name":"Jingshan Park","area":"Xicheng","why":"A coal hill made from the moat spoil. Five minutes up for the single best view in Beijing.","mins":45},{"name":"Beihai Park","area":"Xicheng","why":"Imperial lake garden with a white dagoba on the island. Rowing boats in summer.","mins":90},{"name":"Olympic Forest Park","area":"Chaoyang","why":"Vast, green, and where Beijingers actually run. Skip unless you want a break from stone.","mins":90},{"name":"Fragrant Hills","area":"Haidian","why":"Worth it in late October for the red leaves, mobbed accordingly.","mins":240}],"shopping":[{"name":"Panjiayuan Antique Market","area":"Chaoyang","why":"Weekend mornings. Ceramics, calligraphy, Cultural Revolution ephemera, jade, and a great deal of confident fakery. Bargain hard, expect reproductions.","mins":120},{"name":"Kappabashi of knives it is not, but Dashilan's old brands","area":"Qianmen","why":"Tea, silk, cloth shoes and traditional medicine in shops a century or more old.","mins":90},{"name":"Maliandao Tea Street","area":"Xicheng","why":"Several buildings of nothing but tea. Sit down, get poured, learn something.","mins":120},{"name":"Sanlitun Taikoo Li","area":"Chaoyang","why":"Contemporary design, international brands, the good Page One bookshop.","mins":90}],"nightlife":[{"name":"Houhai lakeside","area":"Xicheng","why":"Touristy bar strip with live music. Pleasant on the water, avoid the hard-sell venues.","mins":120},{"name":"Great Leap Brewing","area":"Dongcheng","why":"Craft beer in a courtyard hutong. The original Doujiao Hutong location is the atmospheric one.","mins":120},{"name":"Jazz at Blue Note or a hutong bar","area":"Dongcheng","why":"Beijing's live music scene is small but real, and better value than Shanghai.","mins":150},{"name":"Night view from Jingshan is closed, so try a rooftop in Qianmen","area":"Qianmen","why":"The Forbidden City lit from a distance, drink in hand.","mins":90}]},"essential10":[{"rank":1,"name":"Forbidden City walked south to north, then Jingshan","why":"The building and the view of the building are one experience. Doing them separately halves both.","mins":240,"label":"Essential","popularity":5,"cultural":5,"worth":5},{"rank":2,"name":"Great Wall at Mutianyu or Jinshanling","why":"The one thing you will regret skipping. Choose a restored-but-quiet section and go early.","mins":360,"label":"Essential","popularity":5,"cultural":5,"worth":5},{"rank":3,"name":"Temple of Heaven park at opening","why":"The only major site where you see contemporary Beijing using an imperial space as a back garden.","mins":120,"label":"Essential","popularity":4,"cultural":5,"worth":5},{"rank":4,"name":"Peking duck, properly","why":"It is a technical dish, not just a famous one. Watching it carved is part of it.","mins":105,"label":"Essential","popularity":5,"cultural":4,"worth":5},{"rank":5,"name":"A hutong on foot with no destination","why":"Beijing's domestic scale is invisible from a car and it is where the city is warmest.","mins":120,"label":"Essential","popularity":3,"cultural":5,"worth":5},{"rank":6,"name":"Summer Palace","why":"Imperial leisure rather than imperial power, and a different register entirely.","mins":180,"label":"Recommended","popularity":4,"cultural":4,"worth":4},{"rank":7,"name":"Lama Temple","why":"Working religion, thick with juniper smoke, twenty minutes from the hutong cafes.","mins":60,"label":"Recommended","popularity":4,"cultural":4,"worth":4},{"rank":8,"name":"National Museum, ancient galleries only","why":"The bronzes are world-class. Ignore the rest unless the politics interest you.","mins":120,"label":"Recommended","popularity":3,"cultural":5,"worth":4},{"rank":9,"name":"798 Art District","why":"The best available window into contemporary Chinese culture, commercial edges and all.","mins":180,"label":"Recommended","popularity":3,"cultural":3,"worth":3},{"rank":10,"name":"Panjiayuan on a weekend morning","why":"More fun as anthropology than as shopping.","mins":120,"label":"Optional","popularity":3,"cultural":3,"worth":3}],"food":{"identity":"Beijing food is northern, wheat-based and imperial at the top end, blunt and salty at the bottom. Think noodles and steamed bread rather than rice, lamb from the Mongolian frontier, heavy fermented bean and sesame pastes, and a court tradition that produced roast duck and Manchu-Han banquets. It is not Sichuan and it is not Cantonese: less chilli than the first, less delicacy than the second, more wheat and mutton than either.","mustTry":[{"dish":"Peking duck","what":"Air-dried duck roasted over fruitwood, carved into skin, meat and fat, served with pancakes, scallion, cucumber and sweet bean sauce.","why":"A court dish perfected over centuries, and the technical benchmark for the whole cuisine.","flavour":"Crisp, rich, smoky; the skin dipped in sugar is the tell of a good house.","howLocalsEat":"Skin first with sugar, then wrapped pancakes, then soup from the carcass.","importance":"Essential"},{"dish":"Zhajiangmian","what":"Thick wheat noodles under fermented soybean paste with pork, topped with shredded raw vegetables you mix in yourself.","why":"The everyday Beijing bowl, and the clearest expression of the northern wheat-and-paste palate.","flavour":"Salty, deep, a little funky; the cucumber cuts it.","howLocalsEat":"Mix hard, eat fast, add vinegar.","importance":"Essential"},{"dish":"Jianbing","what":"A thin mung bean crepe cooked on a griddle with egg, hoisin, chilli, coriander and a crisp cracker folded inside.","why":"The definitive breakfast, made in ninety seconds from a cart.","flavour":"Savoury, crunchy, a little sweet.","howLocalsEat":"Standing up, on the way to the subway, before 9am.","importance":"Essential"},{"dish":"Instant-boiled mutton hotpot","what":"Thin-sliced lamb swished in plain broth from a copper chimney pot, dipped in sesame paste.","why":"Mongol frontier food that became Beijing's winter ritual. The plain broth is the point.","flavour":"Clean, then whatever your sesame dip makes it.","howLocalsEat":"In winter, in a group, with sesame bread and pickled garlic.","importance":"Recommended"},{"dish":"Douzhi and jiaoquan","what":"Fermented mung bean drink with a fried dough ring.","why":"The most divisive thing in the city. Locals love it, almost no visitor does.","flavour":"Sour, cheesy, aggressively fermented.","howLocalsEat":"Breakfast, with pickles, at an old shop.","importance":"Optional, but try one sip"},{"dish":"Lamb skewers","what":"Cumin and chilli mutton grilled over coals, Uyghur in origin.","why":"The default street food of a summer evening.","flavour":"Cumin-forward, fatty, smoky.","howLocalsEat":"By the dozen, with cold Yanjing beer, outdoors.","importance":"Recommended"},{"dish":"Baodu","what":"Flash-boiled tripe with sesame dip.","why":"Old Beijing offal culture, still going in Niujie and around the Drum Tower.","flavour":"Crunchy, clean, dip-dependent.","howLocalsEat":"Quickly, as a snack.","importance":"Optional"},{"dish":"Tanghulu","what":"Hawthorn berries on a stick in hard sugar glaze.","why":"Winter street sweet, sharp under the sugar.","flavour":"Tart then sweet.","howLocalsEat":"Walking, in cold weather.","importance":"Recommended"}]},"mustEat10":[{"dish":"Peking duck","where":"Siji Minfu (Qianmen or Forbidden City branches)","order":"Whole duck, ask for the sugar for the skin","price":"CNY 250-350 for two"},{"dish":"Peking duck, the old-school version","where":"Bianyifang","order":"Menlu-roasted duck, a closed-oven method older than Quanjude's","price":"CNY 250-350 for two"},{"dish":"Zhajiangmian","where":"Haiwanju","order":"Noodles with the full set of vegetable toppings","price":"CNY 30-50"},{"dish":"Jianbing","where":"Any cart with a morning queue; several around Gulou","order":"Add an extra egg","price":"CNY 8-15"},{"dish":"Mutton hotpot","where":"Julong Zhai or Nanmen Shuan Rou","order":"Hand-cut lamb, sesame dip, sesame bread","price":"CNY 120-200 per person"},{"dish":"Lamb skewers and grilled fish","where":"Any evening chuanr strip; Gui Street for the full circus","order":"Skewers by the ten, plus cumin flatbread","price":"CNY 60-120"},{"dish":"Beijing-style dumplings","where":"Baoyuan Dumpling House","order":"The coloured-dough dumplings, several fillings","price":"CNY 50-90"},{"dish":"Imperial-style small plates","where":"Najia Xiaoguan","order":"Manchu court dishes, book ahead","price":"CNY 150-250"},{"dish":"Muslim-quarter beef and lamb","where":"Niujie area shops","order":"Beef pies, lamb offal soup","price":"CNY 30-60"},{"dish":"Yoghurt in a clay pot","where":"Street vendors around Nanluoguxiang and Houhai","order":"Plain, cold","price":"CNY 8-15"}],"restaurants":{"iconic":[{"name":"Siji Minfu","cuisine":"Peking duck","price":"Mid","area":"Qianmen / Dongcheng","desc":"The duck house Beijingers actually recommend now, with a view of the Forbidden City walls from the Nanchizi branch.","dishes":"Roast duck, mustard duck web, sesame pastry","whyGo":"Best balance of quality, price and atmosphere among the famous houses.","booking":"Queue or book; peak times are long"},{"name":"Bianyifang","cuisine":"Peking duck","price":"Mid","area":"Chongwenmen","desc":"Founded 1416, roasting in a closed oven rather than over open fire, which gives softer skin and less smoke.","dishes":"Menlu duck","whyGo":"The other technique, and the older house.","booking":"Advisable"},{"name":"Najia Xiaoguan","cuisine":"Manchu court","price":"Mid-high","area":"Chaoyang","desc":"Imperial bannerman cooking in a small, warm room.","dishes":"Sea cucumber with scallion, court-style pork","whyGo":"A cuisine you will not meet elsewhere.","booking":"Essential"}],"bestFood":[{"name":"TRB Hutong","cuisine":"European fine dining","price":"High","area":"Dongcheng","desc":"In a former temple compound; the courtyard is the reason.","dishes":"Tasting menu","whyGo":"Beijing's most atmospheric special-occasion room.","booking":"Essential, weeks out"},{"name":"King's Joy","cuisine":"Vegetarian fine dining","price":"High","area":"Dongcheng","desc":"Buddhist-influenced vegetarian near the Lama Temple, taken very seriously.","dishes":"Set menu","whyGo":"Proves how good Chinese vegetarian cooking can be.","booking":"Essential"},{"name":"Jing Yaa Tang","cuisine":"Duck and Chinese","price":"High","area":"Sanlitun","desc":"Designer duck house in The Opposite House hotel.","dishes":"Duck, dim sum","whyGo":"If you want the dish in a polished setting.","booking":"Recommended"}],"bestValue":[{"name":"Haiwanju","cuisine":"Old Beijing noodles","price":"Low","area":"Several","desc":"Staff shout a greeting when you walk in and slam the bowl down. Loud, cheap, correct.","dishes":"Zhajiangmian","whyGo":"The bowl and the theatre for the price of a coffee.","booking":"No"},{"name":"Baoyuan Dumpling House","cuisine":"Dumplings","price":"Low","area":"Chaoyang","desc":"Dough coloured with vegetable juice; more fun than it sounds and genuinely good.","dishes":"Mixed dumpling plate","whyGo":"Cheap, reliable, good for groups.","booking":"No"},{"name":"Niujie street shops","cuisine":"Hui Muslim","price":"Low","area":"Xicheng","desc":"Beef pies, lamb soup and sesame cakes around the old mosque.","dishes":"Niuroubing, yangza tang","whyGo":"A different Beijing, and very cheap.","booking":"No"}],"special":[{"name":"Country Kitchen","cuisine":"Northern Chinese","price":"High","area":"Chaoyang","desc":"Open kitchen, wood-fired breads, refined versions of northern staples.","dishes":"Peking duck, hand-pulled noodles","whyGo":"Northern food at fine-dining execution.","booking":"Recommended"},{"name":"Da Dong","cuisine":"Duck and modern Chinese","price":"High","area":"Several","desc":"Famously lean duck and theatrical presentation. Divisive among purists.","dishes":"Super-lean roast duck","whyGo":"The polished, plated interpretation.","booking":"Recommended"}],"casual":[{"name":"Gui Street (Guijie)","cuisine":"Crayfish, hotpot, skewers","price":"Low-mid","area":"Dongzhimen","desc":"A kilometre of red lanterns and restaurants open absurdly late.","dishes":"Spicy crayfish, grilled fish","whyGo":"Beijing's late-night eating street.","booking":"No"},{"name":"Yunnan and Guizhou places around Gulou","cuisine":"Southwestern Chinese","price":"Low-mid","area":"Dongcheng","desc":"Sour, herbal, chilli-forward cooking that makes a good break from northern food.","dishes":"Rice noodles, sour fish soup","whyGo":"Variety, and mostly local crowds.","booking":"No"}],"cafes":[{"name":"Metal Hands","cuisine":"Coffee","price":"Low","area":"Fangjia Hutong and others","desc":"The hutong coffee scene's anchor, in a converted courtyard.","dishes":"Filter, flat white","whyGo":"Good coffee and a good place to sit between sights.","booking":"No"},{"name":"Maliandao tea houses","cuisine":"Tea","price":"Low-mid","area":"Xicheng","desc":"Sit-down tastings of pu'er, oolong and jasmine, with a merchant who will explain the differences.","dishes":"Whatever they pour","whyGo":"The most useful hour you can spend on Chinese tea.","booking":"No"},{"name":"Soloist Coffee","cuisine":"Coffee","price":"Low","area":"Qianmen / Dashilan","desc":"Industrial-vintage roaster in an old lane.","dishes":"Espresso","whyGo":"Well placed between Qianmen and the square.","booking":"No"}]},"experiences":[{"name":"Tai chi or a morning choir in Temple of Heaven park","what":"Turn up before 8am and watch, or join in; nobody minds.","why":"The single most human thing you can do in Beijing.","mins":90},{"name":"Tea tasting on Maliandao","what":"A merchant walks you through several pu'ers and oolongs.","why":"Chinese tea makes sense in an hour of tasting and never from reading.","mins":90},{"name":"Hutong cycling","what":"Rent a bike and follow the lanes around Houhai and Beiluoguxiang.","why":"Beijing is flat and the hutongs are made for two wheels.","mins":150},{"name":"Peking opera or acrobatics","what":"A short evening programme at Huguang Guild Hall or Tianqiao.","why":"The make-up, the falsetto and the percussion are worth meeting once.","mins":90},{"name":"Calligraphy on the paving","what":"Elderly men writing water characters on stone in the parks, who will hand you the brush.","why":"Free, ephemeral and completely charming.","mins":30},{"name":"A dumpling or duck-pancake cooking class","what":"Half a day in a hutong kitchen.","why":"Portable skill, and the market trip beforehand is half the value.","mins":240}],"neighbourhoodGuide":[{"name":"Dongcheng hutongs (Gulou, Nanluoguxiang, Beiluoguxiang)","vibe":"Grey brick, courtyard gates, bicycles, cats","bestFor":"Wandering, coffee, small bars, evening light","sights":"Drum and Bell Towers, Houhai, Confucius Temple","food":"Jianbing, Yunnan, craft beer, hotpot","mins":240},{"name":"Xicheng and Beihai","vibe":"Lakes, willows, imperial gardens, quieter","bestFor":"Parks, boats, morning walks","sights":"Beihai Park, Jingshan, Prince Gong's Mansion","food":"Niujie Muslim quarter is nearby","mins":180},{"name":"Qianmen and Dashilan","vibe":"Restored commercial frontage with real lanes behind","bestFor":"Old shops, snacks, the axis","sights":"Zhengyangmen, Dashilan, Liulichang antiques street","food":"Old brands, duck","mins":150},{"name":"Chaoyang and Sanlitun","vibe":"Towers, embassies, money","bestFor":"Bars, international food, shopping","sights":"Taikoo Li, CCTV headquarters","food":"Everything, at a price","mins":150},{"name":"798 and Caochangdi","vibe":"Factory sheds and galleries","bestFor":"Contemporary art, bookshops","sights":"UCCA, gallery clusters","food":"Cafes and a few good restaurants","mins":180},{"name":"Haidian","vibe":"Universities and imperial gardens, far northwest","bestFor":"Summer Palace, Old Summer Palace","sights":"Summer Palace, Peking University","food":"Student cheap eats","mins":240}],"timeGuidance":{"three":"Day 1 the axis and the Forbidden City. Day 2 the Great Wall. Day 3 Temple of Heaven at dawn, hutongs, Lama Temple, duck.","fivePlus":"Add the Summer Palace, 798, Panjiayuan on a weekend, a tea afternoon on Maliandao, and one deliberately unplanned hutong day."},"dayTrips":[{"name":"Great Wall at Mutianyu","travel":"1.5 hrs each way by car or tour bus","why":"Restored, forested, steep, far quieter than Badaling.","duration":"Full day","suits":"Everyone; the chairlift makes it manageable.","logistics":"Go at opening. Private car is worth splitting.","verdict":"Worth it"},{"name":"Great Wall at Jinshanling","travel":"2.5 hrs each way","why":"Partly unrestored, long ridge walk, almost empty.","duration":"Full day","suits":"Anyone happy with three hours of steep walking.","logistics":"Book a driver; public transport is painful.","verdict":"Worth it if you want the wall to yourself"},{"name":"Ming Tombs and Sacred Way","travel":"1 hr","why":"The stone avenue is memorable; the tombs themselves less so.","duration":"Half day","suits":"Combine with Mutianyu.","logistics":"Usually bundled into wall tours.","verdict":"Only if you have extra time"},{"name":"Chengde Mountain Resort","travel":"2 hrs by high-speed rail","why":"The Qing summer capital, with Tibetan-style temples.","duration":"Full day or overnight","suits":"Second-time visitors.","logistics":"Book rail ahead.","verdict":"Skip unless particularly interested"},{"name":"Tianjin","travel":"35 min by high-speed rail","why":"Colonial concession architecture, an entirely different feel, excellent snacks.","duration":"Full day","suits":"Anyone with a spare day.","logistics":"Trains run constantly from Beijing South.","verdict":"Worth it"}],"practical":{"gettingAround":"The subway is cheap, extensive, signed in English and the correct default. Get a transit QR code set up in Alipay or WeChat on arrival; almost nothing takes cash and foreign cards work poorly outside hotels. Didi is the taxi app. Traffic is genuinely bad, so use rail for anything crossing the centre. Bike-share is excellent and the city is flat.","whenToGo":"September and October are the best months: dry, clear, warm days. Late April and May are good too. Summer is hot, humid and stormy. Winter is cold and dry with brilliant light and thin crowds; December to February you will have the Forbidden City almost to yourself if you can stand minus ten. Avoid the first week of May and the first week of October, when the whole country travels.","howLong":{"one":"Forbidden City, Jingshan and a hutong evening. You will feel it.","twoThree":"Add the wall and Temple of Heaven. This is the honest minimum.","fourFive":"Add the Summer Palace, 798 and a proper hutong day. This is the right length.","week":"Add Tianjin or Chengde, Panjiayuan, tea on Maliandao, and time to be bored somewhere pleasant."},"culture":["Bring your passport everywhere; it is required for museum entry, rail travel and hotel check-in.","Most major sites now require booking days ahead through a WeChat mini-programme. Plan the Forbidden City first.","Payment is by phone. Set up Alipay or WeChat Pay with a foreign card before you arrive; it now works reasonably well.","A VPN, installed before arrival, is necessary for most non-Chinese services.","Queueing is loose and personal space is smaller. It is not rudeness.","Tipping is not expected anywhere.","Tap water is not drunk; hot water is available everywhere and is the local default."]},"whatIdDo":[{"day":"Day 1","plan":"Temple of Heaven at opening, then walk the axis north through Qianmen to Tiananmen. Forbidden City in the afternoon on a timed ticket, exiting north. Straight up Jingshan for sunset. Duck at Siji Minfu."},{"day":"Day 2","plan":"Leave at 7am for Mutianyu. Chairlift up, walk to the far towers, toboggan down. Back by late afternoon; light dinner and an early night."},{"day":"Day 3","plan":"Lama Temple, then coffee on Wudaoying. Walk south through the hutongs to the Drum and Bell Towers. Afternoon free. Evening around Houhai and Gui Street."},{"day":"Day 4","plan":"Summer Palace in the morning, boat across the lake. 798 in the afternoon. Hotpot in the evening if it is cold."},{"day":"Day 5","plan":"Panjiayuan if it is a weekend, otherwise the National Museum bronzes. Tea on Maliandao. Last dinner somewhere unfamous."}],"quickRef":{"musts":["Forbidden City then Jingshan","Great Wall at Mutianyu","Temple of Heaven at dawn","A hutong on foot","Peking duck"],"eats":["Peking duck","Zhajiangmian","Jianbing","Mutton hotpot","Lamb skewers"],"areas":["Gulou and Houhai","Wudaoying","Qianmen and Dashilan","798"],"experiences":["Morning in Temple of Heaven park","Tea tasting on Maliandao","Hutong cycling"],"dayTrip":"The Great Wall at Mutianyu, or Tianjin by high-speed rail","stay":"4-5 days"},"coords":{"798 Art District":[3  starting point and confirm before you commit.","glance":{"why":"There is a Chinese saying that heaven is above and Suzhou and Hangzhou are below, and Hangzhou earned its half of it with a lake. West Lake is not a natural wonder; it is a thousand years of causeways, pagodas, planted willows and framed viewpoints, curated to the point that it has its own canon of ten named views. Add the country's most famous green tea growing in the hills behind, a serious Buddhist monastery, and the headquarters of Alibaba, and you get a city that is both a classical landscape and a tech capital.","bestFor":["Landscape and walking","Tea","Buddhist sites","Cycling","Seasonal beauty"],"idealStay":"2-3 days","character":["Green","Watery","Leisurely","Poetic","Prosperous"],"dontMiss":["Walking or cycling the Su Causeway across West Lake","Lingyin Temple and the Feilai Feng rock carvings","Longjing tea village, ideally with a tasting","The lake at dawn, before the crowds and often in mist","A boat across to the Three Pools Mirroring the Moon","Hefang Street for old-brand shops and snacks","The Grand Canal north of the city, and the museum on it"],"neighbourhoods":["West Lake shore","Longjing and Meijiawu tea villages","Lingyin and the western hills","Hefang Street and Wushan","Grand Canal and Gongshu"]},"history":{"story":"Hangzhou's fortune was made twice by water. The Grand Canal gave it trade from the seventh century; West Lake gave it beauty, and beauty turned out to be the more durable asset. When the Song court fled south in 1127 and made this its capital, the city became, for a while, probably the largest and richest in the world.","origins":"A silted lagoon at the mouth of the Qiantang River, made habitable when the lake was separated from the sea and dredged.","periods":[{"name":"Sui, 610","text":"The Grand Canal reached Hangzhou, connecting it to the north and making it a trading hub."},{"name":"Tang and Wuyue","text":"The poet-governor Bai Juyi built the first causeway and began the tradition of officials improving the lake."},{"name":"Southern Song, 1127-1276","text":"The capital of a truncated empire, and by many accounts the most populous city on earth. Marco Polo called it Kinsay and said it was the finest city in the world. Su Dongpo, another poet-official, dredged the lake and built the second causeway."},{"name":"Ming and Qing","text":"No longer a capital, but the lake became a national aesthetic reference, painted, poeticised and imitated in gardens everywhere."},{"name":"Modern","text":"The Taiping Rebellion devastated it; the twentieth century rebuilt it as a resort city; the twenty-first made it China's e-commerce capital."}],"modern":"Alibaba's headquarters and a large tech economy have made Hangzhou wealthy and young. The lake and its hills are protected, so the money went east and north. It hosted the 2016 G20 and the 2022 Asian Games, both of which funded infrastructure and a great deal of lighting.","whyItMatters":"West Lake is the most influential designed landscape in China. The Ten Views are a formal canon, each a named framing with a stele, and Chinese visitors arrive knowing them. Recognising that changes the experience from a nice walk to reading a text everyone else can already read.","visible":["The Bai and Su Causeways are named for the two poet-officials who built them, 250 years apart.","Leifeng Pagoda's modern rebuild sits over the excavated ruins of the original, visible in the basement.","The Feilai Feng carvings at Lingyin span the tenth to fourteenth centuries and survived because they are in a cliff.","The Grand Canal is still a working waterway and you can ride a public water bus on it."]},"thingsToDo":{"historic":[{"name":"Lingyin Temple","area":"Western hills","why":"One of the largest and wealthiest Chan Buddhist monasteries in China, founded 328 CE. Working, incense-heavy and set in forest.","mins":150},{"name":"Feilai Feng carvings","area":"Beside Lingyin","why":"Over 300 Buddhist figures carved into a limestone crag and its caves, from the tenth century on. Separate ticket, and the better half of the visit.","mins":75},{"name":"Leifeng Pagoda","area":"South lake shore","why":"Rebuilt on the ruins of the collapsed original, with lifts. Excellent lake views and a legend about a white snake.","mins":60},{"name":"Yue Fei Temple","area":"North shore","why":"Tomb of the Song general executed on false charges, still a national symbol of loyalty betrayed.","mins":60},{"name":"Six Harmonies Pagoda","area":"Qiantang River","why":"A Song-era pagoda built to calm the river's tidal bore. Climbable, quiet, out of the way.","mins":75}],"arts":[{"name":"China National Tea Museum","area":"Longjing","why":"Free, well done, and set among the tea terraces. Explains what you are drinking.","mins":90},{"name":"Zhejiang Provincial Museum","area":"Gushan Island / Wulin","why":"Liangzhu jade, Yue celadon and the region's deep history. Free.","mins":120},{"name":"Liangzhu Museum and archaeological park","area":"North of the city","why":"A 5,000-year-old walled city with hydraulic engineering, UNESCO-listed in 2019. A serious detour but a genuine revelation.","mins":180},{"name":"China National Silk Museum","area":"South of the lake","why":"Free, large, and better than it sounds; textiles, dyeing and costume.","mins":90},{"name":"Grand Canal Museum and Xiaohe Zhi Street","area":"Gongshu","why":"The canal's story plus a restored working-class canal street.","mins":120}],"neighbourhoods":[{"name":"West Lake shore","character":"Willows, causeways, teahouses, joggers","highlights":"Su Causeway, Bai Causeway, Broken Bridge, lotus in summer","food":"Lakeside restaurants, tea","bestTime":"Dawn or the hour before sunset","mins":240},{"name":"Longjing and Meijiawu","character":"Tea terraces on hillsides, village houses","highlights":"Tea fields, farmhouse tastings, Dragon Well spring","food":"Farmhouse cooking, tea","bestTime":"Morning","mins":180},{"name":"Hefang Street and Wushan","character":"Restored old commercial street below a hill","highlights":"Old-brand shops, herbal medicine hall, city view from Wushan","food":"Snacks, old restaurants","bestTime":"Afternoon","mins":120},{"name":"Grand Canal and Qiaoxi","character":"Working canal, warehouses turned museums","highlights":"Gongchen Bridge, water bus, craft museums","food":"Local, unpretentious","bestTime":"Morning","mins":150}],"nature":[{"name":"Su Causeway","area":"West Lake","why":"Nearly three kilometres of tree-lined causeway with six bridges. Walk it or cycle it; this is the single best thing in Hangzhou.","mins":90},{"name":"Nine Creeks and Eighteen Gullies","area":"Western hills","why":"A shaded stream walk through tea country. Almost no tourists.","mins":180},{"name":"Xixi Wetland Park","area":"West","why":"Reedy, boat-based, calm. Pleasant rather than essential.","mins":180},{"name":"Baopu Taoist Temple and Baochu Pagoda ridge","area":"North shore","why":"A short climb for the best free view over the lake.","mins":120},{"name":"Qiantang River tidal bore","area":"East, seasonal","why":"The world's largest tidal bore, around the eighth lunar month in September or October.","mins":180}],"shopping":[{"name":"Longjing tea, bought at source","area":"Longjing village","why":"Buy graded, current-season leaf from a grower rather than a lakeside stall.","mins":90},{"name":"Hefang Street","area":"Wushan","why":"Silk, fans, scissors, tea and Huqingyutang, a nineteenth-century medicine hall that is half museum.","mins":120},{"name":"Silk and umbrellas","area":"Around the lake and Hefang","why":"Hangzhou silk is a real trade; the umbrella and fan shops are decorative but pleasant.","mins":60},{"name":"Xiaohe Zhi Street","area":"Grand Canal","why":"Craft workshops in restored canal-side houses.","mins":90}],"nightlife":[{"name":"Impression West Lake","area":"Yuehu","why":"A large outdoor performance staged on the water, originally directed by Zhang Yimou. Spectacular, expensive, seasonal.","mins":90},{"name":"Lake shore after dark","area":"West Lake","why":"The causeways are lit and quiet; the Ten Views include a moonlight one for a reason.","mins":90},{"name":"Bars around Nanshan Road","area":"East shore","why":"The main strip for drinks with a view.","mins":120}]},"essential10":[{"rank":1,"name":"Su Causeway on foot or by bike at dawn","why":"The lake at its best, empty, often misty, and free.","mins":120,"label":"Essential","popularity":5,"cultural":5,"worth":5},{"rank":2,"name":"Lingyin Temple and Feilai Feng","why":"The most important Buddhist site in the region and 300 carvings in a cliff.","mins":210,"label":"Essential","popularity":5,"cultural":5,"worth":5},{"rank":3,"name":"Longjing tea village and a tasting","why":"China's most famous green tea, on the hillside where it grows.","mins":180,"label":"Essential","popularity":4,"cultural":5,"worth":5},{"rank":4,"name":"A boat on the lake","why":"The Ten Views were composed to be seen from the water.","mins":60,"label":"Essential","popularity":5,"cultural":4,"worth":4},{"rank":5,"name":"Baochu Pagoda ridge walk","why":"Twenty minutes up for the best view of the whole lake, and almost nobody does it.","mins":120,"label":"Recommended","popularity":2,"cultural":3,"worth":5},{"rank":6,"name":"Nine Creeks and Eighteen Gullies","why":"A stream walk through tea country with no crowds at all.","mins":180,"label":"Recommended","popularity":2,"cultural":3,"worth":4},{"rank":7,"name":"Hefang Street and Huqingyutang","why":"The old commercial city, and a spectacular Qing medicine hall.","mins":120,"label":"Recommended","popularity":4,"cultural":4,"worth":3},{"rank":8,"name":"Grand Canal water bus and Qiaoxi","why":"The infrastructure that made the city, still working.","mins":150,"label":"Recommended","popularity":2,"cultural":4,"worth":4},{"rank":9,"name":"Liangzhu archaeological site","why":"A 5,000-year-old city with jade and dams. Serious detour, serious reward.","mins":240,"label":"Optional","popularity":2,"cultural":5,"worth":4},{"rank":10,"name":"Impression West Lake","why":"Big, beautiful, expensive and thoroughly staged.","mins":90,"label":"Optional","popularity":4,"cultural":2,"worth":3}],"food":{"identity":"Zhejiang cooking is another branch of the Jiangnan tradition: fresh, light, faintly sweet, heavy on freshwater fish, bamboo, river shrimp and vinegar. Hangzhou's own version leans on the lake and the tea. It is subtle food, and the two most famous dishes are both about restraint rather than intensity.","mustTry":[{"dish":"Longjing shrimp","what":"Freshwater shrimp stir-fried with Dragon Well tea leaves and a little of the brew.","why":"The city's two signatures in one dish, and it only works with genuinely fresh leaf.","flavour":"Sweet, grassy, delicate.","howLocalsEat":"As one dish in a shared spread, in spring.","importance":"Essential"},{"dish":"West Lake vinegar fish","what":"Grass carp poached and dressed in a sweet-sour vinegar sauce.","why":"The most famous dish in the city, and the one most likely to disappoint if badly made.","flavour":"Sharp, sweet, very delicate.","howLocalsEat":"Shared; the fish should be barely cooked.","importance":"Recommended"},{"dish":"Dongpo pork","what":"Cubes of pork belly braised in wine and soy until they hold their shape but collapse on the tongue.","why":"Named for Su Dongpo, the poet-governor who dredged the lake. History and dinner in one.","flavour":"Sweet, winey, rich.","howLocalsEat":"One cube each, with rice.","importance":"Essential"},{"dish":"Longjing tea","what":"Pan-fired green tea from the hills behind the lake, flat-leaved and grassy.","why":"China's most famous green tea, and pre-Qingming first flush is a serious luxury.","flavour":"Chestnut, grass, sweet finish.","howLocalsEat":"In a tall glass, leaves loose, topped up all day.","importance":"Essential"},{"dish":"Beggar's chicken","what":"Chicken wrapped in lotus leaf and clay and baked, then cracked open at the table.","why":"Theatre plus a genuinely good result.","flavour":"Moist, herbal, mild.","howLocalsEat":"Ordered ahead, shared.","importance":"Recommended"},{"dish":"Pian er chuan noodles","what":"Noodles with pork, bamboo shoots and pickled greens in broth.","why":"The everyday local bowl.","flavour":"Salty, savoury, comforting.","howLocalsEat":"For lunch, cheaply.","importance":"Recommended"},{"dish":"Osmanthus and lotus root","what":"Glutinous rice stuffed into lotus root, syrup and osmanthus over the top.","why":"Autumn, in a bowl.","flavour":"Sweet, floral, chewy.","howLocalsEat":"As a dessert.","importance":"Recommended"}]},"mustEat10":[{"dish":"Longjing shrimp","where":"Lou Wai Lou or Zhiweiguan","order":"Longjing xiaren, in spring if possible","price":"CNY 120-250"},{"dish":"Dongpo pork","where":"Lou Wai Lou","order":"One portion between two","price":"CNY 60-120"},{"dish":"West Lake vinegar fish","where":"Lou Wai Lou or Wai Po Jia","order":"Ask for it lightly done","price":"CNY 100-200"},{"dish":"Beggar's chicken","where":"A traditional restaurant, ordered ahead","order":"Whole chicken, shared","price":"CNY 150-250"},{"dish":"Pian er chuan noodles","where":"Kuiyuanguan","order":"The classic, plus shrimp-and-eel noodles","price":"CNY 30-60"},{"dish":"Home-style Hangzhou dishes","where":"Wai Po Jia (Grandma's Home)","order":"Grandma's braised pork, tea shrimp","price":"CNY 60-120 per person"},{"dish":"Longjing tea","where":"A grower's house in Longjing or Meijiawu","order":"Pre-Qingming first flush if it is April","price":"CNY 100-800 per 100g"},{"dish":"Farmhouse lunch in the tea hills","where":"Meijiawu village","order":"Whatever is seasonal, plus tea","price":"CNY 60-120"},{"dish":"Lotus root with glutinous rice","where":"Most local restaurants in autumn","order":"As dessert","price":"CNY 30-50"},{"dish":"Canal-side street snacks","where":"Xiaohe Zhi Street","order":"Whatever is being fried","price":"CNY 10-30"}],"restaurants":{"iconic":[{"name":"Lou Wai Lou","cuisine":"Hangzhou","price":"Mid-high","area":"Gu nter is grey and damp, though snow on the Broken Bridge is one of the canonical Ten Views for a reason. Avoid the first weeks of May and October entirely.","howLong":{"one":"Sunrise on the Su Causeway, Lingyin and Feilai Feng, then a lakeside dinner. Tight but coherent.","twoThree":"Add the tea villages, a boat, Hefang Street and a tea house. Two to three days is right.","fourFive":"Add the Grand Canal, Liangzhu, Nine Creeks and a water town.","week":"Use it as a base for Shaoxing, Wuzhen, Moganshan and Suzhou."},"culture":["Lingyin charges separately for the temple and for Feilai Feng; buy both.","Most lakeside sights are free; the pagodas and gardens are not.","Passport needed for museums and rail.","Payment by phone; set up Alipay or WeChat Pay before arriving.","Tea is graded and priced steeply by picking date; pre-Qingming leaf is the expensive one. Buy from a grower, not a lakeside tout.","Tipping is not expected."]},"whatIdDo":[{"day":"Day 1","plan":"Bike the lake at sunrise, both causeways. Breakfast, then Baochu ridge for the view. Afternoon boat to the Three Pools, Leifeng Pagoda at sunset. Dinner at Wai Po Jia."},{"day":"Day 2","plan":"Lingyin at opening, then Feilai Feng. Bus or taxi to Meijiawu for a farmhouse lunch and a tea tasting. Walk part of Nine Creeks in the afternoon. Quiet dinner."},{"day":"Day 3","plan":"Grand Canal water bus north, canal museums and Xiaohe Zhi Street. Hefang Street and Huqingyutang in the afternoon. A tea house until it gets dark, then the lit causeways."}],"quickRef":{"musts":["Su Causeway at dawn","Lingyin Temple and Feilai Feng","Longjing tea village","A boat on the lake","Baochu ridge view"],"eats":["Longjing shrimp","Dongpo pork","West Lake vinegar fish","Pian er chuan noodles","Longjing tea"],"areas":["West Lake shore","Longjing and Meijiawu","Lingyin and the western hills","Grand Canal"],"experiences":["Cycling the lake at dawn","Tea picking in April","Tea house afternoon"],"dayTrip":"Shaoxing by rail, or Wuzhen overn ll rushed.","fourFive":"The ideal balance of major sights plus neighborhood exploration.","week":"Best for travelers who want museums, food neighborhoods, parks and day trips."},"culture":["Queueing is expected and generally orderly.","On escalators, stand on the right and walk on the left.","Pub culture is casual; order at the bar unless table service is indicated.","Tipping is not mandatory in the American sense; check whether a service charge is already included.","Londoners generally value personal space and efficient, unobtrusive behavior on public transport."]},"whatIdDo":[{"day":"Day 1 - Royal & Westminster","plan":"Start at Westminster Abbey, then Parliament and Big Ben, walk through St James's Park to Buckingham Palace and Green Park. Dinner in Soho and a West End show."},{"day":"Day 2 - Tower & historic London","plan":"Tower of London in the morning, then Tower Bridge, walk west along the Thames to Borough Market, Tate Modern or Shakespeare's Globe, and a riverside evening."},{"day":"Day 3 - Museum + central London","plan":"British Museum in the morning, Covent Garden, lunch, National Gallery and Trafalgar Square, Soho wandering, dinner."},{"day":"Day 4 - Neighborhood London","plan":"Notting Hill and Portobello Road, or Shoreditch and Spitalfields depending on taste, a slower lunch, park or cafe time, and an excellent dinner."},{"day":"Day 5 - Flexible / day trip","plan":"Choose Windsor, Greenwich, Kew, Hampstead Heath, another major museum, or simply use the day for food, shopping and places missed earlier."}],"quickRef":{"musts":["Tower of London","Westminster and Big Ben","Westminster Abbey","British Museum","Thames and South Bank","West End theatre"],"eats":["Fish and chips","British pub food or Sunday roast","Indian/British curry","Afternoon tea","Full English breakfast"],"areas":["Westminster and St James's","Soho and Covent Garden","South Bank","City of London","Shoreditch and Spitalfields","Notting Hill and Kensington"],"experiences":["A West End s
