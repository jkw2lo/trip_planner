c shopping street with food, cosmetics, clothing and casual local retail.","mins":90},{"name":"Ginza","area":"Ginza","why":"Department stores, luxury, Japanese craftsmanship and flagship retail.","mins":150},{"name":"Nihonbashi","area":"Chuo","why":"Traditional food merchants, tea, craft, department stores and modern redevelopment.","mins":120},{"name":"Harajuku and Omotesando","area":"Shibuya","why":"Fashion spectrum from youth-oriented Takeshita Street to high-end architecture and design.","mins":180},{"name":"Jimbocho","area":"Chiyoda","why":"Books, curry shops and old-school intellectual Tokyo; good for browsing rather than checklist sightseeing.","mins":90},{"name":"Akihabara","area":"Chiyoda","why":"Electronics, anime, manga, games and pop-culture retail; worth visiting even if you are only moderately interested.","mins":150}],"nightlife":[{"name":"Shinjuku and Kabukicho","area":"Shinjuku","why":"Neon, bars, karaoke, izakaya and tiny alleys; explore with normal urban awareness and avoid aggressive touts.","mins":180},{"name":"Golden Gai","area":"Shinjuku","why":"Atmospheric micro-bars and a distinctive postwar urban texture; many venues are tiny and may have cover charges.","mins":120},{"name":"Omoide Yokocho","area":"Shinjuku","why":"Compact drinking-and-grilling alley near Shinjuku Station.","mins":90},{"name":"Shibuya","area":"Shibuya","why":"Contemporary bars, clubs, music venues and late-night food.","mins":180},{"name":"Ebisu","area":"Shibuya","why":"A more relaxed restaurant-and-bar scene with strong local appeal.","mins":150},{"name":"Tokyo skyline views","area":"Various observatories","why":"Choose one observatory rather than collecting several; prioritize the view that best fits your route.","mins":90}]},"essential10":[{"rank":1,"name":"Asakusa + Senso-ji","why":"The best compact introduction to Tokyo's historic layer.","mins":210,"label":"Essential","popularity":5,"cultural":5,"worth":5},{"rank":2,"name":"Shibuya Crossing + Shibuya walk","why":"Instantly legible modern Tokyo: density, fashion, transit and energy.","mins":180,"label":"Essential","popularity":5,"cultural":4,"worth":5},{"rank":3,"name":"Meiji Jingu + Harajuku/Omotesando","why":"Traditional shrine in a forest followed by youth culture and design.","mins":210,"label":"Essential","popularity":5,"cultural":5,"worth":5},{"rank":4,"name":"Tsukiji Outer Market breakfast","why":"A food-focused way to experience Tokyo's relationship with seafood and market culture.","mins":150,"label":"Essential","popularity":5,"cultural":4,"worth":5},{"rank":5,"name":"Shinjuku after dark","why":"The city's scale and nightlife become most vivid at night.","mins":210,"label":"Essential","popularity":5,"cultural":4,"worth":5},{"rank":6,"name":"Tokyo National Museum","why":"Adds cultural depth beyond neighborhoods and shopping.","mins":180,"label":"Recommended","popularity":4,"cultural":5,"worth":5},{"rank":7,"name":"Ginza + Nihonbashi","why":"Shows the city's luxury, commerce and historical continuity.","mins":240,"label":"Recommended","popularity":5,"cultural":4,"worth":4},{"rank":8,"name":"One immersive Japanese food experience","why":"Sushi, tempura, yakitori, soba or kaiseki gives more insight than another attraction.","mins":135,"label":"Recommended"},{"rank":9,"name":"Shinjuku Gyoen or Rikugien","why":"Counterbalances the density with Japanese landscape design.","mins":150,"label":"Recommended"},{"rank":10,"name":"A neighborhood without a checklist","why":"Choose Shimokitazawa, Yanaka, Nakameguro or Jimbocho and simply wander.","mins":180,"label":"Recommended"}],"food":{"identity":"Tokyo is less a single 'local cuisine' than Japan's greatest concentration point for regional ingredients, techniques and restaurant traditions. At the same time it has a distinct Edo/Tokyo food identity: Edomae sushi, soba, tempura, monjayaki, Fukagawa meshi and other dishes grew alongside the city's enormous Edo-period population and street-food culture. The practical takeaway is not to spend the trip chasing only famous sushi. Tokyo rewards variety: one high-quality sushi meal, one ramen lunch, soba or tempura, yakitori or izakaya, a neighborhood specialty and casual snacks give a much more complete picture. Spend less at lunch, make one reservation-worthy dinner count, and use another night for an izakaya or yokocho. Expensive does not mean better, and tipping is generally not expected, though some izakaya and bars apply a seating charge and bring a small dish before ordering.","mustTry":[{"dish":"Edomae sushi","what":"Nigiri shaped from vinegared rice and seafood; the Tokyo style developed in Edo.","flavour":"Clean, precise, seafood-forward; chef's choice omakase is the classic format.","importance":"Essential"},{"dish":"Ramen","what":"Wheat noodles in broth; Tokyo has enormous variety rather than one fixed style.","flavour":"Try shoyu, shio, chicken-based or contemporary styles; observe noodle texture and broth balance.","importance":"Essential"},{"dish":"Tempura","what":"Seafood and vegetables lightly battered and fried.","flavour":"Delicate, crisp, not greasy; often eaten with salt and/or dipping sauce.","importance":"Essential"},{"dish":"Soba","what":"Buckwheat noodles, hot or cold.","flavour":"Nutty, aromatic; cold soba makes texture and dipping sauce especially apparent.","importance":"Recommended"},{"dish":"Yakitori","what":"Chicken grilled over charcoal, often including different cuts.","flavour":"Smoky, savory, often lightly seasoned; excellent with beer or sake.","importance":"Essential"},{"dish":"Monjayaki","what":"Very loose savory batter cooked on a hot griddle, strongly associated with Tsukishima.","flavour":"Soft, savory, caramelized edges; scrape small portions from the griddle.","importance":"Recommended"},{"dish":"Tonkatsu","what":"Breaded, deep-fried pork cutlet.","flavour":"Crisp crust, juicy pork; typically served with shredded cabbage and tonkatsu sauce.","importance":"Recommended"},{"dish":"Unagi","what":"Grilled freshwater eel, commonly glazed and served over rice.","flavour":"Sweet-savory, rich and fatty; usually eaten with rice.","importance":"Recommended"},{"dish":"Wagashi","what":"Traditional Japanese sweets such as mochi, dorayaki and seasonal confections.","flavour":"Often subtle and less sweet than Western desserts; tied closely to tea culture.","importance":"Recommended"},{"dish":"Fukagawa meshi","what":"Clams and rice, historically associated with Tokyo's waterfront working communities.","flavour":"Briny, savory, comforting; a distinctly Tokyo local specialty.","importance":"Optional / deep cut"}]},"mustEat10":[{"dish":"Edomae sushi","where":"Sushi Dai / Toyosu area","order":"Chef's-choice sushi or seasonal nigiri","price":"JPY 4,000-8,000+"},{"dish":"Ramen","where":"Ginza Hachigo or a comparable specialist","order":"Signature ramen","price":"JPY 1,500-3,000"},{"dish":"Tempura","where":"Tempura Kondo, Ginza","order":"Chef's tempura course","price":"JPY 15,000-30,000+"},{"dish":"Yakitori","where":"Torishiki or a strong local yakitori counter","order":"Omakase yakitori course","price":"JPY 10,000-20,000+"},{"dish":"Soba","where":"Kanda Matsuya","order":"Cold soba plus tempura","price":"JPY 1,500-4,000"},{"dish":"Tonkatsu","where":"Tonkatsu Marugo or a Ueno-area specialist","order":"Rosu or hire cutlet set","price":"JPY 2,000-4,000"},{"dish":"Monjayaki","where":"Tsukishima Monja Street","order":"Classic seafood or mixed monja","price":"JPY 1,500-3,500"},{"dish":"Unagi","where":"Nodaiwa or an established eel specialist","order":"Unaju or grilled eel set","price":"JPY 5,000-10,000"},{"dish":"Wagashi and tea","where":"Toraya or an established wagashi shop","order":"Seasonal wagashi with Japanese tea","price":"JPY 1,000-3,000"},{"dish":"Convenience-store and depachika snacks","where":"7-Eleven, Lawson, FamilyMart and department food halls","order":"Onigiri, egg sandwich, seasonal sweets, bento","price":"JPY 300-2,500"}],"restaurants":{"iconic":[{"name":"Sushi Dai","cuisine":"Sushi" f a tournament or exhibition fits your dates; otherwise visit the neighborhood and learn about the sport's culture.","why":"Ryogoku is where the sport's institutions and chanko restaurants still live.","mins":180},{"name":"Kabuki at Kabukiza","what":"Watch a performance, including a single-act ticket.","why":"Even a shorter performance gives a taste of traditional theater.","mins":120},{"name":"Izakaya with a local or food tour","what":"Explore an izakaya with a guide.","why":"Useful if you want help navigating menus and etiquette.","mins":150},{"name":"Neighborhood shotengai","what":"Visit an everyday shopping street.","why":"It gives a better sense of lived-in Tokyo than only visiting major landmarks.","mins":90},{"name":"Evening waterfront walk","what":"Walk the Sumida River, Hamarikyu or Odaiba at night.","why":"A different view of the city from the train-and-district routine.","mins":90},{"name":"Craft-focused visit","what":"Look at Japanese knives, ceramics, indigo, stationery or traditional sweets, especially in Nihonbashi, Kappabashi and specialist shopping districts.","why":"Craft is where Tokyo's precision is easiest to see up close.","mins":120},{"name":"A half-day without an itinerary","what":"Spend one half-day deliberately unplanned.","why":"Tokyo's strongest feature is often the quality of ordinary streets between major sights.","mins":240}],"neighbourhoodGuide":[{"name":"Asakusa","vibe":"Traditional, touristy but atmospheric","bestFor":"First-timers, history, street food","sights":"Senso-ji, Nakamise, Sumida River","mins":240},{"name":"Ueno + Yanaka","vibe":"Cultural and old Tokyo","bestFor":"Museums, temples, wandering","sights":"Tokyo National Museum, Ueno Park, Yanaka Ginza","mins":240},{"name":"Ginza + Nihonbashi","vibe":"Polished, historic-commercial","bestFor":"Food, luxury, design, department stores","sights":"Kabukiza, Mitsukoshi, Nihonbashi","food":"Fine dining and depachika food halls","mins":240},{"name":"Tokyo Station + Marunouchi","vibe" s":"History, temples and a relaxed pace","verdict":"Worth it"},{"name":"Hakone","travel":"About 1.5-2 hr","why":"Onsen, Lake Ashi, the ropeway and Fuji-area scenery.","duration":"Full day or overnight","suits":"Nature, hot springs and scenery","verdict":"Worth it"},{"name":"Nikko","travel":"About 2 hr","why":"Lavish shrines, mountains, waterfalls and a lake.","duration":"Full day","suits":"History and nature","verdict":"Worth it"},{"name":"Mt. Takao","travel":"About 1 hr","why":"Accessible hiking close to Tokyo.","duration":"Half day","suits":"Nature and active travelers","verdict":"Worth it"},{"name":"Yokohama","travel":"About 30-45 min","why":"Waterfront, Chinatown, a modern city and museums.","duration":"Half or full day","suits":"Urban variety","verdict":"Only if extra time"},{"name":"Kawagoe","travel":"About 1 hr","why":"Preserved Edo-style streets and a warehouse district.","duration":"Half day","suits":"History and old-town atmosphere","verdict":"Only if extra time"},{"name":"Fuji Five Lakes","travel":"About 2+ hr","why":"Mt. Fuji views and nature.","duration":"Full day","suits":"Scenery and photography","verdict":"Only if extra time; weather dependent"}],"practical":{"gettingAround":"Use rail as the default: JR, Tokyo Metro, Toei Subway and private railways together reach almost every major visitor district, and the subway network alone has more than 280 stations with multilingual signage that makes it far easier than the map suggests. Get an IC card for frictionless travel - Welcome Suica and Tourist PASMO are the visitor-oriented options, and regular Suica or PASMO also work in many relevant areas. For a packed subway day, compare the cost of an IC card with the 24/48/72-hour Tokyo Subway Ticket, which covers Tokyo Metro and Toei Subway but not JR. Walking is not optional - it is part of the experience, and most neighborhoods are best understood by walking the 10-20 minutes between stations, shops and side streets. Taxis are useful late at night, with luggage, or when a group splits a fare, but are not necessary for ordinary sightseeing.","whenToGo":"Spring brings cherry blossoms and pleasant but crowded conditions - excellent, but book early. Early summer is green and warmer with a rainy season, and good for fewer crowds if rain is acceptable. Summer is hot and humid with festivals and fireworks; it is good for festivals but less comfortable for walking, so build in air-conditioned breaks and avoid scheduling every outdoor sight at midday. Autumn is mild with foliage and seasonal food, and is excellent overall. Winter is cool and dry with clear views and illuminations - excellent for city exploration and food, though daylight is shorter.","howLong":{"one":"Asakusa, then Ueno or Tsukiji, then Ginza, then Shibuya or Shinjuku at night.","twoThree":"Historic Tokyo plus Meiji Jingu, Harajuku and Shibuya, plus Tsukiji and Ginza, plus Shinjuku.","fourFive":"Add a major museum, a slower neighborhood, deeper food experiences and one nature block or day trip.","week":"Add multiple day trips, specialist shopping, craft and tea experiences, less-touristed districts and repeat visits to favorite food spots."},"culture":["Queue calmly and let passengers exit trains before boarding.","Keep phone conversations quiet on trains; eating and drinking on commuter trains is generally frowned upon.","Do not tip at ordinary restaurants.","At temples and shrines, observe the local sequence for washing, offerings and prayers; do not treat sacred spaces like photo sets.","At small bars and izakaya, check whether there is a cover or seating charge.","Cash is still useful for small independent businesses even though card and contactless acceptance is widespread.","Trash bins can be scarce; carry a small bag for your own waste."]},"whatIdDo":[{"day":"Day 1 - Old Tokyo","plan":"Asakusa and Senso-ji early. Ueno museums or a Yanaka walk in the afternoon. Izakaya in Ueno or Asakusa in the evening."},{"day":"Day 2 - Modern Tokyo","plan":"Meiji Jingu su Marugo":[35.71,139.772]}},"new-york":{"schema":"cityreport.v1","city":"New York","country":"United States","lat":40.7128,"lon":-74.006,"generated":"2026-09-08","by":"Claude","note":"Written September 2026. Fares checked against the MTA: the subway and bus base fare rose to $3.00 in January 2026, OMNY caps a week of rides at $35, and the unlimited MetroCard passes have been retired. Restaurants and opening arrangements change, so confirm before you go.","glance":{"why":"New York is a walking city disguised as a skyline. The famous sights are mostly worth doing once and quickly; what the city actually rewards is covering ground on foot, block by block, between neighbourhoods that change character in a hundred metres. Manhattan below 59th Street and the western edge of Brooklyn will hold a first visit comfortably, and the single best decision a visitor makes is to spend less time in observation decks and more time eating, walking and going to something - a show, a game, a gig, a museum with one exhibition you actually want to see.","bestFor":["Museums","Food","Theatre and live performance","Architecture","Walking","Shopping","Nightlife","Neighbourhoods","Parks"],"idealStay":"4-5 days for a first visit; 6-7 to include outer-borough neighbourhoods and a slower pace","character":["Dense","Vertical","Fast","Loud","Endlessly specific"],"dontMiss":["Central Park, entered on foot and crossed slowly","The Metropolitan Museum of Art, with a plan and a time limit","The Brooklyn Bridge walked toward Manhattan at dusk","A Broadway or off-Broadway show","The 9/11 Memorial and the harbour from the Staten Island Ferry","Greenwich Village and the West Village on foot","One meal each in Chinatown, a deli, and a neighbourhood in another borough"],"neighbourhoods":["Greenwich Village and the West Village","Lower East Side and Chinatown","SoHo, Nolita and Tribeca","Upper West and Upper East Sides","Williamsburg and Greenpoint","Harlem"]},"history":{"story":"New York was Lenape land, then a Dutch trading post called New Amsterdam in 1624, taken by the English forty years later and renamed. Its harbour made it the continent's port, the Erie Canal in 1825 made it the outlet for a continent's goods, and immigration made it the country's largest city - German and Irish first, then Italian, Eastern European Jewish, and after 1965 Caribbean, Latin American, Chinese, South Asian and West African. The consolidation of the five boroughs in 1898, the elevator and the steel frame, the subway in 1904, the Great Migration and the Harlem Renaissance, the postwar boom, the near-bankruptcy and crime of the 1970s and 80s, gentrification, September 11 and the pandemic are all still legible in specific streets.","origins":"The deep, protected harbour at the mouth of the Hudson is the whole reason for the city. Manhattan's hard schist bedrock is why the towers could be built where they were, and the 1811 grid above Houston Street is why navigating uptown is trivial and downtown is not.","periods":[{"name":"Lenapehoking and New Amsterdam, to 1664","text":"Lenape land becomes a Dutch trading company outpost; the street pattern of the Financial District still follows it."},{"name":"Port city, 1825-1890","text":"The Erie Canal makes New York the country's commercial gateway; tenement districts fill with new arrivals."},{"name":"Immigrant city, 1880-1924","text":"Ellis Island, the Lower East Side tenements, and the political machines and labour movements that came with them."},{"name":"Skyscraper city, 1900-1940","text":"The subway, the Woolworth, Chrysler and Empire State buildings, and Rockefeller Center define the skyline and the idea of the city."},{"name":"Harlem Renaissance and the Great Migration","text":"Black American life and culture reshape uptown and, through it, American music and letters."},{"name":"Crisis and reinvention, 1970s-","text":"Fiscal collapse, crime, AIDS and the artistic explosion that accompanied them; then the safer, richer and more expensive city that followed, and the long recovery from September 11."}],"whyItMatters":"New York's history is mostly domestic rather than monumental - it is in tenement stairwells, subway tile, brownstone stoops and the shopfronts of businesses that outlived their neighbourhoods. That is why the Tenement Museum tells the city's story better than most of its grander institutions.","visible":["Dutch and colonial: the crooked streets of the Financial District, Fraunces Tavern, Trinity Church","Immigrant New York: the Lower East Side tenements, the Tenement Museum, Ellis Island","Gilded Age: the Met, Grand Central Terminal, Fifth Avenue mansions turned museums","Skyscraper era: the Chrysler and Empire State buildings, Rockefeller Center, the Woolworth Building","Modern city: the High Line, Hudson Yards, the 9/11 Memorial and Museum"]},"thingsToDo":{"historic":[{"name":"Brooklyn Bridge","area":"Downtown Brooklyn to Manhattan","why":"Walk it toward Manhattan, late afternoon, and continue into Dumbo or the Financial District. Free, and the best thirty minutes in the city.","mins":60},{"name":"9/11 Memorial and Museum","area":"Financial District","why":"The memorial pools are free and quietly devastating; the museum is thorough and heavy, so allow time and headspace.","mins":150},{"name":"Statue of Liberty and Ellis Island","area":"New York Harbor","why":"The Ellis Island immigration museum is the substantive half. If time is short, the free Staten Island Ferry passes the statue instead.","mins":300},{"name":"Grand Central Terminal","area":"Midtown East","why":"Ten minutes for the concourse ceiling, longer if you eat downstairs. A working building, not an attraction.","mins":45},{"name":"Tenement Museum","area":"Lower East Side","why":"Guided tours through restored apartments of actual families; the best single hour of history in New York.","mins":90},{"name":"Empire State Building or Top of the Rock","area":"Midtown","why":"Choose one. Top of the Rock puts the Empire State in your photo; the Empire State puts you in the more famous building.","mins":120}],"arts":[{"name":"Metropolitan Museum of Art","area":"Upper East Side","why":"Too big to see. Pick three departments - Egyptian, European painting, the American Wing, Arms and Armor - and leave before you are exhausted.","mins":180},{"name":"Museum of Modern Art","area":"Midtown","why":"The best modern collection in the world and a building designed to move crowds through it. Go at opening or on a late evening.","mins":150},{"name":"American Museum of Natural History","area":"Upper West Side","why":"The dioramas, the blue whale and the Gilder Center; the most rewarding museum in the city for children.","mins":180},{"name":"The Frick Collection","area":"Upper East Side","why":"A Gilded Age mansion full of masterpieces, reopened in 2025 after a long renovation; small enough to finish in one visit.","mins":90},{"name":"Whitney Museum of American Art","area":"Meatpacking District","why":"American art in a Renzo Piano building with terraces over the High Line.","mins":120},{"name":"The Met Cloisters","area":"Fort Tryon Park, Upper Manhattan","why":"Medieval art in a reassembled monastery above the Hudson. Worth the subway ride for the quiet alone.","mins":150}],"neighbourhoods":[{"name":"Greenwich Village and the West Village","character":"Low brick, crooked streets, the pre-grid city","highlights":"Washington Square Park, Bleecker Street, the jazz clubs, Stonewall","food":"Old Italian, wine bars, small restaurants worth booking","bestTime":"Late afternoon into evening","mins":210},{"name":"Lower East Side and Chinatown","character":"Tenements, bars, dumplings, layered migration","highlights":"Tenement Museum, Orchard Street, Doyers Street, the Bowery","food":"Chinese, Jewish delis and appetising shops, cocktail bars","bestTime":"Afternoon into night","mins":240},{"name":"SoHo, Nolita and Tribeca","character":"Cast-iron warehouses, shopping, cobbles","highlights":"Cast-iron district, Elizabeth Street, Tribeca lofts","food":"Cafes, expensive lunch, good bakeries","bestTime":"Daytime","mins":180},{"name":"Upper West Side and Central Park","character":"Pre-war apartment blocks, families, museums","highlights":"Central Park's west side, the Natural History Museum, Lincoln Center","food":"Delis, diners, neighbourhood Italian","bestTime":"Morning","mins":210},{"name":"Williamsburg and Greenpoint","character":"Brooklyn waterfront, warehouses, Polish and hipster layers","highlights":"Domino Park, the East River skyline view, Bedford Avenue","food":"Some of the city's best casual restaurants and bakeries","bestTime":"Afternoon into night","mins":240},{"name":"Harlem","character":"Brownstones, boulevards, deep cultural history","highlights":"Apollo Theater, the Studio Museum, Sunday gospel, 125th Street","food":"Southern food, West African, Caribbean","bestTime":"Daytime into early evening","mins":180}],"nature":[{"name":"Central Park","area":"Manhattan","why":"Enter at 59th and walk north to the Ramble and the Reservoir rather than doing a loop of the south end with everyone else.","mins":150},{"name":"The High Line","area":"Chelsea","why":"An elevated rail viaduct turned park; twenty blocks, crowded at midday, best early or at dusk.","mins":90},{"name":"Brooklyn Bridge Park","area":"Dumbo and Brooklyn Heights","why":"The best skyline view in the city, plus a carousel, piers and the Promenade above it.","mins":120},{"name":"Prospect Park","area":"Brooklyn","why":"The same designers as Central Park, with better meadows and fewer visitors. Pair with the Botanic Garden.","mins":150},{"name":"Staten Island Ferry","area":"New York Harbor","why":"Free, twenty-five minutes each way, passes the Statue of Liberty. The best-value thing in New York.","mins":60},{"name":"Governors Island","area":"New York Harbor","why":"A car-free island with hammocks, hills and skyline views; seasonal ferry from Lower Manhattan.","mins":180}],"shopping":[{"name":"SoHo","area":"SoHo","why":"Flagships and boutiques under cast iron; the buildings are as good as the shops.","mins":120},{"name":"Fifth Avenue and Midtown","area":"Midtown","why":"Department stores and flagship spectacle; efficient if you want it, skippable if you do not.","mins":120},{"name":"Lower East Side and Nolita","area":"Downtown","why":"Independent designers, vintage, and small shops that still feel like the owner is inside.","mins":120},{"name":"Chelsea Market","area":"Chelsea","why":"Food hall in a former Nabisco factory at the foot of the High Line; busy but useful.","mins":90},{"name":"Brooklyn Flea and Smorgasburg","area":"Brooklyn","why":"Weekend markets for vintage and street food; check the season and location before going.","mins":120},{"name":"Strand and the bookshops","area":"Union Square and downtown","why":"Eighteen miles of books, plus McNally Jackson and the small shops downtown.","mins":90}],"nightlife":[{"name":"Broadway and off-Broadway","area":"Theater District and downtown","why":"The reason many people come. Off-Broadway is cheaper, often better, and easier to book.","mins":180},{"name":"Jazz in the West Village","area":"West Village","why":"The Village Vanguard, Smalls and Blue Note within a few blocks; the Vanguard is the one to book.","mins":150},{"name":"Lower East Side bars","area":"Lower East Side","why":"The densest run of bars downtown, from dives to cocktail rooms with no sign.","mins":180},{"name":"Brooklyn live music","area":"Williamsburg, Bushwick","why":"Warehouse venues and small rooms; where most of the interesting bookings are.","mins":180},{"name":"Comedy clubs","area":"Village and Midtown","why":"The Comedy Cellar and its neighbours run several shows a night with famous drop-ins.","mins":120},{"name":"A game at the Garden or the ballpark","area":"Midtown, Bronx, Queens","why":"Knicks or Rangers at Madison Square Garden, Yankees or Mets in summer; the crowd is the event.","mins":210}]},"essential10":[{"rank":1,"name":"Central Park on foot","why":"Cross it rather than circle it: the Ramble, the Reservoir and the Bethesda Terrace in one slow walk.","mins":150,"label":"Essential","popularity":5,"cultural":5,"worth":5},{"rank":2,"name":"Metropolitan Museum of Art","why":"One of the two or three great museums on earth. Choose three departments and accept that you are not seeing it.","mins":180,"label":"Essential","popularity":5,"cultural":5,"worth":5},{"rank":3,"name":"Brooklyn Bridge at dusk","why":"Walk from Brooklyn toward Manhattan as the lights come on, then eat in Dumbo or downtown.","mins":90,"label":"Essential","popularity":5,"cultural":5,"worth":5},{"rank":4,"name":"A Broadway or off-Broadway show","why":"Live performance is the city's deepest cultural resource. Off-Broadway is cheaper and frequently better.","mins":180,"label":"Essential","popularity":5,"cultural":5,"worth":5},{"rank":5,"name":"Downtown walking day: Village to Lower East Side","why":"The pre-grid streets, the tenements and the food are the actual texture of New York.","mins":240,"label":"Essential","popularity":3,"cultural":5,"worth":5},{"rank":6,"name":"9/11 Memorial, and the harbour by ferry","why":"The memorial pools plus the free Staten Island Ferry give you the modern city and its harbour in one afternoon.","mins":210,"label":"Essential","popularity":5,"cultural":5,"worth":5},{"rank":7,"name":"Museum of Modern Art","why":"The collection that defined how modern art is told. Book a timed entry and go early.","mins":150,"label":"Recommended","popularity":5,"cultural":5,"worth":4},{"rank":8,"name":"An outer-borough neighbourhood","why":"Williamsburg, Astoria, Flushing, Sunset Park or Jackson Heights - where most New Yorkers actually live and eat.","mins":210,"label":"Recommended","popularity":3,"cultural":5,"worth":5},{"rank":9,"name":"One observation deck","why":"Top of the Rock, the Empire State, Edge or Summit. Pick one, at sunset, and skip the others.","mins":120,"label":"Recommended","popularity":5,"cultural":3,"worth":3},{"rank":10,"name":"The High Line and Chelsea galleries","why":"An elevated park through the gallery district; do the galleries on a Thursday when openings run.","mins":150,"label":"Recommended","popularity":4,"cultural":4,"worth":4}],"food":{"identity":"New York's food identity is immigration plus competition. The city has no cuisine of its own beyond a handful of forms it perfected - the bagel and appetising counter, the pastrami sandwich, the coal-oven and then the by-the-slice pizza, the Cantonese-American dining room, the diner - and beyond those it simply has the best version of almost everything, somewhere, usually far from Midtown. The instinct that ruins visits is eating near the sights. The instinct that saves them is picking a neighbourhood, taking the subway there and eating what it is known for: Sichuan in Flushing, Colombian and Indian in Jackson Heights, Middle Eastern in Bay Ridge, Dominican in Washington Heights.","mustTry":[{"dish":"A bagel with lox and cream cheese","what":"Boiled-then-baked bagel, sliced salmon, cream cheese, from an appetising shop or a corner bagel counter.","why":"The most specifically New York breakfast there is, from the city's Eastern European Jewish history.","flavour":"Chewy, salty, cold and rich all at once.","howLocalsEat":"Standing up, in the morning, ordered fast and precisely.","importance":"Essential"},{"dish":"Pastrami on rye","what":"Hand-cut cured and smoked beef, piled on rye with mustard, at a Jewish deli.","why":"One of the few dishes the city genuinely invented and still does better than anywhere.","flavour":"Peppery, fatty, enormous.","howLocalsEat":"Split it, and never ask for mayonnaise.","importance":"Essential"},{"dish":"Pizza, both kinds","what":"A plain slice from a counter, and a coal- or wood-oven pie from a sit-down place.","why":"The slice is daily life; the pie is the craft version.","flavour":"Thin, foldable, and better after 11pm.","howLocalsEat":"Folded lengthwise, standing at the counter.","importance":"Essential"},{"dish":"Chinatown dumplings and noodles","what":"Soup dumplings, hand-pulled noodles and roast meats in Manhattan's Chinatown, Sunset Park or Flushing.","why":"New York's Chinese food is regionally deep in a way few western cities match.","flavour":"Varies wildly by region - go where the menu is specific.","importance":"Essential"},{"dish":"The halal cart","what":"Chicken and rice with white sauce and hot sauce, from a street cart.","why":"The city's default late-night and lunch-hour meal.","flavour":"Spiced, greasy, deeply satisfying.","howLocalsEat":"In a foil tray, walking.","importance":"Recommended"},{"dish":"A diner breakfast","what":"Eggs, home fries, endless filter coffee in a booth.","why":"A vanishing but still-living form, and the cheapest sit-down meal in Manhattan.","flavour":"Unremarkable and entirely the point.","importance":"Recommended"},{"dish":"Oysters and a martini","what":"East Coast oysters at a raw bar, with something cold and dry.","why":"The city was built on oyster beds, and the raw bar remains one of its best rooms.","flavour":"Briny, cold, mineral.","importance":"Recommended"},{"dish":"Queens street food","what":"Colombian arepas, Tibetan momos, Indian sweets, Mexican tacos - often on one block in Jackson Heights.","why":"The most diverse eating in the United States, and mostly under fifteen dollars.","importance":"Essential"},{"dish":"Cheesecake and black-and-white cookies","what":"Dense baked cheesecake, and the flat iced cookie every deli sells.","why":"The city's two classic sweets, both better than their reputations.","importance":"Optional"},{"dish":"A tasting menu, once","what":"The city's fine dining, from Le Bernardin's seafood to smaller counters downtown.","why":"New York's high end is genuinely world-class if the budget allows one.","importance":"Optional"}]},"mustEat10":[{"dish":"Bagel with lox","where":"Russ & Daughters, Lower East Side","order":"Sturgeon or lox on an everything bagel","price":"USD 18-28"},{"dis /* ---------- file-backed storage ----------
   Browser storage always holds a mirror, so nothing is ever lost. On top of that
   you can link a real trips.json and every change is written straight to it. */
const STORE = {handle:null, mode:"local", needsPermission:false, lastSaved:null, writing:false, again:false};
const FSA = typeof window!=="undefined" && !!window.showSaveFilePicker;

function idb(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB) return rej(new Error("no idb"));
    const r = window.indexedDB.open("tripBoard", 1);
    r.onupgradeneeded = ()=>{ r.result.createObjectStore("kv"); };
    r.onsuccess = ()=>res(r.result);
    r.onerror = ()=>rej(r.error);
  });
}
async function idbSet(k,v){
  const db = await idb();
  return new Promise((res,rej)=>{
    const tx = db.transaction("kv","readwrite");
    tx.objectStore("kv").put(v,k);
    tx.oncomplete = ()=>res(); tx.onerror = ()=>rej(tx.error);
  });
}
async function idbGet(k){
  const db = await idb();
  return new Promise((res,rej)=>{
    const tx = db.transaction("kv","readonly");
    const q = tx.objectStore("kv").get(k);
    q.onsuccess = ()=>res(q.result); q.onerror = ()=>rej(q.error);
  });
}

async function initStorage(){
  if(!FSA) return;
  let h = null;
  try{ h = await idbGet("fileHandle"); }catch(e){ return; }
  if(!h) return;
  STORE.handle = h;
  let perm = "prompt";
  try{ perm = await h.queryPermission({mode:"readwrite"}); }catch(e){}
  if(perm === "granted"){ await adoptFile(); }
  else { STORE.needsPermission = true; STORE.mode = "file-locked"; render(); }
}
async function adoptFile(){
  try{
    const f = await STORE.handle.getFile();
    const txt = await f.text();
    if(txt.trim()){
      const j = JSON.parse(txt);
      if(j && Array.isArray(j.trips)){
        DB = j;
        DB.trips.forEach(normalize);
        localStorage.setItem(KEY, JSON.stringify(DB));
      }
    }
    STORE.mode = "file";
    STORE.needsPermission = false;
    STORE.lastSaved = Date.now();
    render();
  }catch(e){
    STORE.mode = "local"; STORE.needsPermission = true; render();
  }
}
async function reconnectFile(){
  if(!STORE.handle) return;
  try{
    const p = await STORE.handle.requestPermission({mode:"readwrite"});
    if(p==="granted"){ await adoptFile(); toast("Reconnected to your trips file"); }
    else toast("Still using browser storage");
  }catch(e){ toast("Couldn't reconnect"); }
}
async function linkFile(){
  if(!FSA){ toast("This browser can't link files — Chrome or Edge can"); return; }
  try{
    STORE.handle = await window.showSaveFilePicker({
      suggestedName: "trips.json",
      types:[{description:"Trip Board data", accept:{"application/json":[".json"]}}]
    });
    STORE.mode = "file"; STORE.needsPermission = false;
    try{ await idbSet("fileHandle", STORE.handle); }
    catch(e){ toast("Linked for this session — your browser wouldn't remember the file"); }
    await writeFile();
    render();
    toast("Linked. Every change now writes straight to that file.");
  }catch(e){ /* user cancelled */ }
}
async function openFile(){
  if(!FSA){ document.getElementById("importfile").click(); return; }
  try{
    const [h] = await window.showOpenFilePicker({
      types:[{description:"Trip Board data", accept:{"application/json":[".json"]}}]
    });
    STORE.handle = h;
    try{ await idbSet("fileHandle", h); }catch(e){}
    await adoptFile();
    toast("Opened — this file is now where your trips live");
  }catch(e){ /* cancelled */ }
}
async function unlinkFile(){
  STORE.handle = null; STORE.mode = "local"; STORE.needsPermission = false;
  try{ await idbSet("fileHandle", null); }catch(e){}
  render();
  toast("Back to browser storage — your trips are still here");
}
async function writeFile(){
  if(!STORE.handle) return;
  if(STORE.writing){ STORE.again = true; return; }
  STORE.writing = true;
  try{
    const w = await STORE.handle.createWritable();
    await w.write(JSON.stringify(DB,null,2));
    await w.close();
    STORE.lastSaved = Date.now();
    STORE.mode = "file";
  }catch(e){
    STORE.needsPermission = true;
    STORE.mode = "file-locked";
  }
  STORE.writing = false;
  if(STORE.again){ STORE.again = false; return writeFile(); }
  const chip = document.getElementById("savechip");
  if(chip) chip.outerHTML = storageChipHTML();
}
let writeTimer = null;
function scheduleWrite(){
  if(!STORE.handle) return;
  clearTimeout(writeTimer);
  writeTimer = setTimeout(writeFile, 400);
}
function storageChipHTML(){
  if(STORE.mode==="file"){
    const t = STORE.lastSaved ? new Date(STORE.lastSaved) : null;
    return `<button class="savechip ok" id="savechip" data-act="storage" title="Click for storage options">
      <span class="dotok"></span>${esc(STORE.handle && STORE.handle.name || "trips.json")}
      ${t?`<span class="ago">saved ${d2(t.getHours())}:${d2(t.getMinutes())}</span>`:""}</button>`;
  }
  if(STORE.mode==="file-locked"){
    return `<button class="savechip warn" id="savechip" data-act="storage">
      <span class="dotwait"></span>File needs reconnecting</button>`;
  }
  return `<button class="savechip" id="savechip" data-act="storage" title="Click for storage options">
    <span class="dotwait"></span>Saved in this browser</button>`;
}

  t.dayFold = t.dayFold || {};

  t.stays.forEach(st=>{

const MON = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const DOW = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
const MONL = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function dayLabel(d){ const x=parseD(d); return MONL[x.getMonth()]+" "+x.getDate(); }

function d2(n){ return String(n).padStart(2,"0"); }
function parseD(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function fmtD(dt){ return dt.getFullYear()+"-"+d2(dt.getMonth()+1)+"-"+d2(dt.getDate()); }
function addDays(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return fmtD(d); }
function daysBetween(a,b){ return Math.round((parseD(b)-parseD(a))/86400000); }
function todayStr(){ return fmtD(new Date()); }

const MAX_TRIP_DAYS = 400;
function dateRange(a,b){
  if(!a||!b) return [];
  const n = daysBetween(a,b);
  if(n<0 || n>MAX_TRIP_DAYS-1) return [];
  const out=[]; for(let i=0;i<=n;i++) out.push(addDays(a,i));
  return out;
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmt12(t){
  if(!t) return "";
  const [h,m] = t.split(":").map(Number);
  const ap = h>=12 ? "pm" : "am";
  const hh = h%12===0 ? 12 : h%12;
  return hh + (m ? ":"+d2(m) : "") + ap;
}
function mins2h(m){
  m = Math.round(m/5)*5;
  const h = Math.floor(m/60), r = m%60;
  if(h===0) return r+"m";
  return h+"h"+(r?" "+d2(r)+"m":"");
}
const isNum = v => typeof v === "number" && isFinite(v);
const isPoint = p => !!p && isNum(p.lat) && isNum(p.lon);
function haversine(a,b){
  if(!isPoint(a) || !isPoint(b)) return null;
  const R=6371, rad=x=>x*Math.PI/180;
  const dLat=rad(b.lat-a.lat), dLon=rad(b.lon-a.lon);
  const s = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function estimateMins(modeId, from, to){
  const m = TRANSPORT_MODES.find(x=>x.id===modeId);
  const km = haversine(from,to);
  if(!m || km==null) return null;
  const road = m.id==="flight" ? km*1.02 : km*1.25;   // flights near direct, ground routes wander
  return Math.round(road/m.kmh*60 + m.over);
}
let lastDeleted = null;
let lastOptimise = null;
let lastMove = null;
const fmtKm = km => km < 1 ? Math.round(km*1000)+"m" : km.toFixed(1)+"km";
/* Messages used to be dropped on the same spot and sat on top of each other.
   They queue now: newest at the bottom, three at most, oldest pushed out. */
function toastHost(){
  let host = document.getElementById("toasts");
  if(!host){
    host = document.createElement("div");
    host.id = "toasts";
    document.body.appendChild(host);
  }
  return host;
}
function pushToast(html, ms){
  const host = toastHost();
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = html;
  host.appendChild(el);
  while(host.children.length > 3) host.removeChild(host.firstChild);
  setTimeout(()=>{
    el.classList.add("gone");
    setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, 220);
  }, ms);
  return el;
}
function toast(msg){ pushToast(esc(msg), 2400); }
function toastUndo(msg, act){
  // one undo offer at a time — two would be ambiguous about which it undoes
  toastHost().querySelectorAll(".toast.undoable").forEach(el=>el.remove());
  const el = pushToast(esc(msg) + ' <button class="undo" data-act="'+(act||"undodel")+'">Undo</button>', 6000);
  el.classList.add("undoable");
  return el;
}
function c2f(c){ return c*9/5+32; }
function temp(c){
  if(c==null || isNaN(c)) return "–";
  return Math.round(c)+"°/"+Math.round(c2f(c))+"°F";
}

/* =========================================================
   4. TRIP HELPERS
   ========================================================= */
function tripDays(t){ return dateRange(t.arr.date, t.dep.date); }

function tripCodes(t){
  const out = [t.arr.code];
  t.cities.forEach(c=>{ if(c.code && !out.includes(c.code)) out.push(c.code); });
  if(t.dep.code && t.dep.code!==out[out.length-1]) out.push(t.dep.code);
  return out.filter(Boolean);
}
function cityById(t,id){ return t.cities.find(c=>c.id===id) || null; }

// which city are we in on a given day? seeded by arrival, moved by transport magnets
// Pin one day to a city. Days after it follow along until the next pin or
// transport magnet, so you only mark the days you actually move.
function pinDay(t, day, cityId){
  if(!day || !cityId) return;
  t.dayCity = t.dayCity || {};
  t.dayCity[day] = cityId;
}
function computeDayCities(t){
  const days = tripDays(t);
  const map = {};
  if(!days.length) return map;

  const hasMoves = t.magnets.some(m=>m.board==="cal" && m.kind==="move" && m.toCity);
  const hasManual = t.dayCity && Object.keys(t.dayCity).length>0;

  // Nothing said otherwise and there's more than one city? Split the trip evenly
  // in the order you listed them, so every city owns some days from the start.
  // Any transport magnet or manual pick overrides this straight away.
  if(!hasMoves && !hasManual && t.cities.length>1){
    const per = days.length / t.cities.length;
    days.forEach((d,i)=>{
      const ix = Math.min(t.cities.length-1, Math.floor(i/per));
      map[d] = t.cities[ix].id;
    });
    return map;
  }

  let cur = t.cities[0] ? t.cities[0].id : null;
  days.forEach(d=>{
    if(t.dayCity && t.dayCity[d]) cur = t.dayCity[d];
    map[d] = cur;
    // a transport magnet on this day moves you for subsequent days
    const moves = t.magnets.filter(m=>m.board==="cal" && m.day===d && m.kind==="move" && m.toCity);
    if(moves.length) cur = moves[moves.length-1].toCity;
  });
  return map;
}
function magnetsIn(t, pred){ return t.magnets.filter(pred).sort((a,b)=>(a.order||0)-(b.order||0)); }

/* ---------- rough money ----------
   Not accounting. A number on the things that have one, added up, so you can see
   the shape of what the trip costs before you are standing in it. Anything marked
   optional is counted separately, because that is the point of marking it. */
function num(v){
  const n = typeof v === "number" ? v : parseFloat(String(v == null ? "" : v).replace(/[^0-9.\-]/g, ""));
  return isNum(n) && isFinite(n) ? n : 0;
}
function money(t, n){
  if(!n) return "";
  const cur = (t && t.currency) || "";
  const r = Math.round(n);
  return cur + r.toLocaleString();
}
function dayCost(t, day){
  let sure = 0, maybe = 0;
  t.magnets.filter(m=>m.board === "cal" && m.day === day).forEach(m=>{
    const v = num(m.cost);
    if(!v) return;
    if(m.optional) maybe += v; else sure += v;
  });
  return {sure, maybe};
}
function tripCost(t){
  let sure = 0, maybe = 0, beds = 0;
  t.magnets.forEach(m=>{
    const v = num(m.cost);
    if(!v) return;
    if(m.optional) maybe += v; else sure += v;
  });
  stays(t).forEach(st=>{
    const v = num(st.cost);
    if(!v) return;
    if(st.status === "booked") beds += v; else maybe += v;
  });
  return {sure, maybe, beds, total: sure + beds};
}

/* ---------- days folded away, and days that are settled ----------
   Two different ideas, deliberately kept apart. Folding is about clutter: ten
   days is a lot of screen and you are usually working on one of them. Finalising
   is about intent: this day is booked, stop moving it. You fold days that are
   done and days you have not started; you finalise only the ones that are real. */
function dayFolded(t, day){ return !!(t && t.dayFold && t.dayFold[day]); }
function dayLocked(t, day){ return !!(t && t.dayLock && t.dayLock[day]); }
function toggleDayFold(t, day){
  t.dayFold = t.dayFold || {};
  if(t.dayFold[day]) delete t.dayFold[day]; else t.dayFold[day] = true;
  save(); render();
}
function toggleDayLock(t, day){
  t.dayLock = t.dayLock || {};
  if(t.dayLock[day]){
    delete t.dayLock[day];
    save(); render();
    toast(dayLabel(day)+" unlocked — it can move again");
  }else{
    t.dayLock[day] = true;
    save(); render();
    toast(dayLabel(day)+" is finalised — nothing moves in or out");
  }
}
function foldDays(t, mode){
  const days = tripDays(t);
  t.dayFold = t.dayFold || {};
  if(mode==="none") t.dayFold = {};
  else if(mode==="all") days.forEach(d=>{ t.dayFold[d] = true; });
  else if(mode==="locked") days.forEach(d=>{ if(dayLocked(t, d)) t.dayFold[d] = true; });
  save(); render();
}
/* what a folded day says about itself in one line */
function daySummary(t, day){
  const all = magnetsIn(t, m=>m.board==="cal" && m.day===day);
  return {
    acts:  all.filter(m=>m.slot!=="transit" && m.slot!=="lunch" && m.slot!=="dinner"),
    meals: all.filter(m=>m.slot==="lunch" || m.slot==="dinner"),
    trans: all.filter(m=>m.slot==="transit"),
    notes: !!dayNote(t, day),
    stickies: stickies(t, day).length,
    images: dayImages(t, day).length
  };
}

function newTripObject(data){
  const t = {

  t.magnets.push({

    label:"Land "+t.arr.code+(t.arr.time?" "+fmt12(t.arr.time):""),
    note:t.arr.flightNo ? t.arr.flightNo : "arrival", locked:true, order:-1000, time:t.arr.time
  });
  t.magnets.push({
    id:uid(), kind:"fly", board:"cal", day:t.dep.date, slot:slotForTime(t.dep.time),
    label:"Fly out "+t.dep.code+(t.dep.time?" "+fmt12(t.dep.time):""),
    note:t.dep.flightNo ? t.dep.flightNo : "departure", locked:true, order:1000, time:t.dep.time
  });
  // hotel checkin/checkout scaffolding
  t.magnets.push({id:uid(),kind:"stay",board:"todo",col:"before",label:"Book accommodation",note:"",order:1});
  t.magnets.push({id:uid(),kind:"note",board:"todo",col:"before",label:"Check visa / entry rules",note:"",order:2});
  return t;
}
function slotForTime(t){
  if(!t) return "morning";
  const h = +t.split(":")[0];
  if(h<12) return "morning";
  if(h<17) return "afternoon";
  return "evening";
}

/* =========================================================
   5b. CLOCK TIME PICKER
   ========================================================= */
function faceTheme(h){
  if(h>=6 && h<8)   return {bg:"#FDE9CE",ring:"#E9C79A",num:"#6B4A22",hand:"#8A5A22",tag:"dawn"};
  if(h>=8 && h<17)  return {bg:"#FFFDF4",ring:"#E3DCCC",num:"#4A4437",hand:"#23201C",tag:"daytime"};
  if(h>=17 && h<20) return {bg:"#F7D4AE",ring:"#DFA873",num:"#6B3E1C",hand:"#8A4A1C",tag:"dusk"};
  return {bg:"#252B47",ring:"#3C456F",num:"#C6CEEE",hand:"#EDF1FF",tag:"night"};
}
function snap30(t){
  if(!t) return t;
  let [h,m] = t.split(":").map(Number);
  m = m<15 ? 0 : (m<45 ? 30 : 0);
  if(m===0 && +t.split(":")[1] >= 45) h = (h+1)%24;
  return d2(h)+":"+d2(m);
}
// one ring, 48 half-hour stops. midnight at the top, noon at the bottom.
function minOfDay(t){ const [h,m]=t.split(":").map(Number); return h*60+m; }
function fromMin(v){ v=((v%1440)+1440)%1440; return d2(Math.floor(v/60))+":"+d2(v%60); }
function angToTime(ang){ return fromMin(Math.round(((ang%360)+360)%360/360*48)%48*30); }
function timeToAng(t){ return minOfDay(t)/1440*360; }

function clockHTML(key, label, value, hint){
  const set = !!value;
  const val = set ? value : "12:00";
  const H = +val.split(":")[0];
  const th = faceTheme(H);
  const ang = timeToAng(val);
  const R=62, cx=84, cy=84;
  const pos = a => {
    const r=(a-90)*Math.PI/180;
    return [cx+Math.cos(r)*R, cy+Math.sin(r)*R];
  };
  const [hx,hy] = pos(ang);
  const ticks = [];
  for(let i=0;i<24;i++){
    const a=(i*15-90)*Math.PI/180, big = i%6===0, len = big?8:4;
    ticks.push(`<line x1="${(cx+Math.cos(a)*(R+9)).toFixed(1)}" y1="${(cy+Math.sin(a)*(R+9)).toFixed(1)}"
      x2="${(cx+Math.cos(a)*(R+9-len)).toFixed(1)}" y2="${(cy+Math.sin(a)*(R+9-len)).toFixed(1)}"
      stroke="${th.num}" stroke-width="${big?1.6:1}" opacity="${big?.75:.35}"/>`);
  }
  const marks = [[0,"12a"],[6,"6a"],[12,"12p"],[18,"6p"]].map(([h,lbl])=>{
    const a=(h*15-90)*Math.PI/180;
    return `<text x="${(cx+Math.cos(a)*(R-15)).toFixed(1)}" y="${(cy+Math.sin(a)*(R-15)+3.5).toFixed(1)}"
      text-anchor="middle" font-size="9.5" font-family="ui-monospace,Menlo,monospace"
      fill="${th.num}" opacity=".55">${lbl}</text>`;
  }).join("");
  // arc from midnight round to the handle, so you can read the elapsed day at a glance
  const large = ang>180 ? 1 : 0;
  const [sx,sy] = pos(0);
  const arc = ang>0.5 ? `<path d="M ${sx.toFixed(1)} ${sy.toFixed(1)} A ${R} ${R} 0 ${large} 1 ${hx.toFixed(1)} ${hy.toFixed(1)}"
    fill="none" stroke="${th.hand}" stroke-width="3" stroke-linecap="round" opacity="${set?.5:.2}"/>` : "";
  return `<div class="clockbox" data-clock="${key}">
    <div class="clocklbl">${esc(label)}</div>
    <svg class="clockface" width="168" height="168" viewBox="0 0 168 168" role="slider"
         aria-label="${esc(label)} time" aria-valuetext="${set?fmt12(val):"not set"}" tabindex="0">
      <circle cx="${cx}" cy="${cy}" r="${R+9}" fill="${th.bg}" stroke="${th.ring}" stroke-width="1.5"/>
      ${th.tag==="night"?`<circle cx="122" cy="46" r="7" fill="#EDF1FF" opacity=".5"/>
        <circle cx="125" cy="43" r="6" fill="${th.bg}"/>`:""}
      ${th.tag==="daytime"?`<circle cx="122" cy="46" r="6.5" fill="#F2C14E" opacity=".5"/>`:""}
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${th.num}" stroke-width="1" opacity=".18"/>
      ${ticks.join("")}${marks}${arc}
      <text x="${cx}" y="${cy+2}" text-anchor="middle" font-size="21" font-weight="650"
        font-family="ui-monospace,Menlo,monospace" fill="${th.hand}" opacity="${set?1:.35}">${set?fmt12(val):"--:--"}</text>
      <text x="${cx}" y="${cy+19}" text-anchor="middle" font-size="9.5" letter-spacing="1.2"
        font-family="ui-sans-serif,sans-serif" fill="${th.num}" opacity=".6">${set?th.tag.toUpperCase():"DRAG THE DOT"}</text>
      <circle class="knob" cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="11"
        fill="${th.hand}" stroke="${th.bg}" stroke-width="3" opacity="${set?1:.45}"/>
      <circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="3.5" fill="${th.bg}" opacity="${set?.9:.4}"/>
    </svg>
    <div class="nudge">
      <button type="button" data-act="nudge" data-clock="${key}" data-d="-30">−30m</button>
      <button type="button" data-act="nudge" data-clock="${key}" data-d="30">+30m</button>
      ${set?`<button type="button" data-act="clearclock" data-clock="${key}">clear</button>`:""}
    </div>
    <div class="clockhint">${set?"":esc(hint||"drag the dot anywhere round the ring")}</div>
  </div>`;
}
// which model field a clock writes to
const CLOCK_TARGETS = {}; // key -> {get(), set(v)}

function mountClocks(){
  document.querySelectorAll("[data-clock] .clockface").forEach(svg=>{
    const key = svg.closest("[data-clock]").getAttribute("data-clock");
    let dragging = false;
    const angleAt = e=>{
      const r = svg.getBoundingClientRect();
      const src = e.touches && e.touches[0] ? e.touches[0] : e;
      const x = src.clientX - r.left - r.width/2;
      const y = src.clientY - r.top - r.height/2;
      if(Math.hypot(x,y) < 6) return null;         // dead zone at the very centre
      return (Math.atan2(y,x)*180/Math.PI + 90 + 360)%360;
    };
    const apply = e=>{
      const a = angleAt(e);
      if(a==null) return;
      const tgt = CLOCK_TARGETS[key];
      if(tgt) tgt.set(angToTime(a));
    };
    const down = e=>{
      e.preventDefault();
      dragging = true;
      apply(e);
      if(svg.setPointerCapture && e.pointerId!=null){ try{ svg.setPointerCapture(e.pointerId); }catch(_){} }
    };
    const move = e=>{ if(!dragging) return; e.preventDefault(); apply(e); };
    const up = ()=>{ dragging = false; };
    svg.addEventListener("pointerdown", down);
    svg.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    svg.addEventListener("touchstart", down, {passive:false});
    svg.addEventListener("touchmove", move, {passive:false});
    window.addEventListener("touchend", up);
    svg.addEventListener("keydown", e=>{
      const tgt = CLOCK_TARGETS[key];
      if(!tgt) return;
      const step = e.key==="ArrowLeft"||e.key==="ArrowDown" ? -30
                 : e.key==="ArrowRight"||e.key==="ArrowUp" ? 30 : 0;
      if(!step) return;
      e.preventDefault();
      tgt.set(fromMin(minOfDay(tgt.get()||"12:00") + step));
    });
  });
}

// distance-ranked neighbours, plus the big-name cities in the same country that
// distance alone would bury — Beijing shouldn't hide Chengdu
function nearbyCities(origin, excludeNames, limit){
  if(!origin || origin.lat==null) return [];
  const ex = new Set((excludeNames||[]).map(s=>s.toLowerCase()));
  return CITIES
    .map(c=>({city:c, km:haversine(origin,c)}))
    .filter(x=>x.km!=null && x.km<1300 && !ex.has(x.city.name.toLowerCase()))
    .sort((a,b)=>a.km-b.km)
    .slice(0, limit||14);
}
function countryCities(origin, country, excludeNames, limit){
  if(!country) return [];
  const ex = new Set((excludeNames||[]).map(s=>s.toLowerCase()));
  return CITIES
    .filter(c=>c.country===country && MAJOR.has(c.name) && !ex.has(c.name.toLowerCase()))
    .map(c=>({city:c, km:origin&&origin.lat!=null ? haversine(origin,c) : null}))
    .sort((a,b)=>(a.km==null?1e9:a.km)-(b.km==null?1e9:b.km))
    .slice(0, limit||12);
}
// how much room this city actually has, at your chosen pace
function citySlots(t, cityId){
  return daysForCity(t, cityId).length * paceOf(t.pace).per;
}
function shortlistFor(t, cityId){
  return magnetsIn(t, m=>m.board==="short" && m.col===cityId);
}
function citySuggestions(origin, country, excludeNames){
  const near = nearbyCities(origin, excludeNames, 12);
  const seen = new Set(near.map(x=>x.city.name.toLowerCase()).concat((excludeNames||[]).map(s=>s.toLowerCase())));
  const rest = countryCities(origin, country, [...seen], 10);
  return {near, rest};
}

function interestLabel(id, custom){
  const std = INTERESTS.find(i=>i.id===id);
  if(std) return std.label;
  return (custom && custom[id]) || id.replace(/^c:/,"");
}
function suggestionsFor(id, custom){
  if(SUGGEST[id]) return SUGGEST[id];
  const lbl = interestLabel(id, custom);
  const low = lbl.toLowerCase();
  return [[lbl, "do", ""], ["Best "+low+" spot", "see", "ask someone local"]];
}

/* =========================================================
   5e. TRIP NAME CONVENTION
   ========================================================= */
function suggestName(codes, dateStr){
  const clean = (codes||[]).filter(c=>c && c!=="???");
  const uniq = [];
  clean.forEach(c=>{ if(!uniq.includes(c)) uniq.push(c); });
  const year = dateStr ? dateStr.slice(0,4) : new Date().getFullYear();
  if(!uniq.length) return "";
  if(uniq.length===1) return uniq[0]+" "+year;
  return uniq.slice(0,4).join("-")+" "+year;
}

function loadScript(src){
  return new Promise((res,rej)=>{
    if(document.querySelector('script[src="'+src+'"]')) return res();
    const s = document.createElement("script");
    s.src = src; s.onload = ()=>res(); s.onerror = ()=>rej(new Error("load failed"));
    document.head.appendChild(s);
  });
}
const PDFJS_URL = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const TESS_URL = "https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js";

async function textFromPDF(file){
  await loadScript(PDFJS_URL);
  const lib = window.pdfjsLib;
  lib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  const buf = await file.arrayBuffer();
  const pdf = await lib.getDocument({data:buf}).promise;
  let out = "";
  for(let i=1;i<=Math.min(pdf.numPages,8);i++){
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    out += tc.items.map(x=>x.str).join(" ") + "\n";
  }
  return out;
}
async function textFromImage(file, onProgress){
  await loadScript(TESS_URL);
  const r = await window.Tesseract.recognize(file, "eng", {
    logger: m => { if(m.status==="recognizing text" && onProgress) onProgress(Math.round(m.progress*100)); }
  });
  return r.data.text || "";
}

const MONTHS_RE = "jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec";
const MON_IX = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};

function findDates(text){
  const out = [];
  const push = (y,m,d)=>{
    if(m<0||m>11||d<1||d>31) return;
    const dt = new Date(y,m,d);
    if(dt.getMonth()!==m) return;
    out.push(fmtD(dt));
  };
  const nowY = new Date().getFullYear();
  let re, x;
  // 2026-10-12
  re = /\b(20\d{2})[-/.](\d{1,2})[-/.](\d{1,2})\b/g;
  while((x=re.exec(text))) push(+x[1], +x[2]-1, +x[3]);
  // 12 Oct 2026 / 12 October
  re = new RegExp("\\b(\\d{1,2})\\s*(?:st|nd|rd|th)?[\\s.-]*("+MONTHS_RE+")[a-z]*\\.?[\\s,.-]*(20\\d{2})?\\b","gi");
  while((x=re.exec(text))) push(x[3]?+x[3]:nowY, MON_IX[x[2].toLowerCase().slice(0,x[2].length>3?4:3)] ?? MON_IX[x[2].toLowerCase().slice(0,3)], +x[1]);
  // Oct 12, 2026
  re = new RegExp("\\b("+MONTHS_RE+")[a-z]*\\.?\\s+(\\d{1,2})\\s*(?:st|nd|rd|th)?[\\s,]*(20\\d{2})?\\b","gi");
  while((x=re.exec(text))) push(x[3]?+x[3]:nowY, MON_IX[x[1].toLowerCase().slice(0,3)], +x[2]);
  // 12/10/2026 or 10/12/26
  re = /\b(\d{1,2})\/(\d{1,2})\/(20\d{2}|\d{2})\b/g;
  while((x=re.exec(text))){
    let y = +x[3]; if(y<100) y += 2000;
    const a=+x[1], b=+x[2];
    if(a>12 && b<=12) push(y, b-1, a); else push(y, a-1, b);
  }
  const uniq = [...new Set(out)].sort();
  // booking confirmations also carry issue dates and fare deadlines; travel dates are
  // almost always still ahead of you, so prefer those and only fall back if there are none
  const future = uniq.filter(d=>d>=todayStr());
  if(future.length) return future;
  const floor = fmtD(new Date(Date.now()-86400000*400));
  return uniq.filter(d=>d>=floor);
}
function findTimes(text){
  const out = [];
  const re = /\b(\d{1,2}):(\d{2})\s*(a\.?m\.?|p\.?m\.?)?/gi;
  let x;
  while((x=re.exec(text))){
    let h=+x[1], m=+x[2];
    const ap = (x[3]||"").toLowerCase().replace(/\./g,"");
    if(m>59) continue;
    if(ap==="pm" && h<12) h+=12;
    if(ap==="am" && h===12) h=0;
    if(h>23) continue;
    out.push(d2(h)+":"+d2(m));
  }
  return out;
}
function findCodes(text){
  const out = [];
  const re = /\b([A-Z]{3})\b/g;
  let x;
  while((x=re.exec(text))){ if(AIRPORTS[x[1]]) out.push(x[1]); }
  return out;
}
function findFlightNos(text){
  const out = [];
  const re = /\b([A-Z]{2}|[A-Z]\d|\d[A-Z])\s?-?\s?(\d{1,4})\b/g;
  let x;
  while((x=re.exec(text))){
    const code = x[1];
    if(/^\d/.test(code) && +x[2] > 999) continue;
    if(["AM","PM","ID","NO","TO"].includes(code)) continue;
    out.push(code+" "+x[2]);
  }
  return [...new Set(out)];
}
function findCityNames(text){
  const low = " "+text.toLowerCase()+" ";
  return CITIES.filter(c=>low.includes(" "+c.name.toLowerCase()+" ") ||
                          low.includes(" "+c.name.toLowerCase()+","));
}

function parseItinerary(text){
  const codes = findCodes(text);
  const dates = findDates(text);
  const times = findTimes(text);
  const fns   = findFlightNos(text);
  const cities= findCityNames(text);
  const r = {codes, dates, times, fns, cities, arr:{}, dep:{}};
  if(codes.length===1){ r.arr.code = codes[0]; r.dep.code = codes[0]; }
  else if(codes.length===2){ r.arr.code = codes[1]; r.dep.code = codes[1]; }
  else if(codes.length>=3){ r.arr.code = codes[1]; r.dep.code = codes[codes.length-2]; }
  if(dates.length){
    // confirmations carry fare deadlines and return-by dates; a trip is the
    // window starting at the first date, not everything in the document
    r.arr.date = dates[0];
    const within = dates.filter(d=>daysBetween(r.arr.date, d) <= 60);
    r.dep.date = within.length ? within[within.length-1] : dates[0];
    r.ignoredDates = dates.filter(d=>within.indexOf(d)<0);
  }
  if(times.length){
    r.arr.time = snap30(times.length>=2 ? times[1] : times[0]);
    r.dep.time = snap30(times.length>=3 ? times[times.length-2] : times[times.length-1]);
  }
  if(fns.length){ r.arr.flightNo = fns[0]; r.dep.flightNo = fns[fns.length-1]; }
  return r;
}

function cardFacts(card, index, deckSize){
  const key = (card.name||"").toLowerCase();
  const hit = CARD_FACTS[key];
  if(hit) return {iconic:hit.iconic, mins:hit.mins, effort:hit.effort, exact:true};

  let mins = null;
  for(const [re,v] of MINS_WORDS){ if(re.test(card.name)||re.test(card.blurb||"")){ mins = v; break; } }
  if(mins==null) mins = MINS_BY_SUIT[card.suit] || 60;

  let effort = null;
  for(const [re,v] of EFFORT_WORDS){ if(re.test(card.name)||re.test(card.blurb||"")){ effort = v; break; } }
  if(effort==null) effort = EFFORT_BY_SUIT[card.suit];
  if(effort==null) effort = 1;
  if(mins >= 300 && effort < 2) effort = 2;

  // decks are written most-essential first, which is a fair proxy when nothing else is known
  const i = index==null ? 99 : index;
  const iconic = i<=3 ? 5 : i<=7 ? 4 : i<=12 ? 3 : 2;
  return {iconic, mins, effort, exact:false};
}

function bearingLabel(from, to){
  const dLon = (to.lon-from.lon)*Math.PI/180;
  const y = Math.sin(dLon)*Math.cos(to.lat*Math.PI/180);
  const x = Math.cos(from.lat*Math.PI/180)*Math.sin(to.lat*Math.PI/180) -
            Math.sin(from.lat*Math.PI/180)*Math.cos(to.lat*Math.PI/180)*Math.cos(dLon);
  const b = (Math.atan2(y,x)*180/Math.PI + 360)%360;
  const dirs = ["north","north-east","east","south-east","south","south-west","west","north-west"];
  const dir = dirs[Math.round(b/45)%8];
  const km = haversine(from,to);
  if(km==null || km<0.9) return "city centre";
  return Math.round(km)+"km "+dir;

async function wikiExtracts(titles){
  const out = {};
  for(let i=0;i<titles.length;i+=20){
    const batch = titles.slice(i,i+20);
    const url = "https://en.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1"+
      "&exsentences=1&redirects=1&format=json&origin=*&titles="+encodeURIComponent(batch.join("|"));
    try{
      const r = await fetch(url);
      const j = await r.json();
      const pages = (j.query && j.query.pages) || {};
      const norm = {};
      ((j.query && j.query.normalized) || []).forEach(n=>{ norm[n.to]=n.from; });
      Object.keys(pages).forEach(k=>{
        const p = pages[k];
        if(!p.extract) return;
        let s = p.extract.replace(/\s+/g," ").trim();
        if(s.length>150) s = s.slice(0,147).replace(/[ ,;]\w*$/,"")+"…";
        out[p.title] = s;
        if(norm[p.title]) out[norm[p.title]] = s;
      });
    }catch(e){ /* leave blanks */ }
  }
  return out;
}

async function wikidataFame(ids){
  const fame = {}, enTitle = {};
  for(let i=0;i<ids.length;i+=50){
    const batch = ids.slice(i,i+50);
    const url = "https://www.wikidata.org/w/api.php?action=wbgetentities&props=sitelinks"+
      "&format=json&origin=*&ids="+batch.join("%7C");
    try{
      const r = await fetch(url);
      const j = await r.json();
      const ents = j.entities || {};
      Object.keys(ents).forEach(q=>{
        const sl = ents[q].sitelinks || {};
        fame[q] = Object.keys(sl).length;
        if(sl.enwiki && sl.enwiki.title) enTitle[q] = sl.enwiki.title;
      });
    }catch(e){ /* leave unranked */ }
  }
  return {fame, enTitle};
}
